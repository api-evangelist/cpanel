description: >-
  First-party client libraries for the cPanel UAPI, WHM API 1, cPanel API 2 and Manage2 APIs.
  cPanel's own distribution model is unusual and worth stating plainly: the primary integration
  surfaces are the LiveAPI classes and the uapi/whmapi1/cpapi2 command-line tools that ship
  INSIDE cPanel & WHM itself (see cli/cpanel-cli.yml), so most cPanel code never installs a
  package at all. Only one first-party library is published to a public package registry.
  The cPanel/WHM package ecosystem on npm, Packagist and RubyGems is overwhelmingly
  third-party; those are deliberately excluded rather than listed as cPanel's.
