specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: cPanel
providerId: cpanel
generated: '2026-09-05'
created: '2026-05-04'
modified: '2026-09-05'
method: searched
source: https://cpanel.net/pricing/
description: >-
  cPanel's published plans, read from its pricing page on 2026-09-05. They replace a 2026-05-04
  bulk-sweep scaffold that invented a free tier and a 1,000-requests-per-month API quota; neither
  exists. THE CRITICAL FACT FOR AN API CONSUMER: cPanel does not sell API access and does not
  meter API calls. It licenses the cPanel & WHM software per server, priced by the number of
  cPanel ACCOUNTS the server hosts, and the UAPI, WHM API 1, cPanel API 2 and Manage2 APIs are
  included with every licence at no additional cost and with no published call quota. The unit of
  pricing is accounts, not requests.
pricing_model: per-server-licence-by-account-count
currency: USD
billing_periods: [monthly, annual]
annual_discount: 8.4%
tax_note: All prices exclude tax.
