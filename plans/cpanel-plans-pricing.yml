included_in_every_plan:
  - WP Toolkit
  - Website Builder
  - Email accounts
  - Unlimited websites
  - SSL certificates
  - Self-guided Migration
  - Website Monitoring
free_tier:
  exists: false
  trial:
    exists: true
    length_days: 15
    credit_card_required: false
    url: https://www.cpanel.net/products/trial/
    caveat: >-
      The trial is not a hosted sandbox — it is a licence to install cPanel & WHM on a server you
      already have, on an approved Linux distribution with root access and a registered domain.
add_ons:
  note: >-
    The pricing page lists partner add-ons with "starting from" prices only and no included
    quantities; they are recorded as prices, not as plans.
  observed_starting_prices_usd_per_month: [45, 34.95, 16.8, 29, 3, 25, 8.95]
  store: https://store.cpanel.net/
plan_count: 5
api_metering:
  metered: false
  quota_published: false
  note: >-
    Searched the pricing page, the FAQ on it, the developer documentation and both OpenAPI
    documents. No per-call price, no request quota and no API-tier distinction exists anywhere.
