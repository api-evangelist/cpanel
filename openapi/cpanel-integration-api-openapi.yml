openapi: 3.2.0
info:
  title: Cpanel Integration API
  version: 11.137.9999.106
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
  description: 'Operations tagged Integration across 2 of this provider''s published API definitions: cpanel-uapi-openapi.yml, cpanel-whm-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: A server running cPanel.
  url: https://{host}:{port}/execute
  variables:
    host:
      default: cpanel-server.tld
      description: The hostname of a server running cPanel.
    port:
      default: '2083'
      description: The cPanel port.
- description: A server running WHM.
  url: https://{host}:{port}/json-api
  variables:
    host:
      default: whm-server.tld
      description: The hostname of a server running WHM.
    port:
      default: '2087'
      description: The WHM port.
security:
- BasicAuth: []
tags:
- description: The Integration module for UAPI.
  name: Integration
paths:
  /Integration/fetch_url:
    get:
      x-readonly: false
      x-rollback: none
      description: This function returns the URL for an integrated application.
      operationId: Integration-fetch_url
      parameters:
      - description: The application's name.
        in: query
        name: app
        required: true
        schema:
          example: applicationname
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: fetch_url
                    type: string
                  module:
                    description: The name of the module called.
                    example: Integration
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          redirect_url:
                            description: The publicly-available URL to which the application will redirect visitors.
                            example: http://application.example.com/application
                            format: url
                            type: string
                          url:
                            description: The publicly-available URL to which the application redirects visitors if the `redirect_url` location is unavailable.
                            example: http://application.example.com/
                            format: url
                            type: string
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `errors` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Return integrated application URL
      tags:
      - Integration
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  Integration \\\n  fetch_url \\\n  app='applicationname'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/Integration/fetch_url?app=applicationname
      - label: LiveAPI Perl
        lang: Perl
        source: "#--------------------------------------------------------------------------------------\n# Instructions:\n#--------------------------------------------------------------------------------------\n# <theme-name> is the theme assigned to cPanel account.\n# 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n# 2) mkdir api_examples\n# 3) cd api_examples\n# 4) create a file Integration_fetch_url.live.pl and put this code into that file.\n# 5) In your browser login to a cPanel account.\n# 6) Manually change the url from: .../frontend/<theme-name>\n#    to .../frontend/<theme-name>/api_examples/Integration_fetch_url.live.pl\n#--------------------------------------------------------------------------------------\n\nuse strict;\n\nuse Cpanel::LiveAPI ();\n\nmy $cpanel = Cpanel::LiveAPI->new(); # Connect to cPanel - only do this once.\n\n# Print the header\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\n\n# Call the API\nmy $response = $cpanel->uapi(\n    q/Integration/,\n    q/fetch_url/,\n    {\n        'app' => 'applicationname',\n    }\n);\n\n# Handle the response\nif ($response->{cpanelresult}{result}{status}) {\n    my $data = $response->{cpanelresult}{result}{data};\n    # Do something with the $data\n    # So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    # Report errors:\n    print to_json($response->{cpanelresult}{result}{errors});\n}\n\n# Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n#--------------------------------------------------------------------------------------\n# Helper function to convert a perl object to html printable json\n#--------------------------------------------------------------------------------------\nsub to_json {\n    require JSON;\n    my $str = JSON->new->pretty->encode($_[0]);\n    return $str;\n}\n"
      - label: LiveAPI PHP
        lang: PHP
        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account.\n// 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file Integration_fetch_url.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme-name>\n//    to .../frontend/<theme-name>/api_examples/Integration_fetch_url.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'Integration',\n    'fetch_url',\n    array (\n        'app' => 'applicationname',\n    )\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    // Do something with the $data\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}"
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: cPanel 54
    servers:
    - description: A server running cPanel.
      url: https://{host}:{port}/execute
      variables:
        host:
          default: cpanel-server.tld
          description: The hostname of a server running cPanel.
        port:
          default: '2083'
          description: The cPanel port.
  /create_integration_group:
    get:
      description: This function creates a group to store integrations links in the cPanel interface.
      operationId: Integration-create_integration_group
      parameters:
      - description: "The group's ID within the system.\n\n**Warning:**\n\n If you create a link with a `group_id` value that already exists, the function replaces the existing group with the newly-created group."
        in: query
        name: group_id
        required: true
        schema:
          example: WHMCS
          type: string
      - description: The label for the group to display in the cPanel interface.
        in: query
        name: label
        required: true
        schema:
          example: WHMCS+Control
          type: string
      - description: "The order in which to display the group in the cPanel interface.\n\n**Note:**\n\n By default, the function will automatically create an item under the username menu in the interface header."
        in: query
        name: order
        required: true
        schema:
          example: 1
          minimum: 1
          type: integer
      - description: The cPanel account name.
        in: query
        name: user
        required: true
        schema:
          example: username
          format: username
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: create_integration_group
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: Ok
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed: Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Create integration link group
      tags:
      - Integration
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  create_integration_group \\\n  user='username' \\\n  group_id='WHMCS' \\\n  label='WHMCS+Control' \\\n  order='1'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/create_integration_group?api.version=1&user=username&group_id=WHMCS&label=WHMCS%2bControl&order=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '54'
    servers:
    - description: A server running WHM.
      url: https://{host}:{port}/json-api
      variables:
        host:
          default: whm-server.tld
          description: The hostname of a server running WHM.
        port:
          default: '2087'
          description: The WHM port.
  /create_integration_link:
    get:
      description: 'This function creates an integration link in the cPanel interface.


        **Note:**


        The function creates the `APP.adminconfig` and `APP.userconfig` integration link files in the `/var/cpanel/integration/links/USERNAME` directory, where `APP` represents the application name and `USERNAME` represents the user for whom you create integration links.'
      operationId: Integration-create_integration_link
      parameters:
      - description: 'The application to link.


          **Note:**

          * If you create a link with an `app` value that already exists, the function will replace the existing link with the newly-created link.

          * The value you assign to the `app` parameter is how you identify that integration link when listing or removing integration links.

          * You may include underscore (`_`) characters.'
        in: query
        name: app
        required: true
        schema:
          example: WHMCS_billing
          type: string
      - description: 'The service for which to implement authentication.


          **Note:**


          This is a string from the `get_users_links` function. The function typically returns one of the following values.


          * `billing` - This link appears in the user menu

          * `customer_service` - This link appears in the user menu

          * `support` - This link appears in the user menu

          * `upgrade` - This link appears in the user menu and context-sensitive areas when the user may require more of a resource'
        in: query
        name: implements
        required: true
        schema:
          example: billing
          type: string
      - description: The label to display in the cPanel login interface.
        in: query
        name: label
        required: true
        schema:
          example: WHMCS Billing
          type: string
      - description: The subscriber's unique ID that the system will present to the URL in the `autologin_token_url` endpoint.
        in: query
        name: subscriber_unique_id
        required: true
        schema:
          example: '1234'
          type: string
      - description: The token that the system will present to the URL in the `autologin_token_url` endpoint.
        in: query
        name: token
        required: true
        schema:
          example: subway
          type: string
      - description: The cPanel account name.
        in: query
        name: user
        required: true
        schema:
          example: username
          format: username
          type: string
      - description: 'The URL to which the server will send the `app`, `token`, `user`, and `subscriber_unique_id` values through an `HTTP POST` request. The destination server will respond with a JSON-encoded object with either a `redirect_url` key or the `retry` and `attempt` keys.


          **Note:**


          * You **must** include either the `autologin_token_url` parameter, the `url` parameter, or both.

          * If you do not set the `autologin_token_url` parameter, or that server does not respond or exist, then the server will redirect the user to the location in the `url` parameter.

          * If the response contains `redirect_url`, the system will redirect the user to that URL. (For example:, `{"redirect_url":" http://www.whmcs.com/client_area/login/?one_time_user_token_that_expires_in_120_seconds=d41d8cd98f00 ”}` will send the user to that unique URL.)

          * If the response contains `retry` and `attempt`, the system will wait for the retry value in seconds for a maximum of 60 seconds and then attempt the call again. The attempt value indicates the number of attempts that your system has tried. The system will stop after three attempts. (For example, `{"retry":30, "attempt":2}` represents the second attempt to connect, and the system will pause the user for 30 seconds before it tries again.)'
        in: query
        name: autologin_token_url
        required: false
        schema:
          example: http://www.example.com/login.cgi
          format: json
          type: string
      - description: 'The icon image.


          **Note:**


          If you **do not** specify a value, the interface uses a standard puzzle piece icon.'
        in: query
        name: base64_png_image
        required: false
        schema:
          example: iVBORw0KGgoAAAANSUhEUgAAAJgAAADYCAYAAA AXmipNAAAACXBIWXMAAALVAAAC1QHAwm8lAAAAGXRFWHRTb2Z0d2FyZQB 3d3cuaW5rc2NhcGUub3Jnm+48GgAAAUNJREFUeJztziFKg2EABuD3+ydz qGBwiGBZ385hstoMu4DNA8w7eIuBRUyWBYvJsC6CYWCwGGSy7bN6AOFn8 DwneJI/6mTYreNBryYl8A9KktTxoJfu0W66y3mSw6Q8pD+/LJNsWv6x5Z p6NbzJ/sF7uj/3Sf3OJqPUep6P0WnbObZfk1qu02zOks0spXylk+eUvOS 4v2g7x/bbSamPSecuqZ+p5TbN6inLvbcyma3azrH9Sr1IJyejQcq6yWL0 WqbTddspAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA AANr0C5EmMYv5JZrpAAAAAElFTkSuQmCC
          format: base64 image
          type: string
      - description: 'The group ID in which to add the icon of the linked service.


          * `files`

          * `databases`

          * `domains`

          * `email`

          * `metrics`

          * `security`

          * `software`

          * `advanced`

          * `pref`


          **Note:**


          If you **do not** specify a value, the function automatically creates an item under the username menu in the interface header.'
        in: query
        name: group_id
        required: false
        schema:
          enum:
          - files
          - databases
          - domains
          - email
          - metrics
          - security
          - software
          - advanced
          - pref
          example: advanced
          type: string
      - description: "Whether the cPanel interface will display the integration link.\n\n * `1` - Do **not** display the link.\n * `0` - Display the link."
        in: query
        name: hide
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: The order in which to display the icon in the cPanel interface inside the `group_id` group.
        in: query
        name: order
        required: false
        schema:
          example: '999'
          type: string
      - description: 'The URL to which to send the user if the `autologin_token_url` location does not respond or is not present.


          **Note:**


          * You **must** include either the `autologin_token_url` parameter, the `url` parameter, or both.'
        in: query
        name: url
        required: false
        schema:
          example: http://www.example.com
          format: url
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: create_integration_link
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: Ok
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed: Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Create integration link
      tags:
      - Integration
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  create_integration_link \\\n  user='username' \\\n  app='WHMCS_billing' \\\n  token='subway' \\\n  implements='billing' \\\n  label='WHMCS Billing' \\\n  subscriber_unique_id='1234'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/create_integration_link?api.version=1&user=username&app=WHMCS_billing&token=subway&implements=billing&label=WHMCS%20Billing&subscriber_unique_id=1234
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '54'
    servers:
    - description: A server running WHM.
      url: https://{host}:{port}/json-api
      variables:
        host:
          default: whm-server.tld
          description: The hostname of a server running WHM.
        port:
          default: '2087'
          description: The WHM port.
  /get_integration_link_user_config:
    get:
      description: This function retrieves configuration information about a specified integration link in a specified user's cPanel interface.
      operationId: Integration-get_integration_link_user_config
      parameters:
      - description: 'The integration link''s app name.


          **Warning:**


          If you create a link with an app value that already exists, the function will replace the existing link with the newly-created link.'
        in: query
        name: app
        required: true
        schema:
          example: WHMCS_billing
          type: string
      - description: The cPanel account name.
        in: query
        name: user
        required: true
        schema:
          example: username
          format: username
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      userconfig:
                        description: An object with information about the user's integration link.
                        properties:
                          app:
                            description: The application to link.
                            example: WHMCS_billing
                            type: string
                          autologin_token_url:
                            description: 'A publicly-available URL to which the server will send the

                              `app`, `token`, `user`, and `subscriber_unique_id` values through

                              an HTTP POST request. The destination server will respond

                              with a JSON-encoded object with either a `redirect_url`

                              key or the `retry` and `attempt` keys.


                              * If the response contains `redirect_url`, the system will redirect

                              the user to that URL (for example, `{"redirect_url":"http://www.whmcs.com/client_area/login/?one_time_user_token_that_expires_in_120_seconds=d41d8cd98f00}`

                              will send the user to that URL).

                              * If the response contains `retry` and `attempt`, the system will wait for

                              the `retry` value in seconds for a maximum of 60 seconds

                              and then attempt the call again. The `attempt` value indicates

                              the number of attempts that the system tried. The system

                              will stop after three attempts (for example, `{"retry":30,

                              "attempt":2}` represents the second attempt to connect,

                              and the system will pause the user for 30 seconds before

                              it tries again).'
                            example: http://www.example.com/login.cgi
                            format: url
                            type: string
                          base64_png_image:
