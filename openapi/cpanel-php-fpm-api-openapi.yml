      operationId: PHP-php_set_default_accounts_to_fpm
      parameters:
      - description: 'Whether to enable PHP-FPM on all new accounts and domains on

          a server.

          * `1` — Enable PHP-FPM.

          * `0` — Disable PHP-FPM.'
        in: query
        name: default_accounts_to_fpm
        required: true
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data: {}
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: php_set_default_accounts_to_fpm
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
