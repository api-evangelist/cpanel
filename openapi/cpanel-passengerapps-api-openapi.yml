      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  PassengerApps \\\n  ensure_deps \\\n  type='npm' \\\n  app_path='/home/example/my-app/'\n"
