  /PassengerApps/ensure_deps:
    get:
      x-readonly: false
      x-rollback: none
      description: 'This function installs the dependencies for a Passenger application.


        **Note**:


        This function starts the installation process. This may take a long time to complete.


        **Important**:


        When you disable the Web Server role, the system **disables** this function.'
      operationId: PassengerApps-ensure_deps
      parameters:
      - description: The application’s filepath.
        in: query
        name: app_path
        required: true
        schema:
          example: /home/example/my-app/
          format: path
          type: string
      - description: 'The application’s type.


          * `gem` — Ensure ruby gems in the application’s `Gemfile` file.

          * `npm` — Ensure node packages in the application’s `package.json` file.

          * `pip` — Ensure python pips in the application’s `requirements.txt` file.'
        in: query
        name: type
        required: true
        schema:
          enum:
          - gem
          - npm
          - pip
          example: npm
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: ensure_deps
                    type: string
                  module:
                    description: The name of the module called.
                    example: PassengerApps
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          sse_url:
                            description: The SSE URI to track the progress of the process.
                            example: /sse/UserTasks/00000000_5c6c8b18228a35/ensure_deps.log
                            format: url-path
                            type: string
                          task_id:
                            description: The task id of the SSE process.
                            example: 00000000/5c76ec5566332c
                            type: string
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '- `1` - Success.

                          - `0` - Failed. Check the `errors` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
