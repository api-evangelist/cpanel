  /modsec_report_rule:
    get:
      description: 'This function submits ModSecurity™ rule error reports to a remote receiver. The third

        party rule vendors use these error reports to identify problems with their rule sets.


        **Important:**


        When you disable the

        Web Server role,

        the system **disables** this function.'
      operationId: ModSecurity-modsec_report_rule
      parameters:
      - description: The contact email address to send with the error report. This allows the rule's vendor to reply to the user directly.
        in: query
        name: email
        required: true
        schema:
          example: john.doe@example.com
          format: email
          type: string
      - description: A short message that explains the reason for the report.
        in: query
        name: message
        required: true
        schema:
          example: 'Hi. We''re having some trouble with this rule. It seems to be

            blocking all requests.'
          type: string
      - description: 'The MySQL® row IDs from the `hits` table in the `modsec` database

          for the audit log event to report.


          **Note:**


          If you specify more than one row ID:


          * You **must** comma-separate the rule IDs.

          * The rule IDs **must** all correspond to the same ModSecurity rule.'
        examples:
          multiple:
            summary: Report multiple row IDs.
            value: 794828, 794829, 794820
          single:
            summary: Report a single row ID.
            value: 794828
        explode: false
        in: query
        name: row_ids
        required: true
        schema:
          type: integer
        style: form
      - description: 'Whether the function sends the report to the rule''s vendor.


          * `1` — Send the report.

          * `0` — Do **not** send the report.'
        in: query
        name: send
        required: true
        schema:
          enum:
          - 1
          - 0
          example: 1
          type: integer
      - description: 'The report''s type.


          **Note:**


          This value does **not** use a specified format. Treat the value as freeform text.'
        in: query
        name: type
        required: true
        schema:
          example: false positive
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      report:
                        description: An array of objects containing information for the report.
                        items:
                          properties:
                            email:
                              description: The contact email address to send with the error report. This allows the rule's vendor to reply to the report directly.
                              example: john.doe@example.com
                              format: email
                              type: string
                            hits:
                              description: An array of objects containing information about the hit.
                              items:
                                properties:
                                  action_desc:
                                    description: The web server's response to the client.
                                    example: Access denied with code 406 (phase 2).
                                    type: string
                                  handler:
                                    description: This parameter only returns a `null` value.
                                    example: null
                                    type:
                                    - string
                                    - 'null'
                                  host:
                                    description: The virtual host's (vhost) domain name.
                                    example: example.com
                                    format: domain
                                    type: string
                                  http_method:
                                    description: 'The

                                      [HTTP method](http://www.w3.org/Protocols/rfc2616/rfc2616-sec9.html)

                                      that the client used to generate the hit.'
                                    example: GET
                                    type: string
                                  http_status:
                                    description: 'The

                                      [HTTP status code](http://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html)

                                      that the web server returned.'
                                    example: 406
                                    type: integer
                                  http_version:
                                    description: The HTTP version number.
                                    example: HTTP/1.1
                                    type: string
                                  id:
                                    description: The `modsec` database line number.
                                    example: 794828
                                    minimum: 1
                                    type: integer
                                  ip:
                                    description: The client's IP address.
                                    example: 10.215.215.236
                                    format: ipv4
                                    type: string
                                  justification:
                                    description: The specific criteria from the ModSecurity rule that generated the hit.
                                    example: Unconditional match in SecAction.
                                    type: string
                                  meta_file:
                                    description: The ModSecurity configuration file that contains the rule that triggered the log entry.
                                    example: /usr/local/apache/conf/modsec_vendor_configs/MyVendor/one.conf
                                    type: string
                                  meta_id:
                                    description: The ID of the ModSecurity rule that triggered the log entry.
                                    example: 12345694
                                    type: integer
                                  meta_line:
                                    description: The line number of the ModSecurity rule that triggered the log entry.
                                    example: 1
                                    minimum: 1
                                    type: integer
                                  meta_logdata:
                                    description: The transaction data fragment from the ModSecurity rule's `logdata` action.
                                    example: null
                                    type:
                                    - string
                                    - 'null'
                                  meta_msg:
                                    description: The human-readable message from the ModSecurity rule's `msg` action.
                                    example: Method is not allowed by policy
                                    type:
                                    - string
                                    - 'null'
                                  meta_offset:
                                    description: 'The byte offset at which a match occurred within the target

                                      data.


                                      **Note:**


                                      This data is not always available.'
                                    example: 0
                                    minimum: 0
                                    type: integer
                                  meta_rev:
                                    description: The revision number from the ModSecurity rule's `rev` action.
                                    example: 1
                                    minimum: 1
                                    type:
                                    - integer
                                    - 'null'
                                  meta_severity:
                                    description: 'The hit severity level from the ModSecurity

                                      rule''s `severity` action.


                                      * `ALERT`

                                      * `CRITICAL`

                                      * `DEBUG`

                                      * `EMERGENCY`

                                      * `ERROR`

                                      * `INFO`

                                      * `NOTICE`

                                      * `WARNING`'
                                    enum:
                                    - ALERT
                                    - CRITICAL
                                    - DEBUG
                                    - EMERGENCY
                                    - ERROR
                                    - INFO
                                    - NOTICE
                                    - WARNING
                                    example: CRITICAL
                                    type:
                                    - string
                                    - 'null'
                                  meta_uri:
                                    description: 'The client-requested URI.


                                      **Note:**


                                      This data is not always available.'
                                    example: null
                                    format: uri
                                    type:
                                    - string
                                    - 'null'
                                  path:
                                    description: The accessed file's path, relative to the document root.
                                    example: /something
                                    type: string
                                  timestamp:
                                    description: 'The date and time at which the log entry was made.


                                      **Note:**


                                      This parameter uses the server''s configured time zone.'
                                    example: '2019-10-13T07:58:04.000Z'
                                    format: ISO-8601 Date Time (Space Separated)
                                    type: string
                                  timezone:
                                    description: The server's configured timezone, in minutes difference from UTC/GMT.
                                    example: '-300'
                                    type: string
                                type: object
                              type: array
                            message:
                              description: A short message that explains the reason for the report.
                              example: Hi. We're having some trouble with this rule. It seems to be blocking all requests.
                              type: string
                            rule_text:
                              description: The rule text from the configuration file.
                              example: 'SecAction "deny,auditlog,id:''12345694''"

                                '
                              type: string
                            type:
                              description: 'The report''s type.


                                **Note:**


                                This value does **not** use a specified format. Treat the value as

                                freeform text.'
                              example: false positive
                              type: string
                          type: object
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: modsec_report_rule
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
