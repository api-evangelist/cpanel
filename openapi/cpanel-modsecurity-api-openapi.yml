      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      settings:
                        description: An array of objects containing ModSecurity global configuration settings.
                        example:
                        - default: 'Off'
                          description: This setting controls the behavior of the audit engine.
                          directive: SecAuditEngine
                          engine: 1
                          missing: 1
                          name: Audit Log Level
                          radio_options:
                          - name: Log all transactions.
                            option: 'On'
                          - name: Do not log any transactions.
                            option: 'Off'
                          - name: Only log noteworthy transactions.
                            option: RelevantOnly
                          setting_id: 0
                          state: ''
                          type: radio
                          url: https://github.com/SpiderLabs/ModSecurity/wiki/Reference-Manual#secauditengine
                        - description: Specify an external program to pipe transaction log information to for additional analysis. The syntax is analogous to the .forward file, in which a pipe at the beginning of the field indicates piping to an external program.
                          directive: SecGuardianLog
                          missing: 1
                          name: Guardian Log
                          setting_id: 6
                          state: ''
                          type: text
                          url: https://github.com/SpiderLabs/ModSecurity/wiki/Reference-Manual#secguardianlog
                          validation:
                          - arg: '[|]'
                            name: startsWith
                          - path
                        items:
                          properties:
                            default:
                              description: The setting's default value.
                              oneOf:
                              - type: string
                              - minimum: 0
                                type: integer
                            description:
                              description: 'The setting''s description. The user''s

                                [locale](https://go.cpanel.net/locale) may translate this value.'
                              type: string
                            directive:
                              description: The setting's Apache® configuration directive.
                              type: string
                            engine:
                              description: 'Whether the setting is an engine directive. If the setting is

                                a normal directive, the function does **not** return this value.


                                * `1` — Engine directive.'
                              enum:
                              - 1
                              type: integer
                            missing:
                              description: 'Whether the setting is missing.


                                * `1` — The value is missing.'
                              enum:
                              - 1
                              type: integer
                            name:
                              description: The setting's name.
                              type: string
                            radio_options:
                              description: 'An array of objects containing the options that the client should

                                display, as radio buttons, for this setting in a user interface.


                                **Note:**


                                The function **only** returns this value when the `type`

                                parameter is the `radio` values.'
                              items:
                                properties:
                                  name:
                                    description: 'The setting name to display to the user. The user''s

                                      [locale](https://go.cpanel.net/locale) may translate this value.'
                                    type: string
                                  option:
                                    description: 'The setting that the system used to select the setting''s state.


                                      **Note:**


                                      This value is identical to the string that the client sends in

                                      as the `state` value when users select the specified setting. In most

                                      cases, you should **not** display this value to the user. Instead,

                                      display the `name` value.'
                                    type: string
                                type: object
                              type: array
                            setting_id:
                              description: The setting ID.
                              minimum: 0
                              type: integer
                            state:
                              description: The setting's current state, if available.
                              type: string
                            type:
                              description: 'The form element that the WHM interface uses to display this setting.


                                * `text` — WHM users modify this setting via a text box.

                                * `radio` — WHM users modify this setting via a radio button.

                                * `number` — WHM users modify this setting via a text box that

                                only allows numeric values.'
                              enum:
                              - text
                              - radio
                              - number
                              type: string
                            url:
