  /modsec_batch_settings:
    get:
      description: 'This function adds, updates, and removes global ModSecurity™ configuration directives.

        The function modifies these directives in the `/usr/local/apache/conf/modsec2.cpanel.conf`

        file.


        **Important:**


        When you disable the Web Server role,

        the system **disables** this function.


        This function **only** supports the following ModSecurity™ configuration directives:


        setting_idDocumentation


        0SecAuditEngine


        1SecConnEngine


        2SecRuleEngine


        3SecDisableBackendCompression


        4SecGeoLookupDb


        5SecGsbLookupDb


        6SecGuardianLog


        7SecHttpBlKey


        8SecPcreMatchLimit


        9SecPcreMatchLimitRecursion'
      operationId: ModSecurity-modsec_batch_settings
      parameters:
      - description: 'The configuration setting''s ID.


          **Note:**


          To configure multiple IDs, increment the parameter name. For example, `setting_id1`,

          `setting_id2`, and `setting_id3`.'
        examples:
          multiple:
            summary: 'Set or update multiple configuration settings, in this case: SecConnEngine,  SecRuleEngine, and SecDisableBackendCompression.'
            value: setting_id1=1 setting_id2=2 setting_id3=3
          single:
            summary: Set or update a single configuration setting, in this case for SecConnEngine.
            value: 1
        in: query
        name: setting_id
        required: true
        schema:
          maximum: 9
          minimum: 0
          type: integer
      - description: 'The configuration setting''s current state.


          * `On`

          * `Off`


          Some settings accept additional values for this parameter. See the references above for more inforamation.


          **Note:**


          * To configure multiple settings, increment the parameter name. For example, `state1`,

          `state2`, and `state3`.

          * `state` is ignored if `remove` is set to `1` for the setting.'
        examples:
          multiple:
            summary: Set the state of multiple configuration settings.
            value: state1=On state2=On state3=Off
          single:
            summary: Set the state of a single configuration setting.
            value: 'On'
        in: query
        name: state
        required: true
        schema:
          anyOf:
          - enum:
            - 'On'
            - 'Off'
            type: string
          - enum:
            - 'On'
            - 'Off'
            - DetectionOnly
            type: string
          - enum:
            - 'On'
            - 'Off'
            - RelevantOnly
            type: string
          - type: string
          - type: integer
      - description: 'Whether to add or remove the configuration setting in the

          `/usr/local/apache/conf/modsec2.cpanel.conf` file.


          * `1` — Remove the configuration setting.

          * `0` — Add or update the configuration setting.


          * To remove multiple settings, increment the parameter name. For example, `remove1`,

          `remove2`, and `remove3`.'
        examples:
          multiple:
            summary: Remove some settings when updating or setting multiple configuration settings. This example removes the second setting indicated in `setting_id2` and updates the other two settings.
            value: remove1=0 remove2=1 remove3=0
          single:
            summary: Remove a single configuration setting requested in the `setting_id`
            value: 1
        in: query
        name: remove
        required: false
        schema:
          default: 0
          enum:
          - 1
          - 0
          example: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      updated_settings:
                        description: An array of objects that contains the configuration setting's information.
                        items:
                          properties:
                            default:
                              description: 'The setting''s default value.


                                **Note:**


                                The `modsec2.cpanel.conf` file defines this value.'
                              example: 1500
                              minimum: 1
                              type: integer
                            description:
                              description: The setting's description.
                              example: define the match limit of the PCRE library.
                              type: string
                            directive:
                              description: The setting's Apache configuration directive.
                              example: SecAuditEngine
                              type: string
                            engine:
                              description: 'Whether the setting is an engine directive.


                                * `1` — Engine directive.

                                * `0` — Normal directive.'
                              enum:
                              - 1
                              - 0
                              example: 1
                              type: integer
                            name:
                              description: The setting's name.
                              example: Audit Log Level
                              type: string
                            radio_options:
                              description: An array of objects that contain the setting's options display information.
                              items:
                                properties:
                                  name:
                                    description: The option's display name.
                                    example: Log all transactions.
                                    type: string
                                  option:
                                    description: The option.
                                    example: 'On'
                                    type: string
                                type: object
                              type: array
                            setting_id:
                              description: The setting ID.
                              example: 1
                              minimum: 1
                              type: integer
                            state:
                              description: The setting's current state, as set by the `state` parameter's input value.
                              example: 'On'
                              type: string
                            type:
                              description: 'The form element that the WHM interface uses to display this setting.


                                * `text` — WHM users modify this setting via a text box.

                                * `radio` — WHM users modify this setting via a radio button.

                                * `number` — WHM users modify this setting via a text box that **only**

                                allows numeric values.'
                              example: radio
                              type: string
                            url:
                              description: The URL of the setting's entry in the ModSecurity reference manual.
                              example: https://github.com/SpiderLabs/ModSecurity/wiki/Reference-Manual#secpcrematchlimit
                              type: string
                          type: object
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: modsec_batch_settings
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
