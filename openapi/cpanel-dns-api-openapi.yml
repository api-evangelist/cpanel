  /DNS/has_local_authority:
    get:
      x-readonly: true
      description: This function checks whether the local server is authoritative for the domain's DNS records.
      operationId: DNS-has_local_authority
      parameters:
      - description: 'The domain to check whether the local server is authoritative for the domain''s

          DNS records.


          **Note:**


          To check multiple domains, increment or duplicate the parameter name. For

          example, `domain-0`, `domain-1`, and `domain-2`.'
        examples:
          multiple:
            summary: Check multiple domains.
            value: domain-0=example.com domain-1=example1.com domain-2=example2.com
          multiple-alternative:
            summary: Check multiple domains.
            value: domain=example.com domain=example1.com domain=example2.com
          single:
            summary: Check a single domain.
            value: example.com
        in: query
        name: domain
        required: true
        schema:
          example: example.com
          format: domain
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: has_local_authority
                    type: string
                  module:
                    description: The name of the module called.
                    example: DNS
                    type: string
                  result:
                    properties:
                      data:
                        description: An array of objects containing information about the authoritative status of a domain's local DNS zone files.
                        example:
                        - domain: example.com
                          local_authority: 1
                          nameservers:
                          - ns1.example.com
                          - ns2.example.com
                          zone: example.com
                        - domain: example2.com
                          local_authority: 0
                          nameservers: []
                        - domain: example3.com
                          error: (XID 3z756a) DNS query (example3.com/SOA) timeout!
                          local_authority: 0
                          nameservers: []
                          zone: example3.com
                        items:
                          properties:
                            domain:
                              description: The queried domain.
                              format: domain
                              type: string
                            error:
                              description: 'An error message that details the reason why the local server''s

                                authoritative check failed.


                                **Note:**


                                The function **only** returns this value when the check fails.'
                              type: string
                            local_authority:
                              description: 'Whether the local server is authoritative for the domain''s DNS

                                records.


                                * `1` — The local server is authoritative for the domain''s DNS

                                records.

                                * `0` — The local server is **not** authoritative for the domain''s

                                DNS records.'
                              enum:
                              - 1
                              - 0
                              type: integer
                            nameservers:
                              description: The domain's nameservers, if any exist.
                              items:
                                format: domain
                                type: string
                              type: array
                            zone:
                              description: 'The domain''s DNS zone, if one exists.


                                * `null` — No valid DNS zone.'
                              format: domain
                              type:
                              - string
                              - 'null'
                          type: object
                        type: array
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
