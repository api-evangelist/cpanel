  /enable_dnssec_for_domains:
    get:
      description: 'This function enables DNSSEC on the domain.


        **Note:**


        * Only servers that run PowerDNS can use DNSSEC. If you call this function on a server that doesn''t use PowerDNS, you will receive an error.

        * After you enable DNSSEC on the domain, you **must** add the Delegation of Signing (DS) records on your DNS server and with your registrar.

        * You **cannot** modify the DNSSEC security key. To make any changes, you **must** disable, delete, and re-create the DNSSEC security key.'
      operationId: DNS-enable_dnssec_for_domains
      parameters:
      - description: 'The domain for which to enable DNSSEC.


          **Note:**


          To enable DNSSEC on multiple domains, duplicate or increment the parameter name. For example, to check three domains, you could:

          * Use the `domain` parameter multiple times.

          * Use the `domain`, `domain-1`, and `domain-2` parameters.'
        examples:
          multiple:
            summary: Multiple domains
            value: domain=example.com&domain-1=example1.com&domain-2=example2.com
          multiple-alternative:
            summary: Multiple domains
            value: domain=example.com&domain=example1.com&domain=example2.com
          single:
            summary: A single domain.
            value: example.com
        in: query
        name: domain
        required: true
        schema:
          example: example.com
          format: domain
          type: string
      - description: 'Whether to activate the newly-created key.

          * `1` - Activate the key.

          * `0` - Do **not** activate the key.'
        in: query
        name: active
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'The algorithm that the system uses to generate the security key.

          * `5` - RSA/SHA-1

          * `6` - DSA-NSEC3-SHA1

          * `7` - RSASHA1-NSEC3-SHA1

          * `8` - RSA/SHA-256

          * `10` - RSA/SHA-512

          * `13` - ECDSA Curve P-256 with SHA-256

          * `14` - ECDSA Curve P-384 with SHA-384


          **Note:**


          We recommend that you use an ECDSA Curve P-256 with SHA-256 (13) value if your registrar supports it.'
        in: query
        name: algo_num
        required: false
        schema:
          default: 8
          enum:
          - 5
          - 6
          - 7
          - 8
          - 10
          - 13
          - 14
          example: 8
          type: integer
      - description: 'The manner in which the system creates the security key.

          * `classic` - Use separate keys for KSK and ZSK. Use this value when the `algo_num` parameter is equal to or less than 8.

          * `simple` - Use a single key for both KSK and ZSK. Use this value when the `algo_num` parameter is greater than 8.'
        in: query
        name: key_setup
        required: false
        schema:
          default: classic
          enum:
          - classic
          - simple
          example: classic
          type: string
      - description: The number of times that the system rehashes the first resource record hash operation.
        in: query
        name: nsec3_iterations
        required: false
        schema:
          default: 7
          example: 7
          maximum: 500
          minimum: 1
          type: integer
      - description: 'Whether NSEC3 operates in Narrow or Inclusive mode.


          **Note:**


          For information about these modes, read [PowerDNS''s DNSSEC documentation](https://doc.powerdns.com/authoritative/dnssec/intro.html).


          * `1` - Narrow mode.

          * `0` - Inclusive mode.'
        in: query
        name: nsec3_narrow
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether the system will create records for all delegations.

          * `1` - Create records for all delegations.

          * `0` - Create records only for secure delegations.


          **Note:**


          Only use the `1` value if you **must** create records for all delegations.'
        in: query
        name: nsec3_opt_out
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'A hexadecimal string that the system appends to the domain name before it applies the hash function to the name.


          **Note:**


          For information about salt values, read [RFC 5155](https://tools.ietf.org/html/rfc5155#section-3.1.5).'
        in: query
        name: nsec3_salt
        required: false
        schema:
          example: 1a2b3c4d5e6f
          type: string
      - description: 'Whether the domain will use [Next Secure Record](https://tools.ietf.org/html/rfc4470) (NSEC) or NSEC3 semantics.

          * `1` - Use NSEC3 semantics.

          * `0` - Use NSEC semantics.


          **Note:**


          If you use this value, the system ignores the other NSEC3 options.'
        in: query
        name: use_nsec3
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      domains:
                        description: An array of objects that contains information about each domain.
                        items:
                          properties:
                            domain:
                              description: The domain for which the system enabled DNSSEC.
                              example: example.com
                              format: domain
                              type: string
                            enabled:
                              description: 'Whether the system enabled DNSSEC.

                                * `1` - Enabled.

                                * `0` - The system failed to enable DNSSEC.


                                **Note:**


                                This function will **not** return the `nsec_version` and `new_key_id` returns if this return is a `0` value.'
                              enum:
                              - 0
                              - 1
                              example: 1
                              type: integer
                            new_key_id:
                              description: The assigned security key ID. A valid ID.
                              example: '2'
                              type: string
                            nsec_error:
                              description: 'The domain has a NSEC3 configuration error.


                                **Note:**


                                The function **only** displays this return if there is a NSEC3 configuration error. An error message.'
                              example: Error message.
                              type: string
                            nsec_version:
                              description: 'The version of DNSSEC the system used.

                                * `NSEC3`

                                * `NSEC`


                                **Note:**


                                The function only displays this return if there is a NSEC3 configuration error. The system also returns the error in the `nsec_error` return.'
                              enum:
                              - NSEC3
                              - NSEC
                              example: NSEC3
                              type: string
                          type: object
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: enable_dnssec_for_domains
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Enable DNSSEC on domain
      tags:
      - DNS
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  enable_dnssec_for_domains \\\n  domain='example.com'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/enable_dnssec_for_domains?api.version=1&domain=example.com
      x-cpanel-api-version: WHM API 1
