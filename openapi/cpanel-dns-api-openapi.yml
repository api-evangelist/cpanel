  /DNS/fetch_cpanel_generated_domains:
    get:
      x-readonly: true
      description: 'This function retrieves the list of subdomains that cPanel automatically

        generates for a given domain. These include proxy subdomains such as

        `webmail`, `mail`, and `cpanel`, as well as other system-generated

        domain names.'
      operationId: DNS-fetch_cpanel_generated_domains
      parameters:
      - description: The domain for which to retrieve cPanel-generated subdomains.
        examples:
          single:
            summary: Retrieve generated subdomains for a domain.
            value: example.com
        in: query
        name: domain
        required: true
        schema:
          example: example.com
          format: domain
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: fetch_cpanel_generated_domains
                    type: string
                  module:
                    description: The name of the module called.
                    example: DNS
                    type: string
                  result:
                    properties:
                      data:
                        description: An array of objects containing the cPanel-generated domain names for the specified domain.
                        example:
                        - domain: example.com.
                        - domain: cpanel.example.com.
                        - domain: mail.example.com.
                        - domain: webmail.example.com.
                        - domain: webdisk.example.com.
                        items:
                          properties:
                            domain:
                              description: 'A cPanel-generated domain name, returned as a fully-qualified

                                domain name (FQDN) with a trailing dot.'
                              example: webmail.example.com.
                              format: domain
                              type: string
                          type: object
                        type: array
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties:
                          transformed:
                            description: Post-processing may have transformed the data.
                            enum:
                            - 1
                            example: 1
                            type: integer
                      status:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `errors` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Retrieve cPanel-generated subdomains for a domain
      tags:
      - DNS
