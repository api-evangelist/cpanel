        source: "whmapi1 --output=jsonpretty \\\n  set_nsec3_for_domains \\\n  domain='example.com' \\\n  nsec3_opt_out='0' \\\n  nsec3_iterations='7' \\\n  nsec3_narrow='1' \\\n  nsec3_salt='1a2b3c4d5e6f'\n"
