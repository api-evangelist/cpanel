        in: query
        name: domain
        required: true
        schema:
          example: example.com
          format: domain
          type: string
      - description: The number of times that the system re-executes the first resource record hash operation.
        in: query
        name: nsec3_iterations
        required: true
        schema:
          example: 7
          maximum: 500
          minimum: 0
          type: integer
      - description: "Whether NSEC3 will operate in Narrow mode or Inclusive mode.\n\n  **Note**\n\nFor information about these modes, read  [PowerDNS's DNSSEC documentation](https://doc.powerdns.com/authoritative/dnssec/intro.html).\n\n* `1` - Narrow mode.\n* `0` - Inclusive mode."
        in: query
        name: nsec3_narrow
        required: true
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether the system will create records for **all** delegations.

          * `1` - Create records for **all** delegations.

          * `0` - Create records **only** for secure delegations.


          **Note**


          Only select `1` if you **must** create records for all delegations.'
        in: query
        name: nsec3_opt_out
        required: true
        schema:
          enum:
          - 0
          - 1
          example: 0
          type: integer
