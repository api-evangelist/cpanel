  /mass_edit_dns_zone:
    get:
      description: 'This function updates a given DNS zone. It can add, edit,

        and remove many records in a single call. It also ensures

        that each record not removed will occupy the same

        number of lines after the edit as it did before the edit.


        **NOTE:**


        You **cannot** use this function to modify temporary domains.'
      operationId: DNS-mass_edit_dns_zone
      parameters:
      - description: 'The current serial number in the DNS zone’s SOA (Start of Authority)

          record. If this value does not match the zone’s current state, the

          request fails.'
        in: query
        name: serial
        required: true
        schema:
          example: 202001010100
          minimum: 0
          type: integer
      - description: The name of one of the user’s DNS zones.
        in: query
        name: zone
        required: true
        schema:
          example: example.com
          type: string
      - description: "The records to add to the zone. Each item must be a serialized\nJSON object that contains:\n\n* `dname` — The record’s name.\n* `ttl` — The record’s TTL (Time-To-Live) value.\n* `record_type` — The record’s type. For example, `A` or `TXT`.\n* `data` — An array of strings. The format and number of the\n  strings depend on the `record_type` value."
        examples:
          a:
            description: An A record.
            value: '''{"dname":"example", "ttl":14400, "record_type":"A", "data":["11.22.33.44"]}'''
          aaaa:
            description: A TXT record.
            value: '''{"dname":"example", "ttl":14400, "record_type":"TXT", "data":["string1", "string2"]}'''
        explode: true
        in: query
        name: add
        required: false
        schema:
          items:
            format: json
            type: string
          type: array
      - description: "The records to edit in the zone. Each item must be a serialized\nJSON object that contains:\n\n* `line_index` — The line number in the DNS zone where the record starts.\n  This is a 0-based index, so to edit the first line in the file\n  use the `0` value. To edit the second line, give `1`, and so forth.\n* `dname` — The record’s name.\n* `ttl` — The record’s TTL (Time-To-Live) value.\n* `record_type` — The record’s new type. For example, `A` or `TXT`.\n* `data` — An array of strings. The format and number of the\n  strings depend on the `record_type` value."
        explode: true
        in: query
        name: edit
        required: false
        schema:
          items:
            example: '''{"line_index": 9, "dname":"example", "ttl":14400, "record_type": "TXT", "data":["string1", "string2"]}'''
            format: json
            type: string
          type: array
      - description: The line indexes of records to remove from the zone.
        explode: true
        in: query
        name: remove
        required: false
        schema:
          items:
            example: 22
            minimum: 0
            type: integer
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      new_serial:
                        description: 'The DNS zone’s SOA record’s new serial number.

                          You can use this to submit later edits if you

                          track the number of lines each record takes up.'
                        example: 2021031903
                        minimum: 0
                        type: integer
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: mass_edit_dns_zone
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Update a DNS zone
      tags:
      - DNS
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: whmapi1 mass_edit_dns_zone zone='example.com' serial='202001010100' remove=23 add='{"dname":"example", "ttl":14400, "record_type":"A", "data":["11.22.33.44"]}'
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/mass_edit_dns_zone?api.version=1&add=%27%7B%22dname%22%3A%22example%22%2C+%22ttl%22%3A14400%2C+%22record_type%22%3A%22A%22%2C+%22data%22%3A%5B%2211.22.33.44%22%5D%7D%27
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: 96
    servers:
    - description: A server running WHM.
      url: https://{host}:{port}/json-api
      variables:
        host:
          default: whm-server.tld
          description: The hostname of a server running WHM.
        port:
          default: '2087'
          description: The WHM port.
  /parse_dns_zone:
    get:
      description: 'This function parses a given DNS zone.


        **Important:**


        Most DNS zones contain only 7-bit ASCII. However, it is possible for

        DNS zones to contain any binary sequence. An application that decodes

        this function''s base64 output **must** be able to handle cases

        where the decoded octets do not match any specific character

        encoding.'
      operationId: DNS-parse_dns_zone
      parameters:
      - description: The name of one of the user’s DNS zones.
        in: query
        name: zone
        required: true
        schema:
          example: example.com
          type: string
      responses:
