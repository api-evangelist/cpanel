  /add_zone_key:
    get:
      description: 'This function generates a DNSSEC zone key for a domain.


        **Note:**


        * Only servers that run PowerDNS can use DNSSEC. If you call this function on

        a server that doesn''t use PowerDNS, you will receive an error.

        * After you enable DNSSEC on the domain, you **must** add the Delegation of Signing (DS)

        records to your zone record and your registrar.

        * You **cannot** modify the DNSSEC security key. To make any changes, you **must** disable,

        delete, and re-create the DNSSEC security key.'
      operationId: DNS-add_zone_key
      parameters:
      - description: 'The algorithm that the system uses to generate the security key.


          * `5` — RSA/SHA-1

          * `6` — DSA-NSEC3-SHA1

          * `7` — RSA SHA1-NSEC3-SHA1

          * `8` — RSA/SHA-256

          * `13` — ECDSA Curve P-256 with SHA-256

          * `14` — ECDSA Curve P-384 with SHA-384


          **Note:**


          We recommend that you use a `13` (ECDSA Curve P-256 with SHA-256) value if

          your registrar supports it.'
        in: query
        name: algo_num
        required: true
        schema:
          enum:
          - 5
          - 6
          - 7
          - 8
          - 13
          - 14
          example: 13
          type: integer
      - description: The domain for which to enable DNSSEC.
        in: query
        name: domain
        required: true
        schema:
          example: example.com
          type: string
      - description: 'The type of security key to add.


          * `ksk` — Key Signing Key.

          * `zsk` — Zone Signing Key.


          **Note:**


          You **must** call these values in lowercase.'
        in: query
        name: key_type
        required: true
        schema:
          example: ksk
          type: string
      - description: 'Whether to activate the new security key.


          * `1` — Activate.

          * `0` — Do **not** activate.'
