      - description: The new zone's domain.
        in: query
        name: domain
        required: true
        schema:
          example: example.com
          format: domain
          type: string
      - description: The domain's IP address.
        in: query
        name: ip
        required: true
        schema:
          example: 192.168.0.20
          format: ipv4
          type: string
      - description: The domain's IPv6 address.
        in: query
        name: ipv6
        required: false
