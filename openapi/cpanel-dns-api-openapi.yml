  /has_local_authority:
    get:
      description: 'This function checks whether the local server has the authority to publish changes for the domain''s DNS records.


        **Important:**


        When you disable the DNS role, the system **disables** this function.'
      operationId: DNS-has_local_authority
      parameters:
      - description: 'The domain to check whether the local server is authoritative for the domain''s DNS records.


          **Note:**


          To check multiple domains, duplicate or increment the parameter name. For example, to check three domains, use the `domain` parameter multiple times. Or the `domain`, `domain-1`, and `domain-2` parameters.'
        examples:
          multiple:
            summary: Multiple domains
            value: domain=example.com domain-1=example1.com domain-2=example2.com
          single:
            summary: A single domain
            value: example.com
        in: query
        name: domain
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      records:
                        description: An array of objects that contains information about about the authoritative status of a domain's local DNS zone files.
                        items:
                          properties:
                            domain:
                              description: The queried domain.
                              example: example.com
                              type: string
                            error:
                              description: "A message that details the reason why the local server's authoritative check failed.\n\n**Note:**\n\n The function **only** returns this value when the check fails."
