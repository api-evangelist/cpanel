  /DNS/swap_ip_in_zones:
    get:
      x-readonly: false
      x-rollback: none
      description: 'This function replaces a domain''s IPv4 address in the DNS zone

        file with the specified destination IPv4 address.'
      operationId: DNS-swap_ip_in_zones
      parameters:
      - description: The IPv4 address to use as the replacement in the zone files.
        in: query
        name: dest_ip
        required: true
        schema:
          type: string
          format: ipv4
          example: 192.0.2.1
      - description: 'The domain to perform the zone file updates on.


          **Note:**


          To update multiple domains, increment or duplicate the parameter name. For

          example, `domain-0`, `domain-1`, and `domain-2`.'
        examples:
          multiple:
            summary: Update multiple domains.
            value: example.com domain-1=example1.com domain-2=example2.com
          multiple-alternative:
            summary: Update multiple domains.
            value: example.com domain=example1.com domain=example2.com
          single:
            summary: Update a single domain.
            value: example.com
        in: query
        name: domain
        required: true
        schema:
          example: example.com
          format: domain
          type: string
      - description: 'The IPv4 address to use as the replacement for FTP records in the zone files.


          If this parameter is **not** provided, then the system will use the `dest_ip` value.'
        in: query
        name: ftp_ip
        required: false
        schema:
          type: string
          format: ipv4
          example: 192.0.2.1
      - description: 'The IPv4 address to replace in the zone files. The detected source IPv4 address is one of:


          * If there is an A record for the root of the zone **and** the IP address is **not** a loopback address, then the system will use its address.

          * If there are any A records in the zone whose addresses are **not** loopback addresses, then the system will use the address of the first such A record in the zone file.

          * If no A records exist in the zone **or** all A records have loopback addresses, then the system will **not** update the zone file.


          If you do **not** call this parameter, the system will automatically detect the IP addresses in the zone files.'
        in: query
        name: source_ip
        required: false
        schema:
          type: string
          format: ipv4
          example: 192.0.2.0
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: swap_ip_in_zones
                    type: string
                  module:
                    description: The name of the module called.
                    example: DNS
                    type: string
                  result:
                    properties:
                      data:
                        description: An array of objects containing the updated DNS records, including their previous values.
                        items:
                          properties:
                            zone_name:
                              description: The DNS zone in which the system updated the domain's record.
                              format: domain
                              type: string
                              example: example.com
                            record_name:
                              description: The name of the domain's updated DNS record.
                              format: domain
                              type: string
                              example: example.com
                            record_type:
                              description: The type of the DNS record which was updated.
                              type: string
                              example: A
                            old_value:
                              description: The value of the DNS record before it was updated.
                              type: string
                              example: 192.0.2.0
                            new_value:
                              description: The value of the DNS record after it was updated.
                              type: string
                              example: 192.0.2.1
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `errors` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
