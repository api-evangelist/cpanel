  /getzonerecord:
    get:
      description: 'This function returns a line from a domain''s DNS zone configuration.


        **Note:**


        On servers that run CentOS 7, you may see a named warning about the absence of SPF resource records on DNS.

        * This warning is **not** relevant on CentOS 7 servers, because RFC 7208 deprecated SPF records. CentOS 7 servers use TXT records instead of SPF records.

        * Red Hat 7.1 and CentOS 7.1 both contain `bind-9.9.4-23.el7`, which is an updated version of BIND that complies with RFC 7208. To resolve this issue, update your operating system to a version that contains the updated version of BIND. For more information, read the Red Hat Bugzilla case about SPF record errors.


        **Important:**


        When you disable the DNS Role, the system **disables** this function.'
      operationId: DNS-getzonerecord
      parameters:
      - description: The zone record's domain.
        in: query
        name: domain
        required: true
        schema:
          example: example.com
          type: string
      - description: The zone record's line number.
        in: query
        name: line
        required: true
        schema:
          example: 2
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      record:
                        description: An array of objects containing the domain's zone record data.
                        items:
                          $ref: '#/components/schemas/getzonerecordResponseBase'
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: getzonerecord
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: Record obtained.
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed: Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return specific line from domain's DNS configuration
      tags:
      - DNS
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  getzonerecord \\\n  domain='example.com' \\\n  line='2'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/getzonerecord?api.version=1&domain=example.com&line=2
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11'
