        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      domains:
                        description: An array of objects that contain information about each domain.
                        items:
                          properties:
                            disabled:
                              description: 'Whether the system disabled NSEC3.

