  /DNS/is_alias_available:
    get:
      x-readonly: true
      description: 'This function returns whether `ALIAS` and `ANAME` records are available and the value of the running PowerDNS (PDNS) `resolver` setting, if any exists.

        For more information, read our `ALIAS` documentation.'
      operationId: DNS-is_alias_available
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: is_alias_available
                    type: string
                  module:
                    description: The name of the module called.
                    example: DNS
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          alias:
                            description: 'Whether `ALIAS` records are available.


                              * `1` - Available.

                              * `0` - Not available.


                              When `ALIAS` records are enabled, they may work in API calls that accept `A` and `AAAA` records. However, the `ALIAS` record must use a fully qualified domain name (FQDN) rather than an IP address.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type: integer
                          aname:
                            description: 'Whether `ANAME` records are available.


                              * `1` - Available.

                              * `0` - Not available.


                              **NOTE:**


                              The `aname` value is always set to false (i.e. Not available). The `ANAME` record is currently not supported. It is included for completeness and future proofing.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type: integer
