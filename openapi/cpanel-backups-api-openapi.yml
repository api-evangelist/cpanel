info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: WHM API.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: WHM Backups API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running WHM.
  url: https://{host}:{port}/json-api
  variables:
    host:
      default: whm-server.tld
      description: The hostname of a server running WHM.
    port:
      default: '2087'
      description: The WHM port.
security:
- BasicAuth: []
tags:
- description: The Backups module for WHM API 1.
  name: Backups
paths:
  /backup_config_get:
    get:
      description: This function retrieves your backup destination configuration file data.
      operationId: Backup-backup_config_get
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      backup_config:
                        description: A list of backup configuration data.
                        properties:
                          backup_daily_enable:
                            description: 'Whether daily backups are enabled.


                              * `1` — Enabled.

                              * `0` — Disabled.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          backup_daily_retention:
                            description: The number of retained daily backups.
                            example: 5
                            minimum: 1
                            type: integer
                          backup_monthly_dates:
                            description: A comma-seprated list of the days of the month on which the system runs monthly backups.
                            example: 1,15,22
                            type: string
                          backup_monthly_enable:
                            description: 'Whether monthly backups are enabled.


                              * `1` — Enabled.

                              * `0` — Disabled.'
                            enum:
                            - 0
                            - 1
                            example: 0
                            type: integer
                          backup_monthly_retention:
                            description: The number of retained monthly backups.
                            example: 5
                            minimum: 1
                            type: integer
                          backup_weekly_day:
                            description: 'The day of the week on which the system runs weekly backups.


                              * `0` — Sunday.

                              * `1` — Monday.

                              * `2` — Tuesday.

                              * `3` — Wednesday.

                              * `4` — Thursday.

                              * `5` — Friday.

                              * `6` — Saturday.'
                            example: 1,3,5
                            type: string
                          backup_weekly_enable:
                            description: 'Whether weekly backups are enabled.


                              * `1` — Enable.

                              * `0` — Disable.'
                            enum:
                            - 0
                            - 1
                            example: 0
                            type: integer
                          backup_weekly_retention:
                            description: The number of retained weekly backups.
                            example: 4
                            minimum: 1
                            type: integer
                          backupaccts:
                            description: 'Whether to back up accounts.


                              * `1` — Back up.

                              * `0` — Do **not** back up.


                              **Note:**


                              This setting affects whether the system enables the *File and

                              Directory Restoration* interface in cPanel & WHM. For more

                              information, read the

                              [How to Manage Metadata Settings](https://go.cpanel.net/MetadataSettings)

                              documentation.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type: integer
                          backupbwdata:
                            description: 'Whether bandwidth tracking data backups are enabled.


                              * `1` — Enabled.

                              * `0` — Disabled.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          backupdays:
                            description: 'The days of the week on which the system runs daily backups.


                              * `0` — Sunday.

                              * `1` — Monday.

                              * `2` — Tuesday.

                              * `3` — Wednesday.

                              * `4` — Thursday.

                              * `5` — Friday.

                              * `6` — Saturday.'
                            example: 0,2,4,6
                            type: string
                          backupdir:
                            description: The aboslute file path to the server's local backup directory.
                            example: /backup
                            type: string
                          backupenable:
                            description: 'Whether backups are enabled.


                              * `1` — Enabled.

                              * `0` — Disabled.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type: integer
                          backupfiles:
                            description: 'Whether system file backups are enabled.


                              * `1` — Enabled.

                              * `0` — Disabled.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          backuplogs:
                            description: 'Whether error log backups are enabled.


                              * `1` — Enabled.

                              * `0` — Disabled.'
                            enum:
                            - 0
                            - 1
                            example: 0
                            type: integer
                          backupmount:
                            description: 'Whether the system mounts backup partitions as part of the

                              backup process.


                              * `1` — Mounted.

                              * `0` — **Not** mounted.


                              **Note:**


                              This setting affects whether the system enables the *File and

                              Directory Restoration* interface in cPanel & WHM. For more

                              information, read the

                              [How to Manage Metadata Settings](https://go.cpanel.net/MetadataSettings)

                              documentation.'
                            enum:
                            - 0
                            - 1
                            example: 0
                            type: integer
                          backupsuspendedaccounts:
                            description: 'Whether suspended account backups are enabled.


                              * `1` — Enabled.

                              * `0` — Disabled.'
                            enum:
                            - 0
                            - 1
                            example: 0
                            type: integer
                          backuptype:
                            description: 'The type of backup file the system creates.


                              * `compressed` — A compressed `.tar` file.

                              * `uncompressed` — An uncompressed `.tar` file.

                              * `incremental` — A full tree of files and directories.'
                            enum:
                            - compressed
                            - uncompressed
                            - incremental
                            example: compressed
                            type: string
                          check_min_free_space:
                            description: 'Whether the system performs a check of the minimum free disk space

                              available on the destination server.


                              * `1` — Check the free disk space on the destination server.

                              * `0` — Do **not** check the free disk space on the destination

                              server.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          disable_metadata:
                            description: 'Whether the backup system creates metadata when a backup runs.


                              * `1` — Disables metadata creation.

                              * `0` — Enables metadata creation.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type: integer
                          errorthreshhold:
                            description: The number of times that the system attempts to use the additional backup destination.
                            example: 3
                            minimum: 1
                            type: integer
                          force_prune_daily:
                            description: 'Whether the `backup_daily_retention` parameter is strictly enforced.


                              * `1` — Enforced.

                              * `0` — The system **only** enforces the `backup_daily_retention`

                              setting after a backup successfully completes.'
                            enum:
                            - 0
                            - 1
                            example: 0
                            type: integer
                          force_prune_monthly:
                            description: 'Whether the `backup_monthly_retention` parameter is strictly enforced.


                              * `1` — Enforced.

                              * `0` — The system **only** enforces the `backup_monthly_retention`

                              setting after a backup successfully completes.'
                            enum:
                            - 0
                            - 1
                            example: 0
                            type: integer
                          force_prune_weekly:
                            description: 'Whether the `backup_weekly_retention` parameter is strictly enforced.


                              * `1` — Enforced.

                              * `0` — The system **only** enforces the `backup_weekly_retention`

                              setting after a backup successfully completes.'
                            enum:
                            - 0
                            - 1
                            example: 0
                            type: integer
                          gziprsyncopts:
                            description: The environment variables passed to the `gzip` application. The system uses these variables to adjust how the `gzip` application runs when compressing backups.
                            example: --rysncable
                            type: string
                          keeplocal:
                            description: 'Whether the system deletes backups from the local directory.


                              * `1` — The system does not delete backups from the local backup

                              directory.

                              * `0` — The system **deletes** backups from the local

                              directory.


                              **Note:**


                              The `backupdir` return value contains the local backup directory.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          linkdest:
                            description: 'Whether the system checks the `rsync` function for hardlink support.


                              * `1` — Enabled.

                              * `0` — Disabled.'
                            enum:
                            - 0
                            - 1
                            example: 0
                            type: integer
                          localzonesonly:
                            description: 'Whether the system uses a local zone file from the `dnsadmin` daemon

                              or `/var/named/domain.tld` file, where `domain.tld` is the target domain.


                              * `1` — The system uses the `/var/named/domain.tld` file.

                              * `0` — The system uses the `dnsadmin` daemon.'
                            enum:
                            - 0
                            - 1
                            example: 0
                            type: integer
                          maximum_restore_timeout:
                            description: The maximum interval, in seconds, that the restoration attempts a run to completion. If the restoration takes longer than this interval, the system terminates the restoration.
                            example: 21600
                            minimum: 1
                            type: integer
                          maximum_timeout:
                            description: The maximum interval, in seconds, that the backup attempts a run to completion. If the backup takes longer than this interval, the system terminates the backup.
                            example: 7200
                            minimum: 1
                            type: integer
                          min_free_space:
                            description: The minimum amount of free disk space the system checks for on the destination server before attempting a backup to that server.
                            example: 1024
                            minimum: 1
                            type: integer
                          min_free_space_unit:
                            description: 'The unit of measure of disk space for the `min_free_space` return.


                              * `MB` — Megabytes.

                              * `percent` — Percentages.'
                            enum:
                            - MB
                            - percent
                            example: MB
                            type: string
                          mysqlbackup:
                            description: 'The method that the system uses to back up MySQL® databases.


                              * `accounts` — Backs up databases into each account''s archive.

                              * `dir` — Backs up the entire MySQL directory.

                              * `both` — Back up databases into each account''s archive **and**

                              the entire MySQL directory.'
                            example: accounts
                            type: string
                          postbackup:
                            description: 'Whether the `/usr/local/cpanel/scripts/postcpbackup` script runs

                              after the backup completes.


                              * `1` — Enabled.

                              * `0` — Disabled.'
                            enum:
                            - 0
                            - 1
                            example: 0
                            type: integer
                          prebackup:
                            description: 'Whether the `/usr/local/cpanel/scripts/precpbackup` script runs before

                              the system processes backups.


                              * `1` — Enabled.

                              * `0` — Disabled.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          psqlbackup:
                            description: 'Whether backups of PostgreSQL® databases are enabled.


                              * `1` — Enabled.

                              * `0` — Disabled.'
                            enum:
                            - 0
                            - 1
                            example: 0
                            type: integer
                          remote_restore_staging_dir:
                            description: 'The directory on the local server where the system temporarily

                              stores a remote server''s backup file during a backup restoration.'
                            example: /backup
                            type: string
                        type: object
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: backup_config_get
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return backup configuration file data
      tags:
      - Backups
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  backup_config_get\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/backup_config_get?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.38'
  /backup_config_set:
    get:
      description: This function configures a server's backup system. The system saves these settings in the `/var/cpanel/backups/config` file.
      operationId: Backup-backup_config_set
      parameters:
      - description: 'Whether to enable daily backups.


          * `1` — Enable.

          * `0` — Disable.'
        in: query
        name: backup_daily_enable
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: The number of daily backups to retain.
        in: query
        name: backup_daily_retention
        required: false
        schema:
          default: 5
          example: 5
          minimum: 0
          type: integer
      - description: 'Which days of the month to run backups.


          **Note:**


          To add multiple days, use a comma-delimited list.'
        in: query
        name: backup_monthly_dates
        required: false
        schema:
          default: 1
          example: 1
          maximum: 31
          minimum: 1
          type: integer
      - description: 'Whether to enable monthly backups.


          * `1` — Enable.

          * `0` — Disable.'
        in: query
        name: backup_monthly_enable
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: The number of monthly backups to retain.
        in: query
        name: backup_monthly_retention
        required: false
        schema:
          default: 1
          example: 5
          minimum: 0
          type: integer
      - description: 'Which day of the week to run weekly backups.


          * `0` — Sunday.

          * `1` — Monday.

          * `2` — Tuesday.

          * `3` — Wednesday.

          * `4` — Thursday.

          * `5` — Friday.

          * `6` — Saturday.'
        in: query
        name: backup_weekly_day
        required: false
        schema:
          default: 0
          example: 1
          maximum: 6
          minimum: 1
          type: integer
      - description: 'Whether to enable weekly backups.


          * `1` — Enable.

          * `0` — Disable.'
        in: query
        name: backup_weekly_enable
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: The number of weekly backups to retain.
        in: query
        name: backup_weekly_retention
        required: false
        schema:
          default: 4
          example: 4
          minimum: 0
          type: integer
      - description: 'Whether to back up cPanel user accounts.


          * `1` — Back up.

          * `0` — Do **not** back up.


          **Note:**


          This setting affects whether the system enables the *File and Directory Restoration*

          interfaces in

          [cPanel](https://docs.cpanel.net/cpanel/files/file-and-directory-restoration-for-cpanel/)

          and in

          [WHM](https://docs.cpanel.net/whm/backup/file-and-directory-restoration-for-whm/).

          For more information, read the

          [How to Manage Metadata Settings](https://docs.cpanel.net/knowledge-base/backup/how-to-manage-metadata-settings/)

          documentation.'
        in: query
        name: backupaccts
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to back up bandwidth tracking data.


          * `1` — Back up.

          * `0` — Do **not** back up.'
        in: query
        name: backupbwdata
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Which days of the week to run daily backups.


          * `0` — Sunday.

          * `1` — Monday.

          * `2` — Tuesday.

          * `3` — Wednesday.

          * `4` — Thursday.

          * `5` — Friday.

          * `6` — Saturday.


          **Note:**


          For multiple days, use a comma-delimited list.'
        in: query
        name: backupdays
        required: false
        schema:
          default: 0,2,4,6
          example: 0,1,2,3,4,5,6
          maximum: 6
          minimum: 0
          type: string
      - description: The primary backup directory.
        in: query
        name: backupdir
        required: false
        schema:
          default: /backup
          example: /backup
          type: string
      - description: 'Whether to enable backups.


          * `1` — Enable.

          * `0` — Disable.


          **Note:**


          This setting affects whether the system enables the *File and Directory Restoration*

          interfaces in

          [cPanel](https://docs.cpanel.net/cpanel/files/file-and-directory-restoration-for-cpanel/)

          and in

          [WHM](https://docs.cpanel.net/whm/backup/file-and-directory-restoration-for-whm/).

          For more information, read the

          [How to Manage Metadata Settings](https://docs.cpanel.net/knowledge-base/backup/how-to-manage-metadata-settings/)

          documentation.'
        in: query
        name: backupenable
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'Whether to back up system files.


          * `1` — Back up.

          * `0` — Do **not** back up.'
        in: query
        name: backupfiles
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to back up the error logs.


          * `1` — Back up.

          * `0` — Do **not** back up.'
        in: query
        name: backuplogs
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'Whether to mount a backup partition.


          * `1` — Mount.

          * `0` — Do **not** mount.


          **Note:**


          This setting affects whether the system enables the *File and Directory Restoration*

          interfaces in

          [cPanel](https://docs.cpanel.net/cpanel/files/file-and-directory-restoration-for-cpanel/)

          and in

          [WHM](https://docs.cpanel.net/whm/backup/file-and-directory-restoration-for-whm/).

          For more information, read the

          [How to Manage Metadata Settings](https://docs.cpanel.net/knowledge-base/backup/how-to-manage-metadata-settings/)

          documentation.'
        in: query
        name: backupmount
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'Whether to back up suspended accounts.


          * `1` — Back up.

          * `0` — Do **not** back up.'
        in: query
        name: backupsuspendedaccts
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'The type of backup to create.


          * `compressed`

          * `uncompressed`

          * `incremental`'
        in: query
        name: backuptype
        required: false
        schema:
          default: compressed
          enum:
          - compressed
          - uncompressed
          - incremental
          example: compressed
          type: string
      - description: 'Whether to ensure that the destination server possesses the minimum

          free disk space available.


          * `1` — Check the free disk space on the destination server.

          * `0` — Do **not** check the free disk space on the destination server.'
        in: query
        name: check_min_free_space
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether the backup system will create metadata when a backup runs.


          * `1` — Disable metadata creation.

          * `0` — Enable metadata creation.


          **Note:**


          This setting affects whether the system enables the *File and Directory Restoration*

          interfaces in

          [cPanel](https://docs.cpanel.net/cpanel/files/file-and-directory-restoration-for-cpanel/)

          and in

          [WHM](https://docs.cpanel.net/whm/backup/file-and-directory-restoration-for-whm/).

          For more information, read the

          [How to Manage Metadata Settings](https://docs.cpanel.net/knowledge-base/backup/how-to-manage-metadata-settings/)

          documentation.'
        in: query
        name: disable_metadata
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: The number of times that the system will try to use the additional backup destination.
        in: query
        name: errorthreshhold
        required: false
        schema:
          default: 3
          example: 3
          minimum: 0
          type: integer
      - description: 'Whether to strictly enforce the value of the `backup_daily_retention`

          parameter.


          * `1` — Strictly enforce the `backup_daily_retention` parameter.

          * `0` — Only enforce the `backup_daily_retention` parameter **after** a

          successful complete backup.'
        in: query
        name: force_prune_daily
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'Whether to strictly enforce the value of the `backup_monthly_retention`

          parameter.


          * `1` — Strictly enforce the `backup_monthly_retention` parameter.

          * `0` — Only enforce the `backup_monthly_retention` parameter **after** a

          successful complete backup.'
        in: query
        name: force_prune_monthly
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'Whether to strictly enforce the value of the `backup_weekly_retention`

          parameter.


          * `1` — Strictly enforce the `backup_weekly_retention` parameter.

          * `0` — Only enforce the `backup_weekly_retention` parameter **after** a

          successful complete backup.'
        in: query
        name: force_prune_weekly
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: The `gzip` environment variables.
        in: query
        name: gziprsyncopts
        required: false
        schema:
          default: ''
          example: --rysncable
          type: string
      - description: 'Whether to delete backups from the local directory.


          * `1` — Delete.

          * `0` — Do **not** delete.


          **Note:**


          This setting affects whether the system enables the *File and Directory Restoration*

          interfaces in

          [cPanel](https://docs.cpanel.net/cpanel/files/file-and-directory-restoration-for-cpanel/)

          and in

          [WHM](https://docs.cpanel.net/whm/backup/file-and-directory-restoration-for-whm/).

          For more information, read the

          [How to Manage Metadata Settings](https://docs.cpanel.net/knowledge-base/backup/how-to-manage-metadata-settings/)

          documentation.'
        in: query
        name: keeplocal
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to check the `rsync` function for hardlink support.


          * `1` — Check.

          * `0` — Do **not** check.'
        in: query
        name: linkdest
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'Whether to use a local zone file from the `/var/named/domain.tld`

          file or the `dnsadmin` daemon, where `domain.tld` represents the target domain.


          * `1` — Use the `/var/named/domain.tld` file.

          * `0` — Use `dnsadmin`.'
        in: query
        name: localzonesonly
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: How long a restoration will attempt to run, in seconds. If the restoration does not succeed in this amount of time, it will stop.
        in: query
        name: maximum_restore_timeout
        required: false
        schema:
          default: 21600
          example: 21600
          minimum: 0
          type: integer
      - description: How long a backup will attempt to run, in seconds. If the backup does not succeed in this amount of time, it will stop.
        in: query
        name: maximum_timeout
        required: false
        schema:
          default: 7200
          example: 7200
          minimum: 0
          type: integer
      - description: 'The minimum amount of free disk to check for on the destination server.


          **Note:**


          If the value of the `min_free_space_unit` parameter is `percent`, the maximum

          value is `100`.'
        in: query
        name: min_free_space
        required: false
        schema:
          default: 5
          example: 1024
          minimum: 0
          type: integer
      - description: 'The units of measurement of disk space for the `min_free_space` return.


          * `MB` — Megabytes.

          * `percent` — Percent available.'
        in: query
        name: min_free_space_unit
        required: false
        schema:
          default: percent
          enum:
          - MB
          - percent
          example: MB
          type: string
      - description: 'The backup method to use for MySQL® databases.


          * `accounts` — Back up databases in each account''s archive.

          * `dir` — Back up the entire MySQL directory.

          * `both` — Back up databases in each account''s archive and the entire

          MySQL directory.'
        in: query
        name: mysqlbackup
        required: false
        schema:
          default: accounts
          enum:
          - accounts
          - dir
          - both
          example: accounts
          type: string
      - description: 'Whether to run the `/usr/local/cpanel/scripts/postcpbackup` script after

          the backup finishes.


          * `1` — Run.

          * `0` — Do **not** run.'
        in: query
        name: postbackup
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'Whether to run the `/usr/local/cpanel/scripts/precpbackup` script before

          the system processes backups.


          * `1` — Run.

          * `0` — Do **not** run.'
        in: query
        name: prebackup
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to back up PostgreSQL® databases.


          * `1` — Back up.

          * `0` — Do **not** back up.'
        in: query
        name: psqlbackup
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'The directory that temporarily stores a remote backup''s data during a backup restoration.

          The data is a compressed (`.tar.gz`) or uncompressed (`.tar`) account tarball.


          **Important:**


          The system restores backups one at a time. The backup staging directory **must**

          be large enough to contain the largest remote backup file that you wish to restore.

          For example, if you wish to restore three backups, sized 1.5 GB, 528 MB, and

          950 MB each, your backup staging directory must be able to hold at **least** 1.5 GB.


          **Note:**


          The system empties the directory after the system restores the backup.'
        in: query
        name: remote_restore_staging_dir
        required: false
        schema:
          example: /backup
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: backup_config_set
                        type: string
                      reason:
