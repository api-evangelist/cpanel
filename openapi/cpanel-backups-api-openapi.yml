  /backup_destination_add:
    get:
      description: This function adds a backup destination.
      operationId: Backup-backup_destination_add
      parameters:
      - description: 'The application key''s name.


          **Note:**


          This parameter is only valid for the `Backblaze` backup type.'
        in: query
        name: application_key
        required: true
        schema:
          example: A123b45CD678e9
          type: string
      - description: 'The application key ID that authenticates the Backblaze B2 account.


          **Note:**


          This parameter is only valid for the `Backblaze` backup type.'
        in: query
        name: application_key_id
        required: true
        schema:
          example: 12a345B678c9
          type: string
      - description: 'The authorization type.


          * `password`

          * `key`


          **Note:**


          This parameter is only valid for the following backup types:

          * `SFTP`

          * `Rsync`'
        in: query
        name: authtype
        required: true
        schema:
          enum:
          - password
          - key
          example: password
          type: string
      - description: 'The Amazon S3™ Access Key ID.


          **Note:**


          This parameter is only valid for the following backup types:

          * `AmazonS3`

          * `S3Compatible`'
        in: query
        name: aws_access_key_id
        required: true
        schema:
          example: REDACTED_AWS_ACCESS_KEY_ID
          type: string
      - description: 'The Amazon S3™ bucket.


          **Note:**


          This parameter is only valid for the following backup types:

          * `AmazonS3`

          * `S3Compatible`'
        in: query
        name: bucket
        required: true
        schema:
          example: ChockFullOfNuts
          type: string
      - description: 'The bucket''s ID string.


          **Note:**


          This parameter is only valid for the `Backblaze` backup type.'
        in: query
        name: bucket_id
        required: true
        schema:
          example: a12b34cd5678e9f
          type: string
      - description: 'The bucket''s name.


          **Note:**


          This parameter is only valid for the `Backblaze` backup type.'
        in: query
        name: bucket_name
        required: true
        schema:
          example: ChockFullOfNuts
          type: string
      - description: 'The Google Drive client ID.


          **Note:**


          This parameter is only valid for the `GoogleDrive` backup type.'
        in: query
        name: client_id
        required: true
        schema:
          example: aBcdeFgHIjK123
          type: string
      - description: 'The Google Drive client secret.


          **Note:**


          This parameter is only valid for the `GoogleDrive` backup type.'
        in: query
        name: client_secret
        required: true
        schema:
          example: aBcde123FgHIjK456
          type: string
      - description: 'Whether to disable the backup destination.


          * `1` — Disable the backup destination.

          * `0` — Enable the backup destination.'
        in: query
        name: disabled
        required: true
        schema:
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'The remote server''s hostname.


          **Note:**


          This parameter is only valid for the following backup types:

          * `Custom`

          * `FTP`

          * `SFTP`

          * `Rsync`

          * `WebDAV`

          * `S3Compatible`'
        in: query
        name: host
        required: true
        schema:
          example: backups.example.com
          format: hostname
          type: string
      - description: The backup destination's name.
        in: query
        name: name
        required: true
        schema:
          example: destination_name
          type: string
      - description: 'The remote server account''s password or secret

          access key.


          **Note:**


          This parameter is only valid for the following backup types:

          * `AmazonS3`

          * `Custom`

          * `FTP`

          * `SFTP`

          * `Rsync`

          * `WebDAV`

          * `S3Compatible`'
        in: query
        name: password
        required: true
        schema:
          example: 123456luggage
          type: string
      - description: 'The absolute file path to the user-supplied transport solution script.


          **Note:**


          This parameter is only valid for the `Custom` backup type.'
        in: query
        name: script
        required: true
        schema:
          example: /home/backups/beammeupscotty.pl
          type: string
      - description: 'The type of backup destination.


          * `Custom`

          * `FTP`

          * `Local`

          * `SFTP`

          * `WebDAV`

          * `AmazonS3`

          * `Rsync`

          * `GoogleDrive`

          * `S3Compatible`

          * `Backblaze`


          **Note:**


          This value determines which parameters you can use with the function.


          **Warning:**


          Use any of these encrypted connections to transfer system backup files:


          * Amazon S3™

          * Backblaze

          * GoogleDrive

          * Rsync

          * S3 Compatible

          * SFTP

          * WebDAV with SSL enabled'
        in: query
        name: type
        required: true
        schema:
          enum:
          - Custom
          - FTP
          - Local
          - SFTP
          - WebDAV
          - AmazonS3
          - Rsync
          - GoogleDrive
          - S3Compatible
          - Backblaze
          example: Local
          type: string
      - description: 'The remote server account''s username.


          **Note:**


          This parameter is only valid for the following backup types:

          * `Custom`

          * `FTP`

          * `SFTP`

          * `Rsync`

          * `WebDAV`'
        in: query
        name: username
        required: true
        schema:
          example: username
          format: username
          type: string
      - description: 'The path to the backups directory on the remote server.


          **Note:**


          This parameter is only valid for the following backup types:

          * `AmazonS3`

          * `GoogleDrive`

          * `S3Compatible`'
        in: query
        name: folder
        required: false
        schema:
          default: ''
          example: subfolder
          type: string
      - description: 'Whether the path is mounted.


          * `1` — The path is mounted.

          * `0` — The path is **not** mounted.


          **Note:**


          This parameter is only valid for the `Local` backup type.'
        in: query
        name: mount
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to fail the backup attempt if the mount fails.


          * `1` — Fail the backup attempt.

          * `0` — Do **not** fail the backup attempt.


          **Note:**


          This parameter is only valid for the `Local` backup type.'
        in: query
        name: no_mount_fail
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to use this transport only for logs.


          * `1` — This destination will be skipped for regular backups.

          * `0` — Both log and regular backups will be uploaded.


          This setting defaults to 0.

          The only time log files get their own backup is via scripts/remote_log_transfer'
        in: query
        name: only_used_for_logs
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to use passive FTP.


          * `1` — Use passive FTP.

          * `0` — Use active FTP.


          **Note:**


          This parameter is only valid for the `FTP` backup type.'
        in: query
        name: passive
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'The private key file''s passphrase, if the `authtype` parameter is the `key` value.


          **Note:**


          This parameter is only valid for the following backup types:

          * `SFTP`

          * `Rsync`'
        in: query
        name: passphrase
        required: false
        schema:
          default: null
          example: 123456luggage
          type: string
      - description: 'The path to the backups directory on the remote server.


          * This parameter is **required** for the `Local` backup type.

          * If you do **not** use this parameter, the system will not set a value.


          **Note:**


          This parameter is only valid for the following backup types:

          * `Backblaze`

          * `Custom`

          * `Local`

          * `FTP`

          * `SFTP`

          * `Rsync`

          * `WebDAV`'
        in: query
        name: path
        required: false
        schema:
          default: null
          example: backups
          type: string
      - description: "The TCP port to use.\n\n**Note:**\n\n* This parameter defaults to the standard port used by the queried backup `type` parameter.\n* This parameter is only valid for the following backup types:\n  * `FTP`\n  * `SFTP`\n  * `Rsync`\n  * `WebDAV`"
        in: query
        name: port
        required: false
        schema:
          example: 21
          maximum: 65535
          minimum: 1
          type: integer
      - description: 'The file path to the private key file, if the `authtype` parameter is the `key` value.


          **Note:**


          This parameter is only valid for the following backup types:

          * `SFTP`

          * `Rsync`'
        in: query
        name: privatekey
        required: false
        schema:
          default: null
          example: /home/backups/key
          type: string
      - description: 'Whether to use SSL.


          * `1` — Use SSL.

          * `0` — Do **not** use SSL.


          **Note:**


          This parameter is only valid for the `WebDAV` backup type.'
        in: query
        name: ssl
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'The session timeout, measured in seconds.


          **Note:**


          * This parameter is **not** valid for the `Local` backup `type` parameter.

          * The default value depends on the `type` parameter''s value.'
        in: query
        name: timeout
        required: false
        schema:
          example: 30
          type: integer
      - description: 'Whether to upload system backups.


          * `1` — Upload system backups.

          * `0` — Do **not** upload system backups.'
        in: query
        name: upload_system_backup
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      id:
                        description: The backup destination's ID.
                        example: PhAxIoLSdIkCI40q9vWS4BYy
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: backup_destination_add
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Add a backup destination
      tags:
      - Backups
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  backup_destination_add \\\n  name='destination_name' \\\n  type='Local' \\\n  disabled='0' \\\n  bucket='ChockFullOfNuts' \\\n  aws_access_key_id='REDACTED_AWS_ACCESS_KEY_ID' \\\n  password='123456luggage' \\\n  application_key='A123b45CD678e9' \\\n  application_key_id='12a345B678c9' \\\n  bucket_id='a12b34cd5678e9f' \\\n  bucket_name='ChockFullOfNuts' \\\n  script='/home/backups/beammeupscotty.pl' \\\n  host='backups.example.com' \\\n  username='username' \\\n  client_id='aBcdeFgHIjK123' \\\n  client_secret='aBcde123FgHIjK456' \\\n  authtype='password'\n"
