  /start_background_pkgacct:
    get:
      description: 'This function backs up an account with the pkgacct script.


        **Note:**


        - The `/usr/local/cpanel/scripts/pkgacct` script logs results to the `/var/cpanel/pkgacct_sessions/session_id/` directory, where `session_id` represents the backup session''s ID.

        - The target system streams the output of this function with the `/usr/local/cpanel/whostmgr/docroot/cgi/live_tail_log.cgi` script on the source system. Users should **not** directly call this script.'
      operationId: Backup-start_background_pkgacct
      parameters:
      - description: The cPanel account to back up.
        in: query
        name: user
        required: true
        schema:
          example: username
          format: username
          type: string
      - description: 'Whether to compress the data in .gzip format.

          * `compress` - Compress the data.

          * `null` - Do **not** compress the data.'
        in: query
        name: compressionsetting
        required: false
        schema:
          default: null
          enum:
          - compress
          example: compress
          type:
          - string
          - 'null'
      - description: "Whether to update the destination file with any new content since the previous backup.\nThis parameter also removes any content that no longer exists on the account.\nIf the destination file does **not** exist, the function creates a new file in that location.\n* `1` — Create an incremental archive file.\n* `0` — Do **not** create an incremental archive file.\n\n**Note:**\n\n When you use this parameter, the system creates the backup as an uncompressed archive."
        in: query
        name: incremental
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to run the background task with a reduced priority.

          * `1` — Run the backup as a low priority task.

          * `0` — Run the backup with normal priority.'
        in: query
        name: low_priority
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'The minimum version of MySQL® that the system requires to restore the backed up database files.


          **Note:**


          - You can view the server''s installed version of MySQL in the `/var/cpanel/cpanel.config` file.

          - This parameter defaults to the current installed version of MySQL.'
        in: query
        name: mysqlver
        required: false
        schema:
          example: '5.5'
          type: string
      - description: 'Whether to encode each line of the script''s output in JSON format in order to allow the `live_tail_log.cgi` script to stream it.

          * `1` — Serialize the output.

          * `0` — Do **not** serialize the output.'
        in: query
        name: serialized_output
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to exclude the account''s databases from the cpmove archive.

          * `1` — Do **not** back up the account''s databases.

          * `0` — Back up the account''s databases.'
        in: query
        name: skipacctdb
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to exclude the account''s API tokens from the archive.

          * `1` — Do **not** back up the account''s API tokens.

          * `0` — Back up the account''s API tokens.'
        in: query
        name: skipapitokens
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to exclude the account''s external authentication credentials from the archive.

          * `1` — Do **not** back up the account''s external authentication credentials.

          * `0` — Back up the account''s external authentication credentials.'
        in: query
        name: skipauthnlinks
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to exclude the account''s bandwidth data from the archive.

          * `1` — Do **not** back up the account''s bandwidth data.

          * `0` — Back up the account''s data.'
        in: query
        name: skipbwdata
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to exclude the account''s DNSSEC configuration from the archive.

          * `1` — Do **not** back up the account''s DNSSEC configuration.

          * `0` — Back up the account''s DNSSEC configuration.'
        in: query
        name: skipdnssec
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to exclude the account''s DNS zone file information from the archive.

          * `1` — Do **not** back up the account''s DNS zone file information.

          * `0` — Back up the account''s DNS zone file information.'
        in: query
        name: skipdnszones
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to exclude the account''s FTP user accounts from the archive.

          * `1` — Do **not** back up the account''s FTP user accounts.

          * `0` — Back up the account''s FTP user accounts.'
        in: query
        name: skipftpusers
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to skip the home directory''s contents.

          * `1` — Do **not** back up the account''s home directory.

          * `0` — Back up the account''s home directory.'
        in: query
        name: skiphomedir
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to exclude the account''s cPanel & WHM linked server nodes configuration from the archive.

          * `1` — Do **not** back up the account''s linked server nodes configuration.

          * `0` — Back up the account''s linked server nodes configuration.'
        in: query
        name: skiplinkednodes
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to exclude the account''s log files from the archive.

          * `1` — Do **not** back up the account''s log files.

          * `0` — Back up the account''s log files.'
        in: query
        name: skiplogs
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to exclude the account''s reseller privileges from the archive.

          * `1` — Do **not** back up the account''s reseller privileges.

          * `0` — Back up the account''s reseller privileges.'
        in: query
        name: skipresellerconfig
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to exclude the account''s shell information and privileges from the archive.

          * `1` — Do **not** back up the account''s shell information and privileges.

          * `0` — Back up the account''s shell information and privileges.'
        in: query
        name: skipshell
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to exclude the account''s virtual host (vhost) templates from the archive.

          * `1` — Do **not** back up the account''s vhost templates.

          * `0` — Back up the account''s vhost templates.'
        in: query
        name: skipvhosttemplates
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to create the cpmove archive in chunks.

          * `1` — Create the archive in chunks.

          * `0` — Create a single archive file.'
        in: query
        name: split
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'The path to the directory in which you wish to store the cpmove archive.


          **Note:**


          This parameter defaults to `/home/user`, where `user` represents the username of the account.'
        in: query
        name: tarroot
        required: false
        schema:
          example: /home/user
          type: string
      - description: "Whether to use the account's last known successful backup as a template when the script creates the cpmove archive, if any exist.\n* `1` — Use the account's last known successful backup as a template, if any exist.\n* `0` — Do **not** use the account's last known successful backup.\n\n**Note:**\n\n This parameter may reduce the amount of time that the backup process requires."
        in: query
        name: use_backups
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      complete_master_error_log:
                        description: "The name of the master error log.\n\n**Note:**\n\n The target system streams the output of this file with the `live_tail_log.cgi` script; however, users should **not** directly call this script."
                        example: master.error_log
                        type: string
                      complete_master_log:
                        description: "The name of the master log.\n\n**Note:**\n\n The target system streams the output of this file with the `live_tail_log.cgi` script; however, users should **not** directly call this script."
                        example: master.log
                        type: string
                      session_id:
                        description: The backup's session ID.
                        example: example20151109162046c4xzDp55q9u4tPj
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: start_background_pkgacct
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Back up an account using the pkgacct script
      tags:
      - Backups
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  start_background_pkgacct \\\n  user='username'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/start_background_pkgacct?api.version=1&user=username
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '54'
  /start_local_cpmove_restore:
    get:
      description: This function performs a full restoration of a single cPanel account from a `cpmove` tarball.
      operationId: Transfers-start_local_cpmove_restore
      parameters:
      - description: "A filepath that contains the account's `cpmove` tarball or the directory path that contains the extracted `cpmove` tarball.\n\n  **Note:**\n\nYou can use the [pkgacct script](https://go.cpanel.net/ThepkgacctScript) to create a `cpmove` tarball."
        in: query
        name: cpmovepath
        required: true
        schema:
          example: /home/cpmove-newacct.tar.gz
          type: string
      - description: "Whether to assign the account a dedicated IP address.\n* `1` - Assign a dedicated IP address.\n* `0` - Do **not** assign a dedicated IP address.\n\n  **Note:**\n\nThe system **must** have an available IP address."
        in: query
        name: dedicated_ip
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'Whether to delete the `cpmove` tarball or extracted directory, given in the `cpmovepath` parameter, after the system completes the account restoration.

          * `1` - Delete the `cpmove` tarball or extracted directory.

          * `0` - Do **not** delete the `cpmove` tarball or extracted directory.'
        in: query
        name: delete_archive
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'The server on which the account''s email will reside after the system completes the transfer.

          * `.local` - Use the local server the account is being restored on.

          * `.existing` - Use the server location defined in the account''s backup data. The system defaults to the `.local` parameter if this does **not** work.

          * `ALIAS` - Use a [cPanel & WHM linked node server''s alias](https://go.cpanel.net/whmlinkednodes). For example, the `example-alias` for the `servernode.example.com` domain. The system defaults to the `.local` parameter if this does **not** work.'
        in: query
        name: mail_location
        required: false
        schema:
          default: .existing
          oneOf:
          - enum:
            - .local
            - .existing
            type: string
          - description: The remote cPanel & WHM linked server node's alias.
            example: example-alias
            type: string
      - description: 'Whether to overwrite an existing account on the server, if one exists.

          * `1` - Overwrite an existing account.

          * `0` - Do **not** overwrite an existing account on the server.'
        in: query
        name: overwrite
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to perform a restricted restore for the account. The system will perform security checks on the backup file. If you do not trust the source of the account backup with `root` access to your server, use this parameter to protect your server.


          * `1` - Perform a restricted restore.

          * `0` - Do **not** perform a restricted restore.


          **Important:**


          * This parameter is **experimental**. Do **not** consider it as an effective security control. For more information, read our [restricted restore](https://go.cpanel.net/whmdocsTransferorRestoreacPanelAccount#restricted-restore) documentation.

          * If the account owns PostgreSQL® databases, your server **must** use PostgreSQL version 8.4 or newer.

          * This parameter **only** allows restored accounts to use the `noshell` or [`jailshell`](https://go.cpanel.net/VirtFSJailedShell) environments. If the account uses a different shell, the system will set the account to use the `noshell` environment.

          * If there is an issue with the backup file, the system will **not** restore that part of the backup file. It will also adds a warning to the log file.'
        in: query
        name: restricted
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'Whether to perform one of the following actions to the account''s A records:

          * `all` - Replace **all** instances of the original server''s IP address with the new server''s IP address.

          * `basic` - **Only** replace the cPanel provided A records.'
        in: query
        name: update_a_records
        required: false
        schema:
          default: all
          enum:
          - all
          - basic
          example: all
          type: string
      - description: The username to give to the restored cPanel account. This will default to the username provided in the backup files.
        in: query
        name: username
        required: false
        schema:
          example: example
          format: username
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      transfer_session_id:
                        description: The background transfer process ID.
                        example: example202003301756425ugO
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: start_local_cpmove_restore
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed: Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Restore one cPanel account from a backup
      tags:
      - Backups
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  start_local_cpmove_restore \\\n  cpmovepath='/home/cpmove-newacct.tar.gz'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/start_local_cpmove_restore?api.version=1&cpmovepath=%2fhome%2fcpmove-newacct.tar.gz
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '88'
