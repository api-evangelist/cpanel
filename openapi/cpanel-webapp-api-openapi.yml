  /WebApp/stage:
    get:
      description: 'Web Apps is the recommended feature for deploying new web applications, and this function is the entry point. Prefer it over the older Application Manager (`PassengerApps`) feature for new deployments.


        This function registers a new web application from an uploaded

        archive or a Git repository. Once the source is placed on disk, it

        runs a preflight that inspects the source and detects the

        application''s framework and category, records them on the

        application, and derives suggested configuration defaults. The

        detection `confidence` and the suggested `defaults` are returned so

        you can pass them to `WebApp::configure`. The application is

        registered but **not** deployed — call `WebApp::configure` (optional)

        and then `WebApp::deploy` to bring it live.


        The preflight never fails the stage: a source with no recognizable

        markers is registered with a `none` confidence and generic defaults.


        Registering a name that is still **staged** (not yet deployed)

        overwrites it: the previously staged application and its source are

        replaced, and the response `warnings` array reports that the old

        files were overwritten.


        Registering a name that is already **deployed** leaves the running

        application untouched — its container and live routing are never

        disturbed — but the new application cannot reuse the deployed

        application''s display name, or `WebApp::list` and bare-name

        addressing could not tell the two apart. So it is registered under

        the next free `-N` (for example, `my-app-2`), and the response

        `warnings` array reports the assigned name. **Read the assigned name

        from the response `data.name`: you must pass that name (not the one

        you requested) to `WebApp::configure` and `WebApp::deploy` to act on

        this application**, which stands up as its own separate container.


        On failure, the `metadata.error_category` field carries a

        machine-readable failure category.'
      operationId: WebApp_stage
      parameters:
      - description: 'The requested application name (slug). If a deployed application

          already uses it, the application is registered under the next free

          `<name>-N` instead; read the assigned name from the response

          `data.name` and use it for `WebApp::configure` and `WebApp::deploy`.'
        in: query
        name: name
        required: true
        schema:
          example: my-app
          type: string
      - description: "The application's source location. This is **required** for every\nsource type:\n\n* When `source_type` is `zip` — the path, relative to the user's\n  home directory, of a previously uploaded source archive\n  (for example, `uploads/my-app.zip`).\n* When `source_type` is `git` — the Git repository URL to clone\n  (for example, `https://github.com/example/my-app.git`).\n\n**Security note:** This source is built and run on the server.\nOnly use ZIP archives or Git repositories from a trusted origin.\n\nDo not embed credentials (such as a username and password or an\naccess token) in the Git URL — they are stored in plaintext. To\nclone a private repository, use a Git SSH URL that you have an\nSSH key configured for."
        in: query
        name: source
        required: true
        schema:
          example: https://github.com/example/my-app.git
          type: string
      - description: 'The application''s source type.


          * `zip` — An archive previously uploaded with `Fileman::upload_files`.

          * `git` — A Git repository.'
        in: query
        name: source_type
        required: true
        schema:
          enum:
          - zip
          - git
          example: git
          type: string
      - description: 'The application root, relative to the top of the cloned repository

          or extracted archive, for a source whose application does not live

          at the top level (for example, `packages/web` in a monorepo). The

          preflight inspects this directory to detect the framework.


          This parameter must be a relative path inside the source. When

          omitted, it defaults to the source root, unless the manifest is

          found in a single top-level subdirectory (as in a repository zip),

          in which case that subdirectory is used automatically.'
        in: query
        name: appdir
        required: false
        schema:
          example: packages/web
          type: string
      - description: 'The Git branch to clone. Only meaningful when `source_type` is

          `git`.


          This parameter defaults to the repository''s default branch.'
        in: query
        name: branch
        required: false
        schema:
          example: main
          type: string
      - description: 'The run mode for `server` category applications.


          This parameter defaults to `production`.'
        in: query
        name: mode
        required: false
        schema:
          enum:
          - production
          - development
          example: production
          type: string
      - description: 'The runtime that backs the application.


          This parameter defaults to the system default runtime

          (`nodejs`).'
        in: query
        name: runtime
        required: false
        schema:
          enum:
          - nodejs
          example: nodejs
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: stage
                    type: string
                  module:
                    description: The name of the module called.
                    example: WebApp
                    type: string
                  result:
                    properties:
                      data:
                        description: The newly registered application.
                        properties:
                          category:
                            description: 'The application''s category. This determines which

                              lifecycle actions apply.


                              * `static` — The application builds to static files that the web server serves directly.

                              * `server` — The application runs a long-lived server process.

                              * `other` — Any other kind of application.'
                            enum:
                            - static
                            - server
                            - other
                            example: server
                            type: string
                          container_name:
                            description: 'The name of the deployed container backing this

                              application, or `null` while it is only staged.

                              Assigned by the deploy and unique per application

                              instance, so it identifies the exact deployed

                              record even when several applications share a base

                              name.'
                            example: my-app.bob.01
                            type:
                            - string
                            - 'null'
                          confidence:
                            description: 'How confident the preflight detection is.


                              * `high` — Strong framework markers found.

                              * `low` — Partial markers found; verify the defaults before deploying.

                              * `none` — No recognizable markers; the defaults are generic.'
                            enum:
                            - high
                            - low
                            - none
                            example: high
                            type: string
                          defaults:
                            description: Suggested configuration values for the detected framework. Pass them to `WebApp::configure` as-is or after user adjustment.
                            properties:
                              build_command:
                                description: The suggested build command, or `null` if no build step is needed.
                                example: npm run build
                                type:
                                - string
                                - 'null'
                              output_dir:
                                description: The suggested build output directory, or `null` if not applicable.
                                example: .next
                                type:
                                - string
                                - 'null'
                              runtime_tag:
                                description: The suggested runtime version tag.
                                example: '22'
                                type: string
                              startup_command:
                                description: The suggested startup command, or `null` for `static` applications.
                                example: npm run start
                                type:
                                - string
                                - 'null'
                            type: object
                          db:
                            description: The application's linked database information, or `null` if no database is linked.
                            properties:
                              env_keys:
                                description: The environment variable names that carry the database credentials.
                                example:
                                - DB_NAME
                                - DB_HOST
                                - DB_PORT
                                items:
                                  type: string
                                type: array
                              host:
                                description: The database server hostname.
                                example: localhost
                                format: hostname
                                type: string
                              name:
                                description: The database name.
                                example: example_my_app
                                type: string
                              port:
                                description: The database server port.
                                example: 3306
                                type: integer
                            type:
                            - object
                            - 'null'
                          deployed:
                            description: Whether a deploy has put the application live. This is `true` once the application holds a container or a deploy has completed successfully, and `false` for a freshly staged application or one whose only deploy failed.
                            example: false
                            type: boolean
                          domain:
                            description: The domain the application is bound to. This is an existing domain on the account or an automatically generated temporary domain.
                            example: my-app.example.com
                            format: domain
                            type: string
                          env:
                            additionalProperties:
                              type: string
                            description: The application's environment variables.
                            example:
                              NODE_ENV: production
                            type: object
                          framework:
                            description: The application's detected or user-selected framework, or `null` if unknown.
                            example: null
                            type:
                            - string
                            - 'null'
                          last_deploy:
                            description: Information about the most recent deploy, or `null` if the application has never deployed.
                            properties:
                              deploy_id:
                                description: The unique identifier of the deploy.
                                example: dp-20260612-0001
                                type: string
                              result:
                                description: The result of the deploy.
                                enum:
                                - success
                                - failed
                                example: success
                                type: string
                              timestamp:
                                description: When the deploy finished, in ISO 8601 format.
                                example: '2026-06-12T14:03:22.000Z'
                                format: date-time
                                type: string
                            type:
                            - object
                            - 'null'
                          mode:
                            description: The application's run mode. Only meaningful for the `server` category; `null` otherwise.
                            enum:
                            - production
                            - development
                            example: production
                            type:
                            - string
                            - 'null'
                          name:
                            description: 'The application''s assigned name (slug), unique

                              across the account. This may differ from the name

                              you requested: if a deployed application already

                              used that name, the application was registered

                              under the next free `<name>-N`. Use this value for

                              `WebApp::configure` and `WebApp::deploy`.'
                            example: my-app
                            type: string
                          package_manager:
                            description: 'The package manager the deploy uses to install

                              dependencies and run scripts. It is detected from

                              the source''s `packageManager` field, a lockfile, or

                              the default (`npm`).'
                            enum:
                            - npm
                            - yarn
                            - pnpm
                            - bun
                            example: npm
                            type: string
                          runtime:
                            description: The application's runtime identifier.
                            example: nodejs
                            type: string
                          runtime_tag:
                            description: The runtime version tag.
                            example: '22'
                            type: string
                          source:
                            description: The application's source information.
                            properties:
                              branch:
                                description: The Git branch, or `null` for ZIP sources.
                                example: main
                                type:
                                - string
                                - 'null'
                              type:
                                description: 'The source type.


                                  * `zip` — An uploaded archive.

                                  * `git` — A Git repository.'
                                enum:
                                - zip
                                - git
                                example: git
                                type: string
                              url:
                                description: The Git repository URL, or `null` for ZIP sources.
                                example: https://github.com/example/my-app.git
                                type:
                                - string
                                - 'null'
                            type: object
                          staged:
                            description: Whether the application's source is present in the staging area. This is `true` after the source is uploaded or cloned and until the application is deleted.
                            example: true
                            type: boolean
                          status:
                            description: 'The application''s current status.


                              * `created` — Registered but never deployed.

                              * `deploying` — A deploy is in progress.

                              * `running` — The application is live.

                              * `stopped` — The application is stopped.

                              * `errored` — The last action failed.'
                            enum:
                            - created
                            - deploying
                            - running
                            - stopped
                            - errored
                            example: created
                            type: string
                          url:
                            description: The application's live HTTPS URL.
                            example: https://my-app.example.com
                            format: url
                            type: string
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties:
                          error_category:
                            description: 'The machine-readable failure category. Only present

                              when `status` is `0`.


                              * `limit_exceeded` — The account reached its application count or memory limit.

                              * `source_invalid` — The source archive or Git repository is missing, unreadable, or invalid.'
                            enum:
                            - limit_exceeded
                            - source_invalid
                            type:
                            - string
                            - 'null'
                        type: object
                      status:
                        description: '- `1` - Success.

                          - `0` - Failed. Check the `errors` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
