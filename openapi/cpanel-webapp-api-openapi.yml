  /WebApp/redeploy:
    get:
      description: 'This function redeploys an already-deployed application. For

        Git-sourced applications, it pulls the latest changes from the

        configured branch before deploying. Otherwise it behaves exactly

        like `WebApp::deploy`.


        **Note**:


        This function starts an asynchronous task and returns immediately.

        Stream the returned `sse_url` for live progress, or poll the task.

        While the task runs, the application''s status is `deploying`. When

        the task finishes the status transitions to `running` on success or

        `errored` on failure. Use `WebApp::list` to read the current status

        and inspect `last_deploy` for the outcome and any failure category.


        **Important**:


        This function is idempotent. If you call it while a deploy for the

        same application is already running, it returns the in-flight

        task''s identifiers instead of starting a new deploy.


        If this call fails before the task is dispatched (for example, when

        the application does not exist), `metadata.error_category` carries a

        machine-readable failure category. Build and runtime failures occur

        inside the background task and are recorded asynchronously in

        `last_deploy.error_category`, which is accessible via `WebApp::list`.'
      operationId: WebApp_redeploy
      parameters:
      - description: The application's unique name (slug).
        in: query
        name: name
        required: true
        schema:
          example: my-app
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: redeploy
                    type: string
                  module:
                    description: The name of the module called.
                    example: WebApp
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          deploy_id:
                            description: The unique identifier of this deploy.
                            example: dp-20260612-0002
                            type: string
                          sse_url:
                            description: The SSE URL to stream the deploy's progress.
                            example: /sse/UserTasks/00000000_5c6c8b18228a35/deploy.log
                            format: url-path
                            type: string
                          task_id:
                            description: The task id of the SSE process.
                            example: 00000000/5c76ec5566332c
                            type: string
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties:
                          error_category:
                            description: 'The machine-readable failure category. Only present

                              when `status` is `0` and the error occurred before

                              the background task was dispatched.


                              Build and runtime pipeline failures occur asynchronously;

                              they are recorded in `last_deploy.error_category` after

                              the task finishes and are accessible via `WebApp::list`.


                              * `build_failed` — The build step failed. The error message includes the breached resource cap when one applied.

                              * `port_conflict` — The application''s port is already in use.

                              * `requires_build` — The application must be built before it can deploy, and no build command is configured.

                              * `start_failed` — The container started but is not listening on a port, so the application is unreachable; it most likely exited immediately.

                              * `limit_exceeded` — Deploying this application would push the account''s number of running application containers to or past its maximum allowed applications.

                              * `domain_in_use` — Another of this account''s applications has claimed the application''s domain since it was last configured.'
                            enum:
                            - build_failed
                            - port_conflict
                            - requires_build
                            - start_failed
                            - limit_exceeded
                            - domain_in_use
                            type:
                            - string
                            - 'null'
                        type: object
                      status:
                        description: '- `1` - Success.

                          - `0` - Failed. Check the `errors` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Redeploy an application, pulling source updates first
      tags:
      - Webapp
      x-codeSamples:
