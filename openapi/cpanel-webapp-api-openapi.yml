  /WebApp/list:
    get:
      description: 'This function lists the account''s web applications and their current

        state.'
      operationId: WebApp_list
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: list
                    type: string
                  module:
                    description: The name of the module called.
                    example: WebApp
                    type: string
