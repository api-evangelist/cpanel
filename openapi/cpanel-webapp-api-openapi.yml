openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: UAPI accesses the cPanel interface's features. Use this API to access and modify cPanel account data and settings.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: cPanel U Web App API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running cPanel.
  url: https://{host}:{port}/execute
  variables:
    host:
      default: cpanel-server.tld
      description: The hostname of a server running cPanel.
    port:
      default: '2083'
      description: The cPanel port.
security:
- BasicAuth: []
tags:
- description: The WebApp module for UAPI.
  name: Webapp
paths:
  /WebApp/configure:
    get:
      description: 'This function updates an application''s configuration. Only the

        parameters you pass change; omitted parameters keep their current

        values.


        **Important:**


        The `env` parameter uses **replace-all** semantics — the value you

        pass becomes the application''s complete set of environment

        variables. To change one variable, read the current set first and

        resubmit it with your change applied.'
      operationId: WebApp_configure
      parameters:
      - description: The application's unique name (slug).
        in: query
        name: name
        required: true
        schema:
          example: my-app
          type: string
      - description: 'The application root, relative to the top of the source, for a

          source whose application does not live at the top level (for

          example, `packages/web` in a monorepo).


          Pass an empty value to reset the root back to the source top.


          Changing this value re-runs the preflight against the new root,

          which re-detects the application''s `framework` and `category` and

          re-seeds the suggested build defaults (any value you pass explicitly

          in the same call takes precedence). When it changes, the response

          also carries the `confidence` and `defaults` from the re-detection.


          This parameter must be a relative path inside the source.'
        in: query
        name: appdir
        required: false
        schema:
          example: packages/web
          type: string
      - description: The command that builds the application.
        in: query
        name: build_command
        required: false
        schema:
          example: npm run build
          type: string
      - description: 'The database action to perform.


          * `create` — Provision a new database and database user, and inject the credentials into the application''s environment.

          * `link` — Link the existing database that the `db_name` parameter specifies.'
        in: query
        name: db
        required: false
        schema:
          enum:
          - create
          - link
          example: create
          type: string
      - description: 'The name of the existing database to link.


          **Required** when `db` is `link`.'
        in: query
        name: db_name
        required: false
        schema:
          example: example_my_app
          type: string
      - description: 'The name (slug) used to name the deployment. When omitted, the

          deployment is named after the application.'
        in: query
        name: deployname
        required: false
        schema:
          example: my-app
          type: string
      - description: 'The domain to bind the application to. Any domain the account owns is

          accepted — the main domain, an addon domain, a parked domain, or a

          manually created subdomain — and the application is served AT it. A

          domain that does not exist yet is created as a subdomain, provided the

          account owns its root. A domain another application is already serving

          is rejected; see the `domain_in_use` `error_category` value.


          Pass an empty value to generate and bind a temporary domain

          automatically. Because that address is generated rather than chosen,

          it is held to a stricter rule: if a domain already exists there the

          call fails with `domain_unavailable` instead of adopting it.'
        in: query
        name: domain
        required: false
        schema:
          example: my-app.example.com
          format: domain
          type: string
      - description: 'A JSON-encoded object of the application''s environment variables.


          **Warning:** This **replaces all** existing environment variables

          with the set you provide.


          **Security note:** These values are stored in plaintext. Do not

          use this parameter for sensitive secrets (API keys, database

          passwords, tokens, etc.).'
        in: query
        name: env
        required: false
        schema:
          example: '{"NODE_ENV":"production","API_KEY":"abc123"}'
          format: json
          type: string
      - description: The run mode for `server` category applications.
        in: query
        name: mode
        required: false
        schema:
          enum:
          - production
          - development
          example: production
          type: string
      - description: The directory, relative to the application root, that the build writes its output to.
        in: query
        name: output_dir
        required: false
        schema:
          example: dist
          type: string
      - description: The runtime version tag to run the application under. Use `WebApp::get_available` to list the valid tags.
        in: query
        name: runtime_tag
        required: false
        schema:
          example: '22'
          type: string
      - description: The command that starts the application's server process. Only meaningful for the `server` category.
        in: query
        name: startup_command
        required: false
        schema:
          example: npm run start
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: configure
                    type: string
                  module:
                    description: The name of the module called.
                    example: WebApp
                    type: string
                  result:
                    properties:
                      data:
                        description: The application with its updated configuration.
                        properties:
                          category:
                            description: 'The application''s category. This determines which

                              lifecycle actions apply.


                              * `static` — The application builds to static files that the web server serves directly.

                              * `server` — The application runs a long-lived server process.

                              * `other` — Any other kind of application.'
                            enum:
                            - static
                            - server
                            - other
                            example: server
                            type: string
                          container_name:
                            description: 'The name of the deployed container backing this

                              application, or `null` while it is only staged.

                              Assigned by the deploy and unique per application

                              instance, so it identifies the exact deployed

                              record even when several applications share a base

                              name.'
                            example: my-app.bob.01
                            type:
                            - string
                            - 'null'
                          confidence:
                            description: 'How confident the preflight detection is. Present

                              only when this call changed `appdir` and re-ran the

                              preflight.


                              * `high` — Strong framework markers found.

                              * `low` — Partial markers found; verify the defaults before deploying.

                              * `none` — No recognizable markers; the defaults are generic.'
                            enum:
                            - high
                            - low
                            - none
                            example: high
                            type: string
                          defaults:
                            description: Suggested configuration values for the detected framework. Present only when this call changed `appdir` and re-ran the preflight.
                            properties:
                              build_command:
                                description: The suggested build command, or `null` if no build step is needed.
                                example: npm run build
                                type:
                                - string
                                - 'null'
                              output_dir:
                                description: The suggested build output directory, or `null` if not applicable.
                                example: .next
                                type:
                                - string
                                - 'null'
                              runtime_tag:
                                description: The suggested runtime version tag.
                                example: '22'
                                type: string
                              startup_command:
                                description: The suggested startup command, or `null` for `static` applications.
                                example: npm run start
                                type:
                                - string
                                - 'null'
                            type: object
                          db:
                            description: The application's linked database information, or `null` if no database is linked.
                            properties:
                              env_keys:
                                description: The environment variable names that carry the database credentials.
                                example:
                                - DB_NAME
                                - DB_HOST
                                - DB_PORT
                                items:
                                  type: string
                                type: array
                              host:
                                description: The database server hostname.
                                example: localhost
                                format: hostname
                                type: string
                              name:
                                description: The database name.
                                example: example_my_app
                                type: string
                              port:
                                description: The database server port.
                                example: 3306
                                type: integer
                            type:
                            - object
                            - 'null'
                          deployed:
                            description: Whether a deploy has put the application live. This is `true` once the application holds a container or a deploy has completed successfully, and `false` for a freshly staged application or one whose only deploy failed.
                            example: false
                            type: boolean
                          deployname:
                            description: The name used to name the deployment, or `null` when it defaults to the application name.
                            example: my-site
                            type:
                            - string
                            - 'null'
                          domain:
                            description: The domain the application is bound to. This is an existing domain on the account or an automatically generated temporary domain.
                            example: my-app.example.com
                            format: domain
                            type: string
                          env:
                            additionalProperties:
                              type: string
                            description: The application's environment variables.
                            example:
                              API_KEY: abc123
                              NODE_ENV: production
                            type: object
                          framework:
                            description: The application's detected or user-selected framework, or `null` if unknown.
                            example: nextjs
                            type:
                            - string
                            - 'null'
                          last_deploy:
                            description: Information about the most recent deploy, or `null` if the application has never deployed.
                            properties:
                              deploy_id:
                                description: The unique identifier of the deploy.
                                example: dp-20260612-0001
                                type: string
                              result:
                                description: The result of the deploy.
                                enum:
                                - success
                                - failed
                                example: success
                                type: string
                              timestamp:
                                description: When the deploy finished, in ISO 8601 format.
                                example: '2026-06-12T14:03:22.000Z'
                                format: date-time
                                type: string
                            type:
                            - object
                            - 'null'
                          mode:
                            description: The application's run mode. Only meaningful for the `server` category; `null` otherwise.
                            enum:
                            - production
                            - development
                            example: production
                            type:
                            - string
                            - 'null'
                          name:
                            description: 'The application''s name (slug), unique across the

                              account. Use this value to address the application

                              in the per-app operations (`configure`, `deploy`,

                              and the lifecycle verbs). A name is assigned at

                              stage; staging a name a deployed application already

                              uses registers the new one under the next free

                              `<name>-N`, so each application keeps a distinct

                              name.'
                            example: my-app
                            type: string
                          package_manager:
                            description: 'The package manager the deploy uses to install

                              dependencies and run scripts. It is detected from

                              the source''s `packageManager` field, a lockfile, or

                              the default (`npm`).'
                            enum:
                            - npm
                            - yarn
                            - pnpm
                            - bun
                            example: npm
                            type: string
                          runtime:
                            description: The application's runtime identifier.
                            example: nodejs
                            type: string
                          runtime_tag:
                            description: The runtime version tag.
                            example: '22'
                            type: string
                          source:
                            description: The application's source information.
                            properties:
                              branch:
                                description: The Git branch, or `null` for ZIP sources.
                                example: main
                                type:
                                - string
                                - 'null'
                              type:
                                description: 'The source type.


                                  * `zip` — An uploaded archive.

                                  * `git` — A Git repository.'
                                enum:
                                - zip
                                - git
                                example: git
                                type: string
                              url:
                                description: The Git repository URL, or `null` for ZIP sources.
                                example: https://github.com/example/my-app.git
                                type:
                                - string
                                - 'null'
                            type: object
                          staged:
                            description: Whether the application's source is present in the staging area. This is `true` after the source is uploaded or cloned and until the application is deleted.
                            example: true
                            type: boolean
                          status:
                            description: 'The application''s current status.


                              * `created` — Registered but never deployed.

                              * `deploying` — A deploy is in progress.

                              * `running` — The application is live.

                              * `stopped` — The application is stopped.

                              * `errored` — The last action failed.'
                            enum:
                            - created
                            - deploying
                            - running
                            - stopped
                            - errored
                            example: created
                            type: string
                          url:
                            description: The application's live HTTPS URL.
                            example: https://my-app.example.com
                            format: url
                            type: string
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties:
                          error_category:
                            description: 'The machine-readable failure category. Only present

                              when `status` is `0` and the `domain` parameter was

                              rejected.


                              * `domain_in_use` — Another of this account''s applications already serves this domain.

                              * `domain_unavailable` — A domain already exists at the application''s generated default address. Only returned when `domain` was passed empty; an explicitly named domain the account owns is adopted instead.'
                            enum:
                            - domain_in_use
                            - domain_unavailable
                            type:
                            - string
                            - 'null'
                        type: object
                      status:
                        description: '- `1` - Success.

                          - `0` - Failed. Check the `errors` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Update an application's configuration
      tags:
      - Webapp
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  WebApp \\\n  configure \\\n  name='my-app' \\\n  env='{\"NODE_ENV\":\"production\",\"API_KEY\":\"abc123\"}' \\\n  build_command='npm run build' \\\n  startup_command='npm run start' \\\n  runtime_tag='22'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/WebApp/configure?name=my-app&build_command=npm%20run%20build&startup_command=npm%20run%20start&runtime_tag=22
      - label: LiveAPI Perl
        lang: Perl
        source: "#--------------------------------------------------------------------------------------\n# Instructions:\n#--------------------------------------------------------------------------------------\n# <theme-name> is the theme assigned to cPanel account.\n# 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n# 2) mkdir api_examples\n# 3) cd api_examples\n# 4) create a file WebApp_configure.live.pl and put this code into that file.\n# 5) In your browser login to a cPanel account.\n# 6) Manually change the url from: .../frontend/<theme-name>/\n#    to .../frontend/<theme-name>/api_examples/WebApp_configure.live.pl\n#--------------------------------------------------------------------------------------\n\nuse strict;\n\nuse Cpanel::LiveAPI ();\n\nmy $cpanel = Cpanel::LiveAPI->new(); # Connect to cPanel - only do this once.\n\n# Print the header\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\n\n# Call the API\nmy $response = $cpanel->uapi(\n    q/WebApp/,\n    q/configure/,\n    {\n        'name'            => 'my-app',\n        'env'             => '{\"NODE_ENV\":\"production\",\"API_KEY\":\"abc123\"}',\n        'build_command'   => 'npm run build',\n        'startup_command' => 'npm run start',\n        'runtime_tag'     => '22',\n    }\n);\n\n# Handle the response\nif ($response->{cpanelresult}{result}{status}) {\n    my $data = $response->{cpanelresult}{result}{data};\n    # Do something with the $data\n    # So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    # Report errors:\n    print to_json($response->{cpanelresult}{result}{errors});\n}\n\n# Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n#--------------------------------------------------------------------------------------\n# Helper function to convert a perl object to html printable json\n#--------------------------------------------------------------------------------------\nsub to_json {\n    require JSON;\n    my $str = JSON->new->pretty->encode($_[0]);\n    return $str;\n}\n"
      - label: LiveAPI PHP
        lang: PHP
        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account.\n// 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file WebApp_configure.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme-name>/\n//    to .../frontend/<theme-name>/api_examples/WebApp_configure.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'WebApp',\n    'configure',\n    array (\n        'name'            => 'my-app',\n        'env'             => '{\"NODE_ENV\":\"production\",\"API_KEY\":\"abc123\"}',\n        'build_command'   => 'npm run build',\n        'startup_command' => 'npm run start',\n        'runtime_tag'     => '22',\n    )\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    // Do something with the $data\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}"
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: cPanel 138
  /WebApp/delete:
    get:
      description: 'This function deletes an application: it stops the application''s

        running process and removes its container, moves the application''s

        directory aside to a `.bak` sibling (kept for verification or rollback

        rather than deleted), and removes the application from the account''s

        registry.


        Deleting an application cannot be undone, so it requires an explicit

        confirmation: `verify` must be `1` to proceed. A `verify` of `0` makes

        no changes and returns a confirmation-required error.


        The application''s domain is not affected; subdomains are managed

        independently.


        On failure, the `metadata.error_category` field carries a

        machine-readable failure category.


        **Important**:


        The `verify` parameter is **required** and has no default. You must

        set it to `1` to confirm this irreversible operation.'
      operationId: WebApp_delete
      parameters:
      - description: The application's unique name (slug).
        in: query
        name: name
        required: true
        schema:
          example: my-app
          type: string
      - description: "Confirmation that this irreversible deletion should proceed.\n\n* `1` — Confirm and delete: the container is torn down and the\n  application's directory is moved aside to `<name>.bak` (kept for\n  verification or rollback, not hard-deleted).\n* `0` — Make no changes; the call returns a confirmation-required\n  error.\n\nThis parameter is **required** and has no default."
        in: query
        name: verify
        required: true
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: delete
                    type: string
                  module:
                    description: The name of the module called.
                    example: WebApp
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          removed:
                            description: 'Whether the application was removed.


                              * `1` — Removed.'
                            enum:
                            - 1
                            example: 1
                            type: integer
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties:
                          error_category:
                            description: 'The machine-readable failure category. Only present

                              when `status` is `0`.


                              * `teardown_failed` — The system could not fully remove the application (its container or its files); the application remains registered so the deletion can be retried.

                              * `deploy_in_progress` — The application has a deploy currently in flight; wait for it to finish or fail, then retry.'
                            enum:
                            - teardown_failed
                            - deploy_in_progress
                            type:
                            - string
                            - 'null'
                      status:
                        description: '- `1` - Success.

                          - `0` - Failed. Check the `errors` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Delete an application
      tags:
      - Webapp
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  WebApp \\\n  delete \\\n  name='my-app' \\\n  verify='1'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/WebApp/delete?name=my-app&verify=1
      - label: LiveAPI Perl
        lang: Perl
        source: "#--------------------------------------------------------------------------------------\n# Instructions:\n#--------------------------------------------------------------------------------------\n# <theme-name> is the theme assigned to cPanel account.\n# 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n# 2) mkdir api_examples\n# 3) cd api_examples\n# 4) create a file WebApp_delete.live.pl and put this code into that file.\n# 5) In your browser login to a cPanel account.\n# 6) Manually change the url from: .../frontend/<theme-name>/\n#    to .../frontend/<theme-name>/api_examples/WebApp_delete.live.pl\n#--------------------------------------------------------------------------------------\n\nuse strict;\n\nuse Cpanel::LiveAPI ();\n\nmy $cpanel = Cpanel::LiveAPI->new(); # Connect to cPanel - only do this once.\n\n# Print the header\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\n\n# Call the API\nmy $response = $cpanel->uapi(\n    q/WebApp/,\n    q/delete/,\n    {\n        'name'         => 'my-app',\n        'verify'       => 1,\n    }\n);\n\n# Handle the response\nif ($response->{cpanelresult}{result}{status}) {\n    my $data = $response->{cpanelresult}{result}{data};\n    # Do something with the $data\n    # So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    # Report errors:\n    print to_json($response->{cpanelresult}{result}{errors});\n}\n\n# Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n#--------------------------------------------------------------------------------------\n# Helper function to convert a perl object to html printable json\n#--------------------------------------------------------------------------------------\nsub to_json {\n    require JSON;\n    my $str = JSON->new->pretty->encode($_[0]);\n    return $str;\n}\n"
      - label: LiveAPI PHP
        lang: PHP
        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account.\n// 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file WebApp_delete.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme-name>/\n//    to .../frontend/<theme-name>/api_examples/WebApp_delete.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'WebApp',\n    'delete',\n    array (\n        'name'         => 'my-app',\n        'verify'       => 1,\n    )\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    // Do something with the $data\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}"
