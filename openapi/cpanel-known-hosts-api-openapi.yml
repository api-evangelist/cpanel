  /KnownHosts/verify:
    get:
      x-readonly: true
      description: This function checks whether a host's public key exists in the cPanel account's `/home/user/.ssh/known_hosts` file.
      operationId: KnownHosts-verify
      parameters:
      - description: The host to query.
        in: query
        name: host_name
        required: true
        schema:
          example: host.example.com
          oneOf:
          - format: ipv4
            type: string
          - format: domain
            type: string
      - description: The SSH port to use.
        in: query
        name: port
        required: false
        schema:
          default: 22
          example: 1234
          maximum: 65535
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: verify
                    type: string
                  module:
                    description: The name of the module called.
                    example: KnownHosts
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          errors:
                            description: An array of errors that the system generated.
                            items:
                              example: The example.com host does not exist in the known_hosts file.
                              type: string
                            type: array
                          failure_type:
                            description: 'The reason why the system will register the hostname.

                              * `new` — The host does **not** already exist.

                              * `changed` — The host''s information has changed.'
                            enum:
                            - new
                            - changed
                            example: new
                            type: string
                          host:
                            description: An array of objects that contain information about the host.
                            items:
                              properties:
                                host:
