openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: UAPI accesses the cPanel interface's features. Use this API to access and modify cPanel account data and settings.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: cPanel U cPanel Server Information API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running cPanel.
  url: https://{host}:{port}/execute
  variables:
    host:
      default: cpanel-server.tld
      description: The hostname of a server running cPanel.
    port:
      default: '2083'
      description: The cPanel port.
security:
- BasicAuth: []
tags:
- description: Server Information / cPanel Server Information
  name: cPanel Server Information
paths:
  /Variables/get_server_information:
    get:
      x-readonly: true
      description: This function retrieves the configuration settings for the cPanel & WHM server on which an account exists. This is useful, for example, to verify which applications and functionality are available on the account.
      operationId: Variables-get_server_information
      parameters:
      - description: "The server configuration settings to return.\n\n<details>\n<summary>Click to view information about the available server configuration settings.</summary>\n\n* `default_theme` - The cPanel interface's default theme.\n* `email_filter_storage_directory` - The location of the Exim email filter storage directory.\n* `allow_park_subdomain_on_hostname` - Whether the system allows users to park subdomains of the server's hostname.\n* `allow_remote_domains` - Whether the system allows users to create addon domains or aliases that resolve to other servers.\n* `allow_unregistered_domains` - Whether the system allows users to add domains they didn't register with a domain name registrar.\n* `apache_port` - The IP address or IP address with a firewall port number that Apache® uses to listen for requests and serve web pages over an unsecured connection.\n* `apache_ssl_port` - The port or IP address that Apache uses to listen for requests and serve web pages over a secure connection.\n* `api_shell` - Whether the user can access cPanel's [*API Shell*](https://go.cpanel.net/cpaneldocsAPIShell) interface (*cPanel >> Home >> Advanced >> API Shell*).\n* `awstats_browser_update` - Whether the user can update their [AWStats](http://awstats.sourceforge.net/) software.\n* `awstats_reverse_dns` - Whether the AWStats statistical analysis software interprets visitors' domain names as IP addresses.\n* `cpanel_root_directory` - The cPanel `root` directory.\n* `database_prefix_required` - Whether the account requires database prefixing.\n* `display_cpanel_doclinks` - Whether the system displays links to cPanel feature documentation in the cPanel interface.\n* `dnsadmin_app` - The application that processes DNS management requests.\n* `empty_trash_days` - The minimum age of files that the system will automatically purge from `.trash` folders in user home directories.\n* `enable_file_protect` - Whether [EasyApache 4's *FileProtect* option](https://go.cpanel.net/EasyApache4FileprotectOption) is enabled.\n* `file_upload_maximum_bytes` - The maximum file size, in megabytes (MB), that a user can upload to a server.\n* `file_upload_must_leave_bytes` - The minimum filesystem quota that the system requires after a file uploads to a server.\n* `file_usage` - Whether file usage information displays in the cPanel *Home* interface's statistics bar.\n* `ftp_server` - The FTP server.\n* `htaccess_check_recurse` - The maximum number of directories deep to look for `.htaccess` files when you change the PHP handler.\n* `invite_sub` - Whether cPanel account users can send invitations to new Subaccount users via cPanel's [*User Manager*](https://go.cpanel.net/cpaneldocsUserManager) interface (*cPanel >> Home >> Preferences >> User Manager*).\n* `ipv6_listen` - Whether the `cpsrvd` daemon and other cPanel & WHM services listen on IPv6.\n* `local_nameserver_type` - The DNS nameserver's type.\n* `logout_redirect_url` - The logout redirection URL.\n* `mailbox_storage_format` - The mailbox storage format for new accounts.\n* `mail_server` - The mailserver type.\n* `minimum_password_strength` - The minimum strength for cPanel account passwords. \n* `minimum_password_strength_mysql` - The minimum strength for MySQL® or MariaDB® passwords.\n* `mysql_host` - The MySQL or MariaDB hostname or IP address.\n* `mysql_version` - The MySQL or MariaDB version.\n* `php_maximum_execution_time` - The number of seconds that a PHP script can run before the system terminates it.\n* `php_post_maximum_size` - The maximum size, in megabytes (MB), of a POST request.\n* `php_system_default_version` - The system's default version of PHP.\n* `php_upload_maximum_filesize` - The maximum file size, in megabytes (MB), that a PHP script may upload.\n* `php_loader` - The PHP loaders through which the system executes internal PHP scripts.\n* `php_open_basedir_home` - Whether PHP `open_basedir` protection is enabled on the server.\n* `phpmyadmin_disable_search_info_schema` - Whether the user can search for the phpMyAdmin information schema.\n* `docroots_in_public_html_only` - Whether the system restricts users from creating addon domains and subdomains outside of their `public_html` directory.\n* `require_ssl` - Whether the system requires passwords and other sensitive information use SSL encryption.\n* `allow_reset_password` - Whether cPanel's [*Reset Password*](https://go.cpanel.net/resetsubaccountpass) feature is enabled for the account.\n* `allow_reset_password_for_subaccounts` - Whether cPanel's [*Reset Password*](https://go.cpanel.net/resetsubaccountpass) feature is enabled for subaccounts on the account.\n* `disable_analog` - Whether users can access the [*Analog Stats*](https://go.cpanel.net/cpaneldocsAnalogStats) interface (*cPanel >> Home >> Metrics >> Analog Stats*).\n* `skip_apache_clients_optimizer` - Whether the Apache Client Optimizer is enabled.\n* `disable_awstats` - Whether the [AWStats](http://awstats.sourceforge.net/) software is enabled.\n* `skip_mailbox_warnings_check` - Whether mailbox usage warnings are enabled.\n* `disable_boxtrapper` - Whether [*BoxTrapper*](https://go.cpanel.net/cpaneldocsBoxTrapper) is enabled.\n* `skip_bandwidth_limit_check` - Whether the system automatically suspends HTTP service for accounts that exceed their bandwidth limit.\n* `disable_mailman` - Whether Mailman mailing lists are enabled.\n* `disable_roundcube` - Whether [Roundcube webmail](https://roundcube.net/) is enabled.\n* `disable_spamassassin` - Whether the Apache SpamAssassin™ spam filter is enabled.\n* `disable_spambox` - Whether Apache SpamAssassin's spam box feature is enabled.\n* `disable_webalizer` - Whether the [Webalizer](https://docs.cpanel.net/cpanel/metrics/webalizer/) statistics program is enabled.\n* `ssl_default_key_type` - The default SSL/TLS encryption algorithm used by the system.\n* `use_information_schema` - Whether the system uses the MySQL® `INFORMATION_SCHEMA` view. This view includes disk usage by all MySQL tables in the disk usage totals.\n* `use_mail_for_mailman_url` - Whether the system prefixes Mailman URLs with the `mail` prefix. For example, `http://mail.domain.com/mailman`.\n* `is_mod_userdir_enabled` - Whether the [Apache `mod_userdir` Tweak](https://go.cpanel.net/whmdocsApachemod_userdirTweak) is enabled.\n* `version` - The system's Linux® kernel version.\n</details>\n\n**Note:**\n\n* If you don't use this parameter, this function returns **all** of the server's configuration settings.\n* To retrieve multiple variables, increment this parameter. For example, `name-1=variable`, `name-2=variable`, `name-3=variable`."
        examples:
          multiple:
            summary: Get multiple configuration settings.
            value: name=allow_park_subdomain_on_hostname&name=allow_remote_domains&name=allow_reset_password
          single:
            summary: Get a single configuration setting.
            value: allow_park_subdomain_on_hostname
        in: query
        name: name
        required: false
        schema:
          enum:
          - default_theme
          - email_filter_storage_directory
          - allow_park_subdomain_on_hostname
          - allow_remote_domains
          - allow_unregistered_domains
          - apache_port
          - apache_ssl_port
          - api_shell
          - awstats_browser_update
          - awstats_reverse_dns
          - cpanel_root_directory
          - database_prefix_required
          - display_cpanel_doclinks
          - dnsadmin_app
          - empty_trash_days
          - enable_file_protect
          - file_upload_maximum_bytes
          - file_upload_must_leave_bytes
          - file_usage
          - ftp_server
          - htaccess_check_recurse
          - invite_sub
          - ipv6_listen
          - local_nameserver_type
          - logout_redirect_url
          - mailbox_storage_format
          - mail_server
          - minimum_password_strength
          - minimum_password_strength_mysql
          - mysql_host
          - mysql_version
          - php_maximum_execution_time
          - php_post_maximum_size
          - php_system_default_version
          - php_upload_maximum_filesize
          - php_loader
          - php_open_basedir_home
          - phpmyadmin_disable_search_info_schema
          - docroots_in_public_html_only
          - require_ssl
          - allow_reset_password
          - allow_reset_password_for_subaccounts
          - disable_analog
          - skip_apache_clients_optimizer
          - disable_awstats
          - skip_mailbox_warnings_check
          - disable_boxtrapper
          - skip_bandwidth_limit_check
          - disable_mailman
          - disable_roundcube
          - disable_spamassassin
          - disable_spambox
          - disable_webalizer
          - ssl_default_key_type
          - use_information_schema
          - use_mail_for_mailman_url
          - is_mod_userdir_enabled
          - version
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: get_server_information
                    type: string
                  module:
                    description: The name of the module called.
                    example: Variables
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          allow_park_subdomain_on_hostname:
                            description: 'Whether the system allows users to park subdomains of the server''s hostname.


                              * `1` - Allows.

                              * `0` - Doesn''t allow.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type:
                            - integer
                            - 'null'
                          allow_remote_domains:
                            description: 'Whether the system allows users to create addon domains or aliases that resolve to other servers.


                              * `1` - Allows.

                              * `0` - Doesn''t allow.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type:
                            - integer
                            - 'null'
                          allow_reset_password:
                            description: 'Whether cPanel''s [*Reset Password*](https://go.cpanel.net/resetsubaccountpass) feature is enabled for the account.


                              * `1` - *Reset Password* feature enabled.

                              * `0` - *Reset Password* feature not enabled.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type:
                            - integer
                            - 'null'
                          allow_reset_password_for_subaccounts:
                            description: 'Whether cPanel''s [*Reset Password*](https://go.cpanel.net/resetsubaccountpass) feature is enabled for subaccounts on the account.


                              * `1` - *Reset Password* feature enabled.

                              * `0` - *Reset Password* feature not enabled.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type:
                            - integer
                            - 'null'
                          allow_unregistered_domains:
                            description: 'Whether the system allows users to add domains they didn''t register with a domain name registrar.


                              * `1` - Allows.

                              * `0` - Doesn''t allow.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type:
                            - integer
                            - 'null'
                          apache_port:
                            description: The IP address or IP address with a firewall port number that Apache uses to listen for requests and serve web pages over an unsecured connection.
                            example: 192.0.2.0:80
                            type:
                            - string
                            - 'null'
                          apache_ssl_port:
                            description: The IP address or IP address with a firewall port number that Apache uses to listen for requests and serve web pages over a secure connection.
                            example: 192.0.2.0:443
                            type:
                            - string
                            - 'null'
                          api_shell:
                            description: 'Whether the user can access cPanel''s [*API Shell*](https://go.cpanel.net/cpaneldocsAPIShell) interface (*cPanel >> Home >> Advanced >> API Shell*).


                              * `1` - Can access.

                              * `0` - Can''t access.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type:
                            - integer
                            - 'null'
                          awstats_browser_update:
                            description: 'Whether the user can update their [AWStats](http://awstats.sourceforge.net/) software.


                              * `1` - Can update.

                              * `0` - Can''t update.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type:
                            - integer
                            - 'null'
                          awstats_reverse_dns:
                            description: 'Whether the AWStats statistical analysis software interprets visitors'' domain names as IP addresses.


                              * `1` - Interprets visitors'' domain names as IP addresses.

                              * `0` - Doesn''t interpret visitors'' domain names as IP addresses.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type:
                            - integer
                            - 'null'
                          cpanel_root_directory:
                            description: The cPanel `root` directory.
                            example: /usr/local/cpanel
                            format: path
                            type:
                            - string
                            - 'null'
                          database_prefix_required:
                            description: 'Whether the account requires database prefixing.


                              * `1` - Requires database prefixing.

                              * `0` - Doesn''t require database prefixing.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type:
                            - integer
                            - 'null'
                          default_theme:
                            description: The cPanel interface's default theme.
                            example: jupiter
                            type:
                            - string
                            - 'null'
                          disable_analog:
                            description: 'Whether users can access the [*Analog Stats*](https://go.cpanel.net/cpaneldocsAnalogStats) interface (*cPanel >> Home >> Metrics >> Analog Stats*).


                              * `1` - Enabled.

                              * `0` - Not enabled.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type:
                            - integer
                            - 'null'
                          disable_awstats:
                            description: 'Whether the [AWStats](http://awstats.sourceforge.net/) software is enabled.


                              * `1` - Enabled.

                              * `0` - Not enabled.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type:
                            - integer
                            - 'null'
                          disable_boxtrapper:
                            description: 'Whether [*BoxTrapper*](https://go.cpanel.net/cpaneldocsBoxTrapper) is enabled.


                              * `1` - Enabled.

                              * `0` - Not enabled.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type:
                            - integer
                            - 'null'
                          disable_mailman:
                            description: 'Whether Mailman mailing lists are enabled.


                              * `1` - Enabled.

                              * `0` - Not enabled.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type:
                            - integer
                            - 'null'
                          disable_roundcube:
                            description: 'Whether [Roundcube webmail](https://roundcube.net/) is enabled.


                              * `1` - Enabled.

                              * `0` - Not enabled.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type:
                            - integer
                            - 'null'
                          disable_spamassassin:
                            description: 'Whether the Apache SpamAssassin spam filter is enabled.


                              * `1` - Enabled.

                              * `0` - Not enabled.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type:
                            - integer
                            - 'null'
                          disable_spambox:
                            description: 'Whether Apache SpamAssassin''s spam box feature is enabled.


                              * `1` - Enabled.

                              * `0` - Not enabled.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type:
                            - integer
                            - 'null'
                          disable_webalizer:
                            description: 'Whether the [Webalizer](http://www.webalizer.org/) statistics program is enabled.


                              * `1` - Enabled.

                              * `0` - Not enabled.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type:
                            - integer
                            - 'null'
                          display_cpanel_doclinks:
                            description: 'Whether the system displays links to cPanel feature documentation in the cPanel interface.


                              * `1` - Displays documentation links.

                              * `0` - Doesn''t display documentation links.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type:
                            - integer
                            - 'null'
                          dnsadmin_app:
                            description: 'The application that processes DNS management requests.


                              * The value is an application''s file path, relative to the user''s home directory.

                              * `dnsadmin`

                              * `auto-detect SSL`'
                            example: dnsadmin
                            type:
                            - string
                            - 'null'
                            anyOf:
                            - description: The application's file path, relative to the user's home directory.
                              type: string
                            - enum:
                              - dnsadmin
                              - auto-detect SSL
                              type: string
                          docroots_in_public_html_only:
                            description: 'Whether the system restricts users from creating addon domains and subdomains outside of their `public_html` directory.


                              * `1` - Restricts users from creating addon domains and subdomains outside of their `public_html` directory.

                              * `0` - Allows users to creating addon domains and subdomains outside of their `public_html` directory.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type:
                            - integer
                            - 'null'
                          email_filter_storage_directory:
                            description: The location of the Exim email filter storage directory.
                            example: /etc/vfilters
                            format: path
                            type:
                            - string
                            - 'null'
                          empty_trash_days:
                            description: The minimum age of files that the system will automatically purge from `.trash` folders in user home directories.
                            example: disabled
                            type:
                            - string
                            - 'null'
                          enable_file_protect:
                            description: 'Whether [EasyApache 4''s *FileProtect* option](https://go.cpanel.net/EasyApache4FileprotectOption) is enabled.


                              * `1` - Enabled.

                              * `0` - Not enabled.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type:
                            - integer
                            - 'null'
                          file_upload_maximum_bytes:
                            description: The maximum file size, in megabytes (MB), that a user can upload to a server.
                            example: null
                            maximum: 10240
                            minimum: 1
                            type:
                            - integer
                            - 'null'
                          file_upload_must_leave_bytes:
                            description: The minimum filesystem quota that the system requires after a file uploads to a server.
                            example: 5
                            minimum: 1
                            type:
                            - integer
                            - 'null'
                          file_usage:
                            description: 'Whether file usage information displays in the cPanel *Home* interface''s statistics bar.


                              * `1` - Displays file usage information.

                              * `0` - Doesn''t display file usage information.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type:
                            - integer
                            - 'null'
                          ftp_server:
                            description: 'The FTP server.


                              * `pure-ftpd` - The Pure-FTPD server.

                              * `proftpd` - The ProFTPD FTP server.

                              * `disabled` - FTP has been disabled on this server.'
                            enum:
                            - pure-ftpd
                            - proftpd
                            - disabled
                            example: disabled
                            type:
                            - string
                            - 'null'
                          htaccess_check_recurse:
                            description: The maximum number of directories deep to look for `.htaccess` files when you change the PHP handler.
                            example: 2
                            minimum: 0
                            type:
                            - integer
                            - 'null'
                          invite_sub:
                            description: 'Whether cPanel account users can send invitations to new Subaccount users via cPanel''s [*User Manager*](https://go.cpanel.net/cpaneldocsUserManager) interface (*cPanel >> Home >> Preferences >> User Manager*).


                              * `1` - Can send invitations.

                              * `0` - Can''t send invitations.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type:
                            - integer
                            - 'null'
                          ipv6_listen:
                            description: 'Whether the `cpsrvd` daemon and other cPanel & WHM services listen on IPv6.


                              * `1` - Listen on IPv6.

                              * `0` - Don''t listen on IPv6.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type:
                            - integer
                            - 'null'
                          is_mod_userdir_enabled:
                            description: 'Whether the [Apache `mod_userdir` Tweak](https://go.cpanel.net/whmdocsApachemod_userdirTweak) is enabled.


                              * `1` - Enabled.

                              * `0` - Not enabled.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type:
                            - integer
                            - 'null'
                          local_nameserver_type:
                            description: 'The DNS nameserver''s type.


                              * `powerdns` - The PowerDNS nameserver.

                              * `bind` - The bind nameserver.

                              * `disabled` - Nameserver''s have been disabled on this server.'
                            enum:
                            - powerdns
                            - bind
                            - disabled
                            example: powerdns
                            type:
                            - string
                            - 'null'
                          logout_redirect_url:
                            description: The logout redirection URL.
                            example: https://cpanel.net
                            format: url
                            type:
                            - string
                            - 'null'
                          mail_server:
                            description: 'The mailserver type.


                              * `dovecot` - The Dovecot mailserver.

                              * `disabled` - The mailserver is disabled on this system.'
                            enum:
                            - dovecot
                            - disabled
                            example: dovecot
                            type:
                            - string
                            - 'null'
                          mailbox_storage_format:
                            description: 'The mailbox storage format for new accounts.


                              * `mdbox` - The mdbox storage format.

                              * `maildir` - The maildir storage format.'
                            enum:
                            - mdbox
                            - maildir
                            example: maildir
                            type:
                            - string
                            - 'null'
                          minimum_password_strength:
                            description: The minimum strength for cPanel account passwords.
                            example: 65
                            maximum: 100
                            minimum: 0
                            type:
                            - integer
                            - 'null'
                          minimum_password_strength_mysql:
                            description: The minimum strength for MySQL or MariaDB passwords.
                            example: 65
                            maximum: 100
                            minimum: 0
                            type:
                            - integer
                            - 'null'
                          mysql_host:
                            description: The MySQL or MariaDB hostname or IP address.
                            example: localhost
                            type:
                            - string
                            - 'null'
                            oneOf:
                            - format: domain
                              type: string
                            - format: ipv4
                              type: string
                          mysql_version:
                            description: The MySQL or MariaDB version.
                            example: '5.7'
                            type:
                            - string
                            - 'null'
                          php_loader:
                            description: 'The PHP loaders through which the system executes internal PHP scripts.


                              * `ioncube` - The ionCube PHP loader.

                              * `sourceguardian` - The SourceGuardian PHP loader.

                              * `ioncube,sourceguardian` - Both the ionCube and SourceGuardian PHP loaders are in use.

                              * An emtpy string - PHP loader is not in use.'
                            enum:
                            - ''
                            - ioncube
                            - sourceguardian
                            - ioncube,sourceguardian
                            example: ioncube
                            type:
                            - string
                            - 'null'
                          php_maximum_execution_time:
                            description: The number of seconds that a PHP script can run before the system terminates it.
                            example: 90
                            minimum: 90
                            type:
                            - integer
                            - 'null'
                          php_open_basedir_home:
                            description: 'Whether PHP `open_basedir` protection is enabled on the server.


                              * `1` - Enabled.

                              * `0` - Not enabled.


                              **Important:**


                              We removed WHM''s *PHP open_basedir Tweak* interface (*WHM >> Home >> Security Center >> PHP open_basedir Tweak*)'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type:
                            - integer
                            - 'null'
                          php_post_maximum_size:
                            description: The maximum size, in megabytes (MB), of a POST request.
                            example: 55
                            maximum: 2047
                            minimum: 55
                            type:
                            - integer
                            - 'null'
                          php_system_default_version:
                            description: The system's default version of PHP.
                            example: ea-php73
                            type:
                            - string
                            - 'null'
                          php_upload_maximum_filesize:
                            description: The maximum file size, in megabytes (MB), that a PHP script may upload.
                            example: 50
                            maximum: 2047
                            minimum: 50
                            type:
                            - integer
                            - 'null'
                          phpmyadmin_disable_search_info_schema:
