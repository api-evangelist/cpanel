  /php_get_handlers:
    get:
      description: 'This function returns the PHP handlers on the system.


        **Important:**


        When you disable the

        Web Server role,

        the system **disables** this function.'
      operationId: PHP-php_get_handlers
      parameters:
      - description: 'An installed PHP version.


          * `ea-php54`

          * `ea-php55`

          * `ea-php56`

          * `ea-php70`

          * `ea-php71`

          * `ea-php72`

          * `inherit`

          * Any custom PHP package name.


          **Important:**


          We deprecated PHP 5.6 and PHP 7.0 and will remove them in a future version.

          For more information, read our

          [cPanel Deprecation Plan](https://docs.cpanel.net/knowledge-base/cpanel-product/cpanel-deprecation-plan/)

          documentation.'
        in: query
        name: version
        required: false
        schema:
          example: ea-php72
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      version_handlers:
                        description: An array of objects containing the available PHP handlers.
                        items:
                          properties:
                            available_handlers:
                              description: 'The installed PHP handlers.


                                * `suphp`

                                * `cgi`

                                * `dso`

                                * `none`'
                              example:
                              - cgi
                              - none
                              - suphp
                              items:
                                enum:
                                - suphp
                                - cgi
                                - dso
                                - none
                                type: string
                              type: array
                            current_handler:
                              description: 'The PHP version''s handler.


                                * `suphp`

                                * `cgi`

                                * `dso`

                                * `none`'
                              enum:
                              - suphp
                              - cgi
                              - dso
                              - none
                              example: suphp
                              type: string
                            version:
                              description: 'An installed PHP version.


                                * `ea-php54`

                                * `ea-php55`

                                * `ea-php56`

                                * `ea-php70`

                                * `ea-php71`

                                * `ea-php72`

                                * `inherit`

                                * Any custom PHP package name.


                                **Important:**


                                We deprecated PHP 5.6 and PHP 7.0 and will remove them in a future version.

                                For more information, read our

                                [cPanel Deprecation Plan](https://docs.cpanel.net/knowledge-base/cpanel-product/cpanel-deprecation-plan/)

                                documentation.'
                              example: ea-php72
                              type: string
                          type: object
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: php_get_handlers
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

