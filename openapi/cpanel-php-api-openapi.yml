  /php_get_vhost_versions:
    get:
      description: 'This function returns the PHP version of every virtual host that a reseller controls.


        **Note:**


        This document **only** applies to systems that run EasyApache 4.


        **Important:**


        When you disable the Web Server role, the system **disables** this function.'
      operationId: PHP-php_get_vhost_versions
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      versions:
                        description: An array of objects containing the virtual host's suspendend status, versions, virtual hosts, and accounts.
                        items:
                          properties:
                            account:
                              description: The account's name.
                              example: rm3
                              format: username
                              type: string
                            account_owner:
                              description: The account owner's name.
                              example: root
                              format: username
                              type: string
                            documentroot:
                              description: The virtual host's document root.
                              example: /home/example/public_html
                              type: string
                            homedir:
                              description: The virtual host's home directory.
                              example: /home/rm3
                              type: string
                            is_suspended:
                              description: 'The virtual host''s suspension status.


                                **Note:**


                                * `1` - Suspended

                                * `0` - **Not** suspended.'
                              enum:
                              - 1
                              - 0
                              example: 0
                              type: integer
                            main_domain:
                              description: 'Whether the virtual host is the primary domain.


                                **Note:**


                                * `1` - The primary domain

                                * `0` - **Not** the primary domain'
                              enum:
                              - 1
                              - 0
                              example: 1
                              type: integer
                            php_fpm:
                              description: 'Whether PHP-FPM is enabled.


                                * `1` - PHP-FPM enabled.

                                * `0` - PHP-FPM **not** enabled.'
                              enum:
                              - 1
                              - 0
                              example: 1
                              type: integer
                            php_fpm_pool_parms:
                              description: Object containing the domain's PHP-FPM parameters.
                              properties:
                                pm_max_children:
                                  description: The maximum number of child pages per pool.
                                  example: 5
                                  minimum: 1
                                  type: integer
                                pm_max_requests:
                                  description: The number of possible requests the system allows.
                                  example: 20
                                  minimum: 1
                                  type: integer
                                pm_process_idle_timeout:
                                  description: How long the system remains idle before it kills the FPM child process.
                                  example: 10
                                  minimum: 1
                                  type: integer
                              type: object
                            phpversion_source:
                              description: How the virtual host determines its PHP version.
                              items:
                                properties:
                                  domain:
                                    description: The domain the virtual host inherits its PHP version from.
                                    example: example.com
                                    format: domain
                                    type: string
                                  system_default:
                                    description: "Whether the virtual host uses the system's default PHP version.\n* `1` - Uses the system default PHP version.\n\n**Note:**\n\n  The function **only** returns this value if true."
                                    enum:
                                    - 1
                                    example: 1
                                    type: integer
                                type: object
                              properties:
