  /php_get_impacted_domains:
    get:
      description: 'This function lists domains that obtain their PHP version from a specified PHP configuration.


        **Important:**


        When you disable the

        Web Server role,

        the system **disables** this function.'
      operationId: PHP-php_get_impacted_domains
      parameters:
      - description: 'A domain on the system.


          **Note:**


          * You **must** pass either the `system_default` or `domain` parameters, or both.

          * You can pass this parameter multiple times.

          * You **cannot** pass the name of a parked domain.'
        examples:
          multiple:
            summary: Pass multiple domains.
            value: domain=example.com domain=example2.com domain=example3.com
          single:
            summary: Pass a single domain.
            value: example.com
        in: query
        name: domain
        required: true
        schema:
          type: string
      - description: 'Whether to return domains that inherit the system''s default PHP version.


          * `1` — Return domains that inherit the system''s default PHP version.

          * `0` — Do **not** return domains that inherit the system''s default PHP version.


          **Note:**


          * You **must** pass either the `system_default` or `domain` parameters, or both.

          * If you pass this parameter with a false value and do **not** also pass the `domain`

          parameter, the function returns an error.'
        in: query
        name: system_default
        required: true
        schema:
          enum:
          - 1
          - 0
          example: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      domains:
                        description: 'A list of domains or subdomains that obtain their PHP version from

                          the PHP configuration.


                          **Note:**


                          This function does **not** return parked domains.'
                        example:
                        - example.com
                        - subdomain.example.com
                        - example2.com
                        items:
                          type: string
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: php_get_impacted_domains
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return PHP preconfigured domains
      tags:
      - PHP
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  php_get_impacted_domains \\\n  system_default='1' \\\n  domain='example.com'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/php_get_impacted_domains?api.version=1&system_default=1&domain=example.com
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '62'
