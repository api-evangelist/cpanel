  /php_get_vhosts_by_version:
    get:
      description: 'This function lists the virtual hosts that use a specified version of PHP.


        **Note:**


        This document only applies to systems that run EasyApache 4.


        **Important:**


        When you disable the Web Server role, the system **disables** this function.'
      operationId: PHP-php_get_vhosts_by_version
      parameters:
      - description: 'The name of an installed PHP package.

          - `ea-php##`, where `##` represents the major and minor versions of PHP (for example, `ea-php72` represents PHP 7.2).

          - `inherit`

          - Any custom PHP package name.'
        in: query
        name: version
        required: true
        schema:
          example: ea-php56
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      vhosts:
                        description: An array of the virtual hosts that use the specified PHP version.
                        items:
                          example: example.com
                          format: domain
                          type: string
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: php_get_vhosts_by_version
