                              type: array
                            version:
                              description: 'The virtual host''s PHP version.


                                * `ea-php72`

                                * `ea-php73`

                                * `ea-php74`

                                * `inherit`

                                * Any custom PHP package name.'
                              example: ea-php72
                              type: string
                            vhost:
                              description: The virtual host's name.
                              example: otherchars.rm3.tld
                              type: string
                          type: object
                        type: array
