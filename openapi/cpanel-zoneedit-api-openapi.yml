openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: UAPI accesses the cPanel interface's features. Use this API to access and modify cPanel account data and settings.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: cPanel U Zone Edit API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running cPanel.
  url: https://{host}:{port}/execute
  variables:
    host:
      default: cpanel-server.tld
      description: The hostname of a server running cPanel.
    port:
      default: '2083'
      description: The cPanel port.
security:
- BasicAuth: []
tags:
- description: The ZoneEdit module for UAPI.
  name: ZoneEdit
paths:
  /ZoneEdit/resetzone:
    get:
      description: 'This function resets a domain''s DNS

        zone to the server''s default zone template.


        **Important:**


        - This action **destroys** every custom record in the zone. Records that

        the zone template does not recreate, for example `MX`, `TXT` and

        `CNAME` records added by hand, are lost.

        - The reset outcome is reported in the `data` field rather than in the

        `status` field. A call can succeed at the API level while the zone

        rebuild itself fails, so check the `result.status` field in the

        returned data.


        When you disable the DNS role,

        the system **disables** this function.'
      operationId: ZoneEdit-resetzone
      parameters:
      - description: The domain whose DNS zone to reset.
        in: query
        name: domain
        required: true
        schema:
          example: example.com
          format: domain
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    description: A single entry holding the zone rebuild's own reply. The rebuild outcome is reported here rather than in the response's `status` field.
                    items:
                      properties:
                        result:
                          description: The reply from the zone rebuild.
                          properties:
                            checkmx:
                              description: The outcome of the mail exchanger check that the system runs after it rebuilds the zone. The system omits this field when the rebuild fails.
                              type:
                              - object
                              - 'null'
                            status:
                              description: 'Whether the system rebuilt the zone.

                                * `1` - The system rebuilt the zone.

                                * `0` - The rebuild failed. Check the `statusmsg` field for more details.'
                              enum:
                              - 0
                              - 1
                              example: 1
                              type: integer
                            statusmsg:
                              description: A message that describes the rebuild's outcome.
                              example: Zone Reset
                              type: string
                          type: object
                      type: object
                    type: array
                  errors:
                    items:
                      type: string
                    type:
                    - array
                    - 'null'
                  messages:
                    items:
                      type: string
                    type:
                    - array
                    - 'null'
                  metadata:
                    properties:
                      transformed:
                        type: integer
                    type: object
                  status:
                    description: '* `1` — Success.

                      * `0` — Failed. Check the `errors` field for more details.'
                    enum:
                    - 0
                    - 1
                    example: 1
                    type: integer
                  warnings:
                    items:
                      type: string
                    type:
                    - array
                    - 'null'
                type: object
          description: HTTP Request was successful.
      summary: Reset a DNS zone to the server defaults
      tags:
      - ZoneEdit
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  ZoneEdit \\\n  resetzone \\\n  domain='example.com'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/ZoneEdit/resetzone?domain=example.com
      - label: LiveAPI Perl
        lang: Perl
        source: "#--------------------------------------------------------------------------------------\n# Instructions:\n#--------------------------------------------------------------------------------------\n# <theme-name> is the theme assigned to cPanel account, where theme-name represents\n# jupiter.\n# 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n# 2) mkdir api_examples\n# 3) cd api_examples\n# 4) create a file ZoneEdit_resetzone.live.pl and put this code into that file.\n# 5) In your browser login to a cPanel account.\n# 6) Manually change the url from: .../frontend/<theme-name>/\n#    to .../frontend/<theme-name>/api_examples/ZoneEdit_resetzone.live.pl\n#--------------------------------------------------------------------------------------\n\nuse strict;\n\nuse Cpanel::LiveAPI ();\n\nmy $cpanel = Cpanel::LiveAPI->new(); # Connect to cPanel - only do this once.\n\n# Print the header\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\n\n# Call the API\nmy $response = $cpanel->uapi(\n    q/ZoneEdit/,\n    q/resetzone/,\n    {\n        'domain' => 'example.com',\n    }\n);\n\n# Handle the response\nif ($response->{cpanelresult}{result}{status}) {\n    my $data = $response->{cpanelresult}{result}{data};\n    # Do something with the $data\n    # So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    # Report errors:\n    print to_json($response->{cpanelresult}{result}{errors});\n}\n\n# Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n#--------------------------------------------------------------------------------------\n# Helper function to convert a perl object to html printable json\n#--------------------------------------------------------------------------------------\nsub to_json {\n    require JSON;\n    my $str = JSON->new->pretty->encode($_[0]);\n    return $str;\n}\n"
      - label: LiveAPI PHP
        lang: PHP
        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account, where theme-name represents\n// jupiter.\n// 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file ZoneEdit_resetzone.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme-name>/\n//    to .../frontend/<theme-name>/api_examples/ZoneEdit_resetzone.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'ZoneEdit',\n    'resetzone',\n    array (\n        'domain' => 'example.com',\n    )\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    // Do something with the $data\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}\n"
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: cPanel 138
      x-readonly: false
