                    properties:
                      data:
                        properties:
                          cpuser_spam_auto_delete:
                            description: 'The cPanel user''s account-wide spam filter setting


                              * `1` - Enabled.

                              * `0` - Not enabled.


                              **NOTE:**


                              This key **only** appears if the `account` parameter is passed **and** the account does **not** have a custom setting'
