                            description: 'Displays the user''s spam filter threshold.  For more information, see `Email::add_spam_filter`.


                              **Note:**


                              This key does **not** appear if the `cpuser_spam_auto_delete_score` key appears'
                            example: 8
                            minimum: 0
                            type:
                            - integer
                            - 'null'
                          spam_box_enabled:
                            description: 'Whether the user''s spam box is enabled.


                              * `1` -  Enabled.

                              * `0` -  Not enabled.'
                            enum:
                            - 0
                            - 1
