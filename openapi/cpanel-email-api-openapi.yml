  /Email/set_default_address:
    get:
      x-readonly: false
      x-rollback: none
      description: 'This function configures a default (catchall) email address.


        **Important**:


        When you disable the Mail Receive role, the system **disables** this function.'
      operationId: Email-set_default_address
      parameters:
      - description: 'The method to use to handle unroutable mail.

          * `fwd` — Forward messages to the `fwdemail` parameter’s address.

          * `fail` — Bounce messages back to the sender, and include the `failmsgs` parameter’s failure message.

          * `blackhole` — Send messages to the `/dev/null/` directory. This method does **not** generate a failure notice.

          * `pipe` — Pipe mail to the `pipefwd` parameter’s application. This parameter requires the [File Storage role](https://go.cpanel.net/serverroles).'
        in: query
        name: fwdopt
        required: true
        schema:
          enum:
          - fwd
          - fail
          - blackhole
          - pipe
          example: fwd
          type: string
      - description: "The domain whose default email behavior you want to configure.\n\n**Note**:\n\n  This parameter defaults to the cPanel account’s main domain."
        in: query
        name: domain
        required: false
        schema:
          example: example.com
          format: domain
          type: string
      - description: "The failure message for the message’s sender.\n\n**Note**:\n\n Use this parameter if you used the `fail` method for the `fwdopt` parameter."
        in: query
        name: failmsgs
        required: false
        schema:
          default: No such person at this address
          example: Failure echos loud. That address does not exist. Softly I regret. - an email failure haiku
          type: string
      - description: "The email address to which the system forwards messages.\n\n**Note**:\n\n Use this parameter if you used the `fwd` method for the `fwdopt` parameter."
        in: query
        name: fwdemail
        required: false
        schema:
          example: admin@example.com
          format: email
          type: string
