openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: UAPI accesses the cPanel interface's features. Use this API to access and modify cPanel account data and settings.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: cPanel U Quota API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running cPanel.
  url: https://{host}:{port}/execute
  variables:
    host:
      default: cpanel-server.tld
      description: The hostname of a server running cPanel.
    port:
      default: '2083'
      description: The cPanel port.
security:
- BasicAuth: []
tags:
- description: The Quota module for UAPI.
  name: Quota
paths:
  /Quota/get_local_quota_info:
    get:
      x-readonly: true
      description: 'This function retrieves the cPanel account''s quota for the server where you run the function. For example, a distributed cPanel account could approach its quota. The servers will balance that cPanel user''s quota between the parent and the child node.


        **Note:**


        This function runs on **only** the local server. To retrieve the cPanel account''s total quota, use the UAPI `Quota::get_quota` function instead.'
      operationId: Quota-get_local_quota_info
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: get_local_quota_info
                    type: string
                  module:
                    description: The name of the module called.
                    example: Quota
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          byte_limit:
                            description: "The limit for disk space the cPanel account may use on this server, in bytes.\n* A positive integer.\n* `0` - Unlimited or disabled server quotas.\n\n**Note:**\n\n This value does **not** update immediately."
                            example: 262144000
                            minimum: 0
                            type: integer
                          bytes_used:
                            description: 'The amount of disk space the cPanel account uses on this server, in bytes.

                              * A positive integer.

                              * `0` - No usage or disabled server quotas.'
                            example: 4149284
                            minimum: 0
                            type: integer
                          inode_limit:
                            description: 'The limit for inodes that the cPanel account may use on this server.

                              * A positive integer.

                              * `0` - Unlimited or disabled server quotas.'
                            example: 0
                            minimum: 0
                            type: integer
                          inodes_used:
                            description: 'The number of inodes that the cPanel account uses on this server.

                              * A positive integer.

                              * `0` - No usage or disabled server quotas.'
                            example: 1035
                            minimum: 0
                            type: integer
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `errors` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Return local disk quota information
      tags:
      - Quota
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  Quota \\\n  get_local_quota_info\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/Quota/get_local_quota_info
      - label: LiveAPI Perl
        lang: Perl
        source: "#--------------------------------------------------------------------------------------\n# Instructions:\n#--------------------------------------------------------------------------------------\n# <theme-name> is the theme assigned to cPanel account.\n# 1) cd /usr/local/cpanel/base/frontend/<theme_name>\n# 2) mkdir api_examples\n# 3) cd api_examples\n# 4) create a file Quota_get_local_quota_info.live.pl and put this code into that file.\n# 5) In your browser login to a cPanel account.\n# 6) Manually change the url from: .../frontend/<theme_name>/\n#    to .../frontend/<theme_name>/api_examples/Quota_get_local_quota_info.live.pl\n#--------------------------------------------------------------------------------------\n\nuse strict;\n\nuse Cpanel::LiveAPI ();\n\nmy $cpanel = Cpanel::LiveAPI->new(); # Connect to cPanel - only do this once.\n\n# Print the header\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\n\n# Call the API\nmy $response = $cpanel->uapi(\n    q/Quota/,\n    q/get_local_quota_info/\n);\n\n# Handle the response\nif ($response->{cpanelresult}{result}{status}) {\n    my $data = $response->{cpanelresult}{result}{data};\n    # Do something with the $data\n    # So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    # Report errors:\n    print to_json($response->{cpanelresult}{result}{errors});\n}\n\n# Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n#--------------------------------------------------------------------------------------\n# Helper function to convert a perl object to html printable json\n#--------------------------------------------------------------------------------------\nsub to_json {\n    require JSON;\n    my $str = JSON->new->pretty->encode($_[0]);\n    return $str;\n}\n"
      - label: LiveAPI PHP
        lang: PHP
        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account.\n// 1) cd /usr/local/cpanel/base/frontend/<theme_name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file Quota_get_local_quota_info.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme_name>/\n//    to .../frontend/<theme_name>/api_examples/Quota_get_local_quota_info.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'Quota',\n    'get_local_quota_info'\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    // Do something with the $data\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}"
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: cPanel 88
  /Quota/get_quota_info:
    get:
      x-readonly: true
      description: This function retrieves the cPanel account's quota.
      operationId: Quota-get_quota_info
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: get_quota_info
                    type: string
                  module:
                    description: The name of the module called.
                    example: Quota
                    type: string
                  result:
                    properties:
                      data:
                        description: An object containing the cPanel account's quota.
                        properties:
                          inode_limit:
                            description: 'The account''s inode quota limit.


                              * `0` — Unlimited or disabled server quotas.'
                            example: 0
                            oneOf:
                            - description: Unlimited or disabled server quotas.
                              enum:
                              - 0
                              type: integer
                            - description: A positive integer.
                              minimum: 1
                              type: integer
                          inodes_remain:
                            description: 'The account''s available inode quota.


                              * `0` — Unlimited or disabled server quotas.'
                            example: 0
                            oneOf:
                            - description: Unlimited or disabled server quotas.
                              enum:
                              - 0
                              type: integer
                            - description: A positive integer.
                              minimum: 1
                              type: integer
                          inodes_used:
                            description: 'The account''s number of used inodes.


                              * `0` — No usage or disabled server quotas.'
                            example: 1035
                            oneOf:
                            - description: No usage or disabled server quotas.
                              enum:
                              - 0
                              type: integer
                            - description: A positive integer.
                              minimum: 1
                              type: integer
                          megabyte_limit:
                            description: 'The account''s disk space limit, in megabytes (MB).


                              * `0.00` — Unlimited or disabled server quotas.'
                            example: 0
                            oneOf:
                            - description: Unlimited or disabled server quotas.
                              enum:
                              - 0
                              type: number
                            - description: A decimal number.
                              minimum: 1
                              type: number
                          megabytes_remain:
                            description: 'The account''s available disk space in, megabytes (MB).


                              * `0.00` — Unlimited or disabled server quotas.'
                            example: 0
                            oneOf:
                            - description: Unlimited or disabled server quotas.
                              enum:
                              - 0
                              type: number
                            - description: A decimal number.
                              minimum: 1
                              type: number
                          megabytes_used:
                            description: 'The account''s used disk space, in megabytes (MB).


                              * `0.00` — No usage or disabled server quotas.'
                            example: 5.46
                            oneOf:
                            - description: Unlimited or disabled server quotas.
                              enum:
                              - 0
                              type: number
                            - description: A decimal number.
                              minimum: 1
                              type: number
                          under_inode_limit:
                            description: 'Whether the account is under its inode limit.


                              * `1` — Under limit.

                              * `0` — Over limit.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type: integer
                          under_megabyte_limit:
                            description: 'Whether the account is under its disk space limit, in megabytes (MB).


                              * `1` — Under limit.

                              * `0` — Over limit.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type: integer
                          under_quota_overall:
                            description: 'Whether the account is under both its inode and disk megabyte (MB) limit.


                              * `1` — Under limit.

                              * `0` — Over limit.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type: integer
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `errors` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Return disk quota information
      tags:
      - Quota
      x-codeSamples:
      - label: CLI
