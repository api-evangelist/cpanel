                            type: string
                          hascgi:
                            description: 'Whether CGI is enabled for the account.

                              - 1  Enabled.

                              - 0  Disabled.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          homedir:
                            description: The path to the domain's home directory. The absolute path to the domain's home directory.
