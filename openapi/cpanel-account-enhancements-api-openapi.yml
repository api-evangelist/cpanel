                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Remove an Account Enhancement
      tags:
      - Account Enhancements
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  delete_account_enhancement \\\n  name='enhancement 5000'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/delete_account_enhancement?api.version=1&name=enhancement%205000
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '98'
    servers:
    - description: A server running WHM.
      url: https://{host}:{port}/json-api
      variables:
        host:
          default: whm-server.tld
          description: The hostname of a server running WHM.
        port:
          default: '2087'
          description: The WHM port.
  /list_account_enhancements:
    get:
      description: This function retrieves all existing account enhancements on the system.
      operationId: AccountEnhancements-list_account_enhancements
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      enhancements:
                        properties:
                          id:
                            description: The id the account enhancement is for.
                            example: sample-enhancement-id
                            type: string
                          name:
                            description: The name of the account enhancement.
                            example: Sample Enhancement
                            maxLength: 80
                            type: string
                  metadata:
                    properties:
                      command:
                        description: The name of the method called.
                        example: list_account_enhancements
                        type: string
                      output:
                        description: Additional output related to the method called.
                        properties:
                          warnings:
                            description: A list of warnings related to account enhancements.
                            items:
                              example: '(XID svx4zp) The enhancement file “/var/cpanel/account_enhancements/enhancement 5000.json” contains an invalid enhancement “id”: “bad-id”.'
