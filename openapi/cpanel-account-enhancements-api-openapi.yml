      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/AccountEnhancements/list
      - label: LiveAPI Perl
        lang: Perl
        source: "#--------------------------------------------------------------------------------------\n# Instructions:\n#--------------------------------------------------------------------------------------\n# <theme-name> is the theme assigned to cPanel account.\n# 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n# 2) mkdir api_examples\n# 3) cd api_examples\n# 4) create a file AccountEnhancements_list.live.pl and put this code into that file.\n# 5) In your browser login to a cPanel account.\n# 6) Manually change the url from: .../frontend/<theme-name>/\n#    to .../frontend/<theme-name>/api_examples/AccountEnhancements_list.live.pl\n#--------------------------------------------------------------------------------------\n\nuse strict;\n\nuse Cpanel::LiveAPI ();\n\nmy $cpanel = Cpanel::LiveAPI->new(); # Connect to cPanel - only do this once.\n\n# Print the header\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\n\n# Call the API\nmy $response = $cpanel->uapi(\n    q/AccountEnhancements/,\n    q/list/\n);\n\n# Handle the response\nif ($response->{cpanelresult}{result}{status}) {\n    my $data = $response->{cpanelresult}{result}{data};\n    foreach my $item (@{$data}) {\n        # Do something with the $item\n    }\n\n    # So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    # Report errors:\n    print to_json($response->{cpanelresult}{result}{errors});\n}\n\n# Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n#--------------------------------------------------------------------------------------\n# Helper function to convert a perl object to html printable json\n#--------------------------------------------------------------------------------------\nsub to_json {\n    require JSON;\n    my $str = JSON->new->pretty->encode($_[0]);\n    return $str;\n}\n"
      - label: LiveAPI PHP
        lang: PHP
        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account.\n// 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file AccountEnhancements_list.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme-name>/\n//    to .../frontend/<theme-name>/api_examples/AccountEnhancements_list.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'AccountEnhancements',\n    'list'\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    foreach ($data as $item) {\n        // Do something with the $item\n    }\n\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}"
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: cPanel 98
    servers:
    - description: A server running cPanel.
      url: https://{host}:{port}/execute
      variables:
        host:
          default: cpanel-server.tld
          description: The hostname of a server running cPanel.
        port:
          default: '2083'
          description: The cPanel port.
  /assign_account_enhancement:
    get:
      description: This function assigns an Account Enhancement to a cPanel account.
      operationId: AccountEnhancements-assign_account_enhancement
      parameters:
      - description: The username of the account.
        in: query
        name: account
        required: true
        schema:
          example: username
          format: username
          type: string
      - description: The name of the account enhancement.
        in: query
        name: name
        required: true
        schema:
          example: enhancement 5000
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: assign_account_enhancement
                        type: string
                      reason:
                        description: 'The reason the API function failed when the `metadata.result`

                          field is `0`. This field may display a success message when

                          a function succeeds.'
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Assign Account Enhancement
      tags:
      - Account Enhancements
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  assign_account_enhancement \\\n  account='username' \\\n  name='enhancement 5000'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/assign_account_enhancement?api.version=1&account=username&name=enhancement%205000
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.98'
    servers:
    - description: A server running WHM.
      url: https://{host}:{port}/json-api
      variables:
        host:
          default: whm-server.tld
          description: The hostname of a server running WHM.
        port:
          default: '2087'
          description: The WHM port.
  /create_account_enhancement:
    get:
      description: This function creates a new account enhancement.
      operationId: AccountEnhancements-create_account_enhancement
      parameters:
      - description: 'The identifier of the item you are targeting.


          **Note:**

          * You must use an [account enhancements ID](https://go.cpanel.net/add-account-enhancements) that a 3rd-party plugin defines.

          * To return a list of valid account enhancement IDs, run the WHM API 1 `list_account_enhancements` function.'
        in: query
        name: id
        required: true
        schema:
          example: sample-enhancement-id
          type: string
      - description: The name of the account enhancement.
        in: query
        name: name
        required: true
        schema:
          example: featurename 5000
          maxLength: 80
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      name:
                        description: The name of the newly-created account enhancement.
                        example: featurename 5000
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: create_account_enhancement
                        type: string
                      reason:
                        description: 'The reason the API function failed when the `metadata.result`

                          field is `0`. This field may display a success message when

                          a function succeeds.'
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Create Account Enhancement
      tags:
      - Account Enhancements
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  create_account_enhancement \\\n  name='featurename 5000' \\\n  id='sample-enhancement-id'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/create_account_enhancement?api.version=1&name=featurename%205000&id=sample-enhancement-id
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.98'
    servers:
    - description: A server running WHM.
      url: https://{host}:{port}/json-api
      variables:
        host:
          default: whm-server.tld
          description: The hostname of a server running WHM.
        port:
          default: '2087'
          description: The WHM port.
  /delete_account_enhancement:
    get:
      description: This function removes an account enhancement.
      operationId: AccountEnhancements-delete_account_enhancement
      parameters:
      - description: The name of the account enhancement.
        in: query
        name: name
        required: true
        schema:
          example: enhancement 5000
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The name of the method called.
                        example: delete_account_enhancement
                        type: string
                      reason:
                        description: 'The reason the API function failed when the `metadata.result`

                          field is `0`. This field may display a success message when

