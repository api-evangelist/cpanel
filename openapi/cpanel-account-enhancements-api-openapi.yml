                        type: object
                      reason:
                        description: 'The reason the API function failed when the `metadata.result`

                          field is `0`. This field may display a success message when

                          a function succeeds.'
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return Account Enhancements
      tags:
      - Account Enhancements
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  list_account_enhancements\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/list_account_enhancements?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '98'
    servers:
    - description: A server running WHM.
      url: https://{host}:{port}/json-api
      variables:
        host:
          default: whm-server.tld
          description: The hostname of a server running WHM.
        port:
          default: '2087'
          description: The WHM port.
  /modify_account_enhancement:
    get:
      description: 'This function modifies an account enhancement.


        **Important:**


        * When you call this function, you **must** include at least one of

        the `id` or `name` parameters. Lack of a second parameter will result

        in no change.'
      operationId: AccountEnhancements-modify_account_enhancement
      parameters:
      - description: The name of the account enhancement.
        in: query
        name: name
        required: true
        schema:
          example: enhancement 5000
          type: string
      - description: 'The account enhancement''s new identifier.


          **Note:**

          * You must use an [account enhancements](https://go.cpanel.net/account-enhancements) ID that a 3rd-party plugin defines.

          * To return a list of valid account enhancement IDs, run the WHM API 1 `list_account_enhancements` function.'
        in: query
        name: id
        required: false
        schema:
          example: sample-enhancement-id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      id:
                        description: The updated enhancement id.
                        example: sample-enhancement-id
                        type: string
                      name:
                        description: The enhancement name.
                        example: Sample Enhancement
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The name of the method called.
                        example: modify_account_enhancement
                        type: string
                      reason:
                        description: 'The reason the API function failed when the `metadata.result`

                          field is `0`. This field may display a success message when

                          a function succeeds.'
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Update Account Enhancement
      tags:
      - Account Enhancements
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  modify_account_enhancement \\\n  name='enhancement 5000' \\\n  id='sample-enhancement-id'\n"
