      x-readonly: false
      x-rollback: none
      description: 'Use this function to unset all contact email address for an account.


        To set contact email address(es), call `set_email_addresses`.'
      operationId: ContactInformation-unset_email_addresses
      parameters:
      - description: 'The account’s existing contact email addresses.


          If this list does not match the account’s current current email address(es),

          then the request will fail. This control is here to prevent

