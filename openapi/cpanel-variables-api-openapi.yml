openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: UAPI accesses the cPanel interface's features. Use this API to access and modify cPanel account data and settings.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: cPanel U Variables API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running cPanel.
  url: https://{host}:{port}/execute
  variables:
    host:
      default: cpanel-server.tld
      description: The hostname of a server running cPanel.
    port:
      default: '2083'
      description: The cPanel port.
security:
- BasicAuth: []
tags:
- description: The Variables module for UAPI.
  name: Variables
paths:
  /Variables/get_session_information:
    get:
      x-readonly: true
      description: This function retrieves a web server's hostname.
      operationId: Variables-get_session_information
      parameters:
      - description: 'The web server environment variable to retrieve. You can **only**

          retrieve the web server''s hostname.


          * `host` is the only possible value.'
        in: query
        name: name
        required: false
        schema:
          default: host
          enum:
          - host
          example: host
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: get_session_information
                    type: string
                  module:
                    description: The name of the module called.
                    example: Variables
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          host:
                            description: The web server's hostname.
                            example: example.com
                            type: string
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '- 1 - Success

                          - 0 - Failed: Check the errors field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Return web server's hostname
      tags:
      - Variables
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  Variables \\\n  get_session_information\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/Variables/get_session_information
      - label: LiveAPI Perl
        lang: Perl
        source: "#--------------------------------------------------------------------------------------\n# Instructions:\n#--------------------------------------------------------------------------------------\n# <theme-name> is the theme assigned to cPanel account.\n# 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n# 2) mkdir api_examples\n# 3) cd api_examples\n# 4) create a file Variables_get_session_information.live.pl and put this code into that file.\n# 5) In your browser login to a cPanel account.\n# 6) Manually change the url from: .../frontend/<theme-name>/\n#    to .../frontend/<theme-name>/api_examples/Variables_get_session_information.live.pl\n#--------------------------------------------------------------------------------------\n\nuse strict;\n\nuse Cpanel::LiveAPI ();\n\nmy $cpanel = Cpanel::LiveAPI->new(); # Connect to cPanel - only do this once.\n\n# Print the header\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\n\n# Call the API\nmy $response = $cpanel->uapi(\n    q/Variables/,\n    q/get_session_information/\n);\n\n# Handle the response\nif ($response->{cpanelresult}{result}{status}) {\n    my $data = $response->{cpanelresult}{result}{data};\n    # Do something with the $data\n    # So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    # Report errors:\n    print to_json($response->{cpanelresult}{result}{errors});\n}\n\n# Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n#--------------------------------------------------------------------------------------\n# Helper function to convert a perl object to html printable json\n#--------------------------------------------------------------------------------------\nsub to_json {\n    require JSON;\n    my $str = JSON->new->pretty->encode($_[0]);\n    return $str;\n}\n"
      - label: LiveAPI PHP
        lang: PHP
        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account.\n// 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file Variables_get_session_information.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme-name>/\n//    to .../frontend/<theme-name>/api_examples/Variables_get_session_information.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'Variables',\n    'get_session_information'\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    // Do something with the $data\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}"
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: cPanel 86
  /Variables/get_user_information:
    get:
      x-readonly: false
      x-rollback: none
      description: This function retrieves the user's account configuration settings.
      operationId: Variables-get_user_information
      parameters:
      - description: 'The user configuration variables to retrieve. If you don''t use this parameter, this function returns **all** of the user''s configuration data.


          **Note:**


          To retrieve multiple account configuration settings for a user, increment the parameter name. For example: `name-0`, `name-1`, and `name-2`.'
        examples:
          multiple:
            summary: Get multiple account configuration settings.
            value: name-1=mailbox_format&name-2=home&name-3=shell
          single:
            summary: Get a single account configuration setting.
            value: mailbox_format
        in: query
        name: name
        required: false
        schema:
          example: domain
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: get_user_information
                    type: string
                  module:
                    description: The name of the module called.
                    example: Variables
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          backup_enabled:
                            description: 'Whether the user has backups enabled.

                              * `1` - Backups enabled.

                              * `0` - Backups not enabled.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          bandwidth_limit:
                            description: 'The account''s bandwidth limit.

                              * `0` - unlimited

                              * A maximum amount of bandwidth, in bytes.'
                            example: 0
                            minimum: 0
                            type: integer
                          cgi_enabled:
                            description: 'Whether CGI is enabled.

                              * `1` - Enabled.

                              * `0` - Not enabled.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          contact_email:
                            description: The account's contact email address.
                            example: user@example.com
                            format: email
                            type: string
                          contact_email_2:
                            description: The account's alternate contact email address, if one exists.
                            example: user2@example.com
                            format: email
                            type: string
                          cpanel_root_directory:
                            description: The `root` directory.
                            example: /usr/local/cpanel
                            format: path
                            type: string
                          created:
                            description: The account's creation date in [Unix time](http://en.wikipedia.org/wiki/Unix_time) format.
                            example: 1432220941
                            format: unix_timestamp
                            type: integer
                          created_in_version:
                            description: The version of cPanel used during account creation.
                            example: 11.94.0.0
                            format: cPanel version
                            type: string
                          database_owner:
                            description: 'The owner of the account''s databases.

                              * `root`

                              * A reseller account''s username.

                              * The account''s username.'
                            example: root
                            format: username
                            type: string
                          dead_domains:
                            description: The account's inactive domains.
                            items:
                              example: example.example.com
                              format: domain
                              type: string
                            type: array
                          demo_mode:
                            description: 'Whether demo mode is enabled.

                              * `1` - Enabled.

                              * `0` - Not enabled.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          disk_block_limit:
                            description: 'The number of disk blocks for the account.

                              * `0` - unlimited

                              * A maximum amount of disk blocks, in kilobytes.'
                            example: 100000000
                            minimum: 0
                            type: integer
                          dkim_enabled:
                            description: 'Whether DomainKeys Identified Mail (DKIM) is enabled.

                              * `1` - Enabled.

                              * `0` - Not enabled.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          domain:
                            description: The account's main domain.
                            example: example.com
                            format: domain
                            type: string
                          domains:
                            description: list of the account's domains and subdomains.
                            items:
                              example: example.com
                              format: domain
                              type: string
                            type: array
                          feature:
                            description: 'The available features on the account that exist in the `/var/cpanel/users/user` file`, where user represents the cPanel user.


                              **Note:**


                              This object returns any custom features that the hosting provider adds to the `/var/cpanel/users/user` file.'
                            example:
                              custom_feature: 1
                            properties:
                              additionalProperties:
                                description: 'Whether the feature is enabled.

                                  * `1` - Enabled.

                                  * `0` - Disabled.


                                  **Note:**


                                  The feature''s name is the return name.'
                                enum:
                                - 0
                                - 1
                                example: 1
                                type: integer
                                x-additionalPropertiesName: feature
                            type: object
                          feature_list:
                            description: The account's [feature list](https://go.cpanel.net/whmdocs84FeatureManager) name.
                            example: feature_list
                            type: string
                          gid:
                            description: The account's group ID.
                            example: 5678
                            type: integer
                          home:
                            description: The user's home directory.
                            example: /home/user
                            format: path
                            type: string
                          home_directory_links:
                            description: Any symlinks to the cPanel account's home directory. An array of one or more home directory symlinks.
                            items:
                              example: symlink
                            type: array
                          ip:
                            description: The account's IPv4 address.
                            example: 192.0.2.0
                            format: ipv4
                            type: string
                          lang:
                            description: The account's language.
                            example: english
                            type: string
                          last_modified:
                            description: 'The most recent modification time of the `/var/cpanel/users/user` file in [Unix time format](https://en.wikipedia.org/wiki/Unix_time).


                              **Note:**


                              `user` represents the cPanel user.'
                            example: 1416586493
                            format: unix_timestamp
                            type: integer
                          legacy_backup_enabled:
                            description: 'Whether legacy backups are enabled.

                              * `1` - Enabled.

                              * `0` - Disabled.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          locale:
                            description: The account's default locale, a two-letter [ISO-3166 code](http://www.iso.org/iso/country_codes.htm).
                            example: en
                            format: ISO-3166-1 (alpha-2)
                            type: string
                          mailbox_format:
                            description: 'The storage format that the account''s mailboxes use.

                              * `maildir`

                              * `mbox`'
                            enum:
                            - maildir
                            - mbox
                            example: maildir
                            type: string
                          maximum_addon_domains:
                            description: 'The account''s maximum number of addon domains.

                              * `unlimited`

                              * An integer that represents a number of addon domains.'
                            example: unlimited
                            oneOf:
                            - enum:
                              - unlimited
                              type: string
                            - minimum: 0
                              type: integer
                          maximum_databases:
                            description: 'The account''s maximum number of SQL databases.

                              * `unlimited`

                              * An integer that represents a number of SQL databases.'
                            example: unlimited
                            oneOf:
                            - enum:
                              - unlimited
                              type: string
                            - minimum: 0
                              type: integer
                          maximum_defer_fail_percentage:
                            description: 'The [percentage of failed or deferred email messages](https://go.cpanel.net/howtopreventspam) that the account can send per hour before outgoing mail is rate-limited.

                              * `unlimited`

                              * An integer value.'
                            example: unlimited
                            oneOf:
                            - enum:
                              - unlimited
                              type: string
                            - minimum: 0
                              type: integer
                          maximum_email_account_disk_quota:
                            description: 'The maximum size, that the account can define when it creates an email account.

                              * `unlimited`

                              * An integer value, in Megabytes (MB).'
                            example: unlimited
                            oneOf:
                            - enum:
                              - unlimited
                              type: string
                            - minimum: 0
                              type: integer
                          maximum_emails_per_hour:
                            description: 'The maximum number of emails that the account can send in one hour.

                              * A positive integer.

                              * `0` or `unlimited` - The account can send an unlimited number of emails.'
                            example: unlimited
                            oneOf:
                            - enum:
                              - unlimited
                              type: string
                            - minimum: 0
                              type: integer
                          maximum_ftp_accounts:
                            description: 'The account''s maximum number of FTP accounts.

                              * `unlimited`

                              * An integer that represents a number of FTP accounts.'
                            example: unlimited
                            oneOf:
                            - enum:
                              - unlimited
                              type: string
                            - minimum: 0
                              type: integer
                          maximum_mail_accounts:
                            description: 'The maximum number of email accounts for the account.

                              * `unlimited`

                              * An integer that represents a number of email accounts.'
                            example: '0'
                            oneOf:
                            - enum:
                              - unlimited
                              type: string
                            - minimum: 0
                              type: integer
                          maximum_mailing_lists:
                            description: 'The account''s maximum number of mailing lists.

                              * `unlimited`

                              * An integer that represents a number of mailing lists.'
                            example: unlimited
                            oneOf:
                            - enum:
                              - unlimited
                              type: string
                            - minimum: 0
                              type: integer
                          maximum_parked_domains:
                            description: 'The account''s maximum number of aliases.

                              * `unlimited`

                              * An integer that represents a number of aliases.'
                            example: unlimited
                            oneOf:
                            - enum:
                              - unlimited
                              type: string
                            - minimum: 0
                              type: integer
                          maximum_passenger_apps:
                            description: "The account's maximum number of Ruby applications.\n  * `unlimited`\n  * An integer that represents a number of applications."
                            example: unlimited
                            oneOf:
                            - enum:
                              - unlimited
                              type: string
                            - minimum: 0
                              type: integer
                          maximum_subdomains:
                            description: 'The account''s maximum number of subdomains.

                              * `unlimited`

                              * An integer that represents a number of subdomains.'
                            example: unlimited
                            oneOf:
                            - enum:
                              - unlimited
                              type: string
                            - minimum: 0
                              type: integer
                          mxcheck:
                            description: Domains and their mail exchanger (MX) type.
                            example:
                              example.com: local
                              example2.com: remote
                            properties:
                              additionalProperties:
                                description: 'The domain''s MX type.


                                  * `local` - Accept mail locally for the domain.

                                  * `remote` - Do not accept mail locally for the domain.

                                  * `secondary` - Accept mail until a higher priority mail server is available.


                                  **Note:**


                                  The return''s name is the domain name.'
                                enum:
                                - local
                                - remote
                                - secondary
                                example: local
                                type: string
                                x-additionalPropertiesName: domain
                            type: object
                          notify_account_authn_link:
                            description: 'Whether the systems sends a notification when someone links the account to an external authentication account.

                              * `1` - Notifies.

                              * `0` - Doesn''t notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_account_authn_link_notification_disabled:
                            description: 'Whether the systems sends a notification when someone disables notifications for external authentication account links.

                              * `1` - Notifies.

                              * `0` - Doesn''t notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_account_login:
                            description: 'Whether the system sends a notification when someone logs in to the account.

                              * `1` - Notifies.

                              * `0` - Doesn''t notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_account_login_for_known_netblock:
                            description: 'Whether the system sends a notification when a user on a known netblock logs in to the account.

                              * `1` - Notifies.

                              * `0` - Doesn''t notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_account_login_notification_disabled:
                            description: 'Whether the system sends a notification when someone disables notifications for account logins.

                              * `1` - Notifies.

                              * `0` - Doesn''t notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_autossl_expiry:
                            description: 'Whether the system sends a notification when an AutoSSL certificate expires.

                              * `1` - Notifies.

                              * `0` - Doesn''t notify'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_autossl_expiry_coverage:
                            description: 'Whether the system sends a notification when AutoSSL cannot renew a certificate because domains that fail Domain Control Validation (DCV) exist on the current certificate.

                              * `1` - Notifies.

                              * `0` - Doesn''t notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_autossl_renewal_coverage:
                            description: 'Whether the system sends a notification when AutoSSL renews a certificate.

                              * `1` - Notifies.

                              * `0` - Doesn''t notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_autossl_renewal_coverage_reduced:
                            description: 'Whether the system sends a notification when AutoSSL renews a certificate, but the new certificate lacks at least one domain that the previous certificate secured.

                              * `1` - Notifies.

                              * `0` - Doesn''t notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_autossl_renewal_uncovered_domains:
                            description: 'Whether the system sends a notification when AutoSSL renews a certificate, but the new certificate lacks at least one domain that the previous certificate secured.

                              * `1` - Notifies.

                              * `0` - Doesn''t notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_bandwidth_limit:
                            description: 'Whether the systems sends a notification when the account reaches its bandwidth quota.

                              * `1` - Notifies.

                              * `0` - Doesn''t notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_contact_address_change:
                            description: 'Whether the systems sends a notification when someone changes the contact address for the account.

                              * `1` - Notifies.

                              * `0` - Doesn''t notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_contact_address_change_notification_disabled:
                            description: 'Whether the systems sends a notification when someone disables the notification for contact address changes.

                              * `1` - Notifies.

                              * `0` - Doesn''t notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_disk_limit:
                            description: 'Whether the systems sends a notification when the account reaches its disk usage limit.

                              * `1` - Notifies.

                              * `0` - Doesn''t notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_password_change:
                            description: 'Whether the systems sends a notification when someone changes the account''s password.

                              * `1` - Notifies.

                              * `0` - Doesn''t notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_password_change_notification_disabled:
                            description: 'Whether the systems sends a notification when someone disables notifications for password changes.

                              * `1` - Notifies.

                              * `0` - Doesn''t notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_ssl_expiry:
                            description: 'Whether the systems sends a notification when an SSL certificate on the account expires.

                              * `1` - Notifies.

                              * `0` - Doesn''t notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_twofactorauth_change:
                            description: 'Whether the systems sends a notification when the account''s Two-Factor Authentication (2FA) credentials change.

                              * `1` - Notifies.

                              * `0` - Doesn''t notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_twofactorauth_change_notification_disabled:
                            description: 'Whether the systems sends a notification when someone disables notifications for 2FA.

                              * `1` - Notifies.

                              * `0` - Doesn''t notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          owner:
                            description: 'The account''s owner.

                              * `root`

                              * A reseller account''s username.

                              * The account''s username.'
                            example: root
                            format: username
                            type: string
                          package_extensions:
                            description: The account's package extensions.
                            example:
                            - ext1
                            - ext2
                            - ext3
                            items:
                              type: string
                            type: array
                          plan:
                            description: The account's hosting package.
                            example: packagename
                            type: string
                          pushbullet_access_token:
                            description: The account's Pushbullet access token.
                            example: '1234567890'
                            type: string
                          shell:
                            description: The account's shell.
                            example: /bin/bash
                            format: path
                            type: string
                          spf_enabled:
                            description: 'Whether Sender Policy Framework (SPF) is enabled.

                              * `1` - Enabled.

                              * `0` - Not enabled.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          ssl_default_key_type:
                            description: 'The type of key to generate for the user’s TLS certificates and CSRs.


                              * `system` — The system’s `ssl_default_key_type` value in the [`cpanel.config` file](https://go.cpanel.net/ThecpanelconfigFile).

                              * `rsa-2048` — 2,048-bit RSA.

                              * `rsa-4096` — 4,096-bit RSA.

                              * `ecdsa-prime256v1` — ECDSA prime256v1 (“P-256”).

                              * `ecdsa-secp384r1` — ECDSA secp384r1 (“P-384”).'
                            enum:
                            - system
                            - rsa-2048
                            - rsa-4096
                            - ecdsa-prime256v1
                            - ecdsa-secp384r1
                            example: rsa-2048
