  /SSL/get_cn_name:
    get:
      x-readonly: true
      description: This function retrieves the most secure domain for a service.
      operationId: SSL-get_cn_name
      parameters:
      - description: A domain name, cPanel username, or email address.
        example: example.com
        in: query
        name: domain
        required: true
        schema:
          anyOf:
          - description: A valid domain.
            format: domain
            type: string
          - description: A valid email address.
            format: email
            type: string
          - description: A valid cPanel username.
            format: username
            type: string
      - description: 'The service''s name.


          * `cpanel`

          * `imap`

          * `pop3`

          * `smtp`'
        in: query
        name: service
        required: true
        schema:
          enum:
          - cpanel
          - imap
          - pop3
          - smtp
          example: cpanel
          type: string
      - description: 'Whether to append `mail` to the `domain` value to find the best match.


          For example, if you specify the domain `example.com` and call this parameter, the

          function only searches the `mail.example.com` service domains.


          * `1` — Append `mail` to the `domain` value during the search.

          * `0` — Match on the specified `domain` value **only**.'
        in: query
        name: add_mail_subdomain
        required: false
        schema:
          default: 0
          enum:
          - 1
          - 0
          example: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: get_cn_name
                    type: string
                  module:
                    description: The name of the module called.
                    example: SSL
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          cert_match_method:
                            description: 'The method that the system used to match the certificate with the mail

                              service.


                              * `none` — No domain matches the certificate.

                              * `exact` — The domain exactly matches the certificate.

                              * `exact-wildcard` — The domain exactly matches the certificate.

                              * `mail-wildcard` — The `mail` subdomain of the domain matches the domain of the wildcard certificate.

                              * `www-wildcard` — The `www` subdomain of the domain matches the domain of the wildcard certificate.

                              * `hostname-wildcard` — The hostname''s domain matches the domain of the wildcard certificate.

                              * `hostname` — The hostname matches the domain of the certificate.

                              * `localdomain_on_cert-mail-wildcard` — A `mail` subdomain of a domain on the server that matches the certificate.

                              * `localdomain_on_cert-www-wildcard` — A `www` subdomain of a domain on the server matches the certificate.

                              * `localdomain_on_cert` — A domain on the server matches the certificate.'
                            enum:
                            - none
                            - exact
                            - exact-wildcard
                            - mail-wildcard
                            - www-wildcard
                            - hostname-wildcard
                            - hostname
                            - localdomain_on_cert-mail-wildcard
                            - localdomain_on_cert-www-wildcard
                            - localdomain_on_cert
                            example: hostname
                            type: string
                          cert_valid_not_after:
                            description: The certificate's expiration date.
                            example: 1394288638
                            format: unix_timestamp
                            type: integer
                          is_currently_valid:
                            description: "Whether the certificate is currently valid.\n\n* `1` — Valid.\n* `0` — Invalid.\n\n**Note:**\n\nIf the certificate is valid, the following statements are true:\n  * The certificate is **not** self-signed (the `ssldomain_matches_cert` value is `1`).\n  * The certificate matches the SSL domain (the `ssldomain_matches_cert` value is `1`).\n  * The certificate is within its validity period (the `cert_valid_not_after` value is **less** than the current time and date)."
                            enum:
                            - 1
                            - 0
                            example: 0
                            type: integer
                          is_self_signed:
                            description: 'Whether the certificate is self-signed.


                              * `1` — Self-signed.

                              * `0` — Not self-signed.


                              **Note:**


                              If the `cert_match_method` value is `none`, you should ignore this return''s value.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type: integer
                          is_wild_card:
                            description: 'Whether the certificate is a wildcard certificate.


                              * `1` — Wildcard.

                              * `0` — Not a wildcard.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type: integer
                          ssldomain:
                            description: The best domain to use to access the service.
                            example: hostname.example.com
                            format: domain
                            type: string
                          ssldomain_matches_cert:
                            description: 'Whether an SSL-protected domain matches the certificate.


                              * `1` — Matches.

                              * `0` — Does **not** match.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type: integer
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `errors` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Request best SSL domain for service
      tags:
      - SSL
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  SSL \\\n  get_cn_name \\\n  domain='example.com' \\\n  service='cpanel'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/SSL/get_cn_name?domain=example.com&service=cpanel
      - label: LiveAPI Perl
        lang: Perl
        source: "#--------------------------------------------------------------------------------------\n# Instructions:\n#--------------------------------------------------------------------------------------\n# <theme-name> is the theme assigned to cPanel account.\n# 1) cd /usr/local/cpanel/base/frontend/<theme_name>\n# 2) mkdir api_examples\n# 3) cd api_examples\n# 4) create a file SSL_get_cn_name.live.pl and put this code into that file.\n# 5) In your browser login to a cPanel account.\n# 6) Manually change the url from: .../frontend/<theme_name>/\n#    to .../frontend/<theme_name>/api_examples/SSL_get_cn_name.live.pl\n#--------------------------------------------------------------------------------------\n\nuse strict;\n\nuse Cpanel::LiveAPI ();\n\nmy $cpanel = Cpanel::LiveAPI->new(); # Connect to cPanel - only do this once.\n\n# Print the header\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\n\n# Call the API\nmy $response = $cpanel->uapi(\n    q/SSL/,\n    q/get_cn_name/,\n    {\n        'domain' => 'example.com',\n        'service' => 'cpanel',\n    }\n);\n\n# Handle the response\nif ($response->{cpanelresult}{result}{status}) {\n    my $data = $response->{cpanelresult}{result}{data};\n    # Do something with the $data\n    # So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    # Report errors:\n    print to_json($response->{cpanelresult}{result}{errors});\n}\n\n# Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n#--------------------------------------------------------------------------------------\n# Helper function to convert a perl object to html printable json\n#--------------------------------------------------------------------------------------\nsub to_json {\n    require JSON;\n    my $str = JSON->new->pretty->encode($_[0]);\n    return $str;\n}\n"
      - label: LiveAPI PHP
        lang: PHP
        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account.\n// 1) cd /usr/local/cpanel/base/frontend/<theme_name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file SSL_get_cn_name.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme_name>/\n//    to .../frontend/<theme_name>/api_examples/SSL_get_cn_name.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'SSL',\n    'get_cn_name',\n    array (\n        'domain' => 'example.com',\n        'service' => 'cpanel',\n    )\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    // Do something with the $data\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}"
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: cPanel 11.42
    servers:
    - description: A server running cPanel.
      url: https://{host}:{port}/execute
      variables:
        host:
          default: cpanel-server.tld
          description: The hostname of a server running cPanel.
        port:
          default: '2083'
          description: The cPanel port.
