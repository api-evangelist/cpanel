  /SSL/installed_host:
    get:
      x-readonly: true
      description: 'This function retrieves information about a certificate that is installed on a domain''s dedicated IP address.


        **Important:**


        * If you do **not** possess a dedicated IP address, this function will **fail**. For non-dedicated IP addresses, use the `SSL::installed_hosts` function.

        * When you disable the _Calendars and Contacts_, _Receive Mail_, _Web Disk_ , _Webmail_ , **and** _Web Server_ roles, the system **disables** this function.'
      operationId: SSL-installed_host
      parameters:
      - description: 'The domain name.


          **Note:**


          The parameter defaults to the account''s main domain.'
        in: query
        name: domain
        required: false
        schema:
          example: example.com
          format: domain
          type: string
      - description: 'Verify the certificate.

          * `1` — Verify the certificate.

          * `0` — Do **not** verify the certificate.'
        in: query
        name: verify_certificate
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: installed_host
                    type: string
                  module:
                    description: The name of the module called.
                    example: SSL
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          certificate:
                            description: An object containing the certificate information.
                            properties:
                              domains:
                                description: The domains that the certificate covers.
                                items:
                                  example: example.com
                                  format: domain
                                  type: string
                                type: array
                              ecdsa_curve_name:
                                description: 'The ECDSA curve that the certificate''s key uses.


                                  * `prime256v1`

                                  * `secp384r1`

                                  * `null` — The certificate''s key is **not** an ECDSA key.'
                                enum:
                                - prime256v1
                                - secp384r1
                                example: prime256v1
                                type:
                                - string
                                - 'null'
                              ecdsa_public:
                                description: 'The certificate''s key''s ECDSA compressed public point, in hexadecimal format.


                                  * `null` — The certificate''s key is **not** an ECDSA key.'
                                example: null
                                type:
                                - string
                                - 'null'
                              id:
                                description: The certificate's ID.
                                example: example_com_c69ce_37ff5_1397169490_169c717cb2c260281df792788accf041
                                type: string
                              is_self_signed:
                                description: 'Whether the certificate is self-signed.

                                  * `1` — Self-signed.

                                  * `0` — Not self-signed.'
                                enum:
                                - 0
                                - 1
                                example: 1
                                type: integer
                              issuer.commonName:
                                description: The issuer's Common Name, typically a domain name.
                                example: example.com
                                type: string
                              issuer.organizationName:
                                description: The certificate's organization.
                                example: Organization
                                type: string
                              issuer_text:
                                description: The X.509 information about the issuer that contains CSR information.
                                example: 'commonName

                                  example.com

                                  countryName

                                  US

                                  emailAddress

                                  username@example.com

                                  organizationName

                                  Example

                                  stateOrProvinceName

                                  Texas

                                  localityName

                                  Houston'
                                type: string
                              key_algorithm:
                                description: "The certificate's key's algorithm.\n\n  * `rsaEncryption` — RSA.\n  * `id-ecPublicKey` — ECDSA."
                                enum:
                                - rsaEncryption
                                - id-ecPublicKey
                                example: rsaEncryption
                                type: string
                              modulus:
                                description: 'The certificate''s key''s modulus, in hexadecimal format.


                                  * `null` — The certificate''s key is **not** an RSA key.'
                                example: 
                                type:
                                - string
                                - 'null'
                              modulus_length:
                                description: 'The length, in bits, of the certificate''s key''s modulus.


                                  * `null` — The certificate''s key is **not** an RSA key.'
                                example: 2048
                                minimum: 1
                                type:
                                - integer
                                - 'null'
                              not_after:
                                description: The certificate's expiration time.
                                example: 1397169490
                                format: unix_timestamp
                                type: integer
                              not_before:
                                description: The certificate's start time.
                                example: 1365633490
                                format: unix_timestamp
                                type: integer
                              signature_algorithm:
                                description: The signature algorithm of the certificate.
                                example: sha256WithRSAEncryption
                                type: string
                              subject.commonName:
                                description: The certificate's Common Name.
                                example: example.com
                                type: string
                              subject_text:
                                description: The X.509 information about the certificate's subject that contains CSR information.
                                example: 'commonName

                                  example.com'
                                type: string
                              validation_type:
                                description: 'The certificate''s validation type.

                                  * `ev` — Extended Validation.

                                  * `ov` — Organization Validation.

                                  * `dv` — Domain Validation.

                                  * `null` — The system could not parse and determine the certificate''s validation type.'
                                enum:
                                - ev
                                - ov
                                - dv
                                example: dv
                                type:
                                - string
                                - 'null'
                              verify_error:
                                description: 'Any errors that exist during the certificate verification process. If there are no errors, this will return an empty string.


                                  **Note:**


                                  You **must** set the `verify_certificate` parameter to `1` for this return to appear.'
                                example: ''
                                type: string
                            type: object
                          host:
                            description: The issuer's hostname.
                            example: example.com
                            format: domain
                            type: string
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `errors` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Return SSL certificate's info for dedicated IP
      tags:
      - SSL
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  SSL \\\n  installed_host\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/SSL/installed_host
      - label: LiveAPI Perl
        lang: Perl
        source: "#--------------------------------------------------------------------------------------\n# Instructions:\n#--------------------------------------------------------------------------------------\n# <theme-name> is the theme assigned to cPanel account.\n# 1) cd /usr/local/cpanel/base/frontend/<theme_name>\n# 2) mkdir api_examples\n# 3) cd api_examples\n# 4) create a file SSL_installed_host.live.pl and put this code into that file.\n# 5) In your browser login to a cPanel account.\n# 6) Manually change the url from: .../frontend/<theme_name>/\n#    to .../frontend/<theme_name>/api_examples/SSL_installed_host.live.pl\n#--------------------------------------------------------------------------------------\n\nuse strict;\n\nuse Cpanel::LiveAPI ();\n\nmy $cpanel = Cpanel::LiveAPI->new(); # Connect to cPanel - only do this once.\n\n# Print the header\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\n\n# Call the API\nmy $response = $cpanel->uapi(\n    q/SSL/,\n    q/installed_host/\n);\n\n# Handle the response\nif ($response->{cpanelresult}{result}{status}) {\n    my $data = $response->{cpanelresult}{result}{data};\n    # Do something with the $data\n    # So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    # Report errors:\n    print to_json($response->{cpanelresult}{result}{errors});\n}\n\n# Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n#--------------------------------------------------------------------------------------\n# Helper function to convert a perl object to html printable json\n#--------------------------------------------------------------------------------------\nsub to_json {\n    require JSON;\n    my $str = JSON->new->pretty->encode($_[0]);\n    return $str;\n}\n"
      - label: LiveAPI PHP
        lang: PHP
        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account.\n// 1) cd /usr/local/cpanel/base/frontend/<theme_name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file SSL_installed_host.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme_name>/\n//    to .../frontend/<theme_name>/api_examples/SSL_installed_host.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'SSL',\n    'installed_host'\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    // Do something with the $data\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}"
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: cPanel 11.42
    servers:
    - description: A server running cPanel.
      url: https://{host}:{port}/execute
      variables:
        host:
          default: cpanel-server.tld
          description: The hostname of a server running cPanel.
        port:
          default: '2083'
          description: The cPanel port.
