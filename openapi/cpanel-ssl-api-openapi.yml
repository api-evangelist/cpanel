                              - 0
                              - 1
                              example: 1
                              type: integer
                            module_name:
                              description: The AutoSSL provider module's name.
                              example: cPanel
                              type: string
                            specs:
                              description: The provider's specifications.
                              properties:
                                AVERAGE_DELIVERY_TIME:
                                  description: The amount of time in seconds that the provider requires to issue a certificate.
                                  example: 120
                                  type: integer
                                DCV_METHODS:
                                  description: 'The methods that the provider uses

                                    to validate the domain.


                                    * `dns` - DNS Validation Method.

                                    * `http` - HTTP Validation Method.'
                                  items:
                                    enum:
                                    - dns
                                    - http
                                    example: http
                                    type: string
                                  type: array
                                DELIVERY_METHOD:
                                  description: 'The method that the provider uses

                                    to issue the certificate.


                                    * `queue` - The provider delivers certificates through a download queue.

                                    * `api` - The provider delivers certificates through API calls.'
                                  enum:
                                  - queue
                                  - api
                                  example: queue
                                  type: string
                                HTTP_DCV_MAX_REDIRECTS:
                                  description: The maximum number of redirections a domain can use and still pass an HTTP-based DCV.
                                  example: 10
                                  type: integer
                                MAX_DOMAINS_PER_CERTIFICATE:
                                  description: The number of unique domains each certificate can contain.
                                  example: 100
                                  minimum: 1
                                  type: integer
                                RATE_LIMIT_CERTIFICATES_PER_REGISTERED_DOMAIN_PER_WEEK:
                                  description: The maximum number of certificates that the provider will allow per domain in a week.
                                  example: 50
                                  type: integer
                                SUPPORTS_ANCESTOR_DCV:
                                  description: 'Whether the successful Domain Control

