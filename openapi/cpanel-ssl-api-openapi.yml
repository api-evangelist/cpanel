  /get_autossl_metadata:
    get:
      description: This function retrieves values for the currently authenticated user's AutoSSL's metadata keys.
      operationId: SSL-get_autossl_metadata
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      payload:
                        description: An object containing the user's AutoSSL metadata key values.
                        properties:
                          clobber_externally_signed:
                            description: 'This option will allow AutoSSL to replace certificates that none of this systems AutoSSL modules issued.

                              When you enable this option, AutoSSL will install certificates that replace users Certificate Authority (CA) issued certificates if they are invalid or expire within three days.

                              * `1` - Replace the certificate.

                              * `0` - Do **not** replace the certificate.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_autossl_expiry:
                            description: 'This option will send a notification when an AutoSSL certificate expires. This occurs when AutoSSL cannot request a new certificate.


                              **Note:**


                              This can happen if all of a websites domains fail Domain Control Validation (DCV), or if the AutoSSL provider has not issued a certificate in response to a request.

                              * `1` -  Notify.

                              * `0` -  Do **not** notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_autossl_expiry_coverage:
                            description: 'This option will send a notification if at least one currently-secured domain will lose coverage when the certificate renews.


                              * `1` -  Notify.

                              * `0` -  Do **not** notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_autossl_expiry_coverage_user:
                            description: 'This option will send a notification if at least

                              one of a user''s currently-secured domains will lose

                              coverage when the certificate renews.


                              * `1` - Notify.

                              * `0` - Do **not** notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_autossl_expiry_user:
                            description: 'This option will send a notification when a

                              user''s AutoSSL certificate expires. This occurs when

                              AutoSSL cannot request a new certificate for a user.


                              * `1` - Notify.

                              * `0` - Do **not** notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_autossl_renewal:
                            description: 'This option will send a notification when AutoSSL

                              successfully renews a certificate.


                              * `1` - Notify.

                              * `0` - Do **not** notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_autossl_renewal_coverage:
                            description: 'This option will send a notification if a currently-secured

                              domain fails DCV and the certificate has not reached its

                              renewal period.


                              * `1` -  Notify.

                              * `0` -  Do **not** notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_autossl_renewal_coverage_reduced:
                            description: 'This option will send a notification when AutoSSL

                              has renewed a certificate and the new certificate lacks

                              at least one domain that the previous certificate secured.



                              * `1` - Notify.

                              * `0` - Do **not** notify.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                          notify_autossl_renewal_coverage_reduced_user:
                            description: 'This option will send a notification when AutoSSL

                              has renewed a certificate for a user and the new certificate

                              lacks at least one domain that the previous certificate

                              secured.


                              * `1` - Notify.

                              * `0` - Do **not** notify.'
                            enum:
