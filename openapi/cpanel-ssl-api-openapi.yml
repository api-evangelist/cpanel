  /listcrts:
    get:
      description: This function lists the server's domains with installed SSL certificates.
      operationId: SSL-listcrts
      parameters:
      - description: 'Whether to limit the results to certificates registered with

          a certificate authority (CA).


          * `1` — Registered certificates **only**.

          * `0` — All certificates.'
        in: query
        name: registered
        required: false
        schema:
          default: 0
          enum:
          - 1
          - 0
          example: 1
          type: integer
      - description: 'The cPanel username.


          If you do **not** use this parameter, the function returns certificates

          for **all** accounts on the server.'
        in: query
        name: user
        required: false
        schema:
          example: username
          format: username
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      crt:
                        description: Information about the certificate.
                        items:
                          properties:
                            domain:
                              description: The certificate's primary domain.
                              example: example.com
                              format: domain
                              type: string
                            domain_owners:
                              description: A list of the owners of the domain or domains that the certificate covers.
                              example:
                              - username
                              items:
                                format: username
                                type: string
                              type: array
                            domains:
                              description: A list of the domain or domains that the certificate covers.
                              example:
                              - example.com
                              items:
                                format: domain
                                type: string
                              type: array
                            ecdsa_curve_name:
                              description: 'The ECDSA curve that the certificate''s key uses.


                                * `prime256v1`

                                * `secp384r1`

                                * `null` — The certificate''s key is **not** an ECDSA key.'
                              enum:
                              - prime256v1
                              - secp384r1
                              example: null
                              type:
                              - string
                              - 'null'
                            friendly_name:
                              description: The certificate's friendly name.
                              example: TestCertificate
                              type: string
                            id:
                              description: The certificate's ID.
                              example: example._com_d13b4_362b9_1400343187_b05e5c3e443dda9a8869c4cf7457829e
                              type: string
                            is_self_signed:
                              description: 'Whether the certificate is self-signed.


                                * `1` — Self-signed.

                                * `0` — **Not** self-signed.'
                              enum:
                              - 1
                              - 0
                              example: 1
                              type: integer
                            issuer.organizationName:
                              description: The certificate's Organization Name.
                              example: Organization
                              type: string
                            key_algorithm:
                              description: 'The certificate''s key''s algorithm.


                                * `rsaEncryption` — RSA.

                                * `id-ecPublicKey` — ECDSA.'
                              enum:
                              - rsaEncryption
                              - id-ecPublicKey
                              example: rsaEncryption
                              type: string
                            modulus_length:
                              description: 'The certificate''s key''s modulus length, in bits.


                                * `null` — The certificate''s key is **not** an RSA key.'
                              example: 2048
                              type:
                              - integer
                              - 'null'
                            not_after:
                              description: The date the certificate expires.
                              example: 1601467200
                              format: unix_timestamp
                              type: integer
                            registered:
                              description: 'Whether the certificate is registered with a CA.


                                * `1` — Registered.

                                * `0` — **Not** registered.'
                              enum:
                              - 1
                              - 0
                              example: 1
                              type: integer
                            signature_algorithm:
                              description: The certificate's OID hash algorithm signature.
                              example: sha256WithRSAEncryption
                              type: string
                            validation_type:
                              description: 'The certificate''s validation type.


                                * `ev` — Extended Validation.

                                * `ov` — Organization Validation.

                                * `dv` — Domain Validated.

                                * `null` — The system could **not** parse and determine the

                                certificate''s validation type.'
                              enum:
                              - ev
                              - dv
                              - ov
                              example: dv
                              type:
                              - string
                              - 'null'
                          type: object
                        type: array
                    type: object
