  /set_autossl_metadata:
    get:
      description: 'This function sets values for AutoSSL''s metadata keys. This allows you to replace certificates that AutoSSL did not issue and toggle other AutoSSL notifications.


        **Note:**


        We recommend that you use the WHM API 1 `set_autossl_metadata_key` function instead.


        **Information:**


        * You can enter more than one key and value pair in the `metadata_json` JSON hash.

        * Any keys that you do not **explicitly** define will adopt the system''s default value.'
      operationId: SSL-set_autossl_metadata
      parameters:
      - content:
          application/json:
            schema:
              example:
                clobber_externally_signed: 1
                notify_autossl_expiry: 1
                notify_autossl_expiry_coverage: 1
                notify_autossl_expiry_coverage_user: 1
                notify_autossl_expiry_user: 1
                notify_autossl_renewal: 1
                notify_autossl_renewal_coverage: 1
                notify_autossl_renewal_coverage_reduced: 1
                notify_autossl_renewal_coverage_reduced_user: 1
                notify_autossl_renewal_coverage_user: 1
                notify_autossl_renewal_uncovered_domains: 1
                notify_autossl_renewal_uncovered_domains_user: 1
                notify_autossl_renewal_user: 1
              properties:
                clobber_externally_signed:
                  default: 0
                  description: 'Whether to allow AutoSSL to replace certificates that none of

                    this system’s AutoSSL modules issued. When you enable this option, AutoSSL

                    will install certificates that replace users’ Certificate Authority (CA)

                    issued certificates if they are invalid or expire within three days.

                    * `1` - Replace certificates not issued by the AutoSSL system.

                    * `0` - Only replace certificates issued by the AutoSSL system.'
                  enum:
                  - 0
                  - 1
                  example: 1
                  type: integer
                notify_autossl_expiry:
                  default: 1
                  description: 'Whether to send a notification when an AutoSSL certificate expires. This occurs when AutoSSL cannot request a new certificate.

                    * `1` - Send a notification.

                    * `0` - Do **not** send a notification.


                    **Notes:**


                    This can happen if all of a website’s domains fail Domain Control Validation (DCV), or if the AutoSSL provider has not issued a certificate in response to a request.'
                  enum:
                  - 0
                  - 1
                  example: 1
                  type: integer
                notify_autossl_expiry_coverage:
                  default: 1
                  description: 'Whether to send a notification if at least one currently-secured domain will lose coverage when the certificate renews.

                    * `1` - Send a notification.

                    * `0` - Do **not** send a notification.'
                  enum:
                  - 0
                  - 1
                  example: 1
                  type: integer
                notify_autossl_expiry_coverage_user:
                  default: 1
                  description: 'Whether to send a notification if at least one of a user''s currently-secured domains will lose coverage when the certificate renews.

                    * `1` - Send a notification.

                    * `0` - Do **not** send a notification.'
                  enum:
                  - 0
                  - 1
                  example: 1
                  type: integer
                notify_autossl_expiry_user:
                  default: 1
                  description: 'Whether to send a notification when a user''s AutoSSL certificate expires. This occurs when AutoSSL cannot request a new certificate for a user.

                    * `1` - Send a notification.

                    * `0` - Do **not** send a notification.'
                  enum:
                  - 0
                  - 1
                  example: 1
                  type: integer
                notify_autossl_renewal:
                  default: 1
                  description: 'Whether to send a notification when AutoSSL successfully renews a certificate.

                    * `1` - Send a notification.

                    * `0` - Do **not** send a notification.'
                  enum:
                  - 0
                  - 1
                  example: 1
                  type: integer
                notify_autossl_renewal_coverage:
                  default: 1
                  description: 'Whether to send a notification if a currently-secured domain fails DCV and the certificate has not reached its renewal period.

                    * `1` - Send a notification.

                    * `0` - Do **not** send a notification.'
                  enum:
                  - 0
                  - 1
                  example: 1
                  type: integer
                notify_autossl_renewal_coverage_reduced:
                  default: 1
                  description: 'Whether to send a notification when AutoSSL has renewed a certificate and the new certificate lacks at least one domain that the previous certificate secured.

                    * `1` - Send a notification.

                    * `0` - Do **not** send a notification.'
                  enum:
                  - 0
                  - 1
                  example: 1
                  type: integer
                notify_autossl_renewal_coverage_reduced_user:
                  default: 1
                  description: 'Whether to send a notification  when AutoSSL has renewed a certificate for a user and the new certificate lacks at least one domain that the previous certificate secured.

                    * `1` - Send a notification.

                    * `0` - Do **not** send a notification.'
                  enum:
                  - 0
                  - 1
                  example: 1
                  type: integer
                notify_autossl_renewal_coverage_user:
                  default: 1
                  description: 'Whether to send a notification if a currently-secured domain fails DCV and the certificate has not reached its renewal period.

                    * `1` - Send a notification.

                    * `0` - Do **not** send a notification.'
                  enum:
                  - 0
                  - 1
                  example: 1
                  type: integer
                notify_autossl_renewal_uncovered_domains:
                  default: 1
                  description: 'Whether to send a notification when AutoSSL has renewed a certificate and the new certificate lacks one or more of the website’s domains.

                    * `1` - Send a notification.

                    * `0` - Do **not** send a notification.'
                  enum:
                  - 0
                  - 1
                  example: 1
                  type: integer
                notify_autossl_renewal_uncovered_domains_user:
                  default: 1
                  description: 'Whether to send a notification  when AutoSSL has renewed a certificate for a user and the new certificate lacks one or more of the website’s domains.

                    * `1` - Send a notification.

                    * `0` - Do **not** send a notification.'
                  enum:
                  - 0
                  - 1
                  example: 1
                  type: integer
                notify_autossl_renewal_user:
                  default: 1
                  description: 'Whether to send a notification  when AutoSSL successfully renews a certificate for a user.

                    * `1` - Send a notification.

                    * `0` - Do **not** send a notification.'
                  enum:
                  - 0
                  - 1
                  example: 1
                  type: integer
              type: object
        description: JSON-encoded object of metadata keys and values that control AutoSSL's behavior.
        in: query
        name: metadata_json
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: set_autossl_metadata
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Update AutoSSL metadata
      tags:
      - SSL
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  set_autossl_metadata \\\n  metadata_json='{\"clobber_externally_signed\":\"1\",\"notify_autossl_expiry\":\"1\",\"notify_autossl_expiry_coverage\":\"1\",\"notify_autossl_expiry_coverage_user\":\"1\",\"notify_autossl_expiry_user\":\"1\",\"notify_autossl_renewal\":\"1\",\"notify_autossl_renewal_coverage\":\"1\",\"notify_autossl_renewal_coverage_reduced\":\"1\",\"notify_autossl_renewal_coverage_reduced_user\":\"1\",\"notify_autossl_renewal_coverage_user\":\"1\",\"notify_autossl_renewal_uncovered_domains\":\"1\",\"notify_autossl_renewal_uncovered_domains_user\":\"1\",\"notify_autossl_renewal_user\":\"1\"}'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/set_autossl_metadata?api.version=1&metadata_json=%7b%22clobber_externally_signed%22%3a%221%22%2c%22notify_autossl_expiry%22%3a%221%22%2c%22notify_autossl_expiry_coverage%22%3a%221%22%2c%22notify_autossl_expiry_coverage_user%22%3a%221%22%2c%22notify_autossl_expiry_user%22%3a%221%22%2c%22notify_autossl_renewal%22%3a%221%22%2c%22notify_autossl_renewal_coverage%22%3a%221%22%2c%22notify_autossl_renewal_coverage_reduced%22%3a%221%22%2c%22notify_autossl_renewal_coverage_reduced_user%22%3a%221%22%2c%22notify_autossl_renewal_coverage_user%22%3a%221%22%2c%22notify_autossl_renewal_uncovered_domains%22%3a%221%22%2c%22notify_autossl_renewal_uncovered_domains_user%22%3a%221%22%2c%22notify_autossl_renewal_user%22%3a%221%22%7d
