  /SSL/delete_cert:
    get:
      x-readonly: false
      x-rollback: none
      description: 'This function deletes an SSL certificate.


        **Note:**


        * When you call this function, you **must** include the `id` or the `friendly_name`

        parameter.

        * This function **only** deletes certificates from SSL storage. To end SSL

        coverage for a domain, use the UAPI `SSL::delete_ssl` function instead.


        **Important:**


        When you disable the Calendars and Contacts, Receive Mail, Web Disk, Webmail,

        and Web Server roles,

        the system **disables** this function.'
      operationId: SSL-delete_cert
      parameters:
      - description: The certificate's friendly name.
        in: query
        name: friendly_name
        required: false
        schema:
          example: TestCert
          type: string
      - description: The certificate's ID.
        in: query
        name: id
        required: false
        schema:
          example: example_com_cb497_a394d_1397249671_d1272da8f13a1fd837493a5ad1f0a0f3
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: delete_cert
                    type: string
                  module:
                    description: The name of the module called.
                    example: SSL
                    type: string
                  result:
                    properties:
                      data:
                        items:
                          properties:
                            created:
                              description: The date the certificate was created.
                              example: 1538308800
                              format: unix_timestamp
                              type: integer
                            domains:
                              description: A list of the domains that the certificate covers.
                              items:
                                example: example.com
                                format: domain
                                type: string
                              type: array
                            ecdsa_curve_name:
                              description: 'The ECDSA curve that the certificate''s key uses.


                                * `prime256v1`

                                * `secp384r1`

                                * `null` — The certificate''s key is **not** an ECDSA key.'
                              enum:
                              - prime256v1
                              - secp384r1
                              example: prime256v1
                              type:
                              - string
                              - 'null'
                            ecdsa_public:
                              description: 'The certificate''s key''s ECDSA compressed public point, in hexadecimal format.


                                * `null` — The certificate''s key is **not** an ECDSA key.'
                              example: null
                              type:
                              - string
                              - 'null'
                            friendly_name:
                              description: The certificate's friendly name.
                              example: TestCert
                              type: string
                            id:
                              description: The certificate's ID.
                              example: example_com_cb497_a394d_1397249671_d1272da8f13a1fd837493a5ad1f0a0f3
                              type: string
                            is_self_signed:
                              description: 'Whether the certificate is self-signed.


                                * `1` — Self-signed.

                                * `0` — Not self-signed.'
                              enum:
                              - 1
                              - 0
                              example: 1
                              type: integer
                            issuer.commonName:
                              description: The certificate's Common Name.
                              example: example.com
                              type: string
                            issuer.organizationName:
                              description: The certificate's Organization Name.
                              example: Organization
                              type: string
                            issuer_text:
                              description: The certificate's issuer information.
                              example: 'countryName

                                US

                                stateOrProvinceName

                                TX

                                localityName

                                Houston

                                organizationName

                                Organization

                                commonName

                                example.com'
                              type: string
                            key_algorithm:
                              description: 'The certificate''s key''s algorithm.


                                * `rsaEncryption` — RSA.

                                * `id-ecPublicKey` — ECDSA.'
                              enum:
                              - rsaEncryption
                              - id-ecPublicKey
                              example: rsaEncryption
                              type: string
                            modulus:
                              description: 'The certificate''s key''s modulus, in hexadecimal format.


                                * `null` — The certificate''s key is **not** an RSA key.'
                              example: 
                              type:
                              - string
                              - 'null'
                            modulus_length:
                              description: 'The length, in bits, of the certificate''s key''s modulus.


                                * `null` — The certificate''s key is **not** an RSA key.'
                              example: 2048
                              type:
                              - integer
                              - 'null'
                            not_after:
                              description: The date the certificate expired.
                              example: 1569844800
                              format: unix_timestamp
                              type: integer
                            not_before:
                              description: The date the certificate started.
                              example: 1538308800
                              format: unix_timestamp
                              type: integer
                            serial:
                              description: The certificate's serial number.
                              example: 45462cd0d6537b20cf2f3eb8aec07140
                              type: string
                            signature_algorithm:
                              description: The certificate's OID signature hash algorithm.
                              example: sha256WithRSAEncryption
                              type: string
                            subject.commonName:
                              description: The certificate's Common Name.
                              example: example.com
                              type: string
                            subject_text:
                              description: The certificate's subject text information.
                              example: 'commonName

                                www.example.com'
                              type: string
                            validation_type:
                              description: 'The certificate''s validation type.


                                * `ev` — Extended Validation.

                                * `ov` — Organization Validation.

                                * `dv` — Domain Validation.

                                * `null` — The system could not parse and determine the

                                certificate''s validation type.'
                              enum:
                              - ev
                              - ov
                              - dv
                              example: dv
                              type:
                              - string
                              - 'null'
                          type: object
                        type: array
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
