  /fetch_service_ssl_components:
    get:
      description: This function lists the system's services and their associated certificates.
      operationId: SSL-fetch_service_ssl_components
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      services:
                        description: An array of objects containing the certificate information for each service.
                        items:
                          properties:
                            cabundle:
                              description: 'The Certificate Authority (CA) information.


                                This function returns an empty string if no CA bundle exists

                                for the certificate.'
                              example: ''
                              type: string
                            certificate:
                              description: The SSL certificate's contents.
                              example: REDACTED_CERTIFICATE_EXAMPLE
                              format: pem-certificate
                              type: string
                            certificate_info:
                              description: An object containing certificate information data.
                              properties:
                                domains:
                                  description: The domains that correspond to the certificate.
                                  items:
                                    example: example.com
                                    format: domain
                                    type: string
                                  type: array
                                ecdsa_curve_name:
                                  description: 'The ECDSA curve that the certificate''s key uses.


                                    * `prime256v1`

                                    * `secp384r1`

                                    * `null` — The certificate''s key is **not** an ECDSA key.'
                                  enum:
                                  - prime256v1
                                  - secp384r1
                                  example: null
                                  type:
                                  - string
                                  - 'null'
                                ecdsa_public:
                                  description: 'The certificate''s key''s ECDSA compressed public point, in hexadecimal format.


                                    * `null` — The certificate''s key is **not** an ECDSA key.'
                                  example: null
                                  type:
                                  - string
                                  - 'null'
                                is_self_signed:
                                  description: 'Whether the certificate is self-signed.


                                    * `1` — Self-signed.

                                    * `0` — **Not** self-signed.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                issuer.commonName:
                                  description: The certificate's Common Name.
                                  example: example.com
                                  type: string
                                issuer.organizationName:
                                  description: The certificate's Organization Name.
                                  example: Writer's Guild of America
                                  type: string
                                issuer_text:
                                  description: Information about the issuer.
                                  example: 'countryName

                                    US

                                    stateOrProvinceName

                                    Unknown

                                    localityName

                                    Unknown

                                    organizationName

                                    Unknown

                                    organizationalUnitName

                                    Unknown

                                    commonName

                                    example.com

                                    emailAddress

                                    test@example.com'
                                  type: string
                                key_algorithm:
                                  description: 'The certificate''s key''s algorithm.


                                    * `rsaEncryption` — RSA.

                                    * `id-ecPublicKey` — ECDSA.'
                                  enum:
                                  - rsaEncryption
                                  - id-ecPublicKey
                                  example: rsaEncryption
                                  type: string
                                modulus:
                                  description: 'The certificate''s key''s modulus, in hexadecimal format.


                                    * `null` — The certificate''s key is **not** an RSA key.'
                                  example: null
                                  type:
                                  - string
                                  - 'null'
                                modulus_length:
                                  description: 'The certificate''s modulus size.


                                    * `null` — The certificate''s key is **not** an RSA key.'
                                  example: null
                                  type:
                                  - integer
                                  - 'null'
                                not_after:
                                  description: The date the certificate expires.
                                  example: 1601467200
                                  format: unix_timestamp
                                  type: integer
                                not_before:
                                  description: The certificate's validation date.
                                  example: 1569844800
                                  format: unix_timestamp
                                  type: integer
                              type: object
                            key:
                              description: The certificate's private key.
                              example: REDACTED_PRIVATE_KEY_EXAMPLE
                              format: pem-private-key
                              type: string
                            service:
                              description: 'The service that the certificate corresponds to.


                                * `ftp`

                                * `exim`

                                * `dovecot`

                                * `cpanel`'
                              enum:
                              - ftp
                              - exim
                              - dovecot
                              - cpanel
                              example: ftp
                              type: string
                          type: object
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: fetch_service_ssl_components
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return system services and associated certificates
      tags:
      - SSL
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  fetch_service_ssl_components\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/fetch_service_ssl_components?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.40'
    servers:
    - description: A server running WHM.
      url: https://{host}:{port}/json-api
      variables:
        host:
          default: whm-server.tld
          description: The hostname of a server running WHM.
        port:
          default: '2087'
          description: The WHM port.
  /fetch_ssl_certificates_for_fqdns:
    get:
      description: This function retrieves the certificate information for all fully qualified domain names (FQDNs) that the account owns.
      operationId: SSL-fetch_ssl_certificates_for_fqdns
      parameters:
      - description: 'A comma-separated list of domains for which to retrieve information.


          **Note:**


          For browser-based calls, you **must** URI-encode each comma (`%2C`).'
        examples:
          multiple:
            summary: Fetch information for multiple domains.
            value: domains=example-1.com,example-2.com,example-3.com
          single:
            summary: Fetch information for a single domain.
            value: example.com
        in: query
        name: domains
        required: true
        schema:
          format: domain
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      payload:
                        description: Information about the certificate.
                        items:
                          properties:
                            cab:
                              description: The CA bundle's contents.
                              example: REDACTED_CERTIFICATE_EXAMPLE
                              format: pem-certificate
                              type:
                              - string
                              - 'null'
                            created:
                              description: The date the certificate was created.
                              example: 1538308800
                              format: unix_timestamp
