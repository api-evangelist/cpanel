openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: UAPI accesses the cPanel interface's features. Use this API to access and modify cPanel account data and settings.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: cPanel U Version Control API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running cPanel.
  url: https://{host}:{port}/execute
  variables:
    host:
      default: cpanel-server.tld
      description: The hostname of a server running cPanel.
    port:
      default: '2083'
      description: The cPanel port.
security:
- BasicAuth: []
tags:
- description: The VersionControl module for UAPI.
  name: Version Control
paths:
  /VersionControl/create:
    get:
      x-readonly: false
      x-rollback: none
      description: 'This function creates a new Git™ repository on a cPanel account.


        * For more information about support for version control in cPanel & WHM, read our

        Git Version Control and

        Guide to Git documentation.

        * For a list of configuration changes, repository restrictions, and troubleshooting steps,

        read our Guide to Git - For System Administrators documentation.


        **Important:**


        The system logs errors for this function in the `~/.cpanel/logs/vc_TIMESTAMP_git_create.log`

        file, where `TIMESTAMP` represents the time of the error in Unix epoch time.'
      operationId: VersionControl-create
      parameters:
      - description: The new repository's display name.
        in: query
        name: name
        required: true
        schema:
          example: example
          type: string
      - description: 'The absolute path to the directory in which to store the repository, relative to the

          user''s `home` directory.


          **Note:**


          * If the directory does **not** exist, the system will create it.

          * If the specified directory already contains a repository, the system will

          automatically add it to the list of cPanel-managed repositories.

          * This feature enforces several restrictions on repository paths. For more information,

          read our [Guide to Git - For System Administrators](https://go.cpanel.net/GuidetoGitForSystemAdministrators) documentation.'
        in: query
        name: repository_root
        required: true
        schema:
          example: /home/user/public_html/example
          format: path
          type: string
      - description: 'The repository type.


          * `git` — A [Git](https://git-scm.com/) repository.


          **Note:**


          `git` is the only possible value.'
        in: query
        name: type
        required: true
        schema:
          enum:
          - git
          example: git
          type: string
      - content:
          application/json:
            schema:
              example:
                remote_name: origin
                url: ssh://clone.domain.com/cloneme
              properties:
                remote_name:
                  default: origin
                  description: The source repository's name.
                  type: string
                url:
                  description: The source repository's clone URL.
                  type: string
              required:
              - url
        description: 'A JSON-formatted object containing information about the source repository that the

          system will clone.


          **Note:**


          If you do **not** include source repository data, the function creates an empty repository.'
        in: query
        name: source_repository
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: create
                    type: string
                  module:
                    description: The name of the module called.
                    example: VersionControl
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          available_branches:
                            description: An list of available branches for the cloned or existing repository, if any exist.
                            example:
                            - master
                            - olive
                            items:
                              type: string
                            type: array
                          branch:
                            description: 'The repository''s current branch.


                              * `null` — The system has **not** finished the clone process for

                              the repository, or no local branches exist.'
                            example: master
                            type:
                            - string
                            - 'null'
                          clone_urls:
                            description: An object containing URLs to use to clone the repository.
                            properties:
                              read_only:
                                description: 'A list of clone URLs with read-only permissions. The function

                                  returns a blank array if the account does **not** include the

                                  *Shell Access* setting.


                                  **Important:**


                                  If the server uses a [nonstandard SSH port](https://go.cpanel.net/firewall),

                                  the system returns a clone URL that includes the port number.'
                                items:
                                  example: https://user@example.com/home/user/example
                                  format: url
                                  type: string
                                type: array
                              read_write:
                                description: 'A list of of clone URLs with read-write permissions. The function

                                  returns a blank array if the account does **not** include the

                                  *Shell Access* setting.


                                  **Important:**


                                  If the server uses a [nonstandard SSH port](https://go.cpanel.net/firewall),

                                  the system returns a clone URL that includes the port number.'
                                items:
                                  example: ssh://user@example.com/home/user/example
                                  type: string
                                type: array
                            type: object
                          last_update:
                            description: 'Information about the most-recent (HEAD) commit for the current branch.


                              **Note:**


                              * The system may require a large amount of time to clone large

                              repositories. Until this process finishes, HEAD information is unavailable.

                              * `null` is the only possible value.'
                            enum:
                            - null
                          name:
                            description: The repository's display name.
                            example: example
                            type: string
                          repository_root:
                            description: The absolute path of the directory that contains the repository in the user's `home` directory.
                            example: /home/user/public_html/example
                            format: path
                            type: string
                          source_repository:
                            description: 'A object containing information about a cloned repository''s source

                              repository.


                              **Note:**


                              The function **only** returns this object if it will clone a

                              repository.'
                            properties:
                              remote_name:
                                description: The source repository's name.
                                example: remote
                                type: string
                              url:
                                description: The source repository's clone URL.
                                example: http://user@domain.com/home/user/domain
                                format: url
                                type: string
                            type: object
                          tasks:
                            description: 'An array of objects containing information about the

                              [Task Queue](https://go.cpanel.net/whmdocsTaskQueueMonitor)

                              system''s process that will clone the repository.


                              **Note:**


                              The function **only** returns this value if it will clone a

                              repository.'
                            items:
                              properties:
                                action:
                                  description: 'The task''s action.


                                    * `create`


                                    **Note:**


                                    `create` is the only possible value.'
                                  enum:
                                  - create
                                  example: create
                                  type: string
                                args:
                                  description: 'A list of arguments for the

                                    [Task Queue](https://go.cpanel.net/whmdocsTaskQueueMonitor)

                                    system''s process.'
                                  properties:
                                    log_file:
                                      description: 'The absolute path to the process''s log file.


                                        **Note:**


                                        The function **only** returns this value if the process

                                        generated a log file.'
                                      example: /home/username/.cpanel/logs/vc_1234567890.123456_git_deploy.log
                                      type: string
                                    repository_root:
                                      description: The absolute path to the repository's directory within the user's `home` directory.
                                      example: /home/user/example
                                      format: path
                                      type: string
                                  type: object
                                id:
                                  description: 'The [Task Queue](https://go.cpanel.net/whmdocsTaskQueueMonitor)

                                    system''s task ID number.'
                                  example: 00000000/5a9ec8dd4c345d
                                  type: string
                                sse_url:
                                  description: The SSE interface to track the progress of the process.
                                  example: /sse/UserTasks/B3A27B96-51F7-11E8-92E3-CC90C4F823F0
                                  type: string
                                subsystem:
                                  description: 'The [Task Queue](https://go.cpanel.net/whmdocsTaskQueueMonitor)

                                    subsystem that will handle the task.


                                    * `VersionControl`


                                    **Note:**


                                    `VersionControl` is the only possible value.'
                                  enum:
                                  - VersionControl
                                  example: VersionControl
                                  type: string
                              type: object
                            type: array
                          type:
                            description: 'The repository type.


                              * `git` — A Git repostiory.


                              **Note:**


                              `git` is the only possible value.'
                            example: git
                            type: string
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `errors` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Create Git repository
      tags:
      - Version Control
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  VersionControl \\\n  create \\\n  type='git' \\\n  name='example' \\\n  repository_root='/home/user/public_html/example'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/VersionControl/create?type=git&name=example&repository_root=%2fhome%2fuser%2fpublic_html%2fexample
      - label: LiveAPI Perl
        lang: Perl
        source: "#--------------------------------------------------------------------------------------\n# Instructions:\n#--------------------------------------------------------------------------------------\n# <theme-name> is the theme assigned to cPanel account.\n# 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n# 2) mkdir api_examples\n# 3) cd api_examples\n# 4) create a file VersionControl_create.live.pl and put this code into that file.\n# 5) In your browser login to a cPanel account.\n# 6) Manually change the url from: .../frontend/<theme-name>/\n#    to .../frontend/<theme-name>/api_examples/VersionControl_create.live.pl\n#--------------------------------------------------------------------------------------\n\nuse strict;\n\nuse Cpanel::LiveAPI ();\n\nmy $cpanel = Cpanel::LiveAPI->new(); # Connect to cPanel - only do this once.\n\n# Print the header\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\n\n# Call the API\nmy $response = $cpanel->uapi(\n    q/VersionControl/,\n    q/create/,\n    {\n        'type' => 'git',\n        'name' => 'example',\n        'repository_root' => '/home/user/public_html/example',\n    }\n);\n\n# Handle the response\nif ($response->{cpanelresult}{result}{status}) {\n    my $data = $response->{cpanelresult}{result}{data};\n    # Do something with the $data\n    # So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    # Report errors:\n    print to_json($response->{cpanelresult}{result}{errors});\n}\n\n# Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n#--------------------------------------------------------------------------------------\n# Helper function to convert a perl object to html printable json\n#--------------------------------------------------------------------------------------\nsub to_json {\n    require JSON;\n    my $str = JSON->new->pretty->encode($_[0]);\n    return $str;\n}\n"
      - label: LiveAPI PHP
        lang: PHP
        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account.\n// 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file VersionControl_create.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme-name>/\n//    to .../frontend/<theme-name>/api_examples/VersionControl_create.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'VersionControl',\n    'create',\n    array (\n        'type' => 'git',\n        'name' => 'example',\n        'repository_root' => '/home/user/public_html/example',\n    )\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    // Do something with the $data\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}"
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: cPanel 72
  /VersionControl/delete:
    get:
      x-readonly: false
      x-rollback: none
      description: 'This function deletes a cPanel account''s Git™ repository. For more information about

        support for version control in cPanel & WHM, read our

        Git Version Control and

        Guide to Git documentation.


        **Warning:**


        * When you call this function, the system **permanently deletes** the entire contents

        of the specified directory. You **cannot** recover this data after deletion.

        * You **cannot** use this function to delete any repositories that do not appear in

        the cache of repositories (for example, repositories that contain invalid characters or

        exist within cPanel-controlled directories).'
      operationId: VersionControl-delete
      parameters:
      - description: The absolute directory path in the user's `home` directory containing the repository to delete.
        in: query
        name: repository_root
        required: true
        schema:
          example: /home/user/example
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: delete
                    type: string
                  module:
                    description: The name of the module called.
                    example: VersionControl
                    type: string
                  result:
                    properties:
                      data:
                        default: null
                        type:
                        - object
                        - 'null'
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `errors` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                type: object
          description: HTTP Request was successful.
      summary: Delete Git repository
      tags:
      - Version Control
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  VersionControl \\\n  delete \\\n  repository_root='/home/user/example'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/VersionControl/delete?repository_root=%2fhome%2fuser%2fexample
      - label: LiveAPI Perl
        lang: Perl
        source: "#--------------------------------------------------------------------------------------\n# Instructions:\n#--------------------------------------------------------------------------------------\n# <theme-name> is the theme assigned to cPanel account.\n# 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n# 2) mkdir api_examples\n# 3) cd api_examples\n# 4) create a file VersionControl_delete.live.pl and put this code into that file.\n# 5) In your browser login to a cPanel account.\n# 6) Manually change the url from: .../frontend/<theme-name>/\n#    to .../frontend/<theme-name>/api_examples/VersionControl_delete.live.pl\n#--------------------------------------------------------------------------------------\n\nuse strict;\n\nuse Cpanel::LiveAPI ();\n\nmy $cpanel = Cpanel::LiveAPI->new(); # Connect to cPanel - only do this once.\n\n# Print the header\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\n\n# Call the API\nmy $response = $cpanel->uapi(\n    q/VersionControl/,\n    q/delete/,\n    {\n        'repository_root' => '/home/user/example',\n    }\n);\n\n# Handle the response\nif ($response->{cpanelresult}{result}{status}) {\n    my $data = $response->{cpanelresult}{result}{data};\n    # Do something with the $data\n    # So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    # Report errors:\n    print to_json($response->{cpanelresult}{result}{errors});\n}\n\n# Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n#--------------------------------------------------------------------------------------\n# Helper function to convert a perl object to html printable json\n#--------------------------------------------------------------------------------------\nsub to_json {\n    require JSON;\n    my $str = JSON->new->pretty->encode($_[0]);\n    return $str;\n}\n"
      - label: LiveAPI PHP
        lang: PHP
        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account.\n// 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file VersionControl_delete.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme-name>/\n//    to .../frontend/<theme-name>/api_examples/VersionControl_delete.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'VersionControl',\n    'delete',\n    array (\n        'repository_root' => '/home/user/example',\n    )\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    // Do something with the $data\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}"
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: cPanel 72
  /VersionControl/retrieve:
    get:
      x-readonly: false
      x-rollback: none
      description: 'This function lists Git™ repositories on a cPanel account. For more information

        about support for version control in cPanel & WHM, read our

        Git Version Control and

        Guide to Git documentation.


        **Important:**


        * This feature does **not** allow the following characters in repository paths:

        ``\ * | " '' & @ ` $ { } [ ] ( ) ; ? : = % #``

        * This function does **not** allow repositories that exist in the following

        cPanel-controlled directories:


        * `.cpanel`

        * `.htpasswds`

        * `.ssh`

        * `.trash`

        * `access-logs`

        * `cgi-bin`

        * `etc`

        * `logs`

        * `perl5`

        * `mail`

        * `spamassassin`

        * `ssl`

        * `tmp`

        * `var`


        Users can create repositories in some of these directories on the command line.

        They may appear in the list of repositories in Gitweb, but users may see an error

        message if they try to access them.'
      operationId: VersionControl-retrieve
      parameters:
      - description: 'A comma-separated list of desired return values.


          **Note:**


          Use a wildcard (`*`) to list all possible return values.'
        in: query
        name: fields
        required: false
        schema:
          default: '*'
          example: name,type,branch,last_update
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: retrieve
                    type: string
                  module:
                    description: The name of the module called.
                    example: VersionControl
                    type: string
                  result:
                    properties:
                      data:
                        description: An array of objects containing repository data.
                        example:
                        - available_branches:
                          - master
                          branch: master
                          clone_urls:
                            read_only:
                            - https://user@example.com/home/user/example
                            read_write:
                            - ssh://user@example.com/home/user/example
                          deployable: 1
                          last_deployment:
                            deployment_date: 1598774400
                            repository_state:
                              author: User Name <user.name@example.com>
                              date: 1598774400
                              identifier: 2fd4e1c67a2d28fced849ee1bb76e7391b93eb12
                              message: I'm committing some particularly cromulent code.
                          last_update:
                            author: Jane Doe <jane.doe@example.com>
                            date: 1598774400
                            identifier: 2fd4e1c67a2d28fced849ee1bb76e7391b93eb12
                            message: I'm committing some particularly cromulent code.
                          name: example
                          repository_root: /home/user/example
                          tasks:
                          - action: create
                            args:
                              log_file: /home/user/.cpanel/logs/vc_1526305129.123456_git_create.log
                              repository_root: /home/user/example
                            id: 00000000/5a9ec8dd4c345d
                            sse_url: /sse/UserTasks/B3A27B96-51F7-11E8-92E3-CC90C4F823F0
                            subsystem: VersionControl
                          type: git
                        - available_branches:
                          - master
                          branch: master
                          deployable: 1
                          last_update:
                            author: June Due <june.due@example2.com>
                            clone_urls:
                              read_only:
                              - https://user@example.com/home/user/example
                              read_write:
                              - ssh://user@example.com/home/user/example
                            date: 1599730200
                            identifier: 4ee0b73ddf78213c41fcc185acfab68ced99046d
                            last_deployment:
                              deployment_date: 1599730200
                              repository_state:
                                author: User Name <user.name@example.com>
                                date: 1599730200
                                identifier: 2fd4e1c67a2d28fced849ee1bb76e7391b93eb12
                                message: I'm committing some particularly cromulent code.
                            message: My code makes more sense, actually.
                            tasks:
                            - action: create
                              args:
                                log_file: /home/user/.cpanel/logs/vc_1526305129.123456_git_create.log
                                repository_root: /home/user/example
                              id: 00000000/5a9ec8dd4c345d
                              sse_url: /sse/UserTasks/B3A27B96-51F7-11E8-92E3-CC90C4F823F0
                              subsystem: VersionControl
                          name: example2
                          repository_root: /home/user/example2
                          type: git
                        items:
                          properties:
                            available_branches:
                              description: 'A list of available local and remote branches for the cloned

                                or existing repository.


                                * An empty array — No branches exist.

                                * `null` — The repository is a bare repository.'
                              items:
                                type: string
                              type:
                              - array
                              - 'null'
                            branch:
                              description: 'The repository''s current branch.


                                * `null` — The system has not finished the clone process for the

                                repository, no local branches exist, or the repository is a bare

                                repository.'
                              type:
                              - string
                              - 'null'
                            clone_urls:
                              description: An array of objects containing URLS to use to clone the repository.
                              properties:
                                read_only:
                                  description: 'A list of clone URLs with read-only permissions.


                                    This function returns a blank array if the account does

                                    not include the *Shell Access* setting.


                                    **Important:**


                                    If the server uses a nonstandard SSH port, the system returns a

                                    clone URL that includes the port number.'
                                  items:
                                    type: string
                                  type: array
                                read_write:
                                  description: 'A list of clone URLs with read-write permissions.


                                    This function returns a blank array if the account does

