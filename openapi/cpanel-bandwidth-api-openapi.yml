  /Bandwidth/query:
    get:
      x-readonly: true
      description: 'This function queries an account''s bandwidth data and returns a report.


        **Note:**


        This function also returns the bandwidth use of a distributed cPanel account.'
      operationId: Bandwidth-query
      parameters:
      - description: 'How to group the data in the report, in pipe-separated format. This list **must** contain one or both of the following parameters:


          A pipe-separated list that contains one or both of the following parameters:

          * `domain`

          * `protocol`


          This parameter can also include only **one** of the following start time interval types:

          * `year`

          * `year_month`

          * `year_month_day`

          * `year_month_day_hour`

          * `year_month_day_mour_minute`


          **Note:**


          * This parameter accepts a maximum of three values.

          * The function nests the return objects in the order that you declare the values in this parameter.'
        examples:
          domain_protocol_year:
            summary: domain|protocol|year
            value: grouping=domain|protocol|year
          domain_year:
            summary: domain|year
            value: grouping=domain|year
          protocol_year_month:
            summary: protocol|year_month
            value: grouping=protocol|year_month
          year_month_day:
            summary: year_month_day
            value: grouping=year_month_day
        explode: false
        in: query
        name: grouping
        required: true
        schema:
          anyOf:
          - enum:
            - domain
            - protocol
            type: string
          - enum:
            - year
            - year_month
            - year_month_day
            - year_month_day_hour
            - year_month_day_hour_minute
            type: string
        style: pipeDelimited
      - description: 'A pipe-separated list of domains for which to provided data.


          **Note:**


          * If you do not include this parameter, the function will return data for all domains on the cPanel account.

          * The `UNKNOWN` "pseudo-domain" refers to data recorded without a specific domain. All traffic except HTTP traffic

          is recorded without a specific domain.'
        examples:
          multiple:
            summary: Get data for multiple domains and UNKNOWN.
            value: domains=example.com|subdomain.example.com|subdomain2.example.com|parkedexample.com|UNKNOWN
          single:
            summary: Get data for a specific domain.
            value: example.com
        explode: false
        in: query
        name: domains
        required: false
        schema:
          format: domain
          type: string
        style: pipeDelimited
      - description: The end date of the report window.
        in: query
        name: end
        required: false
        schema:
          example: 1446664809
          format: unix_timestamp
          type: integer
      - description: 'Length of time between bandwidth data samples.


          * `daily`

          * `hourly`

          * `5min`


          **Note:**


          The interval''s retention period determines availability of the interval''s data.

          Use the `Bandwidth::get_retention_periods` API to determine an interval''s retention period.'
        in: query
        name: interval
        required: false
        schema:
          default: daily
          enum:
          - daily
          - hourly
          - 5min
          example: daily
          type: string
      - description: 'A pipe-separated list of the protocols for which to provide data.

          * `http`

          * `imap`

          * `smtp`

          * `pop3`

          * `ftp`'
        examples:
          multiple:
            summary: Get data for multiple protocols.
            value: protocols=http|imap|smtp|pop3|ftp
          single:
            summary: Get data for a specific protocol.
            value: http
        explode: false
        in: query
        name: protocols
        required: false
        schema:
          type: string
        style: pipeDelimited
      - description: The start date of the report window.
        in: query
        name: start
        required: false
        schema:
          example: 1445664609
          format: unix_timestamp
          type: integer
      - description: The timezone in which to report the data.
        in: query
        name: timezone
        required: false
        schema:
          example: America/Chicago
          format: olson_timezone_name
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                domain:
                  description: grouping=domain
