  /BoxTrapper/process_messages:
    get:
      x-readonly: false
      x-rollback: none
      description: 'This function performs a specified action on messages in the BoxTrapper queue.


        **Important:**


        When you disable the *Receive Mail* role, the system **disables** this function.'
      operationId: BoxTrapper-process_messages
      parameters:
      - description: 'The action to perform on the email message file. To perform multiple actions on the specified email messages, pass this parameter multiple times.


          * `deliver` — Deliver a specific message.

          * `deliverall` — Deliver all messages from a sender.

          * `delete` — Delete a message.

          * `deleteall` — Delete all messages from a sender.

          * `blacklist` — Blacklist the sender of an email message.

          * `whitelist` — Whitelist the sender of an email message.

          * `ignore` — Ignore email messages from a sender.


          **Note:**


          The function performs the actions on the email messages files in the order that you pass each action.'
        examples:
          multiple:
            summary: Perform multiple actions.
            value: action=blacklist action=deleteall
          single:
            summary: Perform a single action.
            value: blacklist
        in: query
        name: action
        required: true
        schema:
          enum:
          - deliver
          - deliverall
          - delete
          - deleteall
          - blacklist
          - whitelist
          - ignore
          example: blacklist
          type: string
      - description: The filename of the email message to process. To process multiple email messages, pass this parameter multiple times.
        examples:
          multiple:
            summary: Process multiple email messages.
            value: email=example.msg email=example1.msg email=example2.msg
          single:
            summary: Process a single email message.
            value: example.msg
