  /BoxTrapper/deliver_messages:
    get:
      x-readonly: false
      x-rollback: none
      description: 'This function delivers messages in the BoxTrapper queue.


        **Important:**


        When you disable the

        *Receive Mail* role,

        the system **disables** this function.'
      operationId: BoxTrapper-deliver_messages
      parameters:
      - description: 'The sender''s cPanel account email address for which to deliver email messages.


          **Warning:**


          If you call this function in Webmail, the system ignores this parameter

          and defaults to the currently-authenticated email address.'
        in: query
        name: email
        required: true
        schema:
          example: user@example.com
          format: email
          type: string
      - description: 'The filename of the email messages to deliver.


          **Note:**


          To deliver multiple email messages, pass this parameter multiple times.'
        examples:
          multiple:
            summary: Deliver multiple email messages.
            value: queuefile=example.msg&queuefile=example1.msg&queuefile=example2.msg
          single:
            summary: Deliver a single email message.
            value: example.msg
        in: query
        name: queuefile
        required: true
        schema:
          type: string
      - description: 'Whether to deliver all messages that resemble the `queuefile` parameter''s value.


          * `1` - Deliver all similar messages.

          * `0` - Don''t deliver all similar messages.'
        in: query
        name: all_like
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: deliver_messages
                    type: string
                  module:
                    description: The name of the module called.
                    example: BoxTrapper
                    type: string
                  result:
                    properties:
                      data:
                        description: The delivered email message information.
                        items:
                          properties:
                            email:
                              description: The delivered email message's sender.
                              example: user@example.com
                              format: email
                              type: string
                            failed:
                              description: "Whether the system could not deliver the message.\n\n**Note:**\n\n * The function only returns this value if it doesn't deliver the message.\n * `1` is the only possible value."
                              enum:
                              - 1
                              example: 1
                              type: integer
                            matches:
                              description: A list of delivered email messages.
                              items:
                                example: example.msg
                                type: string
                              type: array
                            operator:
                              description: 'The action that the function performed.


                                * `deliver`

                                * `deliverall`'
                              enum:
                              - deliver
                              - deliverall
                              example: deliverall
                              type: string
                            reason:
                              description: 'A message about the failure or the warning.


                                **Note:**


                                The function only returns this value if it doesn''t delete the message or experiences

                                issues when it deletes the message.'
                              example: This is a failure message.
                              type: string
                            warning:
                              description: "Whether the system experienced issues when it delivered the message.\n\n**Note:**\n\n * The function only returns this value if it experiences issues when it delivers the message.\n * `1` is the only possible value."
                              enum:
                              - 1
                              example: 1
                              type: integer
                          type: object
                        type: array
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties:
                          transformed:
                            description: Post-processing may have transformed the data.
                            enum:
                            - 1
                            example: 1
                            type: integer
                      status:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `errors` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Send messages in the BoxTrapper queue
      tags:
      - BoxTrapper
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  BoxTrapper \\\n  deliver_messages \\\n  email='user@example.com' \\\n  queuefile='example.msg'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/BoxTrapper/deliver_messages?email=user%40example.com&queuefile=example.msg
