          type: integer
      - description: 'The hosting plan''s feature list.


          If you do **not** use this parameter, the function assigns the `default`

          feature list to the hosting plan''s accounts.'
        in: query
        name: featurelist
        required: false
        schema:
          default: default
          example: default
          type: string
      - deprecated: true
