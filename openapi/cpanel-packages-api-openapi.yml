openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: WHM API.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: WHM Packages API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running WHM.
  url: https://{host}:{port}/json-api
  variables:
    host:
      default: whm-server.tld
      description: The hostname of a server running WHM.
    port:
      default: '2087'
      description: The WHM port.
security:
- BasicAuth: []
tags:
- description: The Packages module for WHM API 1.
  name: Packages
paths:
  /_getpkgextensionform:
    get:
      description: 'This function retrieves a hosting plan''s package extension templates. When you call this

        function, the system checks the hosting plan''s `_PACKAGE_EXTENSIONS` value. The function

        returns the contents of the `/var/cpanel/packages/extensions/name.tt2` file for each package

        extension in the list, where name represents the package extension''s name.


        For more information, read our

        Guide to Package Extensions.


        **Note:**


        This function returns only metadata if the hosting plan does not use package extensions, or

        if the extensions'' template files are empty.'
      operationId: Accounts-_getpkgextensionform
      parameters:
      - description: The hosting plan's name.
        in: query
        name: pkg
        required: true
        schema:
          example: package1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      html:
                        description: The HTML and Template Toolkit soure code for the hosting plan's extensions' templates.
                        example: <div class="fatBorder" id="dog_Extension"> <fieldset class="groupEditor"> <div class="propertyGroup"> <h3>Dog Settings</h3> <div class="propertyEditor"> <div class="propertyLabel">Dog Species</div> <div class="propertyValue"><input id="dog_species" type="text" name="dog_species" value="dalmatian"></div> </div> <div class="propertyEditor"> <div class="propertyLabel">Tail Length</div> <div class="propertyValue"> <input type="radio" id="dogTailLengthTiny" name="dog_tail_length" value="tiny"> <label for="dogTailLengthTiny">Tiny</label><br> <input type="radio" id="dogTailLengthNormal" name="dog_tail_length" value="normal"> <label for="dogTailLengthNormal">Normal</label><br> <input type="radio" id="dogTailLengthLong" name="dog_tail_length" value="long"> <label for="dogTailLengthLong">Long</label> </div> </div> <div class="propertyEditor"> <div class="propertyLabel"><label for="dog_spots">Has Spots</label></div> <div class="propertyValue"> <input id="dog_spots" type="checkbox" name="dog_spots" value="y" checked="checked"> </div> </div> </div> </fieldset> </div>
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: _getpkgextensionform
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed: Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return hosting plan extension templates
      tags:
      - Packages
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  _getpkgextensionform \\\n  pkg='package1'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/_getpkgextensionform?api.version=1&pkg=package1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.40'
  /add_override_features_for_user:
    get:
      description: This function adds feature overrides to a cPanel account.
      operationId: Accounts-add_override_features_for_user
      parameters:
      - content:
          application/json:
            schema:
              additionalProperties:
                description: 'Whether to enable or disable a feature.


                  * `1` — Enable.

                  * `0` — Disable.


                  **Note:**


                  For a list of available features, use WHM API 1''s `get_feature_names` function.'
                enum:
                - 1
                - 0
                type: integer
              example:
                backup: 1
              type: object
        description: A JSON-encoded list of features to override and whether to enable or disable them.
        in: query
        name: features
        required: true
      - description: The cPanel username.
        in: query
        name: user
        required: true
        schema:
          example: username
          format: username
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: add_override_features_for_user
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Add cPanel account feature list overrides
      tags:
      - Packages
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  add_override_features_for_user \\\n  user='username' \\\n  features='{\"backup\":\"1\"}'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/add_override_features_for_user?api.version=1&user=username&features=%7b%22backup%22%3a%221%22%7d
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '56'
  /addpkg:
    get:
      description: 'This function creates a hosting plan (package).


        **Note:**


        The Access Control Lists

        restricts some of this function''s parameters, which limit the features that

        WHM users can access.'
      operationId: Packages-addpkg
      parameters:
      - description: 'The new hosting plan''s name.


          **Note:**


          * You **cannot** use the name `extensions` for a hosting plan.

          * You **cannot** modify hosting plan names after creation. Do **not**

          include details that may change over time, such as price.'
        in: query
        name: name
        required: true
        schema:
          example: package1
          type: string
      - description: 'A space-separated list of the hosting plan''s

          [package extensions](https://go.cpanel.net/GuidetoPackageExtensions).


          If you do **not** provide a value, the hosting plan will **not** include package

          extensions.


          **Note:**


          * We **strongly** recommend that you manage package extensions through WHM API

          1''s `addpkgext` and `delpkgext` functions.

          * You can include the extension''s variables in your function call, in `key=value` format.

          Consult the extension''s documentation for a list of possible variables.

          * Extension names and variables are case-sensitive.'
        in: query
        name: _PACKAGE_EXTENSIONS
        required: false
        schema:
          example: '''extension1 extension2 extension3'''
          type: string
      - description: 'The hosting plan''s maximum bandwidth use, in megabytes (MB).


          * `0`, `unlimited`, or `null` — The hosting plan allows unlimited bandwidth.


          **Note:**


          The `0`, `unlimited`, and `null` values are **only** available to users that possess

          the corresponding unlimited ACL permission.'
        in: query
        name: bwlimit
        required: false
        schema:
          default: 1048576
          example: 1048576
          oneOf:
          - maximum: 999999
            minimum: 0
            type: integer
          - description: The hosting plan allows unlimited bandwidth.
          - enum:
            - null
          - enum:
            - unlimited
            type: string
      - description: 'Whether CGI access is enabled for the account.


          * `1` — Enabled.

          * `0` — Disabled.


          **Note:**


          When a

          [server profile](https://go.cpanel.net/whmdocsServerProfile) disables the

          [Web Server role](https://go.cpanel.net/serverroles#roles), this parameter

          defaults to `0`. On these servers, you **cannot** enable CGI access.'
        in: query
        name: cgi
        required: false
        schema:
          default: 1
          enum:
          - 1
          - 0
          example: 1
          type: integer
      - description: 'The hosting plan''s cPanel theme.


          This parameter defaults to the server''s

          [default cPanel theme](https://go.cpanel.net/whmdocsBasicasisWebHostManagerSetup#select-a-default-theme-for-the-cpanel-interface).'
        in: query
        name: cpmod
        required: false
        schema:
          example: jupiter
          type: string
      - description: 'Whether to enable Digest Authentication for accounts on the hosting plan.


          * `1` — Enable.

          * `0` — Disable.'
        in: query
        name: digestauth
        required: false
        schema:
          default: 0
          enum:
          - 1
          - 0
          example: 1
          type: integer
      - description: 'The hosting plan''s feature list.


          If you do **not** use this parameter, the function assigns the `default`

          feature list to the account.'
        in: query
        name: featurelist
        required: false
        schema:
          default: default
          example: feature_list
          type: string
      - deprecated: true
        description: 'Whether Microsoft® FrontPage® Extensions are enabled for the account.


          * `1` — Enabled.

          * `0` — Disabled.


          **Note:**


          cPanel & WHM ignores all FrontPage settings and parameters.'
        in: query
        name: frontpage
        required: false
        schema:
          default: 0
          enum:
          - 1
          - 0
          example: 0
          type: integer
      - description: 'Whether the hosting plan allows shell access.


          * `1` — The hosting plan allows shell access.

          * `0` — The hosting plan does **not** allows shell access.'
        in: query
        name: hasshell
        required: false
        schema:
          default: 0
          enum:
          - 1
          - 0
          example: 1
          type: integer
      - description: 'Whether the account has a dedicated IP address.


          * `y` — The account possesses a dedicated IP address.

          * `n` — The account does not possess a dedicated IP address.'
        in: query
        name: ip
        required: false
        schema:
          default: n
          enum:
          - y
          - n
          example: n
          type: string
      - description: 'The hosting plan''s default locale, in its two-letter

          [ISO-3166 code](http://www.iso.org/iso/country_codes.htm)

          format.


          This parameter defaults to the server''s default locale.'
        in: query
        name: language
        required: false
        schema:
          example: en
          format: ISO-3166-1 (alpha-2)
          type: string
      - description: 'The percentage of failed or deferred email messages that the hosting plan allows users

          to send per hour before outgoing mail is rate-limited.


          * `0` or `unlimited` — The hosting plan allows users ot send an unlimited number of

          failed or deferred messages.'
        in: query
        name: MAX_DEFER_FAIL_PERCENTAGE
        required: false
        schema:
          default: unlimited
          example: unlimited
          oneOf:
          - minimum: 0
            type: integer
          - description: The hosting plan allows users ot send an unlimited number of failed or deferred messages.
            enum:
            - unlimited
            type: string
      - description: 'The maximum number of emails that the hosting plan allows users to send in one hour.


          * `0` or `unlimited` — The hosting plan allows users to send an unlimited number of emails.'
        in: query
        name: MAX_EMAIL_PER_HOUR
        required: false
        schema:
          default: unlimited
          example: unlimited
          oneOf:
          - minimum: 0
            type: integer
          - description: The hosting plan allows users to send an unlimited number of emails.
            enum:
            - unlimited
            type: string
      - description: 'The hosting plan''s maximum email account quota size, in megabytes (MB).


          * `0`, `unlimited`, or `null` — The hosting plan allows unlimited email account quota.


          **Note:**


          The `0`, `unlimited`, and `null` values are **only** available to users that possess

          the corresponding unlimited ACL permission.'
        in: query
        name: max_emailacct_quota
        required: false
        schema:
          default: 1024
          example: 1024
          oneOf:
          - maximum: 4294967296
            minimum: 0
            type: integer
          - description: The hosting plan allows unlimited email account quota.
          - enum:
            - null
          - enum:
            - unlimited
            type: string
      - description: The hosting plan's maximum number of Team users.
        in: query
        name: max_team_users
        required: false
        schema:
          example: 7
          maximum: 7
          minimum: 0
          type: integer
      - description: 'The hosting plan''s maximum number of addon domains.


          * `unlimited` or `null` — The hosting plan allows unlimited addon domains.'
        in: query
        name: maxaddon
        required: false
        schema:
          default: 0
          example: unlimited
          oneOf:
          - maximum: 999999
            minimum: 0
            type: integer
          - description: The hosting plan allows unlimited addon domains.
          - enum:
            - null
          - enum:
            - unlimited
            type: string
      - description: 'The hosting plan''s maximum number of FTP accounts.


          * `unlimited`, or `null` — The hosting plan allows unlimited FTP accounts.'
        in: query
        name: maxftp
        required: false
        schema:
          default: unlimited
          example: unlimited
          oneOf:
          - maximum: 999999
            minimum: 0
            type: integer
          - description: The hosting plan allows unlimited FTP accounts.
          - enum:
            - null
          - enum:
            - unlimited
            type: string
      - description: 'The hosting plan''s maximum number of mailing lists.


          * `unlimited`, or `null` — The hosting plan allows unlimited mailing lists.'
        in: query
        name: maxlst
        required: false
        schema:
          default: unlimited
          example: unlimited
          oneOf:
          - maximum: 999999
            minimum: 0
            type: integer
          - description: The hosting plan allows unlimited mailing lists.
          - enum:
            - null
          - enum:
            - unlimited
            type: string
      - description: 'The hosting plan''s maximum number of parked domains (aliases).


          * `unlimited` or `null` — The hosting plan allows unlimited parked domains.'
        in: query
        name: maxpark
        required: false
        schema:
          default: 0
          example: unlimited
          oneOf:
          - maximum: 999999
            minimum: 0
            type: integer
          - description: The hosting plan allows unlimited parked domains.
          - enum:
            - null
          - enum:
            - unlimited
            type: string
      - description: 'The hosting plan''s maximum number of email accounts.


          * `unlimited`, or `null` — The hosting plan allows unlimited email accounts.'
        in: query
        name: maxpop
        required: false
        schema:
          default: unlimited
          example: unlimited
          oneOf:
          - maximum: 999999
            minimum: 0
            type: integer
          - description: The hosting plan allows unlimited email accounts.
          - enum:
            - null
          - enum:
            - unlimited
            type: string
      - description: 'The hosting plan''s maximum number of each available type of SQL

          database.


          For example, if you set this value to `5` and the system administrator

          allows MySQL® and PostgreSQL® databases, users can create up to five MySQL

          databases and up to five PostgreSQL databases.


          * `unlimited`, or `null` — The hosting allows unlimited databases.'
        in: query
        name: maxsql
        required: false
        schema:
          default: unlimited
          example: unlimited
          oneOf:
          - maximum: 999999
            minimum: 0
            type: integer
          - description: The hosting plan allows unlimited databases.
          - enum:
            - null
          - enum:
            - unlimited
            type: string
      - description: 'The hosting plan''s maximum number of subdomains.


          * `unlimited`, or `null` — The hosting plan allows unlimited subdomains.'
        in: query
        name: maxsub
        required: false
        schema:
          default: unlimited
          example: unlimited
          oneOf:
          - maximum: 999999
            minimum: 0
            type: integer
          - description: The hosting plan allows unlimited subdomains.
          - enum:
            - null
          - enum:
            - unlimited
            type: string
      - description: 'The hosting plan''s disk space quota, in megabytes (MB).


          * `0`, `unlimited`, or `null` — The hosting plan allows unlimited disk space.


          **Note:**


          The `0`, `unlimited`, and `null` values are **only** available to users that possess

          the corresponding unlimited ACL permission.'
        in: query
        name: quota
        required: false
        schema:
          default: 10240
          example: 10240
          oneOf:
          - maximum: 999999
            minimum: 0
            type: integer
          - description: The hosting plan allows unlimited disk space.
          - enum:
            - null
          - enum:
            - unlimited
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      pkg:
                        description: The new hosting plan's name.
                        example: package1
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: addpkg
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Create hosting plan
      tags:
      - Packages
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  addpkg \\\n  name='package1'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/addpkg?api.version=1&name=package1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11'
  /addpkgext:
    get:
      description: 'This function adds a package extension to a hosting plan (package).


        **Notes:**


        * If you need to edit a package extension''s parameters, call this function again

        with the same package extension name and the updated package extension variables.


        * You can include the extension''s variables in your function call, in `key=value` format.

        Consult the extension''s documentation for a list of possible variables. Extension variables

        are case-sensitive.'
      operationId: Packages-addpkgext
      parameters:
      - description: 'The hosting plan''s

          [package extensions](https://go.cpanel.net/GuidetoPackageExtensions).


          **Note:**


          * Use space-delimited format to add multiple package extensions.

          * Extension names are case-sensitive.'
        examples:
          multiple:
            summary: Add multiple package extensions.
            value: extension1 extension2 extension3
          single:
            summary: Add a single package extension.
            value: extension1
        explode: false
        in: query
        name: _PACKAGE_EXTENSIONS
        required: true
        schema:
          type: string
        style: spaceDelimited
      - description: 'The hosting plan''s name.


          **Note:**


          You **cannot** use the `extensions` name for a hosting plan.'
        in: query
        name: name
        required: true
        schema:
          example: package1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      pkg:
                        description: The hosting plan's name.
                        example: package1
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: addpkgext
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Add hosting plan extension
      tags:
      - Packages
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  addpkgext \\\n  name='package1' \\\n  _PACKAGE_EXTENSIONS='extension1'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/addpkgext?api.version=1&name=package1&_PACKAGE_EXTENSIONS=extension1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '68'
  /changepackage:
    get:
      description: This function changes a cPanel account's hosting plan (package).
      operationId: Accounts-changepackage
      parameters:
      - description: The hosting plan's name.
        in: query
        name: pkg
        required: true
        schema:
          example: package1
          type: string
      - description: The cPanel account's username.
        in: query
        name: user
        required: true
        schema:
          example: username
          format: username
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: changepackage
                        type: string
                      output:
                        properties:
                          raw:
                            example: '<pre>

                              Changing the account bandwidth limit from “0” to “unlimited”.

                              Changing Feature List to default

                              Changing the maximum email accounts from “unlimited” to “unlimited”.

                              Changing the maximum SQL databases from “unlimited” to “unlimited”.

                              Changing the maximum FTP accounts from “unlimited” to “unlimited”.

                              Changing the maximum mailing lists from “unlimited” to “unlimited”.

                              Changing the maximum subdomains from “unlimited” to “unlimited”.

                              Changing the maximum email quota from “unlimited” to “unlimited” …

                              Changing "Maximum Hourly Email by Domain Relayed" from unlimited to unlimited

                              Changing "Maximum percentage of failed or deferred messages a domain may send per hour" from unlimited to unlimited

                              Changing the maximum parked domains from “unlimited” to “0”.

                              Changing the maximum addon domains from “unlimited” to “0”.

                              Removing Shell Access

                              Shell changed

                              Changing cPanel theme from jupiter to jupiter

                              Changing plan from default to boo

                              Bandwidth limit (unlimited) is lower than (unlimited) (all limits removed)<br /><blockquote><div style=''float:left;''>Enabling...</div><div style=''float:left;''>...exampleaddon.com...</div><div style=''float:left;''>...exampleaddon.example.com...</div><div style=''float:left;''>...example.com...</div><div style=''float:left;''>Done</div></blockquote><br /><div class=''clearit'' style=''clear:both; width:80%;''> </div>Setting quota to “unlimited”.

                              <span class="b2">Warning, this will not change shared IP accounts to dedicated IP accounts, or the reverse.</span>

                              <span class="b2">Warning: Changing a user’s package does not affect their Digest Authentication settings.</span>

                              </pre>'
                            type: string
                        type: object
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Update user hosting plan
      tags:
      - Packages
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  changepackage \\\n  user='username' \\\n  pkg='package1'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/changepackage?api.version=1&user=username&pkg=package1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11'
  /create_featurelist:
    get:
      description: 'This function creates or updates a feature list.


        **Note:**


        A reseller **must** possess the

        Add/Remove Package feature

        to use this function.'
      operationId: FeatureLists-create_featurelist
      parameters:
      - description: The feature list's name.
        in: query
        name: featurelist
        required: true
        schema:
          example: CustomFeatureList
          type: string
      - description: 'Whether to add a specific feature in the feature list.


          * `1` — Add the feature.

          * `0` — Do **not** add the feature.


          **Note:**


          * The parameter''s name is a feature''s name. For example, the `changemx=1`

          adds the *Change Mail Exchanger* feature to the feature list.


          * You can add or omit multiple features.'
        in: query
