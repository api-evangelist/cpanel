  /EmailAuth/ensure_dkim_keys_exist:
    get:
      x-readonly: false
      x-rollback: none
      description: 'This function confirms the validity of a DomainKeys Identified Mail (DKIM) key for one or more domains.


        **Notes:**


        * If an existing DKIM key does **not** meet the server''s security requirements, the system replaces the existing DKIM key.

        * If no DKIM key exists, the system creates a new key for the domain.'
      operationId: EmailAuth-ensure_dkim_keys_exist
      parameters:
      - description: "The domain for which to confirm a valid DKIM key exists.\n\n**Note:**\n\n To check the DKIM key validity for multiple domains, duplicate the parameter name. For example, use the `domain=example.com`, `domain=example2.com`, and `domain=example3.com` parameters."
        examples:
          multiple:
            summary: Multiple domains.
            value: domain=example.com&domain=example2.com&domain=example3.com
          single:
            summary: A single domain.
            value: example.com
        in: query
        name: domain
        required: true
        schema:
          format: domain
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: ensure_dkim_keys_exist
                    type: string
                  module:
                    description: The name of the module called.
                    example: EmailAuth
                    type: string
                  result:
                    properties:
                      data:
                        description: An array of objects that contains information about the domain's DKIM key validity.
                        items:
                          properties:
                            domain:
                              description: The domain for which the system confirmed that a valid DKIM key exists.
                              example: example.com
                              format: domain
                              type: string
                            msg:
                              description: The domain's DKIM key status message.
                              example: created new key
                              type: string
                            status:
                              description: 'Whether the system verified that the domain''s DKIM key exists.

                                * `1` - The system verified the existence of the domain''s DKIM key.

                                * `0` - The system did **not** verify the existence of the domain''s DKIM key.'
                              enum:
                              - 0
                              - 1
                              example: 1
                              type: integer
                          type: object
                        type: array
                      errors:
                        description: List of errors if the API failed.
