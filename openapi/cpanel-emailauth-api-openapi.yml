  /EmailAuth/enable_dkim:
    get:
      x-readonly: false
      x-rollback: none
      description: 'This function enables DomainKeys Identified Mail (DKIM) records on the DNS server for one or more domains.


        **Note:**


        If a DKIM record does **not** exist on the server, this function will install a new DKIM record.'
      operationId: EmailAuth-enable_dkim
      parameters:
      - description: 'The domain for which to enable DKIM records on the DNS server.


          **Note:**


          To enable multiple domain DKIM records, duplicate or increment the parameter. For example, to perform this for three domains, you could:


          * Use the `domain` parameter multiple times.

          * Use the `domain`, `domain-1`, and `domain-2` parameters.'
        examples:
          multiple:
            summary: Enable multiple domains' DKIM records.
            value: domain-1=example1.com domain-2=example2.com domain-3=example3.com
          multiple-alternative:
            summary: Enable multiple domains' DKIM records.
            value: domain=example1.com domain=example2.com domain=example3.com
          single:
            summary: Enable a single domain's DKIM records.
            value: example.com
        in: query
        name: domain
        required: true
        schema:
          format: domain
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: enable_dkim
                    type: string
                  module:
                    description: The name of the module called.
                    example: EmailAuth
                    type: string
                  result:
                    properties:
                      data:
                        description: An array that contains information about the enabled state of a domain's DKIM records on the DNS server.
                        items:
                          properties:
                            domain:
                              description: The domain for which the system enabled the DKIM record.
                              example: example.com
                              format: domain
                              type: string
                            msg:
                              description: The domain's DKIM record status message.
                              example: '[no changes needed]'
                              type: string
                            status:
                              description: 'Whether the system enabled the domain''s DKIM record on the DNS server.

