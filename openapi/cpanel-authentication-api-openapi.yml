openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: WHM API.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: WHM Authentication API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running WHM.
  url: https://{host}:{port}/json-api
  variables:
    host:
      default: whm-server.tld
      description: The hostname of a server running WHM.
    port:
      default: '2087'
      description: The WHM port.
security:
- BasicAuth: []
tags:
- description: The Authentication module for WHM API 1.
  name: Authentication
paths:
  /api_token_create:
    get:
      description: 'This function creates an API token. You can use API tokens instead of a password

        or access hash key to execute WHM API 1 functions over HTTPS. For more information

        about API tokens, read our

        Manage API Tokens in WHM

        documentation.


        **Important:**


        You **must** call this function over an SSL connection.'
      operationId: Tokens-api_token_create
      parameters:
      - description: 'The API token''s name.


          **Note:**


          * An API token name''s maximum length is 50 characters, and the name may **only**

          contain alphanumeric characters, dashes (`-`), and underscores (`_`).

          * You **must** assign a name that does **not** already exist to the API token.'
        in: query
        name: token_name
        required: true
        schema:
          example: example
          type: string
      - description: 'The privileges to assign to the token. If you do not use this parameter, the system

          assigns **all** of your privileges to the token.


          **Note:**


          * You can **only** assign privileges that you possess to the API token.

          * To assign multiple privileges to the token, increment the parameter name. For

          example: `acl-0`, `acl-1`, `acl-2`.'
        examples:
          multiple:
            summary: Assign multiple privileges.
            value: acl-0=create-acct acl-1=list-accts acl-2=kill-acct
          single:
            summary: Assign a single privilege.
            value: all
        in: query
        name: acl
        required: false
        schema:
          type: string
      - description: "The API token's expiration time. If you do not use this parameter, the\nAPI token will not expire.\n\n* A date, in [Unix Epoch format](http://en.wikipedia.org/wiki/Unix_time).\n* `0` — The API token will **not** expire.\n\n**Important:**\n\n When an API token expires, the system **does** not delete it. You **must**\n manually delete expired API tokens."
        in: query
        name: expires_at
        required: false
        schema:
          default: 0
          example: 1609372800
          type: integer
      - description: 'One or more optional remote IP or CIDR IP ranges this token may be used from. If you do not use this parameter, the system

          does not limit which IPs can use this token.


          **Note:**


          * To assign multiple whitelisted IPs to the token, increment the parameter name. For

          example: `whitelist_ip-0`, `whitelist_ip-1`, `whitelist_ip-2`.'
        examples:
          multiple:
            summary: Assign multiple IP or CIDR ranges.
            value: whitelist_ip-0=192.0.2.1 whitelist_ip-1=192.0.2.5 whitelist_ip-2=192.0.2.8/29 whitelist-ip-3=fc00:abcd::f whitelist-ip-4=2620:0:28a4::/48
          single:
            summary: Assign a single IP or CIDR range.
            value: 192.0.2.8/29
        in: query
        name: whitelist_ip
        required: false
        schema:
          anyOf:
          - format: ipv4
            type: string
          - format: ipv6
            type: string
          - format: cidr
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      acls:
                        description: An array of privileges that the token possesses.
                        items:
                          example: kill-acct
                          type: string
                        type: array
                      create_time:
                        description: The API token's creation time, in Unix time format.
                        example: 1483625276
                        format: unix_timestamp
                        type: integer
                      expires_at:
                        description: 'The API token''s expiration time.


                          * A valid timestamp, in Unix time format.

                          * A `null` value.'
                        example: 1609372800
                        format: unix_timestamp
                        type:
                        - integer
                        - 'null'
                      name:
                        description: 'The new API token''s name.


                          **Note:**


                          Use this value to revoke an API token with WHM API 1''s

                          `api_token_revoke` function.'
                        example: example
                        type: string
                      token:
                        description: 'The new API token to use to authenticate to WHM.


                          **Warning:**


                          Make **certain** that you save your API token in a safe location.

                          You **cannot** access the token again after you use this function.'
                        example: UWU28DCA23NKY76CN17MDPKM3O7EFQY8
                        type: string
                      whitelist_ips:
                        description: List of remote IP or CIDR IP ranges this token may be used from.
                        example:
                        - 1.1.1.1
                        - 1.1.1.2
                        - 1.1.1.8/29
                        - fc00:abcd:0000:0000:0000:0000:0000:000f
                        - 2620:0000:28a4:0000:0000:0000:0000:0000/48
                        items:
                          anyOf:
                          - format: ipv4
                            type: string
                          - format: ipv6
                            type: string
                          - format: cidr
                            type: string
                        type:
                        - array
                        - 'null'
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: api_token_create
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Create WHM API token
      tags:
      - Authentication
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  api_token_create \\\n  token_name='example'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/api_token_create?api.version=1&token_name=example
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '64'
  /api_token_get_details:
    get:
      description: This function looks up an API token’s details based on the token itself.
      operationId: Tokens-api_token_get_details
      parameters:
      - description: The API token.
        in: query
        name: token
        required: true
        schema:
          example: GVJWD78FF12NMBFKYKPS9BJ483C0XSQH
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                - properties:
                    data:
                      allOf:
                      - description: The API token’s details. Only present if the system recognizes the given `token`.
                      - $ref: '#/components/schemas/TokenDetails'
                    metadata:
                      $ref: '#/components/schemas/Metadata'
                  title: Token Recognized
                  type: object
                - properties:
                    metadata:
                      $ref: '#/components/schemas/Metadata'
                  title: Token Unrecognized
                  type: object
          description: HTTP Request was successful.
      summary: Look up API token details
      tags:
      - Authentication
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  api_token_get_details \\\n  token=GVJWD78FF12NMBFKYKPS9BJ483C0XSQH\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/api_token_get_details?api.version=1&token=GVJWD78FF12NMBFKYKPS9BJ483C0XSQH
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: 98
  /api_token_list:
    get:
      description: This function lists a WHM account's API tokens.
      operationId: Tokens-api_token_list
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      tokens:
                        additionalProperties:
                          description: An object of API token details.
                          properties:
                            acls:
                              additionalProperties:
                                description: 'Whether the Access Control List (ACL) is enabled.

                                  * `1` - The ACL is enabled.

                                  * `0` - The ACL is disabled.


                                  **Note**


                                  The property name should be an [ACL](https://go.cpanel.net/ACLReferenceChart).'
                                enum:
                                - 0
                                - 1
                                example: 1
                                type: integer
                              description: An object of privileges available to the user.
                            create_time:
                              description: The API token's creation time.
                              example: 1483625276
                              format: unix_timestamp
                              type: integer
                            expires_at:
                              description: The API token's expiration time. If the API token does not expire, the value is `null`.
                              example: 1609372800
                              format: unix_timestamp
                              type:
                              - integer
                              - 'null'
                            name:
                              description: The API token's name.
                              example: my-token-name
                              type: string
                            whitelist_ips:
                              description: List of remote IP or CIDR IP ranges this token may be used from.
                              example:
                              - 192.0.2.1
                              - 192.0.2.2
                              - 192.0.2.8/29
                              - fc00:abcd:0000:0000:0000:0000:0000:000f
                              - 2620:0000:28a4:0000:0000:0000:0000:0000/48
                              items:
                                anyOf:
                                - format: ipv4
                                  type: string
                                - format: ipv6
                                  type: string
                                - format: cidr
                                  type: string
                              type:
                              - array
                              - 'null'
                        description: An object that contains WHM account's API token names.
                        example:
                          my-controller-token:
                            acls:
                              create-acct: 0
                              edit-account: 0
                              limit-bandwidth: 1
                              list-accts: 1
                              suspend-acct: 1
                              upgrade-account: 0
                            create_time: 1483625276
                            expires_at: 1609372800
                            name: my-controller-token
                            whitelist_ips:
                            - 192.0.2.1
                            - 192.0.2.2
                            - 192.0.2.8/29
                            - fc00:abcd:0000:0000:0000:0000:0000:000f
                            - 2620:0000:28a4:0000:0000:0000:0000:0000/48
                          my-read-only-token:
                            acls:
                              create-acct: 0
                              edit-account: 0
                              limit-bandwidth: 0
                              list-accts: 1
                              suspend-acct: 0
                              upgrade-account: 0
                            create_time: 1490882281
                            expires_at: null
                            name: my-read-only-token
                            whitelist_ips: null
                        type: object
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: api_token_list
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed: Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return WHM API tokens
      tags:
      - Authentication
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  api_token_list\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/api_token_list?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '64'
  /api_token_revoke:
    get:
      description: This function revokes an API token from the WHM account.
      operationId: Tokens-api_token_revoke
      parameters:
      - description: 'The API token''s name.


          **Note:**


          To revoke multiple API tokens, increment this parameter''s name. For example: `token_name-1`, `token_name-2`, and `token_name-3`.'
        examples:
          multiple:
            summary: Revoke multiple API tokens.
            value: token_name-1=subway&token_name-2=job&token_name-3=jmkMRXBnhp20iz
          single:
            summary: Revoke a single API token.
            value: subway
        in: query
        name: token_name
        required: true
        schema:
          example: subway
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: api_token_revoke
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '- 1 - Success

                          - 0 - Failed: Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Disable WHM API token
      tags:
      - Authentication
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  api_token_revoke \\\n  token_name='subway'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/api_token_revoke?api.version=1&token_name=subway
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '64'
  /api_token_update:
    get:
      description: This function updates an API token's settings.
      operationId: Tokens-api_token_update
      parameters:
      - description: The API token's name.
        in: query
        name: token_name
        required: true
        schema:
          example: token
          type: string
      - description: 'The new privileges to assign to the token. If you do **not** use this parameter,

          the system will assign all of your privileges to the token.


          For a list of Access Control List (ACL) privileges, read our

          [Edit Reseller Nameservers and Privileges](https://docs.cpanel.net/whm/resellers/edit-reseller-nameservers-and-privileges/#feature-limits-acl-lists)

          documentation.


          **Note:**


          * You can **only** assign privileges that you possess to the API token.


          * The function replaces **all** current privileges with the privileges that you pass

          in this parameter.


          * To assign multiple privileges to the token, increment the parameter name.

          For example, `acl-1`, `acl-2`, `acl-3`.'
        examples:
          multiple:
            summary: Assign multiple privilges.
            value: acl-0=create-acct acl-1=list-accts acl-2=kill-acct
          single:
            summary: Assign a single privilege.
            value: all
        in: query
        name: acl
        required: false
        schema:
          type: string
      - description: 'The API token''s expiration time. If you do not use this parameter,

          the API token will **not** expire.


          * A date, in [Unix Epoch format](http://en.wikipedia.org/wiki/Unix_time).

          * `0` — The API token will **not** expire.


          **Important:**


          When an API token expires, the system does **not** delete it. You **must**

          manually delete expired API tokens.'
        in: query
        name: expires_at
        required: false
        schema:
          default: 0
          example: 1609372800
          format: unix_timestamp
          type: integer
      - description: 'The API token''s new name. If you do not use this parameter, the API token''s name

          remains the same.


          **Note:**


          * An API token name''s maximum length is 50 characters, and the name may **only**

          contain alphanumeric characters, dashes (`-`), and underscores (`_`).


          * You **must** assign a name that does **not** already exist to the API token.'
        in: query
        name: new_name
        required: false
        schema:
          example: example
          maxLength: 50
          type: string
      - description: 'The new remote IP or CIDR IP ranges to assign to this token. If you do not use this parameter, the system

          does not limit which IPs can use this token.


          **Note:**


          * The function replaces **all** current whitelisted IPs with the IPs you pass

          in this parameter.


          * To assign multiple whitelisted IPs to the token, increment the parameter name. For

          example: `whitelist_ip-0`, `whitelist_ip-1`, `whitelist_ip-2`.


          * If a token has whitelisted IPs set, they can be cleared by passing `whitelist_ip=any` as a parameter.

          This will allow any IP to make API calls using that token.'
        examples:
          clear:
            summary: Clear a token's whitelisted IPs list.
            value: whitelist_ip=any
          multiple:
            summary: Assign multiple IPs or CIDR ranges.
            value: whitelist_ip-0=192.0.2.1 whitelist_ip-1=192.0.2.5 whitelist_ip-2=192.0.2.8/29 whitelist-ip-3=fc00:abcd::f whitelist-ip-4=2620:0:28a4::/48
          single:
            summary: Assign a single IP or CIDR range.
            value: whitelist_ip=192.0.2.8/29
        in: query
        name: whitelist_ip
        required: false
        schema:
          anyOf:
          - format: ipv4
            type: string
          - format: ipv6
            type: string
          - format: cidr
            type: string
          - enum:
            - any
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      acls:
                        description: A list of privileges assigned to the token.
                        example:
                        - create-acct
                        - kill-acct
                        - list-accts
                        items:
                          type: string
                        type: array
                      create_time:
                        description: The API token's creation time.
                        example: 1483625276
                        format: unix_timestamp
                        type: integer
                      expires_at:
                        description: 'The API token''s expiration time.


                          **Note:**


                          A `null` value means that the API token does **not** expire.'
                        example: 1609372800
                        format: unix_timestamp
                        type:
                        - integer
                        - 'null'
                      name:
                        description: 'The API token''s name.


                          **Note:**


                          * This function returns the API token''s new name when you use

                          the `new_name` parameter.


                          * Use this value to revoke an API token with WHM API 1''s `api_token_revoke`

                          function.'
                        example: example
                        type: string
                      whitelist_ips:
                        description: List of remote IP or CIDR IP ranges this token may be used from.
                        example:
                        - 192.0.2.1
                        - 192.0.2.2
                        - 192.0.2.8/29
                        - fc00:abcd:0000:0000:0000:0000:0000:000f
                        - 2620:0000:28a4:0000:0000:0000:0000:0000/48
                        items:
                          anyOf:
                          - format: ipv4
                            type: string
                          - format: ipv6
                            type: string
                          - format: cidr
                            type: string
                        type:
                        - array
                        - 'null'
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: api_token_update
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` – Failed. Check the `reason` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Update WHM API token's settings
      tags:
      - Authentication
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  api_token_update \\\n  token_name='token'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/api_token_update?api.version=1&token_name=token
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '68'
  /disable_authentication_provider:
    get:
      description: This function disables a external authentication identity provider for a specified service.
      operationId: Authentication-disable_authentication_provider
      parameters:
      - description: A valid identity provider's identification key.
        in: query
        name: provider_id
        required: true
        schema:
          example: cpanelid
          type: string
      - description: 'The cPanel & WHM service''s name:


          * `cpaneld`

          * `webmaild`

          * `whostmgrd`'
        in: query
        name: service_name
        required: true
        schema:
          enum:
          - cpaneld
          - webmaild
          - whostmgrd
          example: cpaneld
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: disable_authentication_provider
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Disable identity provider
      tags:
      - Authentication
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  disable_authentication_provider \\\n  service_name='cpaneld' \\\n  provider_id='cpanelid'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/disable_authentication_provider?api.version=1&service_name=cpaneld&provider_id=cpanelid
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '54'
  /disable_failing_authentication_providers:
    get:
      description: This function disables any enabled identity provider modules that fail to load.
      operationId: Authentication-disable_failing_authentication_providers
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      payload:
                        description: An array of objects containing information about the external authentication identity provider module failures.
                        items:
                          properties:
                            disabled_services:
                              description: An array of the cPanel services for which the external authentication identity provider was previously disabled.
                              example:
                              - cpaneld
                              - webmaild
                              items:
                                type: string
                              type: array
                            failures_to_disable:
                              description: An array of objects containing the cPanel services for which the system fails to disable the module.
                              items:
                                properties:
                                  failure:
                                    description: A description of the failure to disable the identity provider module for that module.
                                    example: An informative failure message.
                                    type: string
                                  service_name:
                                    description: A cPanel service for which the system failed to disable the external authentication identity provider.
                                    example: whostmgrd
                                    type: string
                                type: object
                              type: array
                            provider_failure:
                              description: A description of the failure.
