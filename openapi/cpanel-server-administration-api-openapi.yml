info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: WHM API.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: WHM Server Administration API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running WHM.
  url: https://{host}:{port}/json-api
  variables:
    host:
      default: whm-server.tld
      description: The hostname of a server running WHM.
    port:
      default: '2087'
      description: The WHM port.
security:
- BasicAuth: []
tags:
- description: The Server Administration module for WHM API 1.
  name: Server Administration
paths:
  /add_configclusterserver:
    post:
      description: 'This function adds a server to a configuration cluster. The function''s return data appears in

        the `metadata` section of its output.


        We recommend that you run this function as a `POST` request with SSL enabled:


        * The length of the remote access key may cause problems if you run the function with the `GET`

        method (for example, a URL in your browser).

        * You risk security problems if you enter a remote access key through the `GET` method.


        **Important:**


        * Run this function as a `root`-level user on the server that you wish to use as the parent server.

        * If you log in to a configuration cluster server that is **not** the parent server, **nothing**

        will indicate that the server is part of a configuration cluster. You can **only** view and modify

        this information from the parent server.'
      operationId: ClusterServer-add_configclusterserver
      parameters:
      - description: A truncated version of the server's remote access key.
        in: query
        name: key
        required: true
        schema:
          example: d0:d0:d0:d0:d0:d0:d0:d0:d0:d0:d0:d0:d0:d0:d0:d0
          type: string
      - description: The remote configuration cluster server's name.
        in: query
        name: name
        required: true
        schema:
          example: example.com
          type: string
      - description: The username for the server's `root`-level account.
        in: query
        name: user
        required: true
        schema:
          example: root
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: add_configclusterserver
                        type: string
                      name:
                        description: The remote configuration cluster server's name.
                        example: example.com
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      signature:
                        description: A truncated version of the server's remote access key.
                        example: d0:d0:d0:d0:d0:d0:d0:d0:d0:d0:d0:d0:d0:d0:d0:d0
                        type: string
                      user:
                        description: The username for the server's `root`-level account.
                        example: root
                        type: string
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Add configuration cluster server
      tags:
      - Server Administration
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  add_configclusterserver \\\n  name='example.com' \\\n  user='root' \\\n  key='d0:d0:d0:d0:d0:d0:d0:d0:d0:d0:d0:d0:d0:d0:d0:d0'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/add_configclusterserver?api.version=1&name=example.com&user=root&key=d0%3ad0%3ad0%3ad0%3ad0%3ad0%3ad0%3ad0%3ad0%3ad0%3ad0%3ad0%3ad0%3ad0%3ad0%3ad0
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.44'
  /configurebackgroundprocesskiller:
    get:
      description: This function configures the server's background process killer.
      operationId: Sys-configurebackgroundprocesskiller
      parameters:
      - description: 'A process to kill in the `/usr/local/cpanel/etc/sym` directory.


          **Note:**


          To enable the background killer for multiple processes, duplicate or increment the parameter name.


          For example, `processes_to_kill`, `processes_to_kill-0`, and `processes_to_kill-1`.'
        examples:
          multiple:
            summary: Kill multiple processes.
            value: eggdrop-0, eggdrop-1, eggdrop-2
          single:
            summary: Kill a single process.
            value: eggdrop
        in: query
        name: processes_to_kill
        required: true
        schema:
          type: string
      - description: 'Unaffected users. If you do not specify a value, the function affects all of the users on the server.


          **Note:**


          To trust multiple users, duplicate or increment the parameter name.


          For example, `trusted_users`, `trusted_users-0`, and `trusted_users-1`.'
        in: query
        name: trusted_users
        required: false
        schema:
          example: user
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: configurebackgroundprocesskiller
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Update background process stopper
      tags:
      - Server Administration
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  configurebackgroundprocesskiller \\\n  processes_to_kill='eggdrop'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/configurebackgroundprocesskiller?api.version=1&processes_to_kill=eggdrop
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11'
  /configureservice:
    get:
      description: 'This function enables or disables a service and its monitoring.


        **Note:**


        If the user only possesses the `clustering`

        Access Control List (ACL),

        then this function can only act on the `named` service.'
      operationId: Services-configureservice
      parameters:
      - description: 'The service to configure. For more information about each service, read our

          [*Service Manager*](https://go.cpanel.net/whmdocsServiceManager)

          documentation.'
        in: query
        name: service
        required: true
        schema:
          enum:
          - apache_php_fpm
          - cpanel-dovecot-solr
          - cpanel_php_fpm
          - cpanellogd
          - cpdavd
          - cphulkd
          - cpsrvd
          - crond
          - dnsadmin
          - exim
          - exim-altport
          - ftpd
          - httpd
          - imap
          - ipaliases
          - lmtp
          - mailman
          - mysql
          - named
          - nscd
          - p0f
          - pop
          - postgresql
          - queueprocd
          - rsyslogd
          - spamd
          - sshd
          example: mysql
          type: string
      - description: 'Whether to enable the service.


          * `1` — Enable.

          * `0` — Disable.


          If you do not use this parameter, the function will **not** change

          the enabled status of the service.


          **Warning:**


          Do **not** use this function to disable the `cpsrvd` service.'
        in: query
        name: enabled
        required: false
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'A port or list of comma-separated ports on which Exim will listen for

          inbound connections.


          **Note:**


          The function **only** uses this parameter if you set `exim-altport` as

          the `service` parameter''s value.'
        in: query
        name: exim-altportnum
        required: false
        schema:
          default: 26
          example: 26, 5000, 6000
          type: string
      - description: 'Whether to monitor the service in WHM''s

          [*Service Status*](https://docs.cpanel.net/whm/server-status/service-status/)

          interface (*WHM >> Home >> Server Status >> Service Status*).


          * `1` — Monitor.

          * `0` — Do **not** monitor.


          If you do not use this parameter, the function will **not** change the

          monitoring status of the service.'
        in: query
        name: monitored
        required: false
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: configureservice
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: Enabled monitoring for mysql.
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed: Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Enable or disable a service and its monitoring
      tags:
      - Server Administration
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  configureservice \\\n  service='mysql'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/configureservice?api.version=1&service=mysql
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.38'
  /create_user_session:
    get:
      description: 'This function creates a new temporary user session for a specified service.

        This allows users with WHM access to log in to third-party applications

        (for example, billing systems) without storing the account password.


        **Note:**


        * The system destroys the temporary session after 15 minutes of inactivity.

        * For more information about the Single Sign On feature, read our

        Guide to API Authentication

        documentation.'
      operationId: Session-create_user_session
      parameters:
      - description: The session's service.
        in: query
        name: service
        required: true
        schema:
          enum:
          - cpaneld
          - whostmgrd
          - webmaild
          example: cpaneld
          type: string
      - description: The session's cPanel account username or a valid email address.
        in: query
        name: user
        required: true
        schema:
          example: user@example.com
          type: string
      - description: 'The cPanel or WHM application to which the session will link. This

          parameter defaults to a blank string, which redirects the user to the

          cPanel

          [*Home*](https://docs.cpanel.net/cpanel/the-cpanel-interface/the-cpanel-interface/)

          interface.


          * A valid application name, to link the session to an application.

          * An invalid application name, to create the session but **not** link

          it to an application.'
        in: query
