      operationId: ConnectedApplications-save_connected_application
      requestBody:
        content:
          application/json:
            schema:
              properties:
                data:
                  additionalProperties: {}
                  description: Data associated with the connected application. There are predefined elements related to specific security scenarios, but additional data may be stored here as well.
                  properties:
                    jwt:
                      additionalProperties: {}
                      description: The contents of a JSON Web Token used during registration or updates.
                      example:
                        callback_url: https://application-1.com/api/si/servers/registrations/callback
                        challenge: ddd13a92-d55e-4818-a960-9776ede6cd74
                        email: john.doe@email.example
                        exp: 1401912171
                        ips:
                        - 1.1.1.1
                        - 2.2.2.2
                        iss: https://application-1.com
                        iss_desc: Sample application
                        name: John Doe
                        redirect_url: https://application-1/redirect
                        scope:
                        - admin:users
                        - admin:resellers
                        - admin:domains
                        state: xyz
                      type: object
                    private_key:
                      description: The name of the private key, if any, used by encryption, signing, or other security schemes used when communicating with this connected application.
                      example: FEF6253E6A122532430D
                      type: string
                    public_key:
                      description: The name of the public key, if any, sent to the connected application during registration.
                      example: AAF6253E6A1225324305623EE
                      type: string
                    token_name:
                      description: The name of the API token, if any, sent to the connected application to allow that application to make API calls on this server.
                      example: Application 1 API Token
                      type: string
                  type: object
                name:
                  description: The name of the connected application.
                  example: application-1
                  type: string
              type: object
