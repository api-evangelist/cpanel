      x-cpanel-available-version: '94'
  /start_profile_activation:
    get:
      description: 'This function activates a server profile.


        **Note:**


        * If a server profile enables a service, the system will **also** enable service monitoring. To disable a service''s monitoring, use WHM''s *Service Manager* interface (*WHM >> Home >> Service Configuration >> Service Manager*).

        * For a list of the server''s available profiles, use the `get_available_profiles` function.'
      operationId: Cpanel-start_profile_activation
      parameters:
      - description: 'The code value of the server profile.


          * `STANDARD` — The Standard profile.

          * `DATABASENODE` — The Database profile.

          * `MAILNODE` — The Mail profile.

          * `DNSNODE` — The DNS profile.'
        in: query
        name: code
        required: true
        schema:
          enum:
          - STANDARD
          - DATABASENODE
          - MAILNODE
          - DNSNODE
          example: MAILNODE
          type: string
      - content:
          application/json:
            schema:
              additionalProperties:
                description: 'Each key is a role. Each key **must** have one of the following values:


                  * `1` — Enable the role.

                  * `0` — Disable the role.'
                enum:
                - 1
                - 0
                example: 0
                type: integer
              example:
                DNS: 0
                SpamFilter: 1
              type: object
        description: "The optional roles to enable or disable with the profile, in\nJSON format. You **must** URI-encode this value.\n\n**Note:**\n\n* As an example, if you wished to enable `SpamFilter` and disable `DNS`, the JSON object would be:\n\n   `{ \"SpamFilter\": 1, \"DNS\": 0 }`.\n\n* This parameter does **not** enable optional roles for profiles that do **not** possess any optional roles.\n* If you do not pass this parameter, the system **disables** a profile's optional roles, if any exist."
        in: query
        name: optional
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      log_id:
