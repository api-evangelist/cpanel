  /force_dedistribution_from_node:
    get:
      description: 'This function converts cPanel accounts that use a given

        child node

        to use the local server instead.


        Unlike the WHM API 1 `modifyacct` API call, this API does **not**

        transfer users’ data from the child node as part of the conversion.

        This API is useful for emergency repairs if, for example, a child

        node goes permanently offline while accounts still use it.


        **Warning:**


        Because this API does not transfer users’ data from the child node,

        all converted users will lose data. You should **only** call this API

        as a last resort.'
      operationId: Cpanel-force_dedistribution_from_node
      parameters:
      - description: 'The child node’s alias (friendly name). This is the value passed in the

          WHM API 1 `link_server_node_with_api_token` function’s `alias` parameter.'
        in: query
        name: node_alias
        required: true
        schema:
          example: mailalias
          type: string
      - description: 'The usernames of the

          [distributed cPanel accounts](https://go.cpanel.net/cPanelGlossary#distributed-cpanel-account)

          to convert.'
        in: query
        name: user
        required: true
        schema:
          example:
          - username
          - username1
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      log:
                        description: Log entries that indicate the conversion’s progress.
                        items:
                          properties:
                            contents:
                              description: The message content.
                              example: Converting “username1” …
                              type: string
                            indent:
                              description: The log message’s indent level.
                              example: 0
                              minimum: 0
                              type: integer
                            type:
                              description: 'The log level of the message.


                                * `success` – A success message.

                                * `out` – An informational message.

                                * `warn` – A warning message.

                                * `error` – An error message.'
                              enum:
                              - success
                              - out
                              - warn
                              - error
                              example: success
                              type: string
                          type: object
                        type: array
                      user_info:
                        description: Information about each newly-converted cPanel account.
                        items:
                          properties:
                            username:
                              description: The cPanel account’s username.
                              example: username1
                              format: username
                              type: string
                          type: object
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: force_dedistribution_from_node
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Repair distributed accounts with data loss
      tags:
      - Server Administration
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  force_dedistribution_from_node \\\n  node_alias='mailalias' \\\n  user='username' user='username1'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/force_dedistribution_from_node?api.version=1&node_alias=mailalias&user=username&user=username1
