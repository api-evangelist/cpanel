      tags:
      - Server Administration
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  update_linked_server_node \\\n  alias='example'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/update_linked_server_node?api.version=1&alias=example
