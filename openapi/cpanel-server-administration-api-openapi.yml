  /update_linked_server_node:
    get:
      description: 'This function updates a linked remote cPanel server node.


        **Important:**


        This function **requires** the use of an API token. For more information,

        read our Guide to API Authentication - API Tokens in WHM

        documentation.'
      operationId: Cpanel-update_linked_server_node
      parameters:
      - description: The name of a linked remote cPanel server node.
        in: query
        name: alias
        required: true
        schema:
          example: example
          type: string
      - description: "The API token required to make API calls to the remote cPanel server node.\n\nThis value defaults to the existing API token.\n\n**Note:**\n\n The API token **must** have `root`-level access on the remote cPanel server node."
        in: query
        name: api_token
        required: false
        schema:
          example: 23ZX8RA1FTE1IVJRL90MB5CREDS4UE2H
          type: string
      - description: 'A new remote cPanel server node''s hostname. The system will update your remote

          cPanel server node''s hostname to this value.


          This value defaults to the existing hostname.


          **Note:**


          This parameter does **not** accept an IP address.'
        in: query
        name: hostname
        required: false
        schema:
          example: example.com
          type: string
      - description: 'Whether to skip [SSL/TLS verification](https://docs.cpanel.net/knowledge-base/security/guide-to-ssl/).

          The system performs this action when it queries the remote cPanel server node.


          **Note:**


          If the remote cPanel server is SSL/TLS verified, you **cannot** skip verification.'
        in: query
        name: skip_tls_verification
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'The username required to make API calls to the remote cPanel server node.


          This value defaults to the existing username.


          **Note:**


          The username **must** have `root`-level access on the remote cPanel server node.'
        in: query
        name: username
        required: false
        schema:
          example: root
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: update_linked_server_node
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

