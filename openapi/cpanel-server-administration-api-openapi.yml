  /delete_configclusterserver:
    get:
      description: 'This function removes a server from a configuration cluster. The function''s return

        data appears in the `metadata` section of its output.


        **Important:**


        If you log in to a configuration cluster server that is **not** the parent server,

        **nothing** will indicate that the server is part of a configuration cluster. You can

        **only** view and modify this information from the parent server.'
      operationId: ClusterServer-delete_configclusterserver
      parameters:
      - description: The hostname or IP address of a remote configuration cluster server.
        in: query
        name: name
        required: true
        schema:
          example: example.com
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: delete_configclusterserver
                        type: string
