      x-cpanel-available-version: '76'
  /link_server_node_with_api_token:
    get:
      description: 'This function links your server to a remote server node. The server uses an API token

        to communicate with the remote server node.


        **Important:**


        * This function **only** runs on a

        Standard Node profile

        server.

        * The remote server node **must** use a version that is the same as or greater than your

        server version.

        * This function **requires** the use of an API token. For more information, read our

        Guide to API Authentication - API Tokens in WHM

        documentation.'
      operationId: Cpanel-link_server_node_with_api_token
      parameters:
      - description: 'A unique name that refers to the remote server node.


          **Note:**


          The alias may **only** contain alphanumeric characters, dashes (`-`), and underscores (`_`).

          It also has a maximum length of 50 characters.'
        in: query
        name: alias
        required: true
        schema:
          example: example
          maxLength: 50
          minLength: 1
          type: string
      - description: 'The API token required to make API calls to the remote server node.


          **Note:**


          The API token **must** have `root`-level access on the remote server node.'
        in: query
        name: api_token
        required: true
        schema:
          example: 23ZX8RA1FTE1IVJRL90MB5CREDS4UE2H
          type: string
