          items:
            example: any
            type: string
          type: array
        displayname:
          description: 'The application''s WHM display label.


            **Note:**


            The function **only** returns this value for plugins that you register with [AppConfig](https://go.cpanel.net/appconfig).'
          example: Roundcube
          type: string
        entryurl:
          description: 'The application''s WHM entry URL.


            **Note:**


            The function **only** returns this value for plugins that you register with [AppConfig](https://go.cpanel.net/appconfig).'
          example: roundcube/
          format: url-path
          type: string
        features:
          description: The required features to run the application.
          items:
            example: roundcube
            type: string
          type: array
        group:
          description: The application's group.
          example: mailman
          type: string
        icon:
          description: 'The application''s icon file, relative to the `/usr/local/cpanel/whostmgr/docroot/addon_plugins/` directory.


            **Note:**


            The function **only** returns this value for plugins that you register with [AppConfig](https://go.cpanel.net/appconfig).'
          example: roundcube.ico
          type: string
        name:
          description: The application's name.
          example: roundcube
          type: string
        origin:
          description: 'The application''s configuration file.


            **Note:**


            The function **only** returns this value for plugins that you register with [AppConfig](https://go.cpanel.net/appconfig).'
          example: clamavconnector.conf
          type: string
        phpConfig:
          description: The application's `php.ini` file, relative to the `/usr/local/cpanel/3rdparty/etc/` directory.
          example: php.ini
          format: path
          type: string
        target:
          description: 'The action''s target directory.


            **Note:**


            The function **only** returns this value for plugins that you register with [AppConfig](https://go.cpanel.net/appconfig).'
          example: _self
          format: path
          type: string
        upgradecall:
          description: "The absolute file path to the application's upgrade script.\n\n**Note:**\n\n* The function **only** returns this value for plugins that you register with [AppConfig](https://go.cpanel.net/appconfig).\n* The system passes upgrade information in the following format: `/usr/local/youraddon/bin/upgrade 11.36.0.0 11.38.0.0`, where:\n  * `11.36.0.0` is the **previous** cPanel & WHM version.\n  * `11.38.0.0` is the **current** cPanel & WHM version."
          example: /usr/local/roundcube/bin/upgrade
          format: path
          type: string
        url:
          description: The application's URL path.
          example: /3rdparty/roundcube
          format: url-path
          type: string
        user:
          description: The application's username.
          example: roundcube
          type: string
      type: object
  securitySchemes:
    BasicAuth:
      scheme: basic
      type: http
