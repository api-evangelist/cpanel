  /Team/edit_team_user:
    get:
      x-readonly: false
      x-rollback: none
      description: This function modifies a team user.
      operationId: Team-edit_team_user
      parameters:
      - description: The username of the team user.
        in: query
        name: user
        required: true
        schema:
          example: teamUser
          type: string
      - description: The role or roles to add to the team user.
        in: query
        name: add_role
        required: false
        schema:
          example: database
          type: string
      - description: The primary contact email address to set for the team user.
        in: query
        name: email1
        required: false
        schema:
          example: teamuser@example.com
          type: string
      - description: The secondary contact email address to set for the team user.
        in: query
        name: email2
        required: false
        schema:
          example: teamuser@example.com
          type: string
