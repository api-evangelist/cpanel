info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: UAPI accesses the cPanel interface's features. Use this API to access and modify cPanel account data and settings.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: cPanel U Subdomains API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running cPanel.
  url: https://{host}:{port}/execute
  variables:
    host:
      default: cpanel-server.tld
      description: The hostname of a server running cPanel.
    port:
      default: '2083'
      description: The cPanel port.
security:
- BasicAuth: []
tags:
- description: The SubDomain module for cPanel UAPI.
  name: Subdomains
paths:
  /SubDomain/changedocroot:
    get:
      x-readonly: false
      x-rollback: none
      description: 'This function changes the document root for a subdomain or addon domain

        that the calling cPanel user owns.


        **Important:**


        - This function does **not** apply to the account''s primary domain.

        Use the WHM API `set_primary_domain_docroot` function to change the document root for a primary domain.

        - The target directory must already exist before you call this function.

        The function does not create it.

        - This function does **not** move any files. You must ensure that the files

        exist in the new path when you call this function.

        - Any parked domains (`ServerAlias` entries) on the affected domain will

        inherit the new document root.

        - AutoSSL HTTP-01 renewals will fail if the new document root is empty

        or missing at renewal time.

        - To revert a document root change, call this function again with the

        original path.


        When you disable the Web Server role,

        the system **disables** this function.'
      operationId: SubDomain-changedocroot
      parameters:
      - description: 'The new document root as a path relative to the user''s home

          directory. The target directory **must** already exist, and the path **must** begin with `public_html/` if the

          *Restrict document roots to public_html* value is set to *On* in

          WHM''s [*Tweak Settings*](https://go.cpanel.net/TweakSettings-Domains)

          interface (*WHM >> Home >> Server Configuration >> Tweak Settings*).'
        in: query
        name: docroot
        required: true
        schema:
          example: public_html/myapp/public
          format: path
          type: string
      - description: The full domain name of the subdomain or addon domain whose document root you want to change. The domain must belong to the calling cPanel user.
        in: query
        name: domain
        required: true
        schema:
          example: sub.example.com
          format: domain
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      documentroot:
                        description: The absolute path of the new document root.
                        example: /home/username/public_html/myapp/public
                        type: string
                    type: object
                  errors:
                    items:
                      type: string
                    type: array
                  messages:
                    items:
                      type: string
                    type: array
                  metadata:
                    properties:
                      transformed:
                        type: integer
                    type: object
                  status:
                    description: '* `1` — Success.

                      * `0` — Failed. Check the `errors` field for more details.'
                    enum:
                    - 0
                    - 1
                    example: 1
                    type: integer
                  warnings:
                    items:
                      type: string
                    type: array
                type: object
          description: HTTP Request was successful.
      summary: Change a subdomain or addon domain document root
      tags:
      - Subdomains
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --user=username --output=jsonpretty \\\n  SubDomain \\\n  changedocroot \\\n  domain='sub.example.com' \\\n  docroot='public_html/myapp/public'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/SubDomain/changedocroot?domain=sub.example.com&docroot=public_html%2Fmyapp%2Fpublic
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: '11'
