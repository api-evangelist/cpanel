openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: WHM API.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: WHM Databases API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running WHM.
  url: https://{host}:{port}/json-api
  variables:
    host:
      default: whm-server.tld
      description: The hostname of a server running WHM.
    port:
      default: '2087'
      description: The WHM port.
security:
- BasicAuth: []
tags:
- description: The Databases module for WHM API 1.
  name: Databases
paths:
  /background_mysql_upgrade_checker_run:
    get:
      description: 'This function checks your MySQL configuration file and table engine before an upgrade to MySQL 8.0.


        **Important:**


        When you disable the

        MySQL/MariaDB role

        **and** remote MySQL is **not** already configured, the system **disables** this function.'
      operationId: Mysql-background_mysql_upgrade_checker_run
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      log_entry:
                        description: 'The upgrade log''s location, relative to the

                          [`/var/cpanel/logs/`](https://docs.cpanel.net/knowledge-base/cpanel-product/the-cpanel-log-files/#/var-cpanel-logs)

                          directory.'
                        example: mysql_upgrade.20200202-172923
                        type: string
                      pid:
                        description: The upgrade check's process ID.
                        example: 23456
                        minimum: 1
                        type: integer
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: background_mysql_upgrade_checker_run
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Validate MySQL status before upgrade
      tags:
      - Databases
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  background_mysql_upgrade_checker_run\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/background_mysql_upgrade_checker_run?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '88'
  /background_mysql_upgrade_status:
    get:
      description: 'This function retrieves the status of a background MySQL® or MariaDB® upgrade.


        **Important:**


        When you disable the MySQL/MariaDB role and remote MySQL is **not** already configured, the system **disables** this function.'
      operationId: Mysql-background_mysql_upgrade_status
      parameters:
      - description: "The logfile's name.\n\n**Note:**\n\n  Log files exist in the `/var/cpanel/logs/` directory."
        in: query
        name: upgrade_id
        required: true
        schema:
          example: mysql_upgrade.20141108-172923
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      error:
                        description: 'An error code.

                          * `0` — Successful upgrade.

                          * `-1` — Child process died from a signal.

                          * `4` — MySQL upgrade failed error code.'
                        example: 0
                        type: integer
                      error_log:
                        description: "The upgrade's error log file.\n\n**Note:**\n\n You can review MySQL upgrade error logs in the following location, where $TIME represents the time in [Unix epoch time](https://en.wikipedia.org/wiki/Unix_time) format: `/var/cpanel/logs/mysql_upgrade.$TIME/unattended_background_upgrade.error`."
                        example: Starting The system failed to update MYSQL,\n------------------------------------\n
                        type: string
                      log:
                        description: The upgrade's log file.
                        example: "Starting process with log file at /var/cpanel/logs/mysql_upgrade.20141108-172923/unattended_background_upgrade.log\nBeginning MariaDB 10.0 upgrade...\nObtained version information from system.\nEnsuring the MariaDB100 repository is available and working.\ncheckyum version 22.3\nEnsuring that the package MariaDB-client with version matching 10.0 is available.\nEnsuring that the package MariaDB-common with version matching 10.0 is available.\nEnsuring that the package MariaDB-devel with version matching 10.0 is available.\nEnsuring that the package MariaDB-server with version matching 10.0 is available.\nEnsuring that the package MariaDB-shared with version matching 10.0 is available.\nEnsuring that the package coreutils is available.\nEnsuring that the package grep is available.\nEnsuring that the package perl-DBI is available.\n your MariaDB server version for the right syntax to use near ''.`netcopya0I5KfqYTfHqJr` FOR UPGRADE'' at line 1 when executing ''CHECK TABLE ... FOR UPGRADE''\nFATAL ERROR: Upgrade failed\nDone building configuration.\nHooks system enabled.\nChecking for and running RPM::Versions ''post'' hooks for any RPMs about to be installed\nAll required ''post'' hooks have been run\nRunning: /usr/local/cpanel/scripts/check_cpanel_pkgs --targets=MySQL41,MySQL50,MySQL51,MySQL55,MySQL56,MariaDB100,MariaDB101 --fix\nRestarting mysql service.\nWaiting for mysql to restart waiting for mysql to initialize finished.\n[1;32mMariaDB upgrade completed successfully[0m\n------------------------------------\n"
                        type: string
                      state:
                        description: 'The upgrade''s state.

                          * success

                          * failed

                          * in progress'
                        enum:
                        - success
                        - failed
                        - in progress
                        example: success
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: background_mysql_upgrade_status
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return MySQL or MariaDB upgrade status
      tags:
      - Databases
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  background_mysql_upgrade_status \\\n  upgrade_id='mysql_upgrade.20141108-172923'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/background_mysql_upgrade_status?api.version=1&upgrade_id=mysql_upgrade.20141108-172923
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: cPanel 11.48
