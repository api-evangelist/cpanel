      description: 'This function lists the server''s database users.


        **Warning:**


        On most servers, this function returns a large amount of output. We **strongly** suggest that you filter and sort the output.


        **Important:**


        When you disable the MySQL/MariaDB and PostgreSQL roles and remote MySQL is not already configured, the system **disables** this function.'
      operationId: DB-list_database_users
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      payload:
                        description: An array of database data objects.
                        items:
                          properties:
                            cpuser:
                              description: The database user's owner.
                              example: example
                              type: string
                            engine:
                              description: 'The database user''s database engine.

                                * `mysql`

                                * `postgresql`'
                              enum:
                              - mysql
                              - postgresql
                              example: postgresql
                              type: string
                            name:
                              description: The database user's name.
                              example: example_user1
                              type: string
                          type: object
                        type: array
                    type: object
