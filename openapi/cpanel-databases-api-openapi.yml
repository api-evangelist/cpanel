  /list_mysql_databases_and_users:
    get:
      description: 'This function retrieves the MySQL® database and user data for the specified account.


        **Important:**


        When you disable the MySQL/MariaDB role **and** remote MySQL is **not** already configured, the system **disables** this function.'
      operationId: DB-list_mysql_databases_and_users
      parameters:
      - description: The username for a specified account.
        in: query
        name: user
        required: true
        schema:
          example: username
          format: username
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      mysql_config:
                        description: An object that contains the user's MySQL database configuration settings.
                        properties:
                          mysql-version:
                            description: The MySQL version installed on the server.
                            example: '5.5'
                            type: string
                          prefix_length:
                            description: The maximum number of characters allowed for the prefix on this server.
                            enum:
                            - 8
                            - 16
                            example: 8
                            type: integer
                          use_db_prefix:
                            description: 'Whether database prefixing is enabled on the server.

                              * `1` — Enabled.

                              * `0` — Disabled.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                        type: object
                      mysql_databases:
                        additionalProperties:
                          description: The database's name is the key's name.
                          items:
                            description: A database username with permissions on the database.
                            type: string
                          type: array
                        description: An object that contains database names and users.
                        example:
                          user1_database1:
                          - user1_user1
                          user2_database2:
                          - user2_user2
                        type: object
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: list_mysql_databases_and_users
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return MySQL databases and users for account
      tags:
      - Databases
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  list_mysql_databases_and_users \\\n  user='username'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/list_mysql_databases_and_users?api.version=1&user=username
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '56'
  /remote_mysql_create_profile:
    get:
      description: This function creates a profile to access a remote MySQL® server.
      operationId: RemoteMySQL-remote_mysql_create_profile
      parameters:
      - description: The MySQL server's IP address or hostname.
        in: query
        name: mysql_host
        required: true
        schema:
          example: 192.168.0.1
          oneOf:
          - format: ipv4
            type: string
          - format: hostname
            type: string
      - description: The MySQL server's password.
        in: query
        name: mysql_pass
        required: true
        schema:
          example: 12345luggage
          type: string
      - description: The MySQL server's port.
        in: query
        name: mysql_port
        required: true
        schema:
          example: 3306
          maximum: 65535
          minimum: 1
          type: integer
      - description: The MySQL server's username.
        in: query
        name: mysql_user
        required: true
        schema:
          example: username
          type: string
      - description: The new profile's name.
        in: query
        name: name
        required: true
        schema:
          example: MyProfile
          type: string
      - description: 'Whether the remote database profile is a cPanel Cloud deployment.


          * `1` — Is cPanel Cloud.

          * `0` — **Not** cPanel Cloud.'
        in: query
        name: cpcloud
        required: false
        schema:
          example: 1
          type: integer
          default: 0
      - description: 'A description of the profile data.


          **Note:**


          This parameter defaults to `User provided

          MySQL credentials`.'
        in: query
        name: setup_via
        required: false
        schema:
          example: Main terminal
          maxLength: 255
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      profile_details:
                        description: An object containing the new profile's data.
                        properties:
                          active:
                            description: 'Whether the system uses this profile to access the MySQL server.

                              * `1` — Active.

                              * `0` — **Not** active.'
                            enum:
                            - 0
                            - 1
                            example: 0
                            type: integer
                          cpcloud:
                            default: '0'
                            description: 'Whether the remote database profile is a cPanel Cloud deployment.


                              * `1` — Is cPanel Cloud.

                              * `0` — **Not** cPanel Cloud.'
                            enum:
                            - 0
                            - 1
                            example: 0
                            type: integer
                          mysql_host:
