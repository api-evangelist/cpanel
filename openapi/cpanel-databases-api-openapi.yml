  /get_database_optimizations:
    get:
      description: 'This function retrieves available database optimizations.


        **Warning:**


        On some servers, this function may return a large amount of output. We strongly suggest that you filter and sort the output.


        **Important:**


        The system **disables** this function when you have **not** configured remote MySQL, and you''ve disabled the MySQL/MariaDB and PostgreSQL roles.'
      operationId: DB-get_database_optimizations
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      payload:
                        description: An array of objects that contain my.cnf options and their recommended values.
                        items:
                          properties:
                            name:
                              description: The name of the option.
                              example: innodb_sort_buffer_size
                              type: string
                            reason:
                              description: A justification for why the option should be adjusted.
                              example: Your system's peak theoretical memory allocation is too high and may cause instability.
                              type: string
                            value:
                              description: The recommended option value.
                              example: 2M
                              type: string
                          type: object
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
