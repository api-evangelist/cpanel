paths:
  /cpgreylist_is_server_netblock_trusted:
    get:
      description: This function returns the Greylisting trusted status of the server's netblock.
      operationId: cPGreyList-cpgreylist_is_server_netblock_trusted
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      ip_blocks:
                        additionalProperties:
                          description: 'Whether the *Trusted Hosts* list includes the IP address range.

                            This return''s name is the IP address range.


                            * `1` — Trusted.

                            * `0` — Not trusted.'
                          enum:
                          - 1
                          - 0
                          type: integer
                        description: A list containing the neighboring netblocks.
                        example:
                          10.0.0.0-10.255.255.255: 1
                          199.0.0.0-199.3.255.255: 1
                          48.0.0.0-48.255.255.255: 1
                        type: object
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: cpgreylist_is_server_netblock_trusted
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return Greylisting trust status of server netblock
      tags:
      - Greylisting
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  cpgreylist_is_server_netblock_trusted\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/cpgreylist_is_server_netblock_trusted?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.50'
  /cpgreylist_list_entries_for_common_mail_provider:
    get:
      description: This function lists Greylisting's IP addresses for the specified mail provider.
      operationId: cPGreyList-cpgreylist_list_entries_for_common_mail_provider
      parameters:
      - description: "The mail provider.\n\n**Note:**\n\n * To list entries for multiple mail providers, increment the parameter name. For example, `provider-0`, `provider-1`, and `provider-2`.\n * Call WHM API 1's `cpgreylist_load_common_mail_providers_config` function to return a list of valid provider keys."
        examples:
          multiple:
            summary: List multiple mail provider entries.
            value: provider-0=example-0 provider-1=example-1 provider-2=example-2
          single:
            summary: List a single mail provider entry.
            value: cpanel
        in: query
        name: provider
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    example:
                      providers:
                        cpanel:
                          ips:
                          - create_time: '2015-07-28T08:16:52.000Z'
                            host_ip: 208.115.214.0-208.115.214.255
                            is_trusted: 1
                            provider_id: 7
                          - create_time: '2015-07-28T08:16:52.000Z'
                            host_ip: 74.63.202.0-74.63.202.255
                            is_trusted: 1
                            provider_id: 7
                      providers_failed:
                        dpanel: 'Unknown mail provider: dpanel'
                    properties:
                      providers:
                        additionalProperties:
                          description: 'An object containing an object that contains the mail provider''s IP address data.


                            **Note:**


                            The return''s name is the mail provider''s display name.'
                          properties:
                            ips:
                              description: An object containing the mail provider's IP address data.
                              properties:
                                create_time:
                                  description: The date and time when the function created the record.
                                  example: '2015-07-28T08:16:52.000Z'
                                  format: ISO-8601 Date Time (Space Separated)
                                  type: string
                                host_ip:
                                  description: The mail provider's IP address or range.
                                  example: 192.168.0.1
                                  format: ipv4
                                  type: string
                                is_trusted:
                                  description: 'Whether Greylisting trusts this mail provider''s IP addresses.

                                    - `1` — Trusted.

                                    - `0` — Not trusted.'
                                  enum:
                                  - 0
                                  - 1
                                  example: 1
                                  type: integer
                                provider_id:
                                  description: The mail provider's identification number.
                                  example: 7
                                  minimum: 1
                                  type: integer
                          type: object
                        description: An object containing mail providers and their IP addresses.
                      providers_failed:
                        additionalProperties:
                          description: 'The reason why the system failed to list IP addresses for the provider.


                            **Note:**


                            The return''s name is the mail provider''s display name.'
                          type: string
                        description: An object containing mail providers that the system failed to retrieve data for.
                        type: object
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: cpgreylist_list_entries_for_common_mail_provider
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return Greylisting IP addresses of mail providers
      tags:
      - Greylisting
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  cpgreylist_list_entries_for_common_mail_provider \\\n  provider='cpanel'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/cpgreylist_list_entries_for_common_mail_provider?api.version=1&provider=cpanel
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.52'
  /cpgreylist_load_common_mail_providers_config:
    get:
      description: This function returns Greylisting's list of common mail service providers.
      operationId: cPGreyList-cpgreylist_load_common_mail_providers_config
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      autotrust_new_common_mail_providers:
                        description: 'Whether Greylisting automatically trusts new mail providers that WebPros International, LLC adds to the common mail providers list.

                          * `1` - New mail providers are automatically trusted.

                          * `0` - New mail providers are **not** automatically trusted.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      common_mail_providers:
                        additionalProperties:
                          description: "An object containing the provider's data.\n\n**Note:**\n\n  The object's name is the provider's key name."
                          properties:
                            autoupdate:
                              description: 'Whether Greylisting automatically trusts new IP addresses that WebPros International, LLC adds for this mail provider.

                                * `1` - New IP addresses are automatically trusted.

                                * `0` - New IP addresses are **not** automatically trusted.'
                              enum:
                              - 0
                              - 1
                              example: 1
                              type: integer
                            display_name:
                              description: The mail provider's name.
                              example: cPanel
                              type: string
                            is_trusted:
                              description: 'Whether Greylisting trusts this mail provider''s IP addresses.

                                * `1` - The provider is trusted.

                                * `0` - The provider is **not** trusted.'
                              enum:
                              - 0
                              - 1
                              example: 1
                              type: integer
                          type: object
                        description: An object containing common mail provider settings.
                        example:
                          cpanel:
                            autoupdate: 1
                            display_name: cPanel
                            is_trusted: 1
                          sectigo:
                            autoupdate: 1
                            display_name: Comodo/Sectigo
                            is_trusted: 1
                        type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: cpgreylist_load_common_mail_providers_config
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed: Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Return Greylisting mail providers
      tags:
      - Greylisting
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  cpgreylist_load_common_mail_providers_config\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/cpgreylist_load_common_mail_providers_config?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.52'
  /cpgreylist_save_common_mail_providers_config:
    get:
      description: This function sets whether Greylisting trusts new entries to cPanel's common mail providers list.
      operationId: cPGreyList-cpgreylist_save_common_mail_providers_config
      parameters:
      - description: 'Whether Greylisting automatically trusts new mail providers that cPanel adds to the common mail providers list.


          * `1` — Automatically trust new mail providers cPanel adds to the common mail providers list.

          * `0` — Do **not** automatically trust new mail providers cPanel adds to the common mail providers list.'
        in: query
        name: autotrust_new_common_mail_providers
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: "Whether Greylisting automatically trusts new IP addresses that cPanel adds to this mail provider.\n\n* `1` — Automatically trust new IP addresses cPanel adds to this mail provider.\n* `0` — Do **not** automatically trust new IP addresses cPanel adds to this mail provider.\n\nIf you do not specify this parameter, the system will **not** change Greylisting settings for **any** existing provider.\n\n**Note:**\n\n The parameter's name is the provider's key name.\n Example key and value:\n * `google=0`"
        in: query
        name: PROVIDERKEY
        required: false
        schema:
          enum:
          - 0
          - 1
          example: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      autotrust_new_common_mail_providers:
                        description: 'Whether Greylisting automatically trusts new mail providers that WebPros International, LLC adds to the common mail providers list.


                          * `1` - New mail providers are automatically trusted.

                          * `0` - New mail providers are **not** automatically trusted.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      common_mail_providers:
                        additionalProperties:
                          description: "An object containing the provider's data.\n\n**Note:**\n\n  The object's name is the provider's key name."
                          properties:
                            autoupdate:
                              description: 'Whether Greylisting automatically trusts new IP addresses that WebPros International, LLC adds for this mail provider.


                                * `1` - New IP addresses are automatically trusted.

                                * `0` - New IP addresses are **not** automatically trusted.'
                              enum:
                              - 0
                              - 1
                              example: 1
                              type: integer
                            display_name:
                              description: The mail provider's name.
                              example: cPanel
                              type: string
                            is_trusted:
                              description: 'Whether Greylisting trusts this mail provider''s IP addresses.


                                * `1` - The provider is trusted.

                                * `0` - The provider is **not** trusted.'
                              enum:
                              - 0
                              - 1
                              example: 1
                              type: integer
                          type: object
                        description: An object containing common mail provider settings.
                        example:
                          cpanel:
                            autoupdate: 1
                            display_name: cPanel
                            is_trusted: 1
                          sectigo:
                            autoupdate: 1
                            display_name: Comodo/Sectigo
                            is_trusted: 1
                        type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: cpgreylist_load_common_mail_providers_config
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed: Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Update Greylisting new mail provider handling
      tags:
      - Greylisting
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  cpgreylist_save_common_mail_providers_config\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/cpgreylist_save_common_mail_providers_config?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.52'
