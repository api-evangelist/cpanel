  /save_cpgreylist_config:
    get:
      description: 'This function modifies the server''s Greylisting configuration settings.


        **Important:**


        When you call this function, you **must** include at least one of the

        following parameters:


        * `spf_bypass`

        * `child_timeout_secs`

        * `record_exp_time_mins`

        * `initial_block_time_mins`

        * `max_child_procs`

        * `purge_interval_mins`

        * `must_try_time_mins`'
      operationId: cPGreyList-save_cpgreylist_config
      parameters:
      - description: 'The maximum of seconds that Greylisting waits for a child process to timeout.


          **Note:**


          This parameter affects the function of the `cPGreyList` daemon. Do **not** change this

          value unless it is absolutely necessary.'
        in: query
        name: child_timeout_secs
        required: false
        schema:
          example: 5
          minimum: 1
          type: integer
      - description: The number of minutes during which Greylisting defers email from an unknown triplet. The maximum value for this parameter is four hours (`240` minutes).
        in: query
        name: initial_block_time_mins
        required: false
        schema:
          example: 10
          maximum: 240
          minimum: 1
          type: integer
      - description: "The maximum number of child processes.\n\n**Notes:**\n\n This parameter affects the function of the `cPGreyList` daemon. Do **not** change this\n value unless it is absolutely necessary."
        in: query
        name: max_child_procs
        required: false
        schema:
          example: 5
          minimum: 1
          type: integer
      - description: The number of minutes during which Greylisting accepts a re-sent email from an unknown triplet. The maximum value for this parameter is one day (`1440` minutes).
        in: query
        name: must_try_time_mins
        required: false
        schema:
          example: 240
          maximum: 1440
          minimum: 1
          type: integer
      - description: 'The number of minutes before Greylisting deletes the records in the Greylisting database.


          **Note:**


          This parameter affects the function of the `cPGreyList` daemon. Do **not** change this

          value unless it is absolutely necessary.'
        in: query
        name: purge_interval_mins
        required: false
        schema:
          example: 60
          minimum: 1
          type: integer
      - description: 'The number of minutes before Greylisting deletes the triplet record and treats a

          re-sent email as coming from a new, unknown triplet. The maximum value for this

          parameter is 30 days (`43200` minutes).'
        in: query
        name: record_exp_time_mins
        required: false
        schema:
          example: 4320
          maximum: 43200
          minimum: 1
          type: integer
      - description: 'Whether emails with SPF bypass Greylisting.


          * `1` — Enabled.

          * `0` — Disabled.'
        in: query
        name: spf_bypass
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      cpgreylist_config:
                        description: A list of Greylisting settings.
                        properties:
                          child_timeout_secs:
                            description: The maximum amount of seconds that Greylisting waits for child process to time out.
                            example: 5
                            minimum: 1
                            type: integer
                          initial_block_time_mins:
                            description: The number of minutes during which Greylisting defers email from an unknown triplet.
                            example: 10
                            maximum: 240
                            minimum: 1
                            type: integer
                          is_enabled:
                            description: 'Whether Greylisting is enabled.


                              * `1` — Enabled.

                              * `0` — Disabled.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type: integer
                          is_exim_enabled:
                            description: 'Whether Exim is enabled.


                              * `1` — Enabled.

                              * `0` — Disabled.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type: integer
                          max_child_procs:
                            description: The maximum amount of child processes.
                            example: 5
                            minimum: 1
                            type: integer
                          must_try_time_mins:
                            description: The number of minutes during which Greylisting accepts a re-sent email from an unknown triplet.
                            example: 240
                            maximum: 1440
                            minimum: 1
                            type: integer
                          purge_interval_mins:
                            description: The number of minutes before Greylisting deletes the records in the Greylisting database.
                            example: 60
                            minimum: 1
                            type: integer
                          record_exp_time_mins:
                            description: The number of minutes before Greylisting deletes the triplet record and treats a re-sent email as a new, unknown triplet.
                            example: 4320
                            maximum: 43200
                            minimum: 1
                            type: integer
                          spf_bypass:
                            description: 'Whether emails with SPF bypass Greylisting.


                              * `1` — Bypass.

                              * `0` — Do **not** bypass.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type: integer
                        type: object
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: save_cpgreylist_config
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
