openapi: 3.2.0
info:
  title: Cpanel Resellers API
  version: 11.137.9999.106
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
  description: 'Operations tagged Resellers across 2 of this provider''s published API definitions: cpanel-uapi-openapi.yml, cpanel-whm-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: A server running cPanel.
  url: https://{host}:{port}/execute
  variables:
    host:
      default: cpanel-server.tld
      description: The hostname of a server running cPanel.
    port:
      default: '2083'
      description: The cPanel port.
- description: A server running WHM.
  url: https://{host}:{port}/json-api
  variables:
    host:
      default: whm-server.tld
      description: The hostname of a server running WHM.
    port:
      default: '2087'
      description: The WHM port.
security:
- BasicAuth: []
tags:
- description: The Resellers module for UAPI.
  name: Resellers
paths:
  /Resellers/list_accounts:
    get:
      x-readonly: true
      description: This function lists all of a reseller's cPanel accounts.
      operationId: Resellers-list_accounts
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: list_accounts
                    type: string
                  module:
                    description: The name of the module called.
                    example: Resellers
                    type: string
                  result:
                    properties:
                      data:
                        description: An array of objects containing the reseller's cPanel accounts.
                        items:
                          properties:
                            domain:
                              description: The cPanel account's domain.
                              example: example.com
                              format: domain
                              type: string
                            select:
                              description: 'Whether the cPanel account''s user is currently logged in.


                                * `1` — Logged in.

                                * An empty string — **Not** logged in.'
                              enum:
                              - '1'
                              - ''
                              example: '1'
                              type: string
                            user:
                              description: The cPanel account's username.
                              example: username
                              format: username
                              type: string
                          type: object
                        type: array
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties:
                          transformed:
                            description: Post-processing may have transformed the data.
                            enum:
                            - 1
                            example: 1
                            type: integer
                      status:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `errors` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Return reseller's cPanel accounts
      tags:
      - Resellers
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  Resellers \\\n  list_accounts\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/Resellers/list_accounts
      - label: LiveAPI Perl
        lang: Perl
        source: "#--------------------------------------------------------------------------------------\n# Instructions:\n#--------------------------------------------------------------------------------------\n# <theme-name> is the theme assigned to cPanel account.\n# 1) cd /usr/local/cpanel/base/frontend/<theme_name>\n# 2) mkdir api_examples\n# 3) cd api_examples\n# 4) create a file Resellers_list_accounts.live.pl and put this code into that file.\n# 5) In your browser login to a cPanel account.\n# 6) Manually change the url from: .../frontend/<theme_name>/\n#    to .../frontend/<theme_name>/api_examples/Resellers_list_accounts.live.pl\n#--------------------------------------------------------------------------------------\n\nuse strict;\n\nuse Cpanel::LiveAPI ();\n\nmy $cpanel = Cpanel::LiveAPI->new(); # Connect to cPanel - only do this once.\n\n# Print the header\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\n\n# Call the API\nmy $response = $cpanel->uapi(\n    q/Resellers/,\n    q/list_accounts/\n);\n\n# Handle the response\nif ($response->{cpanelresult}{result}{status}) {\n    my $data = $response->{cpanelresult}{result}{data};\n    foreach my $item (@{$data}) {\n        # Do something with the $item\n    }\n\n    # So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    # Report errors:\n    print to_json($response->{cpanelresult}{result}{errors});\n}\n\n# Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n#--------------------------------------------------------------------------------------\n# Helper function to convert a perl object to html printable json\n#--------------------------------------------------------------------------------------\nsub to_json {\n    require JSON;\n    my $str = JSON->new->pretty->encode($_[0]);\n    return $str;\n}\n"
      - label: LiveAPI PHP
        lang: PHP
        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account.\n// 1) cd /usr/local/cpanel/base/frontend/<theme_name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file Resellers_list_accounts.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme_name>/\n//    to .../frontend/<theme_name>/api_examples/Resellers_list_accounts.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'Resellers',\n    'list_accounts'\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    foreach ($data as $item) {\n        // Do something with the $item\n    }\n\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}"
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: cPanel 11
    servers:
    - description: A server running cPanel.
      url: https://{host}:{port}/execute
      variables:
        host:
          default: cpanel-server.tld
          description: The hostname of a server running cPanel.
        port:
          default: '2083'
          description: The cPanel port.
  /acctcounts:
    get:
      description: This function lists a reseller's total accounts, suspended accounts, and account creation limit.
      operationId: Resellers-acctcounts
      parameters:
      - description: A reseller's username, to query that reseller. If you do not specify a value, the function lists information for the authenticated account.
        in: query
        name: user
        required: false
        schema:
          example: username
          format: username
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      reseller:
                        description: An object that contains information for an account.
                        properties:
                          active:
                            description: The number of active accounts that the reseller account owns.
                            example: 9
                            minimum: 1
                            type: integer
                          limit:
                            description: 'The maximum number of accounts that the reseller account may create, if a maximum exists.


                              **NOTE:**


                              A null value indicates that the reseller does not have an account creation limit.'
                            example: 25
                            minimum: 1
                            type:
                            - integer
                            - 'null'
                          suspended:
                            description: The number of suspended accounts that the reseller account owns.
                            example: 5
                            minimum: 1
                            type:
                            - integer
                            - 'null'
                          user:
                            description: The reseller account's username or the `root` user.
                            example: root
                            type: string
                        type: object
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: acctcounts
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return reseller's owned accounts' information
      tags:
      - Resellers
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  acctcounts\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/acctcounts?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11'
    servers:
    - description: A server running WHM.
      url: https://{host}:{port}/json-api
      variables:
        host:
          default: whm-server.tld
          description: The hostname of a server running WHM.
        port:
          default: '2087'
          description: The WHM port.
  /get_public_contact:
    get:
      description: This function retrieves an account's public contact information.
      operationId: PublicContact-get_public_contact
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      name:
                        description: The public contact name of the reseller.
                        example: Bob's Hosting
                        type: string
                      url:
                        description: The public contact URL.
                        example: https://bobshosting.net
                        format: url
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: get_public_contact
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return current user's public contact information
      tags:
      - Resellers
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  get_public_contact\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/get_public_contact?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '68'
    servers:
    - description: A server running WHM.
      url: https://{host}:{port}/json-api
      variables:
        host:
          default: whm-server.tld
          description: The hostname of a server running WHM.
        port:
          default: '2087'
          description: The WHM port.
  /getresellerips:
    get:
      description: This function lists a reseller's available IP addresses.
      operationId: Resellers-getresellerips
      parameters:
      - description: 'A reseller''s username, to query only that reseller.


          **Note:**


          If you do **not** specify a value, the function lists available IP addresses for the `root`

          user.'
        in: query
        name: user
        required: false
        schema:
          example: username
          format: username
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      all:
                        description: 'Whether all of the reseller''s IP addresses are available.

                          * `1` — All of the reseller''s IP addresses are available.

                          * `0` — Some or all IP addresses are unavailable.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      ip:
                        description: The reseller's available IP addresses.
                        items:
                          example: 192.168.0.20
                          format: ipv4
                          type: string
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: getresellerips
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return reseller's available IP addresses
      tags:
      - Resellers
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  getresellerips\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/getresellerips?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11'
    servers:
    - description: A server running WHM.
      url: https://{host}:{port}/json-api
      variables:
        host:
          default: whm-server.tld
          description: The hostname of a server running WHM.
        port:
          default: '2087'
          description: The WHM port.
  /list_enhancement_limits:
    get:
      description: This function returns a reseller's account enhancement limits.
      operationId: AccountEnhancements-list_enhancement_limits
      parameters:
      - description: The reseller's username.
        in: query
        name: account
        required: true
        schema:
          example: username
          format: username
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      limits:
                        additionalProperties:
                          description: The reseller's limit for the account enhancement.
                          properties:
                            limit:
                              description: The assignment limit amount.
                              example: 15
                              type: integer
                            limited:
                              description: Whether the assignment limit is unlimited.
                              enum:
                              - 1
                              - 0
                              example: 1
                              type: integer
                            usage:
                              description: The total of cPanel accounts that have the specified Account Enhancement.
                              example: 15
                              type: integer
                          type: object
                          x-additionalPropertiesName: enhancement_id
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: list_enhancement_limits
                        type: string
                      reason:
                        description: 'The reason the API function failed when the `metadata.result`

                          field is `0`. This field may display a success message when

                          a function succeeds.'
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return account enhancement limits
      tags:
      - Resellers
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  list_enhancement_limits \\\n  account='username'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/list_enhancement_limits?api.version=1&account=username
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.98'
    servers:
    - description: A server running WHM.
      url: https://{host}:{port}/json-api
      variables:
        host:
          default: whm-server.tld
          description: The hostname of a server running WHM.
        port:
          default: '2087'
          description: The WHM port.
  /listacls:
    get:
      description: 'This function lists the server''s

        Access Control Lists (ACLs)

        and each list''s privileges.'
      operationId: ACLS-listacls
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      acl:
                        description: An array of objects containing ACL settings.
                        items:
                          properties:
                            name:
                              description: The ACL's name.
                              example: acl1
                              type: string
                            privileges:
                              description: 'A list of ACL privileges, including any third-party ACL privileges

                                that exist for the user.'
                              properties:
                                acct-summary:
                                  description: 'Whether to allow the reseller to view an account summary.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                add-pkg:
                                  description: 'Whether to allow the reseller to add and remove hosting plans

                                    (packages).


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                add-pkg-ip:
                                  description: 'Whether to allow the reseller to create packages with a

                                    dedicated IP address.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                add-pkg-shell:
                                  description: 'Whether to allow the reseller to create packages with shell

                                    access.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                all:
                                  description: 'Whether to grant the reseller **all** ACL privileges.


                                    **Warning:**


                                    A value of `1` grants `root`-level privileges to the reseller.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                allow-addoncreate:
                                  description: 'Whether to allow the reseller to create packages with addon

                                    domains.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                allow-emaillimits-pkgs:
                                  description: 'Whether to allow the reseller to create packages with email quotas

                                    that are **not** the default quotas.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                allow-parkedcreate:
                                  description: 'Whether to allow the reseller to create packages with parked

                                    domains (aliases).


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                allow-shell:
                                  description: 'Whether to allow the reseller to create accounts with shell

                                    access.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                allow-unlimited-bw-pkgs:
                                  description: 'Whether to allow the reseller to create packages with unlimited

                                    bandwidth.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                allow-unlimited-disk-pkgs:
                                  description: 'Whether to allow the reseller to create packages with unlimited

                                    disk space.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                allow-unlimited-pkgs:
                                  description: 'Whether to allow the reseller to create packages with unlimited

                                    features.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                basic-system-info:
                                  description: 'Whether to allow the user to retrieve basic system information.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                basic-whm-functions:
                                  description: 'Whether to allow the reseller to access basic cPanel & WHM

                                    options.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                clustering:
                                  description: 'Whether to allow the reseller to use DNS clusters.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                cors-proxy-get:
                                  description: 'Whether to allow the reseller to perform Cross-Origin Resource

                                    Sharing (CORS) HTTP requests.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                cpanel-api:
                                  description: 'Whether to allow the reseller to execute cPanel API 1, cPanel

                                    API 2 and UAPI functions via WHM.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                cpanel-integration:
                                  description: 'Whether to allow the reseller to manage cPanel integration

                                    links.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                create-acct:
                                  description: 'Whether to allow the reseller to create accounts.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                create-dns:
                                  description: 'Whether to allow the reseller to add DNS zones.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                create-user-session:
                                  description: 'Whether to allow the reseller to create a new temporary user

                                    session for a specified service.


                                    * `1` — Allow.

                                    * `0` — Do not allow.


                                    **Note:**


                                    This ACL privilege allows an API token user to bypass any

                                    restrictions that you set on the API token. For more information,

                                    read our

                                    [Manage API Tokens](https://go.cpanel.net/ManageAPITokens)

                                    documentation.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                demo-setup:
                                  description: 'Whether to allow the reseller to enable demo mode for accounts.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                digest-auth:
                                  description: 'Whether to allow the reseller to manage Digest Authentication.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                edit-account:
                                  description: 'Whether to allow the reseller to edit accounts.


                                    * `1` — Allow.

                                    * `0` — Do not allow.'
                                  enum:
                                  - 1
                                  - 0
                                  example: 1
                                  type: integer
                                edit-dns:
                                  description: 'Whether to allow the reseller to edit DNS zones.


