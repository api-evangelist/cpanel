        host:
          default: whm-server.tld
          description: The hostname of a server running WHM.
        port:
          default: '2087'
          description: The WHM port.
  /setresellerlimits:
    get:
      description: This function sets a reseller's bandwidth and disk quotas.
      operationId: Resellers-setresellerlimits
      parameters:
      - description: The reseller's username.
        in: query
        name: user
        required: true
        schema:
          example: username
          format: username
          type: string
      - description: 'The reseller''s maximum total number of accounts.


          **Important:**


          The system **only** enforces this maximum if you set the `enable_account_limit`

          value to `1`.'
        in: query
        name: account_limit
        required: false
        schema:
          example: 10
          minimum: 1
          type: integer
      - description: 'The reseller''s total bandwidth limit.


          **Important:**


          The system **only** enforces this limit if you set the `enable_resource_limits`

          value to `1`.'
        in: query
        name: bandwidth_limit
        required: false
        schema:
          example: 1073741824
          format: megabytes
          minimum: 0
          type: integer
      - description: 'The reseller''s total disk space usage limit.


          **Important:**


          The system **only** enforces this limit if you set the `enable_resource_limits`

          value to `1`.'
        in: query
        name: diskspace_limit
        required: false
        schema:
          example: 1073741824
          format: megabytes
          minimum: 0
          type: integer
      - description: 'Whether to limit the reseller''s total number of accounts.


          * `1` — Limit.

          * `0` — Do **not** limit.


          **Note:**


          Use this parameter with the `account_limit` parameter.'
        in: query
        name: enable_account_limit
        required: false
        schema:
          default: 0
          enum:
          - 1
          - 0
          example: 0
          type: integer
      - description: 'Whether the reseller can oversell accounts.


          * `1` — The reseller can oversell accounts.

          * `0` — The reseller **cannot** oversell accounts.


          **Important:**


          The system **only** enforces this limit if you set the `enable_resource_limits`

          value to `1`.'
        in: query
        name: enable_overselling
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 1
          type: integer
      - description: 'Whether the reseller can oversell bandwidth.


          * `1` — The reseller can oversell bandwidth.

          * `0` — The reseller **cannot** oversell bandwidth.


          **Important:**


          The system **only** enforces this limit if you set the `enable_resource_limits` and

          the `enable_overselling` values to `1`.'
        in: query
        name: enable_overselling_bandwidth
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 1
          type: integer
      - description: 'Whether the reseller can oversell disk space.


          * `1` — The reseller can oversell disk space.

          * `0` — The reseller **cannot** oversell disk space.


          **Important:**


          The system **only** enforces this limit if you set the `enable_resource_limits`

          and the `enable_oversellng` values to `1`.'
        in: query
        name: enable_overselling_diskspace
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 1
          type: integer
      - description: 'Whether to apply package limit numbers to the reseller.


          * `1` — Enable package limit numbers.

          * `0` — Disable package limit numbers.'
        in: query
        name: enable_package_limit_numbers
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 0
          type: integer
      - description: 'Whether to apply package limits to the reseller.


          * `1` — Enable package limits.

          * `0` — Disable package limits.'
        in: query
        name: enable_package_limits
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 0
          type: integer
      - description: 'Whether to limit the reseller''s resources.


          * `1` — Limit resources.

          * `0` — Do **not** limit resources.


          **Note:**


          Use this parameter with the `bandwidthlimit`, `diskspace_limit`,

          `enable_overselling`, `enable_overselling_bandwidth`, `enable_overselling_diskspace`,

          `enable_overselling`, `enable_package_limits`, and `enable_package_limit_numbers`

          parameters.'
        in: query
        name: enable_resource_limits
        required: false
        schema:
          default: 0
          enum:
          - 1
          - 0
          example: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: setresellerlimits
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Update reseller's bandwidth and disk quotas
      tags:
      - Resellers
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  setresellerlimits \\\n  user='username'\n"
