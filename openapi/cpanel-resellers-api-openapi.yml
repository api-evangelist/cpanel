  /set_enhancement_limit:
    get:
      description: This function sets account enhancement limits for a reseller account.
      operationId: AccountEnhancements-set_enhancement_limit
      parameters:
      - description: The reseller's username.
        in: query
        name: account
        required: true
        schema:
          example: username
          format: username
          type: string
      - description: 'The account enhancement''s identifier.


          **Note:**

          * You must use an [account enhancement](https://go.cpanel.net/account-enhancements) ID that a 3rd-party plugin defines.

          * To return a list of valid account enhancement IDs, run the WHM API 1 `list_account_enhancements` function.'
        in: query
        name: id
        required: true
        schema:
          example: sample-enhancement-id
          type: string
      - description: 'Whether the Account Enhancement assignment limit is unlimited.

          * `0` - The assignment is unlimited.

          * `1` - The assignment is limited.'
        in: query
        name: limited
        required: true
        schema:
          enum:
          - 1
          - 0
          example: 1
          type: integer
      - description: 'The account enhancement limit amount. This parameter is only

          required if the `limited` parameter is `1`.'
        in: query
        name: limit
        schema:
          example: 15
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: set_enhancement_limit
                        type: string
                      reason:
                        description: 'The reason the API function failed when the `metadata.result`

                          field is `0`. This field may display a success message when

                          a function succeeds.'
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Update account enhancement limit
      tags:
      - Resellers
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  set_enhancement_limit \\\n  account='username' \\\n  id='sample-enhancement-id' \\\n  limited='1' \\\n  limit='15'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/set_enhancement_limit?api.version=1&account=username&id=sample-enhancement-id&limited=1&limit=15
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.98'
    servers:
    - description: A server running WHM.
      url: https://{host}:{port}/json-api
      variables:
        host:
          default: whm-server.tld
          description: The hostname of a server running WHM.
        port:
          default: '2087'
          description: The WHM port.
