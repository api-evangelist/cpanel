  /setresellerips:
    get:
      description: 'This function adds IP addresses to a reseller''s account.


        **Note:**


        To assign a main IP address to a reseller''s account, call the WHM API 1 `setresellermainip` function.


        For more information, read our Manage Reseller''s IP Delegation documentation.'
      operationId: Resellers-setresellerips
      parameters:
      - description: The reseller's username.
        in: query
        name: user
        required: true
        schema:
          example: username
          format: username
          type: string
      - description: 'Whether to allocate the reseller a dedicated IP address.


          * `1` — Restrict the reseller''s account to its dedicated IP address.

          * `0` — Allow the user to dedicate any available IP address to an owned account.'
        in: query
        name: delegate
        required: false
        schema:
          default: 0
          enum:
          - 1
          example: 1
          type: integer
      - description: 'The IP addresses to allocate to the reseller''s account.


          **Note:**


          * If you do **not** use this parameter, the function clears the reseller''s IP address list.

          * Use a comma-separated list to allocate multiple IP addresses.'
        in: query
        name: ips
        required: false
        schema:
          example: 192.168.0.20
          format: ipv4
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      all:
                        description: 'Whether the function allocated all available IP addresses to the reseller. This return **only** appears if you set the `delegate` parameter to `0`.


                          **Note:**


                          `1` is the only possible value.'
                        enum:
                        - 1
                        example: 1
                        type: integer
                      ip:
                        description: An array of the reseller's allocated IP addresses.
                        items:
                          example: 192.168.0.20
                          format: ipv4
                          type: string
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: setresellerips
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Add IP addresses to reseller
      tags:
      - Resellers
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  setresellerips \\\n  user='username'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/setresellerips?api.version=1&user=username
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11'
