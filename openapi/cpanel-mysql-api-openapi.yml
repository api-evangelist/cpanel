  /Mysql/setup_db_and_user:
    get:
      x-readonly: false
      x-rollback: none
      description: 'This function creates a randomly named MySQL® database and user. This allows a 3rdparty tool to create its own DB without needing any knowledge of cPanel internals such as quotas or other limits. These will simply be passed back as an error.


