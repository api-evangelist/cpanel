      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  Mysql \\\n  rename_database \\\n  oldname='mydb' \\\n  newname='newlyrenamed'\n"
      - label: URL
