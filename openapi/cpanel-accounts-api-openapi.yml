      summary: Update multiple cPanel accounts
      tags:
      - Accounts
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  massmodifyacct \\\n  user='username'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/massmodifyacct?api.version=1&username=username
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '88'
  /modifyacct:
    get:
      description: 'This function modifies a cPanel account.


        **Warning:**


        We **strongly** recommend that you **do not** modify a single cPanel account''s settings if that cPanel account uses a hosting plan (package). If the package values change, **the system will overwrite any of your custom values with the package''s new values**.


        **Note:**


        On servers that run CentOS 7, you may see a `named` warning about the absence of SPF resource records on DNS.

        * This warning is **not** relevant on CentOS 7 servers, because RFC 7208 deprecated SPF records. CentOS 7 servers use TXT records instead of SPF records.

        * Red Hat 7.1 and CentOS 7.1 both contain `bind-9.9.4-23.el7`, which is an updated version of BIND that complies with RFC 7208. To resolve this issue, update your operating system to a version that contains the updated version of BIND. For more information, read the Red Hat Bugzilla case about SPF record errors.'
      operationId: Accounts-modifyacct
      parameters:
      - description: The cPanel account's current username.
        in: query
        name: user
        required: true
        schema:
          example: example
          format: username
          type: string
      - description: "A list of names for [Account Enhancements](https://go.cpanel.net/account-enhancements) to assign to the cPanel account.\n To view your server's Account Enhancements, run WHM API 1's `list_account_enhancements` function.\n\n**Warning:**\n\nYou must provide a complete list of Account Enhancements for the cPanel account. The parameter will add or remove Account Enhancements\nbased on the names that you provide."
        examples:
          multiple:
            summary: Assign multiple enhancements
            value:
            - My Custom Enhancement
            - Sample Enhancement
          single:
            summary: Assign one enhancement
            value: My Custom Enhancement
        in: query
        name: account_enhancements
        schema:
          type: string
      - description: 'Whether backups are enabled for the cPanel account.


          * `1` — Enable backups.

          * `0` — Disable backups.


          This parameter defaults to the defined system value.


          **Note:**


          You **must** have `root`-level privileges to set this parameter.'
        in: query
        name: BACKUP
        required: false
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'The cPanel account''s maximum bandwidth use, in bytes.


          * `0` or `unlimited` — The cPanel account can use unlimited bandwidth.


          This parameter defaults to the defined system value.'
        in: query
        name: BWLIMIT
        required: false
        schema:
          example: unlimited
          oneOf:
          - enum:
            - unlimited
            type: string
          - minimum: 0
            type: integer
      - description: 'The cPanel account''s contact email address.


          This parameter defaults to the defined system value.'
        in: query
        name: contactemail
        required: false
        schema:
          example: username@example.com
          format: email
          type: string
      - description: 'The owner of the cPanel account''s MySQL databases.


          This parameter defaults to the defined system value.'
        in: query
        name: DBOWNER
        required: false
        schema:
          example: example
          type: string
      - description: 'The number of disk blocks for the cPanel account, in kilobytes (KB).


          This parameter defaults to the defined system value.'
        in: query
        name: DISK_BLOCK_LIMIT
        required: false
        schema:
          example: 100000000
          type: integer
      - description: 'The cPanel account''s main domain.


          This parameter is an alias of `domain`. If you set both

          the `DNS` and `domain` parameters, the `DNS` parameter will

          override the `domain` parameter.


          This parameter defaults to the defined system value.'
        in: query
        name: DNS
        required: false
        schema:
          example: example.com
          format: domain
          type: string
      - description: 'The cPanel account''s main domain.


          This parameter is an alias of `DNS`. If you set both

          the `DNS` and `domain` parameters, the `DNS` parameter will

          override the `domain` parameter.


          This parameter defaults to the defined system value.'
        in: query
        name: domain
        required: false
        schema:
          example: example.com
          format: domain
          type: string
      - description: 'Whether CGI access is enabled for the cPanel account.


          * `1` — Enable CGI access.

          * `0` — Disable CGI access.


          This parameter defaults to the defined system value.


          **Note:**


          When a [server profile](https://go.cpanel.net/howtouseserverprofiles) disables the Web Server role, you **cannot** enable CGI access.'
        in: query
        name: HASCGI
        required: false
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether DKIM is enabled for the cPanel account.


          * `1` — Enable DKIM.

          * `0` — Disable DKIM.


          This parameter defaults to the defined system value.'
        in: query
        name: HASDKIM
        required: false
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether DMARC is enabled for the cPanel account.


          * `1` — Enable DMARC.

          * `0` — Disable DMARC.


          This parameter defaults to the defined system value.'
        in: query
        name: HASDMARC
        required: false
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether shell (SSH) access is enabled for the cPanel account.


          * `1` — Enable shell access.

          * `0` — Disable shell access.


          This parameter defaults to the defined system value.


          **Note:**


          We **strongly** recommend that you use the `shell` parameter to specify a shell for SSH access.'
        in: query
        name: HASSHELL
        required: false
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether SPF is enabled for the cPanel account.


          * `1` — Enable SPF.

          * `0` — Disable SPF.


          This parameter defaults to the defined system value.'
        in: query
        name: HASSPF
        required: false
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'The cPanel account''s display language.


          This parameter defaults to the defined system value.'
        in: query
        name: LANG
        required: false
        schema:
          example: english-utf8
          type: string
      - description: 'The cPanel account''s default locale, in two-letter [ISO-3166 code](https://www.iso.org/iso-3166-country-codes.html) format.


          This parameter defaults to the defined system value.'
        in: query
        name: LOCALE
        required: false
        schema:
          example: en
          format: ISO-3166-1 (alpha-2)
          type: string
      - description: "The server that will manage the cPanel account's mail.\n\n* `.local` — Make the local server manage the cPanel account’s mail. If the account currently uses a [child node](https://go.cpanel.net/cPanelGlossary#child-node) for its mail, this will transfer the account’s mail to the local server.\n* The alias (friendly name) of a child node that should manage the cPanel account’s mail.\n\n  When you distribute an account’s mail, the function adds a `LINK` entry to the\n  [`/var/cpanel/accounting.log`](https://go.cpanel.net/ThecPanelLogFiles) file.\n\nThis parameter defaults to the account’s current mail node, or `.local` if the account’s mail is on the local server."
        in: query
        name: mail_node_alias
        required: false
        schema:
          example: mailnode
          oneOf:
          - description: A mail node alias.
            example: mailnode
            type: string
          - description: Transfer a user’s mail from an existing mail node to the local server.
            enum:
            - .local
            type: string
      - description: 'The storage format that the cPanel account''s mailboxes use.


          * `maildir`

          * `mbox`


