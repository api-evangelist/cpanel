  /set_digest_auth:
    get:
      description: 'This function enables or disables Digest Authentication for an account. Windows Vista®,

        Windows® 7, and Windows® 8 requires that you enable Digest Authentication support in order

        to access your Web Disk over a clear text,

        unencrypted connection.


        **Note:**


        If the server has an SSL certificate that a recognized certificate authority signed and you

        can make an SSL connection over port `2078`, you do **not** need to enable Digest Authentication.'
      operationId: Sys-set_digest_auth
      parameters:
      - description: 'Whether to enable Digest Authentication for the account.


          * `1` — Enable.

          * `0` — Disable.'
        in: query
        name: enabledigest
        required: true
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: The account's password.
        in: query
        name: password
        required: true
        schema:
          example: 123456luggage
          type: string
      - description: The account's username.
        in: query
        name: user
        required: true
        schema:
          example: username
          type: string
      - description: 'Whether to enable Digest Authentication for the account. This is an alias for the `enabledigest` parameter.


          * `1` — Enable.

          * `0` — Disable.'
        in: query
        name: digestauth
        required: false
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: set_digest_auth
                        type: string
                      reason:
                        description: 'The reason the API function failed when the `metadata.result`

                          field is `0`. This field may display a success message when

                          a function succeeds.'
                        example: Digest Authentication enabled.
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Enable or disable Digest Authentication
      tags:
      - Accounts
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  set_digest_auth \\\n  user='username' \\\n  password='123456luggage' \\\n  enabledigest='1'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/set_digest_auth?api.version=1&user=username&password=123456luggage&enabledigest=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11'
  /untrack_acct_id:
    get:
      description: 'This function removes a user identification number (UID) or group

        identification number (GID) from the tracked ID list.'
      operationId: Accounts-untrack_acct_id
      parameters:
      - description: 'Whether to prevent removal of user or group IDs currently in use.


          * `1` — Prevent removal.

          * `0` — Do **not** prevent removal.'
        in: query
        name: check_exists
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to prevent removal of the user ID if the quota system tracks associated files.


          * `1` — Prevent removal.

          * `0` — Do **not** prevent removal.


          **Note:**


          * This parameter **only** applies to user IDs and **not** group IDs.

          * You cannot check filesystems if the quota system does **not** track them.'
        in: query
        name: check_quota
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: "The group ID to remove from the track list.\n\n**Note:**\n\n You **must** include the `uid` parameter, the `gid` parameter, or both."
        in: query
        name: gid
        required: false
        schema:
          example: 1012
          type: integer
      - description: 'Whether to prevent removal of system user or group IDs.


          * `1` — Prevent removal.

          * `0` — Do **not** prevent removal.'
        in: query
        name: protect_system
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: "The user ID to remove from the track list.\n\n**Note:**\n\n You **must** include the `uid` parameter, the `gid` parameter, or both."
        in: query
        name: uid
        required: false
        schema:
          example: 1012
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: untrack_acct_id
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Remove UID or GID from tracked list
      tags:
      - Accounts
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  untrack_acct_id \\\n  uid='1012'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/untrack_acct_id?api.version=1&uid=1012
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '58'
