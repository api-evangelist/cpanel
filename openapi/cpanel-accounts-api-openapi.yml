  /massmodifyacct:
    get:
      description: 'This function modifies multiple cPanel accounts.


        **Warning:**


        * We **strongly** recommend that you do not modify a cPanel account''s settings

        if that account uses a hosting plan (package). If the package values change, the

        system will overwrite any of your custom values with the package''s new values.

        * This function uses case-sensitive parameters. You **must** enter parameters in

        the correct case format. If you do not, the function will ignore that parameter.


        **Note:**


        On servers that run CentOS 7, you may see a `named` warning about the absence of

        SPF resource records on DNS.

        * This warning is **not** relevant on CentOS 7 servers, because

        RFC 7208 deprecated SPF records. CentOS 7

        servers use TXT records instead of SPF records.

        * Red Hat 7.1 and CentOS 7.1 both contain `bind-9.9.4-23.el7`, which is an updated

        version of BIND that complies with RFC 7208. To resolve this issue, update your

        operating system to a version that contains the updated version of BIND. For more

        information, read the Red Hat Bugzilla case about SPF record errors.'
      operationId: Accounts-massmodifyacct
      parameters:
      - description: 'The account''s current username.


          **Note:**


          To modify multiple users, duplicate or increment the parameter name. For example,

          the `user-1`, `user-2`, and `user-3` parameters.'
        examples:
          multiple:
            summary: Modify multiple users.
            value: user-0=username user-1=username1 user-2=username2 user-3=username3
          multiple-alternative:
            summary: Modify multiple users.
            value: user=username user=username1 user=username2 user=username3
          single:
            summary: Modify a single user.
            value: username
        in: query
        name: user
        required: true
        schema:
          format: username
          type: string
      - description: 'Whether backups are enabled for the account.


          * `1` — Enabled.

          * `0` — Disabled.


          This parameter defaults to the defined system value.


          **Note:**


          This parameter **requires** `root` privileges.'
        example: 1
        in: query
        name: BACKUP
        required: false
        schema:
          enum:
          - 1
          - 0
      - description: 'The account''s maximum bandwidth use, in bytes.


          * `0`, `null` or `unlimited` — The account can use unlimited bandwidth.


          This parameter defaults to the defined system value.'
        in: query
        name: BWLIMIT
        required: false
        schema:
          $ref: '#/components/schemas/IntPosNullOrUnlimited'
      - description: 'The account''s contact email address.


          This parameter defaults to the defined system value.'
        in: query
        name: CONTACTEMAIL
        required: false
        schema:
          example: username@example.com
          format: email
          type: string
      - description: 'The owner of the account''s MySQL® databases.


          This parameter defaults to the defined system value.'
        in: query
        name: DBOWNER
        required: false
        schema:
          example: example
          format: username
          type: string
      - description: 'The number of disk blocks for the account, in kilobytes (KB).


          This parameter defaults to the defined system value.'
        in: query
        name: DISK_BLOCK_LIMIT
        required: false
        schema:
          example: 100000000
          minimum: 1
          type: integer
      - description: 'Whether CGI access is enabled for the account.


          * `1` — Enabled.

          * `0` — Disabled.


          This parameter defaults to the defined system value.


          **Note:**


          When a [server profile](https://go.cpanel.net/whmdocsServerProfile) disables the

          [Web Server](https://go.cpanel.net/serverroles#roles) role, you **cannot** enable

          CGI access.'
        in: query
        name: HASCGI
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 1
          type: integer
      - description: 'Whether DomainKeys Identified Mail (DKIM) is enabled for the account.


          * `1` — Enabled.

          * `0` — Disabled.


          This parameter defaults to the defined system value.'
        in: query
        name: HASDKIM
        required: false
        schema:
          enum:
          - 1
          - 0
          type: integer
      - description: 'Whether Domain-based Message Authentication, Reporting, and Conformance (DMARC) is enabled for the account.


          * `1` — Enabled.

          * `0` — Disabled.


          This parameter defaults to the defined system value.'
        in: query
        name: HASDMARC
        required: false
        schema:
          enum:
          - 1
          - 0
          type: integer
      - description: 'Whether shell (SSH) access is enabled for the account.


          * `1` — Enabled.

          * `0` — Disabled.


          This parameter defaults to the defined system value.


          **Note:**


          We **strongly** recommend that you use the `shell` parameter to specify a shell for

          SSH access.'
        in: query
        name: HASSHELL
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 1
          type: integer
      - description: 'Whether Sender Policy Framework (SPF) is enabled for the account.


          * `1` — Enabled.

          * `0` — Disabled.


          This parameter defaults to the defined system value.'
        in: query
        name: HASSPF
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 1
          type: integer
      - description: 'The account''s display language.


          This parameter defaults to the defined system value.'
        in: query
        name: LANG
        required: false
        schema:
          example: english-utf8
          type: string
      - description: 'The account''s default locale.


          This parameter defaults to the defined system value.'
        in: query
        name: LOCALE
        required: false
        schema:
          example: en
          format: ISO-3166-1 (alpha-2)
          type: string
      - description: 'The storage format that the account''s mailboxes use.


          * `maildir`

          * `mbox`


          This parameter defaults to the defined system value.'
        in: query
        name: MAILBOX_FORMAT
        required: false
        schema:
          enum:
          - maildir
          - mbox
      - description: 'The percentage of failed or deferred email messages that the account can send per hour

          before outgoing mail is rate-limited.


          * `0` or `unlimited` — The account can send an unlimited number of failed or deferred

          messages.


          This parameter defaults to the defined system value.'
        in: query
        name: MAX_DEFER_FAIL_PERCENTAGE
        required: false
        schema:
          $ref: '#/components/schemas/IntPosOrUnlimited'
      - description: 'The maximum number of emails that the account can send in one hour.


          * `0` or `unlimited` — The account can send an unlimited number of emails.


          This parameter defaults to the defined system value.'
        in: query
        name: MAX_EMAIL_PER_HOUR
        required: false
        schema:
          $ref: '#/components/schemas/IntPosOrUnlimited'
      - description: 'The maximum size, in megabytes (MB), that the account can define when it creates an

          email account.


          * `unlimited` — The account possesses an unlimited quota.


          **Important:**


          * This value applies to each email account, **not** each cPanel account.

          * If you specify a `MAX_EMAILACCT_QUOTA` value, the function will **overwrite** the

          plan''s defined value for that cPanel account.

          * This parameter does **not** affect any existing email accounts

          * We recommend that you allow the account''s plan to determine this value.

          * `MAX_EMAIL_PER_HOUR` will define to unlimited if you do **not** define either the plan

          or `MAX_EMAILACCT_QUOTA` parameters.


          This parameter defaults to the defined system value. It will default to `unlimited` if

          you do **not** define either the `plan` or `MAX_EMAILACCT_QUOTA` parameters.'
        in: query
        name: MAX_EMAILACCT_QUOTA
        required: false
        schema:
          example: unlimited
          oneOf:
          - enum:
            - unlimited
            type: string
          - maximum: 4294967296
            minimum: 1
            type: integer
      - description: 'The account''s maximum number of addon domains.


          * `0`, `null`, or `unlimited` — The account possesses unlimited addon domains.


          This parameter defaults to the defined system value.'
        in: query
        name: MAXADDON
        required: false
        schema:
          $ref: '#/components/schemas/Int0-999999NullOrUnlimited'
      - description: 'The account''s maximum number of FTP accounts.


          * `null` or `unlimited` — The account possesses unlimited FTP accounts.


          This parameter defaults to the defined system value.'
        in: query
        name: MAXFTP
        required: false
        schema:
          $ref: '#/components/schemas/Int0-999999NullOrUnlimited'
      - description: 'The account''s maximum number of mailing lists.


          * `0`, `null`, or `unlimited` — The account possesses unlimited mailing lists.


          This parameter defaults to the defined system value.'
        in: query
        name: MAXLST
        required: false
        schema:
          $ref: '#/components/schemas/Int0-999999NullOrUnlimited'
      - description: 'The account''s maximum number of parked domains (aliases).


          * `null` or `unlimited` — The account possesses unlimited mailing lists.


          This parameter defaults to the defined system value.'
        in: query
        name: MAXPARK
        required: false
        schema:
          $ref: '#/components/schemas/Int0-999999NullOrUnlimited'
      - description: 'The account''s maximum number of Ruby applications.


          * `null` or `unlimited` — The account possesses unlimited Ruby applications.


          This parameter defaults to the defined system value.'
        in: query
        name: MAXPASSENGERAPPS
        required: false
        schema:
          $ref: '#/components/schemas/Int0-999999NullOrUnlimited'
      - description: 'The maximum number of email accounts for the account.


          * `null` or `unlimited` — The account possesses unlimited email accounts.


          This parameter defaults to the defined system value.'
        in: query
        name: MAXPOP
        required: false
        schema:
          $ref: '#/components/schemas/Int0-999999NullOrUnlimited'
      - description: 'The maximum number of each available type of SQL database for the account.


          For example, if you set this value to `5` and the system administrator allows MySQL®

          and PostgreSQL® databases, users can create up to five MySQL databases and up to five

          PostgreSQL databases.


          * `null` or `unlimited` — The account possesses unlimited databases.


          This parameter defaults to the defined system value.'
        in: query
        name: MAXSQL
        required: false
        schema:
          $ref: '#/components/schemas/Int0Max999999NullOrUnlimited'
      - description: 'The maximum number of subdomains for the account.


          * `null` or `unlimited` — The account possesses unlimited subdomains.


          This parameter defaults to the defined system value.'
        in: query
        name: MAXSUB
        required: false
        schema:
          $ref: '#/components/schemas/Int0-999999NullOrUnlimited'
      - description: 'Whether to modify the firewall rules as part of the account modification.


          * `1` – Modify the firewall rules.

          * `0` – Do **not** modify the firewall rules.


          **NOTE:**


          If you do not set this parameter, the system will modify the firewall based on the *Do not make changes to the firewall during account modification.* setting in WHM''s [*Tweak Settings*](https://docs.cpanel.net/whm/server-configuration/tweak-settings/) interface (*WHM >> Home >> Server Configuration >> Tweak Settings*).'
        in: query
        name: modify_firewall
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'The priority of the account''s primary mail exchanger.


          **Note:**


          The parameter name consists of `MXCHECK`, a hyphen, and the primary domain of the

          account.


          Example key and value:

          * `MXCHECK-example.com=10`


          This parameter defaults to the define system value.'
        in: query
        name: MXCHECK-*
        required: false
        schema:
          example: 1
          minimum: 0
          type: integer
      - description: 'Whether to send a notification when someone links the account to an external

          authentication account.


          * `1` — Enabled.

          * `0` — Disabled.


          This parameter defaults to the defined system value.'
        in: query
        name: notify_account_authn_link
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 0
          type: integer
      - description: 'Whether to send a notification when someone disables notifications for external

          authentication account links.


          * `1` — Enabled.

          * `0` — Disabled.


          This parameter defaults to the defined system value.'
        in: query
        name: notify_account_authn_link_notification_disabled
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 0
          type: integer
      - description: 'Whether to send a notification when an AutoSSL certificate expires.


          * `1` — Enabled.

          * `0` — Disabled.


          This parameter defaults to the defined system value.'
        in: query
        name: notify_autossl_expiry
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 0
          type: integer
      - description: 'Whether to send a notification AutoSSL cannot renew a certificate because domains

          that fail Domain Control Validation (DCV) exist on the current certificate.


          * `1` — Enabled.

          * `0` — Disabled.


          This parameter defaults to the defined system value.'
        in: query
        name: notify_autossl_expiry_coverage
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 0
          type: integer
      - description: 'Whether to send a notification when AutoSSL renews a certificate.


          * `1` — Enabled.

          * `0` — Disabled.


          This parameter defaults to the defined system value.'
        in: query
        name: notify_autossl_renewal
        required: false
        schema:
          enum:
