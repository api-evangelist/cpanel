          - 1
          example: 0
          type: integer
      - description: 'Whether to send a notification when someone changes the contact

          address for the cPanel account.


          * `1` — Enabled.

          * `0` — Disabled.


          This parameter defaults to the defined system value.'
        in: query
        name: notify_contact_address_change
