openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: WHM API.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: WHM Accounts API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running WHM.
  url: https://{host}:{port}/json-api
  variables:
    host:
      default: whm-server.tld
      description: The hostname of a server running WHM.
    port:
      default: '2087'
      description: The WHM port.
security:
- BasicAuth: []
tags:
- description: The Accounts module for WHM API 1.
  name: Accounts
paths:
  /accountsummary:
    get:
      description: 'This function retrieves a summary of a user''s account.


        **Note:**


        You must use either the user or domain parameters.'
      operationId: Accounts-accountsummary
      parameters:
      - description: The account's main domain.
        in: query
        name: domain
        required: false
        schema:
          example: example.com
          type: string
      - description: The search term.
        in: query
        name: search
        required: false
        schema:
          example: example.com
          type: string
      - description: The search method to use.
        in: query
        name: searchmethod
        required: false
        schema:
          example: exact
          type: string
      - description: The type of search to perform.
        in: query
        name: searchtype
        required: false
        schema:
          example: domain
          type: string
      - description: The account's username.
        in: query
        name: user
        required: false
        schema:
          example: username
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      acct:
                        description: An array of objects of account data.
                        items:
                          properties:
                            backup:
                              description: 'Whether backups are enabled.

                                * `1` Enabled.

                                * `0` Disabled.'
                              enum:
                              - 0
                              - 1
                              example: 0
                              type: integer
                            child_nodes:
                              description: An array that contains the the workload and alias values for each of the child nodes.
                              items:
                                properties:
                                  alias:
                                    description: The alias of the child node
                                    type: string
                                    example: nodealias
                                  workload:
                                    description: The workload delegated to the child node
                                    enum:
                                    - Mail
                                    example: Mail
                                    type: string
                              type: array
                            disklimit:
                              description: 'The account''s disk space quota.

                                * `unlimited`

                                * A maximum amount of disk space, in mebibyte (MiB).'
                              example: unlimited
                              oneOf:
                              - enum:
                                - unlimited
                                type: string
                              - minimum: 0
                                type: integer
                            diskused:
                              description: The account's current disk space usage. An integer that represents an amount of disk space, in mebibyte (MiB). For example, 14M represents 14 MiB of disk space.
                              example: 14M
                              format: mebibyte-short
                              type: string
                            domain:
                              description: The account's main domain. A valid domain name on the account.
                              example: example.com
                              format: fqdn
                              type: string
                            email:
                              description: The account's contact email address. A valid email address.
                              example: username@example.com
                              format: email
                              type: string
                            inodeslimit:
                              description: 'The limit on the number of files that the account owns.

                                * `unlimited`

                                * A maximum amount of files as an integer.'
                              example: unlimited
                              oneOf:
                              - enum:
                                - unlimited
                                type: string
                              - minimum: 0
                                type: integer
                            inodesused:
                              description: The number of files that the account owns.
                              example: 1
                              minimum: 0
                              type: integer
                            ip:
                              description: The account's main domain's IP address.
                              example: 192.168.0.128
                              format: ipv4
                              type: string
                            ipv6:
                              description: The account's main domain's IPv6 addresses.
                              items:
                                example: 0101:ca75:0101:ca75:0101:ca75:0101:ca77
                                format: ipv6
                                type: string
                              type: array
                            is_locked:
                              description: 'Whether the account is currently locked.

                                * `1` Locked.

                                * `0` Not locked.'
                              enum:
                              - 0
                              - 1
                              example: 0
                              type: integer
                            legacy_backup:
                              description: 'Whether legacy backups are enabled.

                                * `1` Enabled.

                                * `0` Disabled.'
                              enum:
                              - 0
                              - 1
                              example: 0
                              type: integer
                            mailbox_format:
                              description: 'The storage format that the account''s email mailboxes use.

                                * `maildir` The account''s mail is stored in `maildir` format.

                                * `mbox` The account''s mail is stored in `mbox` format.'
                              enum:
                              - maildir
                              - mbox
                              example: maildir
                              format: mailbox_format
                              type: string
                            max_defer_fail_percentage:
                              description: 'The percentage of failed or deferred email messages that the account

                                can send per hour before outgoing mail is rate-limited.

                                * `unlimited`

                                * An integer that represents a percentage of messages.'
                              example: unlimited
                              oneOf:
                              - enum:
                                - unlimited
                                type: string
                              - minimum: 0
                                type: integer
                            max_email_per_hour:
                              description: 'The maximum number of emails that the account can send in one hour.

                                * `unlimited`

                                * An integer that represents a number of sent emails.'
                              example: unlimited
                              oneOf:
                              - enum:
                                - unlimited
                                type: string
                              - minimum: 0
                                type: integer
                            max_emailacct_quota:
                              description: 'The maximum size that the cPanel account can define when it creates an email account.

                                * `unlimited`

                                * A positive integer that represents the allowable maximum size of an email account, in mebibyte (MiB).'
                              example: unlimited
                              oneOf:
                              - enum:
                                - unlimited
                                type: string
                              - minimum: 0
                                type: integer
                            maxaddons:
                              description: 'The account''s maximum number of addon domains.

                                * `unlimited`

                                * `*unknown*`  The account cannot use any addon domains.

                                * An integer that represents a number of addon domains.'
                              example: unlimited
                              oneOf:
                              - enum:
                                - unlimited
                                type: string
                              - minimum: 0
                                type: integer
                            maxftp:
                              description: 'The account''s maximum number of FTP accounts.

                                * `unlimited`

                                * An integer that represents a number of FTP accounts.'
                              example: unlimited
                              oneOf:
                              - enum:
                                - unlimited
                                type: string
                              - minimum: 0
                                type: integer
                            maxlst:
                              description: 'The account''s maximum number of mailing lists.

                                * `unlimited`

                                * An integer that represents a number of mailing lists.'
                              example: unlimited
                              oneOf:
                              - enum:
                                - unlimited
                                type: string
                              - minimum: 0
                                type: integer
                            maxparked:
                              description: 'The account''s maximum number of parked domains (aliases).

                                * `unlimited`

                                * `*unknown*` The account cannot use any parked domains.

                                * An integer that represents a number of parked domains.'
                              example: unlimited
                              oneOf:
                              - enum:
                                - unlimited
                                type: string
                              - minimum: 0
                                type: integer
                            maxpop:
                              description: 'The account''s maximum number of email addresses.

                                * `unlimited`

                                * An integer that represents a number of email accounts.'
                              example: unlimited
                              oneOf:
                              - enum:
                                - unlimited
                                type: string
                              - minimum: 0
                                type: integer
                            maxsql:
                              description: 'The account''s maximum number of SQL databases.

                                * `unlimited`

                                * An integer that represents a number of SQL databases.'
                              example: unlimited
                              oneOf:
                              - enum:
                                - unlimited
                                type: string
                              - minimum: 0
                                type: integer
                            maxsub:
                              description: 'The account''s maximum number of subdomains.

                                * `unlimited`

                                * `*unknown*` The account cannot use any subdomains.

                                * An integer that represents a number of subdomains.'
                              example: unlimited
                              oneOf:
                              - enum:
                                - unlimited
                                type: string
                              - minimum: 0
                                type: integer
                            min_defer_fail_to_trigger_protection:
                              description: 'The minimum number of failed or deferred messages that the account can send before

                                outgoing mail is subject to rate-limiting.

                                * `unlimited`

                                * An integer that represents a number of failed or deferred messages.'
                              example: '5'
                              oneOf:
                              - enum:
                                - unlimited
                                type: string
                              - minimum: 0
                                type: integer
                            outgoing_mail_hold:
                              description: 'Whether to retain outgoing mail in the mail queue for the account''s users.

                                * `1` Suspend and force failure of outgoing email.

                                * `0` Unsuspend outgoing email.'
                              enum:
                              - 0
                              - 1
                              example: 0
                              type: integer
                            outgoing_mail_suspended:
                              description: 'Whether to suspend outgoing email from the account''s users and force failure of any of their mail currently in the mail queue.

                                * `1` - Suspend and force failure of outgoing email.

                                * `0` - Unsuspend outgoing email.


                                **Note:**


                                If mail for a cPanel user''s account is suspended, the system will reject their email before the system puts it in the mail server queue.'
                              enum:
                              - 0
                              - 1
                              example: 0
                              type: integer
                            owner:
                              description: 'The account''s owner.

                                * root

                                * A reseller account''s username.'
                              example: root
                              format: username
                              type: string
                            partition:
                              description: The partition that contains the account's home directory. The name of a partition on the server.
                              example: home
                              type: string
                            plan:
                              description: The account's hosting package. The name of a package on the server.
                              example: packagename
                              format: plan
                              type: string
                            shell:
                              description: The account's shell. A shell location on the server.
                              example: /bin/bash
                              format: shell
                              type: string
                            startdate:
                              description: 'The account creation date. The date in YY-Mon-DD HH-mm human-readable format, where:- YY represents the year.

                                * `Mon` represents the month.

                                * `DD` represents the date.

                                * `HH` represents the hour.

                                * `mm` represents the minute.'
                              example: 13 May 22 16:03
                              format: YY-Mon-DD-HH-MM
                              type: string
                            suspended:
                              description: 'Whether the account is currently suspended.

                                * `1`  Suspended.

                                * `0`  Not suspended.'
                              enum:
                              - 0
                              - 1
                              example: 0
                              type: integer
                            suspendreason:
                              description: 'The reason for account suspension, if one was provided.

                                * `null` The account is not currently suspended.

                                * A blank value, if the suspender did not provide a reason.

                                * A message that explains the suspension.'
                              example: not suspended
                              type:
                              - string
                              - 'null'
                            suspendtime:
                              description: 'The time of suspension.

                                * `null` The account is not currently suspended.

                                * The time at which the account became suspended.'
                              example: null
                              type:
                              - string
                              - 'null'
                            temporary:
                              description: 'Whether the Customer Support Ticket process created this user for temporary access to the system.

                                * `1` - Temporary user.

                                * `0` - Regular user.'
                              enum:
                              - 0
                              - 1
                              example: 0
                              type: integer
                            is_temporary_domain:
                              description: 'Whether the main domain is a temporary domain.

                                * `1` - The account''s main domain is a temporary domain.

                                * `0` - The account''s main domain is not a temporary domain.


                                **Note:**


                                For more information about temporary domains, read our [Temporary Domains](https://go.cpanel.net/cp-temporary-domain) documentation.'
                              enum:
                              - 0
                              - 1
                              example: 0
                              type: integer
                            theme:
                              description: 'The account''s cPanel interface theme.

                                * Any valid theme on the server.'
                              example: jupiter
                              format: theme
                              type: string
                            uid:
                              description: The account's user ID on the system.
                              type: integer
                            unix_startdate:
                              description: The account creation date. The account creation date and time, in Unix time format.
                              example: 1369256589
                              format: unix_timestamp
                              type: integer
                            user:
                              description: The account username. A cPanel account or reseller username on the server.
                              example: username
                              format: username
                              type: string
                          type: object
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: accountsummary
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` Success

                          * `0` Failed: Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return cPanel account summary
      tags:
      - Accounts
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  accountsummary \\\n  user='username'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/accountsummary?api.version=1&user=username
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.32'
  /get_upgrade_opportunities:
    get:
      description: 'This function lists accounts that could benefit from upgrading to a different package.

        The listed accounts may be nearing (or exceeding) resource usage thresholds.'
      operationId: Accounts-get_upgrade_opportunities
      parameters:
      - description: A fixed number of blocks to use as an alternative disk usage threshold.
        in: query
        name: disk_threshold_blocks
        required: false
        schema:
          default: 2097152
          example: 8388608
          minimum: 0
          type: integer
      - description: The fraction of 1 at which to consider usage "near".
        in: query
        name: nearness_fraction
        required: false
        schema:
          default: 0.8
          example: 0.6
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      upgrade_opportunities:
                        additionalProperties:
                          description: The property name is the cPanel account.
                          properties:
                            bw_limit:
                              description: Upgrade opportunities related to bandwidth limits.
                              properties:
                                last_month:
                                  allOf:
                                  - description: Bandwidth usage for last month.
                                    type: object
                                  - $ref: '#/components/schemas/nearReachedBaseSchema'
                                messages:
                                  description: An array of human-readable messages representing the facts listed in the other structured data in the `bw_limit` object.
                                  items:
                                    example: This account has used 54% of its bandwidth quota for this month.
                                    type: string
                                  type: array
                                this_month:
                                  allOf:
                                  - description: Bandwidth usage for this month.
                                    type: object
                                  - $ref: '#/components/schemas/nearReachedBaseSchema'
                              type: object
                            disk_usage:
                              description: Upgrade opportunities related to disk usage.
                              properties:
                                messages:
                                  description: An array of human-readable messages representing the facts listed in the other structured data in the `disk_usage` object.
                                  items:
                                    example: This account has used 94% of its disk quota.
                                    type: string
                                  type: array
                                relative_to_fixed_amount:
                                  allOf:
                                  - description: Relative to a preset fixed amount (customizable).
                                    type: object
                                  - $ref: '#/components/schemas/diskSchema'
                                relative_to_quota:
                                  allOf:
                                  - description: Relative to the account's quota, if applicable.
                                    type: object
                                  - $ref: '#/components/schemas/diskSchema'
                              type: object
                            messages:
                              description: An array of human-readable messages representing the facts listed in the other structured data.
                              example:
                              - This account has used 54% of its bandwidth quota for this month.
                              - This account has used 94% of its disk quota.
                              items:
                                type: string
                              type: array
                        description: The collection of accounts and information about their upgrade opportunities.
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: get_upgrade_opportunities
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Get upgrade opportunities
      tags:
      - Accounts
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  get_upgrade_opportunities\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/get_upgrade_opportunities?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11'
  /has_digest_auth:
    get:
      description: 'This function checks whether Digest Authentication is enabled for

        a cPanel user. Windows® Vista, Windows® 7, and Windows® 8 require Digest Authentication

        support in order to access Web Disk over an unencrypted connection.'
      operationId: Sys-has_digest_auth
      parameters:
      - description: The cPanel account username.
        in: query
        name: user
        required: true
        schema:
          example: username
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      digestauth:
                        description: 'Whether Digest Authentication support is enabled.

                          * `1` — Enabled.

                          * `0` — Disabled.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: has_digest_auth
                        type: string
                      reason:
                        description: 'The reason the API function failed when the `metadata.result`

                          field is `0`. This field may display a success message when

                          a function succeeds.'
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Validate cPanel account Digest Authentication
      tags:
      - Accounts
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  has_digest_auth \\\n  user='username'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/has_digest_auth?api.version=1&user=username
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.34'
  /has_mycnf_for_cpuser:
    get:
      description: 'This function checks whether a cPanel user''s home directory contains

        a valid .my.cnf file.'
      operationId: Sys-has_mycnf_for_cpuser
      parameters:
      - description: The cPanel account username.
        in: query
        name: user
        required: true
        schema:
          example: user
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      has_mycnf_for_cpuser:
                        description: 'Whether a valid .my.cnf file exists in the account''s home directory.

                          - `1` -  Exists.

                          - `0` -  Does not exist.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: has_mycnf_for_cpuser
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '- `1` - Success

                          - `0` - Failed: Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Validate MySQL Configuration file
      tags:
      - Accounts
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  has_mycnf_for_cpuser \\\n  user='user'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/has_mycnf_for_cpuser?api.version=1&user=user
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.40'
  /listaccts:
    get:
      description: This function lists the accounts on the server.
      operationId: Accounts-listaccts
      parameters:
      - description: "A [Perl Compatible Regular Expression (PCRE)](https://en.wikipedia.org/wiki/Perl_Compatible_Regular_Expressions) that filters the results.\n\n**Note:**\n * The system matches the PCRE against the `searchtype` parameter's specified type.\n * If you do not specify a value for both the `searchtype` and `search` parameters,\n   the function returns all of the server's accounts."
        in: query
        name: search
        required: false
        schema:
          example: username
          type: string
      - description: 'The function''s search method.

          * `exact` - The matched value and the `search` value **must** be identical.

          * `regex` - The matched value must contain the `search` value.'
        in: query
        name: searchmethod
        required: false
        schema:
          enum:
          - exact
          - regex
          example: exact
          type: string
      - description: 'The account information to query. If you do not specify a value

          for both the `searchtype` and `search` parameters, the function returns all

          of the server''s accounts.

          * `domain` - Match domains against the `search` regular expression.

          * `owner` - Match the WHM user who owns the account against the `search` regular expression.

          * `user` - Match usernames against the `search` regular expression.

          * `ip` - Match IP addresses against the `search` regular expression.

          * `package` - Match hosting plans (packages) against the `search` regular expression.'
        in: query
        name: searchtype
        required: false
        schema:
          enum:
          - domain
          - owner
          - user
          - ip
          - package
          example: domain
          type: string
      - description: 'The returns to include in the output for each account.


          If you do not specify a value, the function''s output includes all of its returns.'
        in: query
        name: want
        required: false
        schema:
          example: domain,diskused
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      acct:
                        description: An array of objects containing account data.
                        items:
                          properties:
                            backup:
                              description: 'Whether backups are enabled.

                                * `1` - Enabled.

                                * `0` - Disabled.'
                              enum:
                              - 0
                              - 1
                              example: 0
                              type: integer
                            child_nodes:
                              description: An array that contains the the workload and alias values for each of the child nodes.
                              items:
                                properties:
                                  alias:
                                    description: The alias of the child node
                                    type: string
                                    example: nodealias
                                  workload:
                                    description: The workload delegated to the child node
                                    enum:
                                    - Mail
                                    example: Mail
                                    type: string
                              type: array
                            disklimit:
                              description: 'The account''s disk space quota.

                                * `unlimited` — The account has unlimited disk space quota.

                                * A maximum amount of disk space, in megabytes (MB).'
                              oneOf:
                              - enum:
                                - unlimited
                                type: string
                              - minimum: 0
                                type: integer
                            diskused:
                              description: 'The account''s current disk space usage, in megabytes (MB), appended with `M`.


