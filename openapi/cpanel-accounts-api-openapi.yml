      - description: 'Whether to send a notification when AutoSSL renews a certificate but the new

          certificate lacks at least one domain that the previous certificate secured.


          * `1` — Enabled.

          * `0` — Disabled.


          This parameter defaults to the defined system value.'
        in: query
        name: notify_autossl_renewal_coverage
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 0
          type: integer
      - description: 'Whether to send a notification when someone changes the contact address for the account.


          * `1` — Enabled.

          * `0` — Disabled.


          This parameter defaults to the defined system value.'
        in: query
        name: notify_contact_address_change
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 0
          type: integer
      - description: "Whether to send a notification when disables the notification for contact address\n changes.\n\n* `1` — Enabled.\n* `0` — Disabled.\n\nThis parameter defaults to the defined system value."
        in: query
        name: notify_contact_address_change_notification_disabled
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 0
          type: integer
      - description: 'Whether to send a notification when the account reaches its disk usage limit.


          * `1` — Enabled.

          * `0` — Disabled.


          This parameter defaults to the defined system value.'
        in: query
        name: notify_disk_limit
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 0
          type: integer
      - description: 'Whether to send a notification when someone changes the account''s password.


          * `1` — Enabled.

          * `0` — Disabled.


          This parameter defaults to the defined system value.'
        in: query
        name: notify_password_change
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 0
          type: integer
      - description: 'Whether to send a notification when someone disables notifications for password changes.


          * `1` — Enabled.

          * `0` — Disabled.


          This parameter defaults to the defined system value.'
        in: query
        name: notify_password_change_notification_disabled
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 0
          type: integer
      - description: 'Whether to send a notification when an SSL certificate on the account expires.


          * `1` — Enabled.

          * `0` — Disabled.


          This parameter defaults to the defined system value.'
        in: query
        name: notify_ssl_expiry
        required: false
        schema:
          enum:
          - 1
          - 0
          example: 0
          type: integer
      - description: 'Whether to suspend outgoing email on the account.


          * `1` — Suspend outgoing email.

          * `0` — Do **not** suspend outgoing email.


          This parameter defaults to the defined system value.'
        in: query
        name: OUTGOING_EMAIL_SUSPENDED
        required: false
        schema:
