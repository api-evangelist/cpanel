  /LogManager/list_error_logs:
    get:
      x-readonly: true
      description: 'This function lists the website''s PHP error log files with size

        and last-modified metadata. It does not return file contents.'
      operationId: LogManager-list_error_logs
      parameters:
      - description: A domain owned by the cPanel account.
        example: example.com
        in: query
        name: domain
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: list_error_logs
                    type: string
                  module:
                    description: The name of the module called.
                    example: LogManager
                    type: string
                  result:
                    properties:
                      data:
                        description: An array of objects describing the requested error logs.
                        items:
                          properties:
                            error:
                              description: 'An error message that describes why the system could not

                                return metadata for this log file.'
                              example: null
                              type:
                              - string
                              - 'null'
                            file_id:
                              description: "The `file_id` value for each log file.\n\n* `php_fpm_error_log` — The PHP FPM error log\n  file located in the user's home directory\n  under the `logs/` subdirectory.\n* `docroot_error_log` — The PHP error log\n  file located in the website's document\n  root directory.\n* `homedir_error_log` — The home directory\n  error log file located in the user's home\n  directory."
                              enum:
                              - php_fpm_error_log
                              - docroot_error_log
                              - homedir_error_log
                              example: php_fpm_error_log
                              type: string
                            modified_today:
                              description: 'Whether the log file was last modified today

                                (server local time).


                                * `1` — The file was modified today.

                                * `0` — The file was not modified today.'
                              enum:
                              - 1
                              - 0
                              example: 1
                              type: integer
                            mtime:
                              description: 'The log file''s last-modified time as a unix

                                timestamp.'
                              example: 1778112083
                              type:
                              - integer
                              - 'null'
                            path:
                              description: The absolute path to the log file.
                              example: /home/cpuser/logs/example_com.php.error.log
                              type: string
                            size:
                              description: The log file's size, in bytes.
                              example: 4096
                              type:
                              - integer
                              - 'null'
