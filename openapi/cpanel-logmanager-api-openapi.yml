  /LogManager/view_error_log:
    get:
      x-readonly: true
      description: 'This function reads the trailing lines of a single PHP error log

        file for a domain owned by the current cPanel user and returns

        them in chronological order (oldest first).'
      operationId: LogManager-view_error_log
      parameters:
      - description: A domain owned by the current cPanel user.
        example: example.com
        in: query
        name: domain
        required: true
        schema:
          type: string
      - description: 'Which of the three well-known log locations to read.


          * `php_fpm_error_log` — The PHP FPM error log. This file is located in the `logs/` directory within the cPanel account''s home directory.

          * `docroot_error_log` — The PHP error log. This file is located in the domain''s document root directory.

          * `homedir_error_log` — The cPanel account PHP error log. This file is located in the cPanel account''s home directory.'
        example: php_fpm_error_log
        in: query
        name: file_id
        required: true
        schema:
          enum:
          - php_fpm_error_log
          - docroot_error_log
          - homedir_error_log
          type: string
      - description: 'The number of lines to retrieve from the end of the log file.


          **Note:**


          Values above `5000` are silently capped at `5000`.'
        example: 100
        in: query
        name: limit
        required: false
        schema:
          default: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: view_error_log
                    type: string
                  module:
                    description: The name of the module called.
                    example: LogManager
                    type: string
                  result:
                    properties:
                      data:
                        description: 'An object describing the requested log file

                          and its content.'
                        properties:
                          file_id:
                            description: 'The identifier of the log file that was

                              read. Same value as the `file_id` input

                              parameter.


                              * `php_fpm_error_log` — The PHP FPM error log. This file is located in the `logs/` directory within the cPanel account''s home directory.

                              * `docroot_error_log` — The PHP error log. This file is located in the domain''s document root directory.

                              * `homedir_error_log` — The cPanel account PHP error log. This file is located in the cPanel account''s home directory.'
                            enum:
                            - php_fpm_error_log
                            - docroot_error_log
                            - homedir_error_log
                            example: php_fpm_error_log
                            type: string
                          log_content:
                            description: 'The end of the error log file in chronological order.


                              **Note:**


                              This array will return an empty value if the log file is empty.'
                            example:
                            - '[07-May-2026 00:01:23 UTC] PHP Warning: Use of undefined constant FOO'
                            - '[07-May-2026 00:02:47 UTC] PHP Fatal error: Allowed memory size exhausted'
                            items:
                              type: string
                            type: array
                          lines_read:
                            description: The number of lines returned in the `log_content` return's value.
                            example: 2
                            type: integer
                          modified_today:
                            description: 'Whether the log file was modified today. The function determines the time and date with the cPanel & WHM server''s time.


                              * `1` — The file was modified today.

                              * `0` — The file was not modified today.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type: integer
                          mtime:
                            description: 'The log file''s last-modified time, in Unix time format.


                              **Note:**


                              This return value is determined via a `fstat` system call on the log file.'
                            example: 1778112083
                            type: integer
                          partial:
                            description: 'Whether the log file contains more lines than the `limit` parameter''s value.


                              * `1` — The file exceeds the `limit` parameter''s value.

                              * `0` — The file did not exceed the `limit` parameter''s value.'
                            enum:
                            - 1
                            - 0
                            example: 0
                            type: integer
                          path:
                            description: The absolute path to the log file on disk.
                            example: /home/cpuser/logs/example_com.php.error.log
                            type: string
                          size:
                            description: 'The log file''s size, in bytes.


                              **Note:**


                              This return value is determined via a `fstat` system call on the log file.'
                            example: 4096
                            type: integer
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties:
                          transformed:
                            description: Post-processing may have transformed the data.
                            enum:
                            - 1
                            example: 1
                            type: integer
                      status:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `errors` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running an API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
