  /LogManager/set_settings:
    get:
      x-readonly: false
      x-rollback: clean
      description: 'This function saves the account''s log archive settings.


        **Note:**


        You **must** pass at least one of the `archive_logs`, `prune_archive`, or `retention_days` parameters.'
      operationId: LogManager-set_settings
      parameters:
      - description: 'Whether to archive log files to your home directory after the

          system processes statistics.

          * `1` — Archive the logs.

          * `0` — Do **not** archive the logs.


          **Note:**


          * This parameter defaults to the `archive-logs` setting''s value in the user''s `~/.cpanel-logs` file.

          * If this file does **not** exist, this parameter defaults to the `default_archive-logs` key''s value in the [`cpanel.config`](https://go.cpanel.net/cpanelconfiginvalid) file.'
        in: query
        name: archive_logs
        required: false
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to remove the previous month''s archived logs from the `~/logs directory` at the end of each month.

          * `1` — Remove the logs.

          * `0` — Do **not** remove the logs.


          **Note:**


          * This parameter defaults to the `remove-old-archived-logs` setting''s value in the user''s `~/.cpanel-logs` file.

          * If this file doesn''t exist, this parameter defaults to the `default_remove-old-archive-logs` key''s value in the [`cpanel.config`](https://go.cpanel.net/cpanelconfiginvalid) file.'
        in: query
        name: prune_archive
        required: false
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'The number of days to retain archived log files before automatic removal.

          * `0` — Retain logs indefinitely.

          * `-1` — Clear the per-user override and revert to the server default.

          * Any positive integer — Retain logs for that many days.


          When not provided, the existing value is preserved.'
        in: query
        name: retention_days
        required: false
        schema:
          example: 30
          minimum: -1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: set_settings
                    type: string
                  module:
                    description: The name of the module called.
                    example: LogManager
                    type: string
                  result:
                    properties:
                      data: {}
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `errors` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Save cPanel account's log archive settings
      tags:
      - LogManager
      x-codeSamples:
      - label: CLI
        lang: Shell
