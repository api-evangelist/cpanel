  /Sitejet/can_create_domains:
    get:
      description: 'This function returns whether a cPanel account can create new subdomains or addon domains.


        **Note:**


        Creating a new addon domain is dependent on the creation of subdomains. If the cPanel account has reached its limit for subdomains, you cannot create a new addon domain, even if the limit for addon domains has not been reached.'
      operationId: can_create_domains
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: can_create_domains
                    type: string
                  module:
                    description: The name of the module called.
                    example: Sitejet
                    type: string
                  result:
                    properties:
                      data:
                        description: "Whether the cPanel user can create a new subdomin or addon domain.\n  * `1` - The cPanel user can create a new subdomain or addon domain.\n  * `0` - The cPanel user can not create a new subdomain or addon domain."
                        enum:
                        - 1
                        - 0
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties:
                          transformed:
                            description: Post-processing may have transformed the data.
                            enum:
