  /Branding/include:
    get:
      x-readonly: true
      description: 'This function retrieves and renders a branding file from the active theme.

        The file may be a Template Toolkit (`.tt`) file or a standard HTML/image

        file. When the file is a Template Toolkit file, the system processes it

        and returns the rendered output. Otherwise, the system returns the file''s

        raw or HTML-encoded content.'
      operationId: Branding-include
      parameters:
      - description: The relative path to the branding file within the theme directory.
        examples:
          tt_file:
            summary: Include a Template Toolkit branding file.
            value: header.tt
          html_file:
            summary: Include a standard HTML branding file.
            value: header.html
        in: query
        name: file
        required: true
        schema:
          example: header.tt
          type: string
      - description: 'A JSON-encoded object containing additional variables to pass to the

          Template Toolkit template when rendering a `.tt` file. This parameter

          is ignored for non-template files.'
        in: query
        name: data
        required: false
        schema:
          example: '{"logoColor":"blue","showBanner":1}'
          format: json
          type: string
      - description: 'Whether to return the raw file content without HTML encoding.


          * `1` — Return the raw file content.

          * `0` — Return HTML-encoded content. This is the default behavior.


          This parameter has no effect when the file is a Template Toolkit (`.tt`) file.'
        in: query
        name: raw
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: "Whether to skip the default branding fallback.\n\n* `1` — Do not fall back to the default branding file if the theme-specific\n  file does not exist. This parameter has no effect for accounts that do not\n  have a branding package assigned; the theme fallback is always applied in\n  that case.\n* `0` — Fall back to the default branding file. This is the default behavior."
