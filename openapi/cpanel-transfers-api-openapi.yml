        in: query
        name: transfer_session_id
        required: true
        schema:
          example: exampleservercopya20140206192428NtyW
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: analyze_transfer_session_remote
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Validate remote server's credentials
      tags:
      - Transfers
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  analyze_transfer_session_remote \\\n  transfer_session_id='exampleservercopya20140206192428NtyW'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/analyze_transfer_session_remote?api.version=1&transfer_session_id=exampleservercopya20140206192428NtyW
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.44'
  /available_transfer_modules:
    get:
      description: 'This function lists all available transfer modules.


        **Note:**


        For more information about how this function works with other functions in the transfer and restore process, read our

        Guide to Transfer and Restore API Functions

        documentation.'
      operationId: Transfers-available_transfer_modules
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      modules:
                        additionalProperties:
                          description: 'The priority of the transfer module.


                            **Note:**


                            The key is the transfer module''s name.'
                          example: '6000'
                          pattern: ^[1-9][0-9]*$
                          type: string
                        description: The transfer module's information.
                        example:
                          AccountLocal: '5000'
                          AccountRemoteRoot: '3000'
                          AccountRemoteUser: '4000'
                          FeatureListRemoteRoot: '1000'
                          LegacyAccountBackup: '6000'
                          PackageRemoteRoot: '2000'
                        type: object
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: available_transfer_modules
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
