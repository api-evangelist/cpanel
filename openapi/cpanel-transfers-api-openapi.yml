      tags:
      - Transfers
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  available_transfer_modules\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/available_transfer_modules?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.44'
  /create_remote_root_transfer_session:
    get:
      description: 'This function creates a transfer session as the `root` user.


        **Important:**


        For information about the ports that cPanel & WHM uses, read our How to Configure Your Firewall for cPanel Services documentation.


        **Note:**


        For more information about how this function works with other functions in the transfer and restore process, read our Guide to Transfer and Restore API Functions documentation.


        ### Authentication

        There are several methods that you can use to authenticate a transfer session with the remote server:


        #### Authenticate as root

        If you use SSH to authenticate as the `root` user, the remote server''s SSH must accept `root` logins. For more information read OpenSSH''s `sshd_config` documentation.


        The following table displays the correct parameters and values for this authentication method:


        | Parameter | Value |

        |-|-|

        | `user` | `root` |

        | `password` | `root`''s password |


        You can also use an SSH public key to authenticate the `root` user. If the SSH public key is encrypted, include the SSH key''s passphrase.


        The following table displays the correct parameters and values for this authentication method:


        | Parameter | Value if the SSH Key is not encrypted | Value if the SSH Key is encrypted |

        |-|-|-|

        | `user` | `root` | `root` |

        | `sshkey_name` | The `root` user''s SSH key. | The `root` user''s SSH key. |

        | `sshkey_passphrase` | *(none)* | The `root` user''s SSH key passphrase. |


        #### Authenticate as a user

        Many server administrators do not permit direct `root` logins via SSH on their servers.

        * If the remote server forbids root logins, you **must** use another user and their password on the remote server, and then escalate to the `root` user. For more information read OpenSSH''s `sshd_config` documentation.

        * If the system administrator used WHM''s *Manage Wheel Group Users* interface (*WHM >> Home >> Security Center >> Manage Wheel Group Users*) to grant the user `su` access, then you will need to specify `su` and the `root` password.

        * If the user has `sudo` access, you do **not** need the `root` password.


        The following table displays the correct parameters and values for this authentication method:


        | Parameter | Value if the user has sudo access | Value if the user has su access |

        |-|-|-|

        | `user` | The username. | The username. |

        | `password` | The user''s password. | The user''s password. |

        | `root_escalation_method` | `sudo` | `su` |

        | `root_password` | *(none)* | The `root` user''s password. |


        You can also use an SSH public key instead of a password to authenticate that user. If the SSH public key is encrypted, include the SSH key''s passphrase.


        The following table displays the correct parameters and values for this authentication method:


        | Parameter | sudo | su |

        |-|-|-|

        | `user` | The username. | The username. |

        | `sshkey_name` | The user''s SSH key. | The user''s SSH key. |

        | `sshkey_passphrase` (If encrypted) | The user''s SSH key passphrase. | The user''s SSH key passphrase. |

        | `root_escalation_method` | `sudo` | `su` |

        | `root_password` | *(none)* | The `root` user''s password. |'
      operationId: Transfers-create_remote_root_transfer_session
      parameters:
      - description: 'The method by which the transfer system will execute commands on the remote system.

          * `ssh` — Use SSH. The function uses the remote server''s indicated SSH `port` value.

          * `whostmgr` — Use the remote server''s secure WHM port. This will reject invalid  TLS handshakes.

          * `whostmgr_insecure` — Use the remote server''s secure WHM port, but **ignores** any TLS verification failures.'
        in: query
        name: comm_transport
        required: true
        schema:
          default: ssh
          enum:
          - ssh
          - whostmgr
          - whostmgr_insecure
          example: ssh
          type: string
      - description: 'Whether to compress data before transfer.

          * `1` — Compress.

          * `0` — Do **not** compress.'
        in: query
        name: compressed
        required: true
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to transfer reseller privileges.

          * `1` — Transfer.

          * `0` — Do **not** transfer.'
        in: query
        name: copy_reseller_privs
        required: true
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to use a custom `pkgacct` scripts on the remote server for the transfer session.

          * `1` — Use a custom `pkgacct` script.

          * `0` — Do **not** use a custom script.'
        in: query
        name: enable_custom_pkgacct
        required: true
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: The remote server's hostname or IP address.
        example: 192.168.0.0
        in: query
        name: host
        required: true
        schema:
          anyOf:
          - description: A valid IP address.
            example: 192.168.0.0
            format: ipv4
            type: string
          - description: A valid domain.
            example: remote.example.com
            format: domain
            type: string
      - description: 'Whether to run the remote server processes at low priority in order to reduce impact on server performance.

          * `1` — Run at low priority.

          * `0` — Run at high priority.'
        in: query
        name: low_priority
        required: true
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: The number of CPU threads to use for restore sessions.
        in: query
        name: restore_threads
        required: true
        schema:
          example: 1
          minimum: 1
          type: integer
      - description: The number of CPU threads to use for transfer sessions.
        in: query
        name: transfer_threads
        required: true
        schema:
          example: 1
          minimum: 1
          type: integer
      - description: 'Whether to not use SSL to encrypt data.

          * `1` — Do **not** use SSL.

          * `0` — Use SSL.'
        in: query
        name: unencrypted
        required: true
        schema:
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: "Whether to skip the Restricted Restore system.\n* `1` — Skip.\n* `0` — Do **not** skip.\n\n**Note:**\n\n  If you want to pass the `force` parameter in the WHM API 1 `enqueue_transfer_item` function, you **must** set this parameter to a value of `0`."
        in: query
        name: unrestricted_restore
        required: true
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to use an existing backup instead of packaging the data again if the backup is less than 24 hours old.

          * `1` — Use an existing backup.

          * `0` — Package the data.'
        in: query
        name: use_backups
        required: true
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: The username to use to connect to the remote server.
        in: query
        name: user
        required: true
        schema:
          example: root
          type: string
      - description: "The username's password.\n\n**Note:**\n\n Use this parameter if you will authenticate to the remote server with a password. Do **not** use this parameter if you will authenticate to the remote server with an SSH key."
        in: query
        name: password
        required: false
        schema:
          example: 123456luggage
          type: string
      - description: The remote server's SSH port number.
        in: query
        name: port
        required: false
        schema:
          default: 22
          example: 22
          maximum: 65535
          minimum: 1
          type: integer
      - description: "The escalation method to use to connect to the remote server.\n* `su`\n* `sudo`\n\n**Note:**\n\n Use this parameter if the `sshd_config` file's `PermitRootLogin` value is `No`."
        in: query
        name: root_escalation_method
        required: false
        schema:
          enum:
          - su
          - sudo
          example: sudo
          type: string
      - description: "`root`'s password on the remote server.\n\n**Note:**\n\n Use this parameter if the `sshd_config` file's `PermitRootLogin` value is `No` and you will use the `root` user's password to escalate access."
        in: query
        name: root_password
        required: false
        schema:
          example: 123456luggage
          type: string
      - description: 'The SSH key''s name.


          **Note:**


          * Use this parameter if you will authenticate to the remote server with an SSH key. Do **not** use this parameter if you will authenticate to the remote server with a password.

          * SSH keys are available in WHM''s [*Manage root''s SSH Keys*](https://go.cpanel.net/whmdocsManagerootsSSHKeys) interface (*WHM >> Home >> Security Center >> Manage root’s SSH Keys*).'
        in: query
        name: sshkey_name
        required: false
        schema:
          example: FrancisScott
          type: string
      - description: "The SSH key's passphrase.\n\n**Note:**\n\n Use this parameter if you will authenticate to the remote server with an SSH key, and the key is encrypted."
        in: query
        name: sshkey_passphrase
        required: false
        schema:
          example: kkwtoowoygidsa
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      analyze_rawout:
                        description: The HTML output from the analysis of the remote server connection.
                        example: 'Fetching information from remote host: \u201c10.1.100.35\u201d \u2026 \u2026\nDone\nFetching information from remote host: \u201c10.1.100.35\u201d \u2026 \u2026\nDone\n",'
                        type: string
                      create_rawout:
                        description: The HTML output from the creation of the remote server connection.
                        example: 'Basic credential check \u2026 \u2026\nDone\nFetching information from remote host: \u201c10.1.100.35\u201d \u2026 \u2026\nDone\nFetching WHM Version \u2026\nDone\nTesting \u201cvm5.docs.cpanel.net\u201d for transfer streaming support with password authentication....<strong>Streaming Supported</strong>\nRemote Server Type: \u201cWHM1130\u201d\n",'
                        type: string
                      transfer_session_id:
                        description: The transfer session's ID.
                        example: vm5docscpanelcopya20140430200606V06z
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: create_remote_root_transfer_session
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Create remote server transfer session as root user
      tags:
      - Transfers
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  create_remote_root_transfer_session \\\n  host='192.168.0.0' \\\n  user='root' \\\n  transfer_threads='1' \\\n  restore_threads='1' \\\n  unrestricted_restore='1' \\\n  comm_transport='ssh' \\\n  copy_reseller_privs='1' \\\n  compressed='1' \\\n  unencrypted='0' \\\n  use_backups='1' \\\n  low_priority='1' \\\n  enable_custom_pkgacct='1'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/create_remote_root_transfer_session?api.version=1&host=192.168.0.0&user=root&transfer_threads=1&restore_threads=1&unrestricted_restore=1&comm_transport=ssh&copy_reseller_privs=1&compressed=1&unencrypted=0&use_backups=1&low_priority=1&enable_custom_pkgacct=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.44'
  /create_remote_user_transfer_session:
    get:
      description: 'This function creates a transfer session with a non-root user to a remote server.


        **Important:**


        * The source and target servers must be able to communicate over port `2087` to use this feature.

        * The source and target servers must also be able to communicate over the port that your servers use for SSH connections.

        * For more information about the ports that cPanel & WHM uses, read our How to Configure Your Firewall for cPanel & WHM Services documentation.


        **Note:**


        For more information about how this function works with other functions in the transfer and restore process, read our Guide to Transfer and Restore API Functions documentation.'
      operationId: Transfers-create_remote_user_transfer_session
      parameters:
      - description: The server hostname for the account.
        in: query
        name: host
        required: true
        schema:
          example: hostname.example.com
          format: domain
          type: string
      - description: The account's password.
        in: query
        name: password
        required: true
        schema:
          example: 12345luggage
          type: string
      - description: 'Whether to skip the Restricted Restore process.

          * `1` - Skip Restricted Restore.

          * `0` - Use Restricted Restore.


          **Note:**


          You **must** set this parameter to a value of 1.'
        in: query
        name: unrestricted_restore
        required: true
        schema:
          enum:
          - 1
          example: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      transfer_session_id:
                        description: The transfer session's ID.
                        example: vm5docscpanelnoroo201402251939519hmy
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: create_remote_user_transfer_session
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed: Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Create remote server transfer session
      tags:
      - Transfers
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  create_remote_user_transfer_session \\\n  host='hostname.example.com' \\\n  password='12345luggage' \\\n  unrestricted_restore='1'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/create_remote_user_transfer_session?api.version=1&host=hostname.example.com&password=12345luggage&unrestricted_restore=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.44'
  /delete_account_archives:
    get:
      description: This function removes a cPanel user account's archives.
      operationId: Transfers-delete_account_archives
      parameters:
      - description: The cPanel account username.
        in: query
        name: user
        required: true
        schema:
          example: username
          format: username
          type: string
      - description: The filepath to the archive storage location.
        in: query
        name: mountpoint
        required: false
        schema:
          default: /home
          example: /home/example/
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: delete_account_archives
                        type: string
                      output:
                        properties:
                          messages:
                            description: An array of status messages.
                            items:
                              example: 'Found archive: /home/example/example.tar.gz'
                              type: string
                            type: array
                          warnings:
                            description: An array of warning messages.
                            items:
                              example: This is a warning message.
                              type: string
                            type: array
                        type: object
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Remove cPanel account's archives
      tags:
      - Transfers
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  delete_account_archives \\\n  user='username'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/delete_account_archives?api.version=1&user=username
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '70'
  /enqueue_transfer_item:
    get:
      description: 'This function adds a transfer session to a queue. For more information about how this function works with other

        functions in the transfer and restore process, read our

        Guide to Transfer and Restore API Functions documentation.


        **Important:**


        The `module` parameter determines which additional parameters to use with the function.'
      operationId: Transfers-enqueue_transfer_item
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/schemas-Transfers_EnqueueTransferItem_Type'
        description: An enqueue transfer item.
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: enqueue_transfer_item
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed: Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Add module to transfer session
      tags:
      - Transfers
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --input=json --output=jsonpretty \\\n  enqueue_transfer_item\n"
      - label: HTTP Request (Wire Format)
        lang: HTTP
        source: 'GET /cpsess##########/json-api/enqueue_transfer_item HTTP/1.1

          Host: example.com:2083

          Cookie: ###################################

          Content-Type: application/json

          Content-Length: 0


