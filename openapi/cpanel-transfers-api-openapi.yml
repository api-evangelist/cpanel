  /remote_basic_credential_check:
    get:
      description: 'This function checks the SSH credentials on the remote server.


        ### Authentication

        There are several methods that you can use to authenticate a transfer session with the remote server.


        #### PermitRootLogin=Yes

        The simplest authentication method is to use the `root` user and password. To do this, the `sshd_config` file on the remote server **must** contain the following value: `PermitRootLogin=Yes`


        The following table displays the correct parameters and values for this authentication method:


        | Parameter | Value |

        |-|-|

        | `user` | `root` |

        | `password` | `root`''s password. |


        You can also use the SSH Public Key to authenticate the `root` user. If the SSH Public Key is encrypted, include the SSH Key''s passphrase.


        The following table displays the correct parameters and values for this authentication method:


        | Parameter | Value if the SSH Key is not encrypted | Value if the SSH Key is encrypted |

        |-|-|-|

        | `user` | `root` | `root` |

        | `sshkey_name` | `root`''s SSH key name. | `root`''s SSH key name. |

        | `sshkey_passphrase` | (none) | `root`''s SSH key passphrase. |


        #### PermitRootLogin=No

        Many server administrators do not permit direct root logins on their servers.

        * If the remote server contains `PermitRootLogin=No` in the `sshd_config `file, then you **must** use another user and their password on the remote server, and then escalate to `root`.

        * If the system administrator used WHM''s *Manage Wheel Group Users* interface (*WHM >> Home >> Security Center >> Manage Wheel Group Users*) to grant the user `su` access, then you will need to specify `su` and the `root` password.

        * If the user has `sudo` access, you do **not** need the `root` password.


        The following table displays the correct parameters and values for this authentication method:


        | Parameter | Value if the user has sudo access | Value if the user has su access |

        |-|-|-|

        | `user` | The user''s username. | The user''s username. |

        | `password` | The user''s password. | The user''s password. |

        | `root_escalation_method` | `sudo` | `su` |

        | `root_password` | (none) | `root`''s password. |


        You can also use an SSH Public Key instead of a password to authenticate that user. If the SSH Public Key is encrypted, include the SSH Key''s passphrase.


        The following table displays the correct parameters and values for this authentication method:


        | Parameter | sudo | su |

        |-|-|-|

        | `user` | The user''s username. | The user''s username. |

        | `sshkey_name` | The user''s SSH key name. | The user''s SSH key name. |

        | `sshkey_passphrase` (If encrypted) | The user''s SSH key passphrase. | The user''s SSH key passphrase. |

        | `root_escalation_method` | `sudo` | `su` |

        | `root_password` | (none) | `root`''s password. |'
      operationId: SSH-remote_basic_credential_check
      parameters:
      - description: The remote server's hostname or IP address.
        example: 192.168.0.0
        in: query
        name: host
        required: true
        schema:
          anyOf:
          - description: A valid IP address.
            example: 192.168.0.0
            format: ipv4
            type: string
          - description: A valid domain.
            example: remote.example.com
            format: domain
            type: string
      - description: The username to use to connect to the remote server.
        in: query
        name: user
        required: true
        schema:
          example: root
          format: username
          type: string
      - description: The username's password.
        in: query
        name: password
        required: false
        schema:
          example: 123456luggage
          type: string
      - description: The remote server's SSH port number.
        in: query
        name: port
        required: false
        schema:
          default: 22
          example: 22
          maximum: 65535
          minimum: 1
          type: integer
      - description: "The escalation method to use to connect to the remote server.\n* `su`\n* `sudo`\n\n**Note:**\n\n Use this parameter if `PermitRootLogin=No` in the remote server's `sshd_config` file."
        in: query
        name: root_escalation_method
        required: false
        schema:
          enum:
          - su
          - sudo
          example: sudo
          type: string
      - description: "`root`'s password on the remote server.\n\n**Note:**\n\n Use this parameter if `PermitRootLogin=No` in the remote server's `sshd_config` file and the `root_escalation_method` value is set to `su`."
        in: query
        name: root_password
        required: false
        schema:
          example: 123456luggage
          type: string
      - description: "The SSH key's name.\n\n**Note:**\n\n SSH keys are available in WHM's *Manage root's SSH Keys* interface (*WHM >> Home >> Security Center >> Manage root’s SSH Keys*)."
        in: query
        name: sshkey_name
        required: false
        schema:
          example: FrancisScott
          type: string
      - description: "The SSH key's passphrase.\n\n**Note:**\n\n Use this parameter if the SSH Key is encrypted."
        in: query
        name: sshkey_passphrase
        required: false
        schema:
          example: kkwtoowoygidsa
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      output:
                        description: The function call's raw HTML output.
                        example: 'Basic credential check…

                          Done

                          '
                        type: string
                      response:
                        description: The function call's response.
                        example: 'basic credential check

                          '
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: remote_basic_credential_check
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: Success
                        type: string
                      result:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Validate remote server's SSH credentials
      tags:
      - Transfers
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  remote_basic_credential_check \\\n  host='192.168.0.0' \\\n  user='root'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/remote_basic_credential_check?api.version=1&host=192.168.0.0&user=root
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.44'
