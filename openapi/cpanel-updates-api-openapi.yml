        source: https://hostname.example.com:2087/cpsess##########/json-api/set_tier?api.version=1&tier=current
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.38'
  /update_updateconf:
    post:
      description: 'This function modifies a server''s `/etc/cpupdate.conf` file. This file controls how the server handles software updates and upgrades.


        **Important:**


        You **must** have the `root` level Access Control List (ACL) privilege to execute this function.'
      operationId: CpUpdate-update_updateconf
      parameters:
      - description: "The cPanel & WHM installation's release tier, or a [valid version number](https://go.cpanel.net/longtermsupport).\n\nIf you do not use this parameter, the system retains the current setting.\n\n* A valid cPanel & WHM version number.\n* `STABLE` - This version has received considerable public exposure, testing, and verification.\n* `RELEASE` - This version is feature-complete and well-tested. It contains all intended features and functionality.\n* `CURRENT` - This version is tested and verified, but it may not contain all of the proposed functionality of a release. This tier is similar to the \"release candidate\" tier that other publication schemes use.\n* `EDGE` - This version only has rudimentary testing. The features are subject to further modification. This version usually lacks official public documentation.\n* `LTS` - Some hosting providers do not wish to upgrade cPanel & WHM to newer major versions. This is a single cPanel & WHM version for the year-long period in which WebPros International, LLC supports it.\n\n  If you do not set this parameter, the system retains the current setting.\n\n New installations default to RELEASE."
        in: query
        name: CPANEL
        required: false
        schema:
          anyOf:
          - enum:
            - STABLE
            - RELEASE
            - CURRENT
            - EDGE
            - LTS
            type: string
          - format: cPanel version
            type: string
          - type: string
          example: RELEASE
      - description: 'The frequency with which the server updates the operating system distribution''s packages each time that the `/usr/local/cpanel/scripts/upcp` script runs.


          If you do not set this parameter, the system retains the current setting.


          * `daily` - Update the system packages daily.

          * `manual` - Update the system packages manually.

          * `never` - If you specify `never`, the server administrator **must** run the `/usr/local/cpanel/scripts/update-packages` script when they update the server''s packages.'
        in: query
        name: RPMUP
        required: false
        schema:
          anyOf:
          - enum:
            - daily
            - manual
            - never
            type: string
          - type: string
          example: daily
      - description: 'The frequency with which the server updates Apache SpamAssassin''s™ rules when the `/usr/local/cpanel/scripts/upcp` script runs.


          If you do not set this parameter, the system retains the current setting.


          * `daily` - Update Apache SpamAssassin rules daily.

          * `manual` - Update Apache SpamAssassin rules manually.

          * `never` - If you specify `never`, the server administrator **must** run the `/usr/local/cpanel/scripts/update-packages` script when they update Apache SpamAssassin''s rules.'
        in: query
        name: SARULESUP
        required: false
        schema:
          anyOf:
          - enum:
            - daily
            - manual
            - never
            type: string
          - type: string
          example: daily
      - description: 'Whether the system applies expedited security updates for the current major version.


          This setting is **independent** of the `UPDATES` setting. It drives the hourly `/usr/local/cpanel/scripts/upcp --security` check, which applies a security release within the current major version as soon as it is available, even when `UPDATES` is set to `manual` or `never`.


          If you do not set this parameter, the system retains the current setting.


          * `hourly` - Check for and apply current-major security updates every hour. This is the default.

          * `never` - Do **not** apply expedited security updates.'
        in: query
        name: SECURITY_UPDATES
        required: false
        schema:
          anyOf:
          - enum:
            - hourly
            - never
            type: string
          - type: string
          example: hourly
      - description: 'The absolute directory path to the staging directory for updates.


          If you do not set this parameter, the system retains the current setting.'
        in: query
        name: STAGING_DIR
        required: false
        schema:
          example: /usr/local/cpanel
          type: string
      - description: 'When the system will check for updates.


          If you do not set this parameter, the system retains the current setting.


          * `daily` - Update cPanel & WHM automatically through a cron job once every 24 hours.

          * `manual` - Update cPanel & WHM manually.

          * `never` - Do **not** update cPanel & WHM.'
        in: query
        name: UPDATES
        required: false
        schema:
          anyOf:
          - enum:
            - daily
            - manual
            - never
            type: string
          - type: string
          example: daily
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: update_updateconf
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed: Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Update software update behavior
      tags:
      - Updates
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  update_updateconf\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/update_updateconf?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.38'
