                          * `0` - Mailman is **not** installed on the server.'
                        example: 2.1.23-9
                        oneOf:
                        - description: A version of Mailman.
                          type: string
                        - description: Mailman is **not** installed.
                          enum:
                          - 0
                          type: integer
                      mariadb:
