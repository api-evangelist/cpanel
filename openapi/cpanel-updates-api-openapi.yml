  /set_cpanel_updates:
    get:
      description: This function sets the frequency of cPanel & WHM updates.
      operationId: Sys-set_cpanel_updates
      parameters:
      - description: 'The frequency with which to run cPanel & WHM updates on a server.

          - `daily` — Run updates daily.

          - `manual` — Run updates manually.

          - `never` — Never run updates.'
        in: query
        name: updates
        required: true
        schema:
          enum:
          - daily
          - manual
          - never
          example: daily
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      updates:
                        description: 'The new frequency of server updates.

                          - `daily` — Run updates daily.

                          - `manual` — Run updates manually.

                          - `never` — Never run updates.'
                        enum:
                        - daily
                        - manual
                        - never
                        example: daily
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: set_cpanel_updates
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: Cpanel update frequency set to daily
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Update cPanel & WHM update frequency
      tags:
      - Updates
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  set_cpanel_updates \\\n  updates='daily'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/set_cpanel_updates?api.version=1&updates=daily
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.38'
  /set_tier:
    get:
      description: This function sets a cPanel & WHM server to a specified support tier.
      operationId: Sys-set_tier
      parameters:
      - description: The support tier to use.
        in: query
        name: tier
        required: true
        schema:
          enum:
          - edge
          - current
          - release
          - stable
          - lts
          example: current
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      tier:
                        description: The server's new support tier.
                        enum:
                        - edge
                        - current
                        - release
                        - stable
                        - lts
                        example: current
                        type: string
                    type: object
                  metadata:
                    properties:
