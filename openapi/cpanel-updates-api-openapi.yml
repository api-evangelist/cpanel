                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: get_available_tiers
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: Got tiers list
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return cPanel & WHM available versions
      tags:
      - Updates
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  get_available_tiers\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/get_available_tiers?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.38'
  /get_current_lts_expiration_status:
    get:
      description: This function determines whether a branch's Long-Term Support (LTS) version expires within three months. For more information about LTS, read our cPanel Long-Term Support documentation.
      operationId: Update-get_current_lts_expiration_status
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      expiration:
                        description: When support for the build version expires.
                        example: 1585612801
                        format: unix_timestamp
                        type: integer
                      expires_in_next_three_months:
                        description: 'Whether the LTS version expires within the next three months.

                          - `1` — LTS expires within the next three months.

                          - `0` — LTS does **not** expire within the next three months.'
                        enum:
                        - 0
                        - 1
                        example: 0
                        type: integer
                      full_version:
                        description: The full version number.
                        example: 11.88.1.11
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: get_current_lts_expiration_status
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return Long Term Support expiration status
      tags:
      - Updates
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  get_current_lts_expiration_status\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/get_current_lts_expiration_status?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '62'
  /get_lts_wexpire:
    get:
      description: This function parses the `/etc/cpanel/TIERS.json` file and returns whether a branch qualifies for Long-Term Support (LTS). For more information about LTS, read our cPanel Long-Term Support documentation.
      operationId: Update-get_lts_wexpire
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      branch:
                        additionalProperties:
                          description: The branch.
                          items:
                            properties:
                              build:
                                description: The build version number.
                                example: 11.90.0.5
                                type: string
                              is_main:
                                description: 'Whether the build represents the main build of the branch.

                                  * `1` - The build is the main build of the branch.

                                  * `0` - The build is **not** the main build of the branch.


                                  **Note:**


                                  This will be `1` for exactly one of the entries in this array.'
                                enum:
                                - 0
                                - 1
                                example: 0
                                type: integer
                            type: object
                          type: array
                        description: An object that lists information about available branch builds.
                        example:
                          11.78.0:
                          - build: 11.78.0.49
                            is_main: 1
                          11.80.0:
                          - build: 11.80.0.24
                            is_main: 1
                          11.82.0:
                          - build: 11.82.0.19
                            is_main: 1
                          11.84.0:
                          - build: 11.84.0.22
                            is_main: 1
                          11.86.0:
                          - build: 11.86.0.25
                            is_main: 1
                          11.88.0:
                          - build: 11.88.0.14
                            is_main: 1
                          11.90.0:
                          - build: 11.90.0.5
                            is_main: 1
                        type: object
                      flags:
                        additionalProperties:
                          description: 'Feature or flag in the output format.


                            * `1` - Feature is present in the returned data.

                            * `0` - Feature is **not** present in the returned data.'
                          enum:
                          - 0
                          - 1
                          type: integer
                        description: An object containing Features or flags supported by this output.
                        example:
                          is_main: 1
                        type: object
                      tiers:
                        additionalProperties:
                          description: The release tier.
                          items:
                            properties:
                              build:
                                description: The build version number.
                                type: string
                              expires:
                                description: 'When WebPros International, LLC support for the build version expires.

                                  Encoded as a Unix Timestamp.


                                  **Note:**


                                  This item is only present when the version is LTS.'
                                example: '1617148801'
                                type: string
                              is_lts:
                                description: 'Whether cPanel offers this version as LTS.

                                  * `1` — Long-term support.

                                  * `0` — No Long-term support.


                                  **Note:**


                                  This item is only present when the version is LTS.'
                                enum:
                                - 1
                                example: 1
                                type: integer
                              is_main:
                                description: 'Whether the build represents the main build of the tier.

                                  * `1` - The build is the main build of the tier.

                                  * `0` - The build is **not** the main build of the tier.


                                  **Note:**


                                  This will be `1` for exactly one of the entries in this array.'
                                enum:
                                - 0
                                - 1
                                example: 1
                                type: integer
                              named:
                                description: 'The release tier or tiers which currently offer this branch, if applicable.


                                  **Note:**


                                  This item is only present when the version is part of a named tier.'
                                example:
                                - edge
                                - current
                                - release
                                items:
                                  enum:
                                  - edge
                                  - current
                                  - release
                                  - stable
                                  - lts
                                  type: string
                                type: array
                            type: object
                          type: array
                        description: An object that lists information about build versions in release tiers.
                        example:
                          '11.78':
                          - build: 11.78.0.49
                            expires: '1588636799'
                            is_lts: 1
                            is_main: 1
                          '11.80':
                          - build: 11.80.0.24
                            is_main: 1
                          '11.82':
                          - build: 11.82.0.19
                            is_main: 1
                          '11.84':
                          - build: 11.84.0.22
                            is_main: 1
                          '11.86':
                          - build: 11.86.0.25
                            expires: '1617148801'
                            is_lts: 1
                            is_main: 1
                            named:
                            - lts
                          '11.88':
                          - build: 11.88.0.13
                            is_main: 0
                            named:
                            - stable
                          - build: 11.88.0.14
                            is_main: 1
                          '11.90':
                          - build: 11.90.0.5
                            is_main: 1
                            named:
                            - current
                            - edge
                            - release
                        type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: get_lts_wexpire
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed: Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return Long Term Support status for all versions
      tags:
      - Updates
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  get_lts_wexpire\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/get_lts_wexpire?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '62'
  /installed_versions:
    get:
      description: This function lists the versions of third-party software that ship with cPanel & WHM.
      operationId: ApplicationVersions-installed_versions
      parameters:
      - description: 'Whether to list the server''s installed RPMs in the function''s

          `cpanel_packages`, `ea_4_packages`, and `os_packages` arrays.


          * `1` - List.

          * `0` - Do **not** list.'
        in: query
        name: packages
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    example:
                      apache: 2.4.12
                      apache_php_default_version: 0
                      apache_php_versions:
                      - 0
                      bind: 9.9.4-29
                      clamav: 0.99.2-1
                      cpanel_and_whm: 11.64.0.9999
                      cpanel_packages:
                      - cpanel-ace-editor-1.2.6-1.cp1166.noarch
                      - cpanel-yui-2.9.0-5.cp1136.noarch
                      cpanel_php: 7.2.7-4
                      cron: 0
                      cronie: 1.4.11-23
                      dovecot: 2.2.31 (65cde28)
                      ea_4_packages: []
                      easyapache: '4'
                      exim: 4.89-2
                      linux_kernel: 3.10.0-327.18.2.el7.x86_64
                      mailman: 2.1.23-9
                      mariadb: 0
                      mariadb_build: 0
                      munin: 0
                      mysql: 5.7.61
                      mysql_build: 5.7.61-1
                      nscd: 2.17-222
                      openssh-server: 7.4p1-21
                      operating_system_name: centos
                      operating_system_version: '7.2'
                      os_packages:
                      - ImageMagick-6.7.8.9-15.el7_2.x86_64
                      - zsh-5.0.2-14.el7.x86_64
                      p0f: 3.09b-1
                      postgresql: 0
                      postgresql_build: 0
                      powerdns: 0
                      proftpd: 0
                      pureftpd: 1.0.45
                      roundcube: 1.2.4-1
                      rsyslog: 8.24.0-16
                      spamd: 3.4.2
                      squirrelmail: 0
                    properties:
                      apache:
                        description: 'The Apache® version.


                          * `0` - Apache is **not** installed on the server.'
                        example: 2.4.12
                        oneOf:
                        - description: A version of Apache.
                          type: string
                        - description: Apache is **not** installed.
                          enum:
                          - 0
                          type: integer
                      apache_php_default_version:
                        description: 'The default PHP version for Apache.


                          * `0` - PHP for Apache is **not** installed on the server.'
                        example: 7.3.21-1.1.1
                        oneOf:
                        - description: A version for Apache of default PHP.
                          type: string
                        - description: default PHP is **not** installed.
                          enum:
                          - 0
                          type: integer
                      apache_php_versions:
                        description: 'An array of PHP versions that the system installs for Apache.


                          If PHP for Apache is **not** installed, this will return an array containing `0`.


                          **Note:**


                          Unlike other keys in this object, this returns a `[0]` value when PHP for Apache is **not** installed.'
                        example:
                        - 7.1.33-3.4.2
                        - 7.2.33-1.1.1
                        - 7.3.21-1.1.1
                        items:
                          oneOf:
                          - description: A version of PHP for Apache.
                            type: string
                          - description: PHP for Apache is **not** installed on the server.
                            enum:
                            - 0
                            type: integer
                        type: array
                      bind:
                        description: 'The BIND version.


                          * `0` - BIND is **not** installed on the server.'
                        example: 9.9.4-29
                        oneOf:
                        - description: A version of BIND.
                          type: string
                        - description: BIND is **not** installed.
                          enum:
                          - 0
                          type: integer
                      clamav:
                        description: 'The ClamAV version.


                          * `0` - ClamAV is **not** installed on the server.'
                        example: 0.99.2-1
                        oneOf:
                        - description: A version of ClamAV.
                          type: string
                        - description: ClamAV is **not** installed.
                          enum:
                          - 0
                          type: integer
                      cpanel_and_whm:
                        description: The cPanel & WHM version.
                        example: 11.64.0.9999
                        type: string
                      cpanel_packages:
                        description: 'An array of cPanel-provided RPMs.


                          **Note:**


                          The function **only** returns this array if you set the `packages` parameter to `1`.'
                        example:
                        - cpanel-ace-editor-1.1.9-1.cp1152.noarch
                        - cpanel-analog-6.0-2.cp1136.x86_64
                        - cpanel-angular-chosen-1.4.0-1.cp1158.noarch
                        items:
                          type: string
                        type: array
                      cpanel_php:
                        description: 'The system PHP version.


                          * `0` - System PHP is **not** installed on the server.'
