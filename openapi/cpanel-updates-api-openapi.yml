                        oneOf:
                        - description: A version of the cron daemon.
                          type: string
                        - description: ISC / Vixie cron is **not** installed.
                          enum:
                          - 0
                          type: integer
                      cronie:
                        description: 'The version of the cronie cron daemon. This is the default cron service installed on CentOS, CloudLinux, AlmaLinux, and other systems running derivatives of Red Hat Enterprise Linux.


                          * `0` - cronie is **not** installed on the server.'
                        example: 1.4.11-23
                        oneOf:
                        - description: A version of the cron daemon.
                          type: string
                        - description: cronie is **not** installed.
                          enum:
                          - 0
                          type: integer
                      dovecot:
                        description: 'The Dovecot version.


                          * `0` - Dovecot is **not** installed on the server.'
                        example: 2.2.31 (65cde28)
