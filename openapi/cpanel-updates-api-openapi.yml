openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: WHM API.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: WHM Updates API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running WHM.
  url: https://{host}:{port}/json-api
  variables:
    host:
      default: whm-server.tld
      description: The hostname of a server running WHM.
    port:
      default: '2087'
      description: The WHM port.
security:
- BasicAuth: []
tags:
- description: Server Administration / Updates
  name: Updates
paths:
  /accept_eula:
    get:
      description: 'This function records acceptance of cPanel & WHM''s legal terms. To do this, the function creates a touchfile in the `/var/cpanel/activate/` directory and writes an acceptance audit record to `/var/cpanel/activate/eula_acceptance.json`. The audit record captures the accepting user, timestamp, remote IP address, agreement version, and agreement URLs.


        **Important:**


        Server owners *must* accept these agreements before they use cPanel & WHM.'
      operationId: EULA-accept_eula
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: accept_eula
                        type: string
                      reason:
                        description: 'The reason the API function failed when the `metadata.result`

                          field is `0`. This field may display a success message when

                          a function succeeds.'
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed. Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Save EULA acceptance
      tags:
      - Updates
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  accept_eula\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/accept_eula?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '76'
  /get_available_tiers:
