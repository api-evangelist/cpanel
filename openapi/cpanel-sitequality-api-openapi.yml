  /SiteQuality/get_all_scores:
    post:
      description: This function returns information about the cPanel user's Site Quality Monitoring projects' most recent monitoring check results.
      operationId: SiteQuality-get_all_scores
      parameters:
      - description: 'Whether to enable verbose output.


          ** Note: **


          This includes information about the user''s Site Quality Monitoring project''s most recent results in each monitoring check subcategory.'
        in: query
        name: verbose
        required: true
        schema:
          example: 1
          default: null
          type:
          - integer
          - 'null'
          enum:
          - 0
          - 1
          - null
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: get_all_scores
                    type: string
                  module:
                    description: The name of the module called.
                    example: SiteQuality
                    type: string
                  result:
                    properties:
                      data:
                        description: An object that contains score details.
                        type: object
                        properties:
                          scores:
                            description: An array of objects containing score data and the associated system information.
                            type: array
                            items:
                              type: object
                              properties:
                                system:
                                  type: object
                                  properties:
                                    name:
                                      description: The name of the project.
                                      type: string
                                      example: MyProject
                                    id:
                                      description: The project's ID number.
                                      example: 2542
                                      type: integer
                                scores:
                                  type: object
                                  properties:
                                    basic-uptime:
                                      $ref: '#/components/schemas/Score'
                                    basic-performance:
                                      $ref: '#/components/schemas/Score'
                                    basic-seo:
                                      $ref: '#/components/schemas/Score'
                                    basic-content:
                                      $ref: '#/components/schemas/Score'
                                    basic-tech:
                                      $ref: '#/components/schemas/Score'
                                    basic-security:
                                      $ref: '#/components/schemas/Score'
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `errors` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running an API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                type: object
          description: HTTP Request was successful.
      summary: Return all projects' monitoring results
      tags:
      - SiteQuality
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  SiteQuality \\\n  get_all_scores \\\n  verbose=1\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/SiteQuality/get_all_scores?verbose=1
      - label: LiveAPI Perl
        lang: Perl
