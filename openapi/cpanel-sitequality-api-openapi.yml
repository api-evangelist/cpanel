openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: UAPI accesses the cPanel interface's features. Use this API to access and modify cPanel account data and settings.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: cPanel U Site Quality API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running cPanel.
  url: https://{host}:{port}/execute
  variables:
    host:
      default: cpanel-server.tld
      description: The hostname of a server running cPanel.
    port:
      default: '2083'
      description: The cPanel port.
security:
- BasicAuth: []
tags:
- description: The SiteQuality module for UAPI.
  name: SiteQuality
paths:
  /SiteQuality/create_project:
    post:
      description: This function creates a Site Quality Monitoring project. A project bundles together one or more URLs with a shared domain for monitoring.
      operationId: SiteQuality-create_project
      parameters:
      - description: The name of the project to create.
        in: query
        name: name
        required: true
        schema:
          example: MyProject
          type: string
      - description: The URL to monitor.
        in: query
        name: url
        required: true
        schema:
          example: https://example.com
          type: string
      - description: "Whether to enable standard email alerts.\n  * `1` - Enable standard alerting.\n  * `0` - Do not enable standard alerting.\n  * `null` - Do not enable standard alerting."
        in: query
        name: standard_alerting
        required: false
        schema:
          example: 0
          default: null
          type:
          - integer
          - 'null'
          enum:
          - 0
          - 1
          - null
      - description: The monitoring template to use for the project.
        in: query
        name: system_type
        required: false
        schema:
          example: Website
          default: Website
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: create_project
                    type: string
                  module:
                    description: The name of the module called.
                    example: SiteQuality
                    type: string
                  result:
                    properties:
                      data:
                        description: An object that contains project attributes.
                        properties:
                          id:
                            description: The project ID number.
                            example: 1754
                            type: integer
                          identifier:
                            description: The project identifier.
                            example: pro-1754
                            type: string
                          location:
                            description: The region where monitoring checks originate.
                            example: us
                            type: string
                          name:
                            description: The project's name.
                            example: MyProject
                            type: string
                          role:
                            description: Information about the user that owns the project.
                            type: object
                            properties:
                              id:
                                description: The user's role ID number.
                                example: 0
                                type: integer
                              name:
                                description: The user's role title.
                                example: Owner
                                type: string
                          systems:
                            description: Information about the system that the project monitors.
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  description: The name of the system.
                                  example: MyProject
                                  type: string
                                description:
                                  description: A description of the system.
                                  default: null
                                  example: null
                                  type:
                                  - string
                                  - 'null'
                                domain:
                                  description: The system's base domain.
                                  example: https://example.com
                                  type: string
                                id:
                                  description: The system's ID number.
                                  example: 2542
                                  type: integer
                                interval:
                                  description: The time interval for monitoring checks.
                                  example: hour
                                  type: string
                                limits:
                                  description: Restrictions placed on the monitoring checks.
                                  type: object
                                  properties:
                                    maximumCrawlDepth:
                                      description: The maximum number of URLs to check for dead links on a page.
                                      example: 500
                                      default: 500
                                      type: integer
                                system_type:
                                  description: The monitoring template used for the system.
                                  type: object
                                  properties:
                                    name:
                                      description: The name of the system type.
                                      example: Website
                                      default: Website
                                      type: string
                                    id:
                                      description: The system's type ID number.
                                      example: 1
                                      default: 1
                                    fixedComponents:
                                      description: "Whether the system components are immutable.\n  * `true` - The components are immutable.\n  * `false` - The components are not immutable.."
                                      example: true
                                      default: true
                                      type: boolean
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `errors` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running an API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                type: object
          description: HTTP Request was successful.
      summary: Add domain to monitoring
      tags:
      - SiteQuality
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  SiteQuality \\\n  create_project \\\n  name=MyProject \\\n  url='https://example.com'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/SiteQuality/create_project?name=MyProject&url=https://example.com
      - label: LiveAPI Perl
        lang: Perl
        source: "#--------------------------------------------------------------------------------------\n# Instructions:\n#--------------------------------------------------------------------------------------\n# <theme-name> is the theme assigned to cPanel account.\n# 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n# 2) mkdir api_examples\n# 3) cd api_examples\n# 4) create a file SiteQuality_create_project.live.pl and put this code into that file.\n# 5) In your browser login to a cPanel account.\n# 6) Manually change the url from: .../frontend/<theme-name>\n#    to .../frontend/<theme-name>/api_examples/SiteQuality_create_project.live.pl\n#--------------------------------------------------------------------------------------\n\nuse strict;\n\nuse Cpanel::LiveAPI ();\n\nmy $cpanel = Cpanel::LiveAPI->new(); # Connect to cPanel - only do this once.\n\n# Print the header\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\n\n# Call the API\nmy $response = $cpanel->uapi(\n    q/SiteQuality/,\n    q/create_project/,\n    {\n        'name' => 'MyProject',\n        'url' => 'https://example.com',\n    }\n);\n\n# Handle the response\nif ($response->{cpanelresult}{result}{status}) {\n    my $data = $response->{cpanelresult}{result}{data};\n    # Do something with the $data\n    # So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    # Report errors:\n    print to_json($response->{cpanelresult}{result}{errors});\n}\n\n# Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n#--------------------------------------------------------------------------------------\n# Helper function to convert a perl object to html printable json\n#--------------------------------------------------------------------------------------\nsub to_json {\n    require JSON;\n    my $str = JSON->new->pretty->encode($_[0]);\n    return $str;\n}\n"
      - label: LiveAPI PHP
        lang: PHP
        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account.\n// 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file SiteQuality_create_project.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme-name>\n//    to .../frontend/<theme-name>/api_examples/SiteQuality_create_project.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'SiteQuality',\n    'create_project',\n    array (\n        'name' => 'MyProject',\n        'url' => 'https://example.com',\n    )\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    // Do something with the $data\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}"
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: 110
      x-cpanel-plugin: SiteQuality
  /SiteQuality/create_site_quality_user:
    post:
      description: This function creates a Site Quality Monitoring user account associated with a cPanel user account.
      operationId: SiteQuality-create_site_quality_user
      parameters:
      - description: The cPanel account's email address.
        in: query
        name: email
        required: true
        schema:
          example: username@example.com
          type: string
      - description: 'The account''s password.


          **Note:**


          If no password is given, one is auto-generated.


          The system does not save this value.'
        in: query
        name: password
        required: false
        schema:
          example: An3xample!?
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: create_site_quality_user
                    type: string
                  module:
                    description: The name of the module called.
                    example: SiteQuality
                    type: string
                  result:
                    properties:
                      data:
                        description: An object that contains user attributes.
                        properties:
                          app_token:
                            description: The long-lived token for this account. The <a href="https://go.cpanel.net/5k" target="_blank">koality</a> servers require this token to authenticate. If this token is lost, the user must create a new account.
                            example: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9...
                            type: string
                          username:
                            description: The account's username. This value reflects the `email` parameter.
                            example: username@example.com
                            type: string
                          enabled:
                            description: "Whether the account is enabled to process user data.\n * `false` - The account is disabled.\n * `true` - The account is enabled."
                            example: true
                            type:
                            - boolean
                            - 'null'
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages the API generated.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `errors` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings that the API generated. Warnings describe non-critical failures or issues the system noted while running an API function.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                type: object
          description: HTTP Request was successful.
      summary: Register cPanel user for monitoring
      tags:
      - SiteQuality
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  SiteQuality \\\n  create_site_quality_user \\\n  email=username@example.com\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/SiteQuality/create_site_quality_user?email=username@example.com
      - label: HTTP Request (Wire Format)
        lang: HTTP
        source: 'POST /cpsess##########/execute/SiteQuality/create_site_quality_user HTTP/1.1

          Host: example.com:2083

          Cookie: ###################################

          Content-Type: application/json

          Content-Length: 0

          '
      - label: LiveAPI Perl
        lang: Perl
        source: "#--------------------------------------------------------------------------------------\n# Instructions:\n#--------------------------------------------------------------------------------------\n# <theme-name> is the theme assigned to cPanel account.\n# 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n# 2) mkdir api_examples\n# 3) cd api_examples\n# 4) create a file SiteQuality_create_site_quality_user.live.pl and put this code into that file.\n# 5) In your browser login to a cPanel account.\n# 6) Manually change the url from: .../frontend/<theme-name>\n#    to .../frontend/<theme-name>/api_examples/SiteQuality_create_site_quality_user.live.pl\n#--------------------------------------------------------------------------------------\n\nuse strict;\n\nuse Cpanel::LiveAPI ();\n\nmy $cpanel = Cpanel::LiveAPI->new(); # Connect to cPanel - only do this once.\n\n# Print the header\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\n\n# Call the API\nmy $response = $cpanel->uapi(\n    q/SiteQuality/,\n    q/create_site_quality_user/,\n    {\n        'email' => 'username@example.com',\n    }\n);\n\n# Handle the response\nif ($response->{cpanelresult}{result}{status}) {\n    my $data = $response->{cpanelresult}{result}{data};\n    # Do something with the $data\n    # So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    # Report errors:\n    print to_json($response->{cpanelresult}{result}{errors});\n}\n\n# Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n#--------------------------------------------------------------------------------------\n# Helper function to convert a perl object to html printable json\n#--------------------------------------------------------------------------------------\nsub to_json {\n    require JSON;\n    my $str = JSON->new->pretty->encode($_[0]);\n    return $str;\n}\n"
      - label: LiveAPI PHP
        lang: PHP
        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account.\n// 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file SiteQuality_create_site_quality_user.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme-name>\n//    to .../frontend/<theme-name>/api_examples/SiteQuality_create_site_quality_user.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'SiteQuality',\n    'create_site_quality_user',\n    array (\n        'email' => 'username@example.com',\n    )\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    // Do something with the $data\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}"
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: 110
      x-cpanel-plugin: SiteQuality
