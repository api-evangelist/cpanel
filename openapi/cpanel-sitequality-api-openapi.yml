      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  SiteQuality \\\n  verify_code\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/SiteQuality/verify_code
      - label: LiveAPI Perl
        lang: Perl
        source: "#--------------------------------------------------------------------------------------\n# Instructions:\n#--------------------------------------------------------------------------------------\n# <theme-name> is the theme assigned to cPanel account.\n# 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n# 2) mkdir api_examples\n# 3) cd api_examples\n# 4) create a file SiteQuality_verify_code.live.pl and put this code into that file.\n# 5) In your browser login to a cPanel account.\n# 6) Manually change the url from: .../frontend/<theme-name>\n#    to .../frontend/<theme-name>/api_examples/SiteQuality_verify_code.live.pl\n#--------------------------------------------------------------------------------------\n\nuse strict;\n\nuse Cpanel::LiveAPI ();\n\nmy $cpanel = Cpanel::LiveAPI->new(); # Connect to cPanel - only do this once.\n\n# Print the header\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\n\n# Call the API\nmy $response = $cpanel->uapi(\n    q/SiteQuality/,\n    q/verify_code/,\n    {\n        'code' => '123456',\n    }\n);\n\n# Handle the response\nif ($response->{cpanelresult}{result}{status}) {\n    my $data = $response->{cpanelresult}{result}{data};\n    # Do something with the $data\n    # So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    # Report errors:\n    print to_json($response->{cpanelresult}{result}{errors});\n}\n\n# Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n#--------------------------------------------------------------------------------------\n# Helper function to convert a perl object to html printable json\n#--------------------------------------------------------------------------------------\nsub to_json {\n    require JSON;\n    my $str = JSON->new->pretty->encode($_[0]);\n    return $str;\n}\n"
      - label: LiveAPI PHP
        lang: PHP
        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account.\n// 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file SiteQuality_verify_code.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme-name>\n//    to .../frontend/<theme-name>/api_examples/SiteQuality_verify_code.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'SiteQuality',\n    'verify_code',\n    {\n        'code' => '123456',\n    }\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    // Do something with the $data\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}"
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: 110
      x-cpanel-plugin: SiteQuality
components:
  schemas:
    Score:
      type: object
      properties:
        master:
          description: The overall results for the check.
          type: object
          properties:
            title:
              description: The title of the check.
              example: Uptime
              type: string
            status:
              description: "The check's summarized status.\n  * `good` — The check has returned a positive result.\n  * `bad`  — The check has returned a negative result."
              type: string
              example: good
              enum:
              - good
              - bad
            message:
              description: The check's status message.
              example: The project is proving to be very reliable (currently and in the last 30 days) and has good accessibility. The current level should be maintained.
              type: string
            description:
              description: A description of the check.
              example: If a project is unavailable, customers cannot visit, browse or make purchases. The accessibility assessment is based on the current situation, but also on historical values and trends.
              type: string
            identifier:
              description: An unique identifier for the check.
              example: Score:Basic:Uptime
              type: string
            score:
              description: 'A numeral score for the check.


                ** Note: **


                A higher score indicates that your website performs well in that check.'
              example: 100
              type: integer
            incidents:
              type: array
              example: []
              default: []
            attributes:
              type: object
              properties:
                score:
                  type: integer
                  example: 100
                limit:
                  type: integer
                  example: 0
        sub_scores:
          description: 'Monitoring checks subcategory results.


            ** Note: **


            We use the check subcategory results to calculate the master results.'
          type: array
          example: []
          default: []
          items:
            type: object
            properties:
              title:
                description: The title of the check subcategory.
                example: Current availability
                type: string
              status:
                description: "The check subcategory's summarized status.\n  * `good` — The check has returned a positive result.\n  * `bad`  — The check has returned a negative result."
                type: string
                example: good
                enum:
                - good
                - bad
              message:
                description: The check subcategory's status message.
                example: All project pages can be reached and thus be visited by potential customers.
                type: string
              description:
                description: A description of the check.
                example: It is evaluated whether the project is currently accessible. If it is not, this is usually due to technical reasons.
                type: string
              identifier:
                description: An unique identifier for the check.
                example: Score:Uptime:Down
                type: string
              score:
                description: 'A numeral score for the check subcategory.


                  ** Note: **


                  A higher score indicates that your website performs well in that check.'
                example: 100
                type: integer
              incidents:
                example: []
                type: array
                default: []
              weight:
                description: The weighted contribution of the subcategory check's `score` result to the `master` object's `score` result.
                example: 20
                type: integer
              weighted_score:
                description: The score after weight has been adjusted.
                example: 20
                type: integer
              attributes:
                type: object
                properties:
                  scoring:
                    type: string
                    example: good
                  score:
                    type: integer
                    example: 100
                  components_processed:
                    type: integer
                    example: 1
                  components_failed:
                    type: integer
                    example: 0
                  limit:
                    type: integer
                    example: 0
                  tool:
                    type: string
                    example: KoalaPing
  securitySchemes:
    BasicAuth:
      scheme: basic
      type: http
