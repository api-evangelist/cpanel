  /package_manager_list_packages:
    get:
      description: This function lists information about the system's available RPM packages.
      operationId: PackageManager-package_manager_list_packages
      parameters:
      - description: 'Return RPM packages that exist in a specified state.


          * `any` — All RPMs available on the system.

          * `installed` — The RPMs installed on the system.

          * `not_installed` — The available RPMs not yet installed on the system.

          * `updatable` — The RPMs with updates available.'
        in: query
        name: state
        schema:
          default: any
          enum:
          - any
          - installed
          - not_installed
          - updatable
          example: installed
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    description: A list of RPM objects that match the requested `state`.
                    properties:
                      packages:
                        description: An array of objects that contains the RPM packages on the system.
                        example:
                        - package: MariaDB-client
                        - package: MariaDB-common
                        items:
                          properties:
                            package:
                              description: An RPM package.
                              type: string
                          type: object
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: package_manager_list_packages
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return available RPM packages
      tags:
      - RPM
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  package_manager_list_packages\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/package_manager_list_packages?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.52'
  /package_manager_resolve_actions:
    get:
      description: This function determines the actions that would result from the provisioning of a specified RPM package or packages.
      operationId: PackageManager-package_manager_resolve_actions
      parameters:
      - description: 'The name of an RPM package.


          **Note:**


          * To submit more than one package, pass the parameter multiple times. For example,

          `package=ea-php55` and `package=ea-apr-util`.'
        examples:
          multiple:
            summary: Submit multiple RPM packages.
            value: package=ea-apache24-mod_headers package=ea-apache24-mod_cgid package=ea-apache24-mod_mpm_event
          single:
            summary: Submit a single RPM package.
            value: ea-apache24-mod_headers
        in: query
        name: package
        required: true
        schema:
          type: string
      - description: 'The RPM namespace that represents a set of packages.

          **Note:**

          * `ea` and any from `ea4_get_additional_pkg_prefixes` API call are the **only** possible values. * When more than one namespace is involved, pass the parameter multiple times. For example, `ns=ea` and `ns=altea`.'
        examples:
          multiple:
            summary: Operate under multiple namespaces.
            value: ns=ea ns=altea
          single:
            summary: Operate under one namespace.
            value: ea
        in: query
        name: ns
        required: false
        schema:
          enum:
          - ea
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      install:
                        description: A list of RPM packages that the system would install if you provisioned them as currently selected.
                        example:
                        - ea-apache24-mod_mpm_event
                        - ea-apache24-mod_cgid
                        items:
                          type: string
                        type: array
                      unaffected:
                        description: A list of unaffected RPM packages.
                        example:
                        - ea-php70-php-devel
                        - ea-php56-runtime
                        - ea-php55-php-common
                        - ea-apache24-mod_headers
                        - ea-php56-php-bcmath
                        - ea-php70-php-curl
                        - ea-php70-php-xml
                        items:
                          type: string
                        type: array
                      uninstall:
                        description: A list of RPM packages that the system would uninstall if you provisioned them as currently selected.
                        example:
                        - ea-apache24-mod_cgi
                        - ea-apache24-mod_mpm_prefork
                        items:
                          type: string
                        type: array
                      upgrade:
                        description: A list of RPM packages that the system would upgrade if you provisioned them as currently selected.
                        example:
                        - ea-php56
                        items:
                          type: string
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: package_manager_resolve_actions
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return possible RPM package changes
      tags:
      - RPM
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  package_manager_resolve_actions \\\n  package='ea-apache24-mod_headers'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/package_manager_resolve_actions?api.version=1&package=ea-apache24-mod_headers
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.52'
  /package_manager_submit_actions:
    get:
      description: 'This function installs, upgrades, or uninstalls RPM packages.


        **Note:**


        The system queues this function''s actions to run as background tasks. The actions may

        require additional time to finish.'
      operationId: PackageManager-package_manager_submit_actions
      parameters:
      - description: 'The RPM package that you want to install. If you do not use this parameter, the function

          does not install a package.


          **Note:**


          You can pass this parameter multiple times to install more than one RPM package'
        examples:
          multiple:
            summary: Install multiple RPM packages.
            value: install=package1 install=package2
          single:
            summary: Install a single RPM package.
            value: package1
        in: query
        name: install
        required: false
        schema:
          type: string
      - description: 'The RPM package that you want to uninstall. If you do not use this parameter, the function

          does not uninstall a package.


          **Note:**


          You can pass this parameter multiple times to uninstall more than one RPM package.'
        examples:
          multiple:
            summary: Uninstall multiple RPM packages.
            value: uninstall=package3 uninstall=package4 uninstall=package5
          single:
            summary: Uninstall a single RPM package.
            value: package3
        in: query
        name: uninstall
        required: false
        schema:
          type: string
      - description: 'The RPM package that you want to upgrade. If you do not use this parameter, the function

          does not upgrade a package.


          **Note:**


          You can pass this parameter multiple times to upgrade more than one RPM package.'
        examples:
          multiple:
            summary: Upgrade multiple RPM packages.
            value: upgrade=package6 upgrade=package7 upgrade=package8
          single:
            summary: Upgrade a single RPM package.
            value: package6
        in: query
        name: upgrade
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      build:
                        description: A valid Process ID (PID).
                        example: 9717
                        type: integer
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: package_manager_submit_actions
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Start RPM package installation, update, or removal
      tags:
      - RPM
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  package_manager_submit_actions\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/package_manager_submit_actions?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.52'
