                type: object
          description: HTTP Request was successful.
      summary: Enable login security
      tags:
      - cPHulk
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  enable_cphulk\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/enable_cphulk?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.48'
  /flush_cphulk_login_history:
    get:
      description: 'This function removes the login history entries from the cPHulk

        database.'
      operationId: cPHulk-flush_cphulk_login_history
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      records_removed:
                        description: 'The number of entries that the function deleted

                          from the cPHulk database.'
                        example: 10
                        minimum: 0
                        type: integer
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: flush_cphulk_login_history
                        type: string
                      reason:
                        description: 'The reason the API function failed when the `metadata.result`

                          field is `0`. This field may display a success message when

                          a function succeeds.'
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Remove all login security records
      tags:
      - cPHulk
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  flush_cphulk_login_history\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/flush_cphulk_login_history?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.48'
  /flush_cphulk_login_history_for_ips:
    get:
      description: This function removes specific login history entries from the cPHulk database. Use this function to unblock one or more IP addresses.
      operationId: cPHulk-flush_cphulk_login_history_for_ips
      parameters:
      - description: "The record's IP address.\n\n**Note:**\n\n To unblock multiple IP addresses, increment the parameter name (for example, to unblock three IP addresses, use the `ip-1`, `ip-2`, and `ip-3` parameters)."
        examples:
          multiple:
            description: Multiple IPv4 addresses.
            value:
            - 192.168.0.1
            - 192.168.0.2
            - 192.168.0.3
          multiple-ipv6:
            summary: Multiple IPv6 addresses.
            value:
            - 2001:db8::1
            - 2002:db8::1
            - 2003:db8::1
          single:
            description: A single IPv4 address.
            value:
            - 192.168.0.1
          single-ipv6:
            summary: Single IPv6 Address
            value:
            - 2001:db8::1
        explode: true
        in: query
        name: ip
        required: true
        schema:
          items:
            anyOf:
            - format: ipv4
              type: string
            - format: ipv6
              type: string
          type: array
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      iptable_bans_removed:
                        description: The number of `iptables` temporary block rules that the function deleted.
                        example: 1
                        minimum: 0
                        type: integer
                      records_removed:
                        description: The number of entries that the function deleted.
                        example: 1
                        minimum: 0
                        type: integer
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: flush_cphulk_login_history_for_ips
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
