openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: WHM API.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: WHM C P Hulk API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running WHM.
  url: https://{host}:{port}/json-api
  variables:
    host:
      default: whm-server.tld
      description: The hostname of a server running WHM.
    port:
      default: '2087'
      description: The WHM port.
security:
- BasicAuth: []
tags:
- description: The cPHulk module for WHM API 1.
  name: cPHulk
paths:
  /batch_create_cphulk_records:
    post:
      description: This function adds one or more records to cPHulk's whitelist or blacklist. The function includes the option to add unique comments for each IP address that you add.
      operationId: cPHulk-batch_create_cphulk_records
      requestBody:
        content:
          application/json:
            schema:
              example:
                api.version: 1
                list_name: white
                records:
                - comment: Automated update tools.
                  ip: 192.168.0.1
                - comment: System administrators and support systems.
                  ip: 192.168.1.0/30
                - comment: Owner of example.com.
                  ip: 122.1.56.7-122.1.56.8
                - comment: Special access group 1
                  ip: '2001:db9::'
                - comment: Special access group 1
                  ip: 2001:db9::1-2001:db9::5
                - comment: Special access group 2
                  ip: 2001:db8::/32
              properties:
                api.version:
                  description: The WHM API version number.
                  enum:
                  - 1
                  type: integer
                list_name:
                  description: 'The cPHulk list''s name.


                    * `black` - Add a new record or records to the blacklist.

                    * `white` - Add a new record or records to the whitelist. '
                  enum:
                  - black
                  - white
                  example: white
                  type: string
                records:
                  description: The list of records to add to the whitelist or blacklist.
                  items:
                    description: A whitelist or blacklist record.
                    properties:
                      comment:
                        example: Dangerous website
                        maximum: 255
                        type: string
                      ip:
                        $ref: '#/components/schemas/ip-address'
                    required:
                    - ip
                    type: object
                  type: array
                skip_enabled_check:
                  default: 0
                  description: "Whether to skip checking if cPHulk runs on the server.\n\n* `1` - Do **not** check if cPHulk is running.\n* `0` - Check if cPHulk is running.\n\n**Note:**\n\n If cPHulk is disabled and you check its status, the function returns the following message: `cPHulk is disabled on the server.` "
                  enum:
                  - 0
                  - 1
                  example: 1
                  type: integer
              required:
              - api.version
              - list_name
              - records
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      comment:
                        description: The comment that you included when you called the function.
                        example: George Wendt flying through the air.
                        type: string
                      ip_blocks_removed:
                        description: The number of IP address blocks that the function deleted.
                        example: 1
                        type: integer
                      ips_added:
                        description: An array of IP addresses that the function added from the list. This function will always returns ranges in the IP1-IP2 format.
                        example:
                        - 192.168.0.1
                        - 192.168.1.0-192.168.1.3
                        - 122.1.56.7-122.1.56.8
                        items:
                          $ref: '#/components/schemas/ip-address'
                        type: array
                      ips_failed:
                        additionalProperties:
                          description: 'The reason why the system failed to add an IP address to the list.


                            **Note:**


                            The IP address is the return''s name.'
                          type: string
                        description: An object of IP addresses that the system failed to add to the list. This object contains one or more IP address returns.
                        example:
                          192.168.0.1: 'Invalid IP address or range: "192.68.0.1"'
                        type: object
                      iptable_bans_removed:
                        description: The number of `iptables` temporary block rules that the function deleted.
                        example: 0
                        minimum: 0
                        type: integer
                      list_name:
                        description: 'The cPHulk list''s name.

                          * `black`

                          * `white`'
                        enum:
                        - black
                        - white
                        example: white
                        type: string
                      original_ips_added:
                        description: "An array of IP addresses that the function added from the list.\n  The system will return the one of the following formats:\n\n - A IPv4 address (192.168.0.1).\n - A simple IPv4 address range (192.168.1.1-192.168.1.4).\n - A CIDR IPv4 address range (192.168.1.0/30)."
                        example:
                        - 192.168.0.1
                        - 192.168.1.0/30
                        - 122.1.56.7-122.1.56.8
                        items:
                          $ref: '#/components/schemas/ip-address'
                        type: array
                      requester_ip:
                        anyOf:
                        - format: ipv4
                          type: string
                        - format: ipv6
                          type: string
                        description: The IP address of the user or system that requested the addition.
                        example: 10.1.4.228
                      requester_ip_is_whitelisted:
                        description: 'Whether the requester''s IP address exists on cPHulk''s whitelist.

                          * `1` - Whitelisted.

                          * `0` - Not whitelisted.'
                        enum:
                        - 0
                        - 1
                        example: 0
                        type: integer
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: batch_create_cphulk_records
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Add login security record to list with comment
      tags:
      - cPHulk
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "echo '{\"api.version\":\"1\",\"list_name\":\"white\",\"records\":[{\"comment\":\"Automated update tools.\",\"ip\":\"192.168.0.1\"},{\"comment\":\"System administrators and support systems.\",\"ip\":\"192.168.1.1/30\"},{\"comment\":\"Owner of example.com.\",\"ip\":\"122.1.56.7-122.1.56.8\"}]}' | \\\nwhmapi1 --input=json --output=jsonpretty \\\n  batch_create_cphulk_records"
      - label: HTTP Request (Wire Format)
        lang: HTTP
        source: 'POST /cpsess##########/json-api/batch_create_cphulk_records HTTP/1.1

          Host: example.com:2083

          Cookie: ###################################

          Content-Type: application/json

          Content-Length: 260


          {"api.version":"1","list_name":"white","records":[{"comment":"Automated update tools.","ip":"192.168.0.1"},{"comment":"System administrators and support systems.","ip":"192.168.1.1/30"},{"comment":"Owner of example.com.","ip":"122.1.56.7-122.1.56.8"}]}'
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.48'
  /cphulk_status:
    get:
      description: This function returns the status of the cPHulk service.
      operationId: cPHulk-cphulk_status
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      is_enabled:
                        description: 'Whether the cPHulk service is enabled.

                          * `1` - cPHulk is enabled.

                          * `0` - cPHulk is disabled.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      service:
                        description: The cPHulk service's name.
                        example: cPHulk
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: cphulk_status
                        type: string
                      reason:
                        description: 'The reason the API function failed when the `metadata.result`

                          field is `0`. This field may display a success message when

                          a function succeeds.'
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return login security status
      tags:
      - cPHulk
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  cphulk_status\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/cphulk_status?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.48'
  /create_cphulk_record:
    get:
      description: This function adds a new record or records to cPHulk's whitelist or blacklist.
      operationId: cPHulk-create_cphulk_record
      parameters:
      - description: 'The record''s IP address, if there is only one IP address to add.


          **Note:**


          To add multiple IP addresses, increment the parameter name. For example, `ip-1`, `ip-2`, and `ip-3`.'
        examples:
          multiple:
            description: Add multiple IP addresses.
            value:
            - 192.168.0.1
            - 192.168.0.2
            - 192.168.0.3
          single:
            description: Add a single IP address.
            value:
            - 192.168.0.1
        explode: true
        in: query
        name: ip
        required: true
        schema:
          items:
            $ref: '#/components/schemas/ip-address'
        style: form
      - description: 'The cPHulk list''s name.


          * `black` - Add a new record or records to the blacklist.

          * `white` - Add a new record or records to the whitelist. '
        in: query
        name: list_name
        required: true
        schema:
          enum:
          - black
          - white
          example: white
          type: string
      - description: A comment to include.
        in: query
        name: comment
        required: false
        schema:
          example: George Wendt flying through the air.
          maximum: 255
          type: string
      - description: "Whether to skip checking if cPHulk runs on the server.\n\n* `1` - Do **not** check if cPHulk is running.\n* `0` - Check if cPHulk is running.\n\n**Note:**\n\n If cPHulk is disabled and you check its status, the function returns the following message: `cPHulk is disabled on the server.` "
        in: query
        name: skip_enabled_check
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      comment:
                        description: The comment that you included when you called the function.
                        example: George Wendt flying through the air.
                        type: string
                      ip_blocks_removed:
                        description: The number of IP address blocks that the function deleted.
                        example: 1
                        type: integer
                      ips_added:
                        description: An array of IP addresses that the function added to the list.
                        items:
                          $ref: '#/components/schemas/ip-address'
                        type: array
                      ips_failed:
                        additionalProperties:
                          description: 'The reason why the system failed to add an IP address to the list.


                            **Note:**


                            The IP address is the return''s name.'
                          type: string
                        description: A object of IP addresses that the system failed to add to the list. This object contains one or more IP address returns.
                        example:
                          192.168.0.1: 'Invalid IP address or range: "192.68.0.1"'
                        type: object
                      iptable_bans_removed:
                        description: The number of `iptables` temporary block rules that the function deleted.
                        example: 0
                        minimum: 0
                        type: integer
                      list_name:
                        description: 'The cPHulk list''s name.

                          * `black`

                          * `white`'
                        enum:
                        - black
                        - white
                        example: white
                        type: string
                      requester_ip:
                        anyOf:
                        - format: ipv4
                          type: string
                        - format: ipv6
                          type: string
                        description: The IP address of the user or system that requested the addition.
                        example: 10.1.4.228
                      requester_ip_is_whitelisted:
                        description: 'Whether the requester''s IP address exists on cPHulk''s whitelist.

                          * `1` - Whitelisted.

                          * `0` - Not whitelisted.'
                        enum:
                        - 0
                        - 1
                        example: 0
                        type: integer
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: create_cphulk_record
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Add login security record to list
      tags:
      - cPHulk
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  create_cphulk_record \\\n  list_name='white' \\\n  ip='192.168.0.1'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/create_cphulk_record?api.version=1&list_name=white&ip=192.168.0.1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.48'
  /delete_cphulk_record:
    get:
      description: This function deletes a record or records from cPHulk's whitelist or blacklist.
      operationId: cPHulk-delete_cphulk_record
      parameters:
      - description: "The record's IP address.\n\n**Note:**\n\n To delete multiple IP addresses, increment the parameter name. For example, `ip-1`, `ip-2`, `ip-3`."
        examples:
          multiple:
            description: Multiple IP addresses.
            value:
            - 192.168.0.1
            - 192.168.0.2
            - 2001:db8::1
            - 2002:db8::1
          single:
            description: Single IP address.
            value:
            - 192.168.0.1
        explode: true
        in: query
        name: ip
        required: true
        schema:
          items:
            $ref: '#/components/schemas/ip-address'
          type: array
        style: form
      - description: 'The cPHulk list''s name.


          * `white`

          * `black`'
        in: query
        name: list_name
        required: true
        schema:
          enum:
          - white
          - black
          example: white
          type: string
      - description: "Whether to skip checking if cPHulk runs on the server.\n\n* `1` - Don’t check cPHulk’s status.\n* `0` - Check cPHulk’s status.\n\n**Note:**\n\n If cPHulk is disabled and you check its status, the function returns the following message:\n`cPHulk is disabled on the server`."
        in: query
        name: skip_enabled_check
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      ips_failed:
                        additionalProperties:
                          description: "The reason why the system failed to add the IP address to the list.\n\n**Note:**\n\n The IP address is the property name."
                          example: Invalid IP address or range "192.68.0.1"
                          type: string
                        description: Information about IP addresses that the system failed to add to the list.
                        example:
                          192.168.0.1: This is why, alpha.
                          192.168.9.1: This is why, beta.
                        type: object
                      ips_removed:
                        description: The IP addresses that the function removed from the list.
                        items:
                          example: 192.168.0.1
                          format: ipv4
                          type: string
                        type: array
                      list_name:
                        description: 'The cPHulk list''s name.

                          * `black`

                          * `white`'
                        enum:
                        - black
                        - white
                        example: white
                        type: string
                      requester_ip:
                        description: The requester's IP address.
                        example: 192.168.0.1
                        format: ipv4
                        type: string
                      requester_ip_is_whitelisted:
                        description: 'Whether the requester''s IP address exists on cPHulk''s whitelist.

                          * `1` - Whitelisted.

                          * `0` - **Not** whitelisted.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: delete_cphulk_record
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed: Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Remove login security record from list
      tags:
      - cPHulk
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  delete_cphulk_record \\\n  list_name='white' \\\n  ip='192.168.0.1'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/delete_cphulk_record?api.version=1&list_name=white&ip=192.168.0.1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.48'
