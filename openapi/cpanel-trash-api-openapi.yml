openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: UAPI accesses the cPanel interface's features. Use this API to access and modify cPanel account data and settings.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: cPanel U Trash API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running cPanel.
  url: https://{host}:{port}/execute
  variables:
    host:
      default: cpanel-server.tld
      description: The hostname of a server running cPanel.
    port:
      default: '2083'
      description: The cPanel port.
security:
- BasicAuth: []
tags:
- description: The Trash module for UAPI.
  name: Trash
paths:
  /Trash/remove:
    post:
      description: Force-deletes a single item from the current user's ~/.trash directory. Unlike Fileman.fileop op=unlink, this uses a non-safe recursive delete, so permission-locked entries (e.g. a 0444 file or a 0555 subdirectory preserved from a backup) are actually removed instead of being silently skipped and falsely reported as deleted. The path parameter must resolve strictly within ~/.trash (symlinks and `..` traversal are resolved before the confinement check runs); the trash root itself can never be the target. If the target is already absent, this is an idempotent success rather than an error. On success, the stale line (if any) for the removed item is pruned from the trash's restore map.
      operationId: remove
      parameters:
      - description: Home-relative path of the item to permanently delete. Must resolve strictly within ~/.trash.
        in: query
        name: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    example: 3
                    type: integer
                  func:
                    example: remove
                    type: string
                  module:
                    example: Trash
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          alreadyGone:
                            description: True when the target was already absent (idempotent success); omitted otherwise.
                            example: false
                            type: boolean
                          removed:
                            description: Always true on success.
                            example: true
                            type: boolean
                        type: object
                      errors:
                        items:
                          type: string
                        type: array
                      messages:
                        items:
                          type: string
                        type: array
                      status:
                        example: 1
                        type: integer
                      warnings:
                        items:
                          type: string
                        type: array
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Permanently delete a single item from the trash
      tags:
      - Trash
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  Trash \\\n  remove \\\n  path=/.trash/backup-7.14.2026_16-35-25_alonglonglon\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/Trash/remove
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: 136
      x-cpanel-plugin: Trash
