openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: WHM API.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: WHM IP Addresses API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running WHM.
  url: https://{host}:{port}/json-api
  variables:
    host:
      default: whm-server.tld
      description: The hostname of a server running WHM.
    port:
      default: '2087'
      description: The WHM port.
security:
- BasicAuth: []
tags:
- description: The IP Addresses module for WHM API 1.
  name: IP Addresses
paths:
  /addips:
    get:
      description: 'This function adds an IPv4 address or addresses to the server.

        When you add an IP address, the system attempts to add an alias of that IP

        address to the main network interface. This process rebuilds the IP address

        pool, which resides in the `/etc/ipaddrpool` file. The system stores IP addresses

        within the `/etc/ips` file. The `ipaliases` service activates those IP addresses

        when the server starts.'
      operationId: Ips-addips
      parameters:
      - description: 'The IPv4 address or address range

          in [Class C CIDR format](http://en.wikipedia.org/wiki/Classless_Inter-Domain_Routing).'
        examples:
          ipv4:
            summary: IPv4 address
            value: 192.168.0.0
          ipv4range:
            summary: IPv4 address range
            value: 192.168.0.20/28
        in: query
        name: ips
        required: true
        schema:
          type: string
      - description: 'The IPv4 address'' netmask.


          **Note:**


          If the `ips` parameter is in Class C CIDR format,

          the range mask **must** be a value from `24` through `30`.'
        in: query
        name: netmask
        required: true
        schema:
          example: 255.255.255.0
          format: ipv4
          type: string
      - description: 'An IPv4 address or comma-delimited list of IPv4 addresses to exclude.


          **Note:**


          If you do not specify a value,

          the function does not exclude any IPv4 addresses.'
        examples:
          multiple:
            summary: Multiple IP addresses.
            value: excludes=192.0.20.0,192.0.20.1
          single:
            summary: A single IP address.
            value: 192.0.20.0
        explode: false
        in: query
        name: excludes
        required: false
        schema:
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: addips
                        type: string
                      output:
                        properties:
                          messages:
                            description: A list of messages returned from the function.
                            items:
                              example: eth0:cp1 is now up. 192.168.0.20/255.255.255.0 broadcast 192.168.0.255 has been added.
                              type: string
                            type: array
                        type: object
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: Success
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Add IP addresses
      tags:
      - IP Addresses
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  addips \\\n  ips='192.168.0.0' \\\n  netmask='255.255.255.0'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/addips?api.version=1&ips=192.168.0.0&netmask=255.255.255.0
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11'
  /delip:
    get:
      description: This function removes an IP address from the server.
      operationId: Ips-delip
      parameters:
      - description: The IPv4 address.
        in: query
        name: ip
        required: true
        schema:
          example: 10.1.1.1
          format: ipv4
          type: string
      - description: The network alias to which the IPv4 address is bound.
        in: query
        name: ethernetdev
        required: false
        schema:
          default: ''
          example: eth0
          type:
          - string
          - 'null'
      - description: 'Whether to remove the IP address if the ethernet interface is down.

          * `1` — Do **not** remove the IP address.

          * `0` — Remove the IP address.'
        in: query
        name: skipifshutdown
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: delip
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: eth0:cp2 is now down, 10.1.1.1 has been removed
                        type: string
                      result:
                        description: '* `1` — Success

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Remove IP address
      tags:
      - IP Addresses
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  delip \\\n  ip='10.1.1.1'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/delip?api.version=1&ip=10.1.1.1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11'
  /get_public_ip:
    get:
      description: 'This function returns the public IP address for a specified public or private IP address. You can use this function to determine the system''s main public IP address, especially for systems that use a 1:1 NAT configuration.

        * cPanel & WHM uses the main public IP address to perform many different functions. For example, the system uses this IP address to verify the server''s license status with WebPros International, LLC.

        * System administrators can configure the main public IP address in WHM''s Basic WebHost Manager Setup interface (_Home >> Server Configuration >> Basic WebHost Manager Setup_).'
      operationId: Ips-get_public_ip
      parameters:
      - description: A valid public or private IP address to query.
        in: query
        name: ip
        required: true
        schema:
          example: 192.0.2.0
          format: ipv4
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      public_ip:
                        description: The public IP address.
                        example: 192.0.2.0
                        format: ipv4
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: get_public_ip
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return public IP address of private IP address
      tags:
      - IP Addresses
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  get_public_ip \\\n  ip='192.0.2.0'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/get_public_ip?api.version=1&ip=192.0.2.0
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '62'
  /get_shared_ip:
    get:
      description: This function retrieves the IP address that an account shares with the accounts that it owns.
      operationId: Ips-get_shared_ip
      parameters:
      - description: 'The WHM user''s username.


          **Note:**


          This parameter defaults to the currently-authenticated user.'
        in: query
        name: user
        required: false
        schema:
          example: example
          format: username
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      ip:
                        description: "The IP address that the WHM user shares.\n\n**Note:**\n\n If the user does **not** have a shared IP address, the function returns the tilde ( `~` ) character."
                        example: 192.168.0.1
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: get_shared_ip
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return shared IP address
      tags:
      - IP Addresses
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  get_shared_ip\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/get_shared_ip?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '62'
  /ipv6_disable_account:
    get:
      description: 'This function removes the IPv6 address from an account.


        **Notes:**


        - When you disable IPv6 on an account, the system unbinds that IPv6 address from your server and the account loses the address. If you enable IPv6 on that account again, the system assigns it a different IPv6 address.

        - For all of cPanel & WHM''s features to function properly on IPv6, the `cpsrvd` daemon **must** listen on IPv6 addresses. To enable this functionality, select On for the *Listen on IPv6 Addresses* setting in the *System* section of WHM''s Tweak Settings interface (*WHM >> Home >> Server Configuration >> Tweak Settings*).


        **Important:**


        When you disable the Web Server role, the system **disables** this function.'
      operationId: IPv6-ipv6_disable_account
      parameters:
      - description: A comma delimited list of account names.
        in: query
        name: user
        required: true
        schema:
          example: user1,user2,user3
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      fail_cnt:
                        description: 'The number of accounts that failed to disable IPv6.


                          **Note**


                          The function only returns this value if any failures exist.'
                        example: 0
                        minimum: 0
                        type: integer
                      failures:
                        description: 'List of accounts where IPv6 disable failed


                          **Note**


                          The function only returns this value if any failures exist.'
                        items:
                          properties:
                            name:
                              description: The name of the account where IPv6 disable failed
                              example: user1
                              format: username
                              type: string
                            reason:
                              description: The reason for the IPv6 disable failure
                              example: The “user1” account does not exist.
                          type: object
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: ipv6_disable_account
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Remove IPv6 address range from account
      tags:
      - IP Addresses
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  ipv6_disable_account \\\n  user='user1,user2,user3'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/ipv6_disable_account?api.version=1&user=user1%2cuser2%2cuser3
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.40'
  /ipv6_enable_account:
    get:
      description: 'This function assigns an IPv6 address to one or more accounts.


        **Note:**


        You **must** perform at least one of the following actions before you call this function:

        * Use WHM''s *IPv6 Ranges* interface (*WHM >> Home >> IP Functions >> IPv6 Ranges*) or WHM API 1''s `ipv6_range_add` function to add one or more IPv6 address ranges for use as dedicated IPv6 addresses.

        * Use WHM''s *Basic WebHost Manager Setup* interface (*WHM >> Home >> Server Configuration >> Basic WebHost Manager Setup*) or modify the `/etc/wwwacct.conf` file to add a shared IPv6 address to the server.

        * For all of cPanel & WHM''s features to function properly on IPv6, the `cpsrvd` daemon **must** listen on IPv6 addresses. To enable this functionality, select *On* for the *Listen on IPv6 Addresses* setting in the *System* section of WHM''s *Tweak Settings* interface (*WHM >> Home >> Server Configuration >> Tweak Settings*).


        **Important:**


        When you disable the Web Server role, the system **disables** this function.'
      operationId: IPv6-ipv6_enable_account
      parameters:
      - description: 'The IPv6 address range''s name.


          **Note:**


          The range name `SHARED` will assign the server''s shared IPv6 address to the account(s).'
        in: query
        name: range
        required: true
        schema:
          example: Hosting_IPv6_Block
          type: string
      - description: A comma-delimited list of account names.
        in: query
        name: user
        required: true
        schema:
          example: user1,user2,user3
          format: username
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    example:
                      fail_cnt: 2
                      failures:
                        brain: The “brain” account does not exist.
                        pinky: The “pinky” account does not exist.
                      ipv6:
                        chewie: 2001:0db8:1a34:56cf:0000:0000:0000:0000
                        cptest: 2001:0db8:1a34:56cf:0000:0000:0000:0001
                        domain1: 2001:0db8:1a34:56cf:0000:0000:0000:0002
                    properties:
                      fail_cnt:
                        description: The number of accounts that failed to enable IPv6.
                        example: 0
                        minimum: 0
                        type: integer
                      failures:
                        additionalProperties:
                          description: 'The account and the reason why IPv6 enable failed.


                            **Note:**


                            The function uses the account name as the return''s name.'
                          example: Failed to enable IPv6
                          type: string
                        description: List of accounts where IPv6 enable failed.
                        type: object
                      ipv6:
                        additionalProperties:
                          description: 'The account and the IPv6 address assigned to the account.


                            **Note:**


                            The function uses the account name as the return''s name.'
                          type: string
                        description: The IPv6 addresses that the system assigned to each account.
                        type: object
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: ipv6_enable_account
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed: Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Add IPv6 address range to accounts
      tags:
      - IP Addresses
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  ipv6_enable_account \\\n  user='user1,user2,user3' \\\n  range='Hosting_IPv6_Block'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/ipv6_enable_account?api.version=1&user=user1%2cuser2%2cuser3&range=Hosting_IPv6_Block
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.40'
  /ipv6_range_add:
    get:
      description: 'This function adds a range of IPv6 addresses to the server.


        **Notes:**


        - This function **cannot** modify the server''s shared IPv6 address. To update that address, modify the /etc/wwwacct.conf file, or use WHM''s *Basic WebHost Manager Setup* interface (*Home >> Server Configuration >> Basic WebHost Manager Setup*).

        - For all of cPanel & WHM''s features to function properly on IPv6, the `cpsrvd` daemon **must** listen on IPv6 addresses. To enable this functionality, select *On* for the *Listen on IPv6 Addresses* setting in the *System* section of WHM''s *Tweak Settings* interface (*WHM >> Home >> Server Configuration >> Tweak Settings*).


        **Important:**


        When you disable the Web Server role, the system **disables** this function.'
      operationId: IPv6-ipv6_range_add
      parameters:
      - description: 'The IPv6 address range''s name.


          **Note:**


          You **cannot** use SHARED as a range''s name.

          It is reserved for the server''s shared IPv6 address.'
        in: query
        name: name
        required: true
        schema:
          example: ExampleRange
          type: string
      - description: 'The IPv6 address range and network portion

          in [CIDR format](http://en.wikipedia.org/wiki/Classless_Inter-Domain_Routing).'
        in: query
        name: range
        required: true
        schema:
          example: 2001:db8:66ac:cafe::/64
          type: string
      - description: 'Whether the IPv6 address range is available.


          **Note**


          * `1` - Available.

          * `0` - Reserved.'
        in: query
        name: enabled
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: A note for the IPv6 address range.
        in: query
        name: note
        required: false
        schema:
          default: null
          example: Initial IPv6 address pool
          type:
          - string
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: ipv6_range_add
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Add IPv6 address range
      tags:
      - IP Addresses
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  ipv6_range_add \\\n  range='2001:db8:66ac:cafe::/64' \\\n  name='ExampleRange'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/ipv6_range_add?api.version=1&range=2001%3adb8%3a66ac%3acafe%3a%3a%2f64&name=ExampleRange
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.40'
  /ipv6_range_edit:
    get:
      description: 'This function changes an IPv6 address range''s name and/or note.


        **Notes:**


        - This function **cannot** modify the server''s shared IPv6 address. To update that address, modify the /etc/wwwacct.conf file, or use WHM''s *Basic WebHost Manager Setup* interface (*Home >> Server Configuration >> Basic WebHost Manager Setup*).

        - For all of cPanel & WHM''s features to function properly on IPv6, the `cpsrvd` daemon **must** listen on IPv6 addresses. To enable this functionality, select *On* for the *Listen on IPv6 Addresses* setting in the *System* section of WHM''s *Tweak Settings* interface (*WHM >> Home >> Server Configuration >> Tweak Settings*).


        **Important:**


        When you disable the Web Server role, the system **disables** this function.'
      operationId: IPv6-ipv6_range_edit
      parameters:
      - description: 'The IPv6 address range''s current name.


          **Note:**


          You **cannot** edit the range named SHARED.'
        in: query
        name: name
        required: true
        schema:
          example: ExampleRange
          type: string
      - description: 'The IPv6 address range''s new name.


          **Note:**


          * If not supplied the range keeps its old name.

          * You **cannot** change range name to SHARED.'
        in: query
        name: new_name
        required: false
        schema:
          default: null
          example: AnotherRange
          type: string
      - description: 'The IPv6 address range''s new note.


          **Note:**


          If you don''t specify this parameter, the function will not change the range''s note.'
        in: query
        name: note
        required: false
        schema:
          default: null
          example: This is an update to the note.
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: ipv6_range_edit
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Update IPv6 address range name or note
      tags:
      - IP Addresses
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  ipv6_range_edit \\\n  name='ExampleRange'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/ipv6_range_edit?api.version=1&name=ExampleRange
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.40'
  /ipv6_range_list:
    get:
      description: 'This function lists available IPv6 address ranges.


        **Note:**


        For all of cPanel & WHM''s features to function properly on IPv6, the `cpsrvd` daemon **must** listen on IPv6 addresses. To enable this functionality, select *On* for the *Listen on IPv6 Addresses* setting in the *System* section of WHM''s *Tweak Settings* interface (*WHM >> Home >> Server Configuration >> Tweak Settings*).


        **Important:**


        When you disable the Web Server role, the system **disables** this function.'
      operationId: IPv6-ipv6_range_list
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      range:
                        description: An array of the IPv6 address ranges.
                        items:
                          properties:
                            CIDR:
                              description: The IPv6 address range, in CIDR format.
                              example: 2001:db8:100:6::/64
                              type: string
                            enabled:
                              description: 'Whether the IPv6 address range is available.

                                * `1`  Available.

                                * `0`  Reserved.'
                              enum:
                              - 0
                              - 1
                              example: 1
                              type: integer
                            first:
                              description: The first IPv6 address in the range.
                              example: 2001:db8:0100:0006:0000:0000:0000:0000
                              format: ipv6
                              type: string
                            last:
                              description: The last IPv6 address in the range.
                              example: 2001:db8:0100:0006:ffff:ffff:ffff:ffff
