openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: UAPI accesses the cPanel interface's features. Use this API to access and modify cPanel account data and settings.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: cPanel U Server Information API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running cPanel.
  url: https://{host}:{port}/execute
  variables:
    host:
      default: cpanel-server.tld
      description: The hostname of a server running cPanel.
    port:
      default: '2083'
      description: The cPanel port.
security:
- BasicAuth: []
tags:
- description: The ServerInformation module for UAPI.
  name: Server Information
paths:
  /ServerInformation/get_information:
    get:
      x-readonly: true
      description: 'This function returns the status of each

        cPanel service (daemon),

        device, and server health check point on your server.'
      operationId: ServerInformation-get_information
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: get_information
                    type: string
                  module:
                    description: The name of the module called.
                    example: ServerInformation
                    type: string
                  result:
                    properties:
                      data:
                        description: An array of objects containing the server's status.
                        example:
                        - name: apache_php_fpm
                          status: 1
                          type: service
                          value: up
                        - name: cpanel-dovecot-solr
                          status: 1
                          type: service
                          value: up
                        - name: cpanellogd
                          status: 1
                          type: service
                          value: up
                        - name: cpdavd
                          status: 1
                          type: service
                          value: up
                        - name: cphulkd
                          status: 1
                          type: service
                          value: up
                        - name: cpsrvd
                          status: 1
                          type: service
                          value: up
                        - name: crond
                          status: 1
                          type: service
                          value: up
                        - name: dnsadmin
                          status: 1
                          type: service
                          value: up
                        - name: exim
                          status: 1
                          type: service
                          value: up
                          version: exim-4.92-1.cp1180.x86_64
                        - name: ftpd
                          status: 1
                          type: service
                          value: up
                        - name: httpd
                          status: 1
                          type: service
                          value: up
                          version: 2.4.39
                        - name: imap
                          status: 1
                          type: service
                          value: up
                        - name: ipaliases
                          status: 1
                          type: service
                          value: up
                        - name: lmtp
                          status: 1
                          type: service
                          value: up
                        - name: mailman
                          status: 1
                          type: service
                          value: up
                        - name: mysql
                          status: 1
                          type: service
                          value: up
                          version: 5.7.25
                        - name: named
                          status: 1
                          type: service
                          value: up
                        - name: nscd
                          status: 1
                          type: service
                          value: up
                        - name: pop
                          status: 1
                          type: service
                          value: up
                        - name: queueprocd
                          status: 1
                          type: service
                          value: up
                        - name: rsyslogd
                          status: 1
                          type: service
                          value: up
                        - name: spamd
                          status: 1
                          type: service
                          value: up
                        - name: sshd
                          status: 1
                          type: service
                          value: up
                        - name: Server Load
                          status: 1
                          type: metric
                          value: '1.73'
                        - name: CPU Count
                          status: 1
                          type: metric
                          value: '2'
                        - name: Memory Used
                          status: 1
                          type: device
                          value: 44.12%
                        - name: Swap
                          status: 1
                          type: device
                          value: 0.73%
                        - name: Disk / (/)
                          status: 1
                          type: device
                          value: 26%
                        - name: Disk /tmp (/tmp)
                          status: 1
                          type: device
                          value: 0%
                        - name: Disk /var/tmp (/var/tmp)
                          status: 1
                          type: device
                          value: 0%
                        items:
                          properties:
                            error:
                              description: An error message about why system couldn't read a resource's status file.
                              example: nscd is reporting errors.
                              type: string
                            name:
                              description: "The cPanel services, devices, and server health check points on the\nserver.\n\n* A valid [cPanel service](https://go.cpanel.net/ThecPanelWHMServiceDaemons). \n* `CPU Count` — The number of CPUs on the server.\n* `Disk mount (mount)` — The server's disk mounts, where `mount`\nrepresents the disk mount location.\n* `Server Load` — The server's CPU load.\n* `Memory Used` — The server's current memory use.\n* `Swap` — The server's swap space."
                              example: cpsrvd
                              type: string
                            status:
                              description: 'Whether the resource is enabled or disabled.


                                * `1` — Enabled.

                                * `0` — Disabled.

                                * `unknown` — The system couldn''t determine the resource''s status.'
                              example: 1
                              oneOf:
                              - description: Whether the resource is enabled or disabled.
                                enum:
                                - 1
                                - 0
                                type: integer
                              - description: The system couldn't determine the resource's status.
                                enum:
                                - unknown
                                type: string
                            type:
                              description: 'The type of resource.


                                * `device`

                                * `metric`

                                * `service`'
                              enum:
                              - device
                              - metric
                              - service
                              example: service
                              type: string
                            value:
                              anyOf:
                              - description: The resource's status.
                                enum:
                                - up
                                - down
                                - unknown
                                type: string
                              - description: The resource's current usage.
                                type: string
                              description: 'The resource''s status.


                                * `up`

                                * `down`

                                * `unknown`

                                * The current resource usage.'
                            version:
                              description: 'The resource''s software version.


                                **Important:**


                                The function **only** returns this value if a valid software

                                version exists.'
                              example: exim-4.92-1.cp1178.x86_64
                              type: string
                          type: object
                        type: array
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties:
                          transformed:
                            description: Post-processing may have transformed the data.
                            enum:
                            - 1
                            example: 1
                            type: integer
                      status:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `errors` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Return service and device status
      tags:
      - Server Information
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  ServerInformation \\\n  get_information\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/ServerInformation/get_information
      - label: LiveAPI Perl
        lang: Perl
        source: "#--------------------------------------------------------------------------------------\n# Instructions:\n#--------------------------------------------------------------------------------------\n# <theme-name> is the theme assigned to cPanel account.\n# 1) cd /usr/local/cpanel/base/frontend/<theme_name>\n# 2) mkdir api_examples\n# 3) cd api_examples\n# 4) create a file ServerInformation_get_information.live.pl and put this code into that file.\n# 5) In your browser login to a cPanel account.\n# 6) Manually change the url from: .../frontend/<theme_name>/\n#    to .../frontend/<theme_name>/api_examples/ServerInformation_get_information.live.pl\n#--------------------------------------------------------------------------------------\n\nuse strict;\n\nuse Cpanel::LiveAPI ();\n\nmy $cpanel = Cpanel::LiveAPI->new(); # Connect to cPanel - only do this once.\n\n# Print the header\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\n\n# Call the API\nmy $response = $cpanel->uapi(\n    q/ServerInformation/,\n    q/get_information/\n);\n\n# Handle the response\nif ($response->{cpanelresult}{result}{status}) {\n    my $data = $response->{cpanelresult}{result}{data};\n    foreach my $item (@{$data}) {\n        # Do something with the $item\n    }\n\n    # So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    # Report errors:\n    print to_json($response->{cpanelresult}{result}{errors});\n}\n\n# Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n#--------------------------------------------------------------------------------------\n# Helper function to convert a perl object to html printable json\n#--------------------------------------------------------------------------------------\nsub to_json {\n    require JSON;\n    my $str = JSON->new->pretty->encode($_[0]);\n    return $str;\n}\n"
      - label: LiveAPI PHP
        lang: PHP
        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account.\n// 1) cd /usr/local/cpanel/base/frontend/<theme_name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file ServerInformation_get_information.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme_name>/\n//    to .../frontend/<theme_name>/api_examples/ServerInformation_get_information.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'ServerInformation',\n    'get_information'\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    foreach ($data as $item) {\n        // Do something with the $item\n    }\n\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}"
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: cPanel 82
