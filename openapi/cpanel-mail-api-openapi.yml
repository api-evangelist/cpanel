  /install_dkim_private_keys:
    get:
      description: 'This function installs existing keys for use in a DomainKeys Identified Mail (DKIM) record. This is useful if you do not want the system to generate keys for DKIM records.


        **Notes:**


        * This function does **not** update the local DNS server''s records.

        * If the local DNS server is authoritative for the domain''s DNS records, use the WHM API 1 `enable_dkim` function to update the local DNS server''s DNS records.

        * We recommend that you use the WHM API 1 `install_dkim_private_keys` and `enable_dkim` functions in a batch WHM API 1 call.'
      operationId: EmailAuth-install_dkim_private_keys
      parameters:
      - description: 'The domain for which to install an RSA private key to the local server''s DKIM record.


          **Note:**


          To install RSA private keys for multiple domains, increment the parameter name. For example, use the `domain-1=example-1.com`, `domain-2=example-2.com`, and `domain-3=example-3.com` parameters.'
        examples:
          multiple:
            summary: The domains for which to install an RSA private key to the local server's DKIM record.
            value: domain-1=example-1.com&domain-2=example-2.com&domain-3=example-3.com
          single:
            summary: The domain for which to install an RSA private key to the local server's DKIM record.
            value: example.com
        in: query
        name: domain
        required: true
        schema:
          format: domain
          type: string
      - description: "An RSA key in [Privacy-Enhanced Mail (PEM)](https://en.wikipedia.org/wiki/Privacy-Enhanced_Mail) format.\n\n**Note:**\n\n * You **must** provide this parameter for each `domain` parameter.\n * To install multiple RSA keys for a domain, increment the parameter name. For example, use the `key-1`, `key-2` parameters.\nexamples:\n  single:\n    summary: An RSA key in [Privacy-Enhanced Mail (PEM)](https://en.wikipedia.org/wiki/Privacy-Enhanced_Mail) format.\n    value: key\n  multiple:\n    summary: RSA keys in [Privacy-Enhanced Mail (PEM)](https://en.wikipedia.org/wiki/Privacy-Enhanced_Mail) format.\n    value: key-1=KEYKEYKEY&key-2=KEYKEYKEY"
        in: query
        name: key
        required: true
        schema:
          example: 
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      payload:
                        description: An array of objects containing information about the RSA private key installation to the local server's DKIM record.
                        items:
                          properties:
