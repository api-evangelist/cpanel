    get:
      description: 'This function configures your Apache SpamAssassin™ options.


        **Important:**


        When you disable the Spam Filter role, the system disables this function.'
      operationId: Spamd-save_spamd_config
      parameters:
      - description: 'A comma-separated list of IP addresses to authorize to access the spamd daemon.


          **Note:**


          * If you do **not** specify a value, the `spamd` daemon allows connections from any IP address.

          * If you set a value for this parameter, it **must** include `127.0.0.1` in the list of values so that the `chkservd` daemon can access the `spamd` daemon.'
        explode: false
        in: query
        name: allowedips
        required: false
        schema:
          example: 127.0.0.1,192.168.0.1
          type: string
        style: form
      - description: The maximum number of children per `spamd` process.
        in: query
        name: maxchildren
        required: false
        schema:
          example: 5
          minimum: 1
          type: integer
      - description: The maximum number of connections that the `spamd` daemon allows per child process.
        in: query
        name: maxconnperchild
        required: false
        schema:
          example: 200
          minimum: 1
          type: integer
      - description: 'The process ID''s file path.


          **Warning:**


          This parameter changes the `spamd` daemon''s process ID filepath. On

          systems that use the `systemd` daemon, you must update the `PIDFile`

          parameter in the `spamd.service` definition. If you do not update the

          `PIDFile` parameter, the `spamd` daemon will fail to function because the

          PID path and the `PIDFile` parameter will not match.'
        in: query
        name: pidfile
        required: false
        schema:
          example: /var/run/spamd.pid
          type: string
