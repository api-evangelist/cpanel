openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: WHM API.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: WHM Mail API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running WHM.
  url: https://{host}:{port}/json-api
  variables:
    host:
      default: whm-server.tld
      description: The hostname of a server running WHM.
    port:
      default: '2087'
      description: The WHM port.
security:
- BasicAuth: []
tags:
- description: The Mail module for WHM API 1.
  name: Mail
paths:
  /apply_dmarc:
    get:
      description: 'This function applies a DMARC record to the specified domain(s).


        **Note:**


        You **cannot** modify DMARC records on temporary domains.'
      operationId: EmailAuth-apply_dmarc
      parameters:
      - description: 'The DMARC record to apply to the requested domains.


          **Note:**


          When using multiple policies, each policy must have a matching domain.


          When using a single policy, it will be applied to all specified domains.


          Visit the following link for more information about the DMARC record specification: https://dmarc.org/resources/specification/'
        examples:
          multiple:
            summary: To apply multiple DMARC policies, duplicate the policy arguments.
            value: policy="v=DMARC1; p=none;" policy="v=DMARC1; p=reject;" policy="v=DMARC1; p=quarantine;"
          single:
            summary: To apply a single DMARC record to domains, specify a single policy.
            value: policy="v=DMARC1;p=reject;pct=100;rua=mailto:postmaster@example.com"
        in: query
        name: policy
        required: true
        schema:
          type: string
      - description: "The domain for which to apply the DMARC record.\n\n**Note:**\n\n To apply multiple domain DMARC records, duplicate the parameter name. For example, use the `domain=example-1.com`, `domain=example-2.com`, and `domain=example-3.com` parameters.\n\n If you do not include this argument, the system applies the DMARC record to **all** domains on the system."
        examples:
          multiple:
            summary: To apply multiple DMARC records
            value: domain=example-1.com domain=example-2.com domain=example-3.com
          single:
            summary: To apply a single domain DMARC record
            value: example.com
        in: query
        name: domain
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      payload:
                        description: An array of objects that contains information about the DMARC records applied to domains.
                        items:
                          properties:
                            domain:
                              description: The domain for which the DMARC record was applied.
                              example: example.com
                              format: domain
                              type: string
                            msg:
                              description: The domain's DMARC record status message.
                              example: '[ADD:TXT@_dmarc.example.com:v=DMARC1; p=reject;]'
                              type: string
                            status:
                              description: 'Whether the system applied a DMARC record to the domain.

                                * `1` - The system applied a DMARC record.

                                * `0` - The system did **not** apply a DMARC record.'
                              enum:
                              - 0
                              - 1
                              example: 1
                              type: integer
                          type: object
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: apply_dmarc
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Apply a DMARC record to a domain
      tags:
      - Mail
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  apply_dmarc \\\n  domain='example.com' \\\n  policy='v=DMARC1; p=reject;'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/apply_dmarc?api.version=1&domain=example.com&policy='v=DMARC1; p=reject;'
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '124'
  /block_incoming_email_from_country:
    get:
      description: This function blocks email from specific countries.
      operationId: Exim-block_incoming_email_from_country
      parameters:
      - description: "The country to block.\nThe [ISO 3166-1 alpha-2 code](https://www.iso.org/iso-3166-country-codes.html) two-letter country code.\n\n**Warning:**\n\nDo **not** block the `ZZ` country code if the server uses a [NAT](https://docs.cpanel.net/knowledge-base/general-systems-administration/1-1-nat/) configuration.\n\n**Note:**\n\n  * To search all available country codes, read the ISO's [Full list of Country Codes](https://www.iso.org/obp/ui) documentation.\n  * To block multiple countries, duplicate or increment the parameter name. For example: `country_code-1`, `country_code-2`, and `country_code-3`."
        examples:
          multiple:
            summary: Multiple country codes.
            value: country_code-1=AA country_code-2=AB country_code-3=AC
          single:
            summary: A single country code.
            value: AA
        in: query
        name: country_code
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      updated:
                        description: 'Whether the function blocked one or more countries.

                          * `1` — Success.

                          * `0` — Failure.


                          **Note**

                          The function returns `0` for the `updated` return if the server already blocks that country.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: block_incoming_email_from_country
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Add block on emails from specific countries
      tags:
      - Mail
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  block_incoming_email_from_country \\\n  country_code='AA'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/block_incoming_email_from_country?api.version=1&country_code=AA
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '84'
  /block_incoming_email_from_domain:
    get:
      description: This function blocks email from specific domains.
      operationId: Exim-block_incoming_email_from_domain
      parameters:
      - description: 'The domain to block.


          **Note:**


          * The function returns `0` for the `updated` return if the server already blocks that domain.

          * An FQDN requires **at least** [a label, a dot (`.`), and a top-level domain (TLD)](https://en.wikipedia.org/wiki/Domain_name#Domain_name_syntax).

          * Enter an asterisk (`*`) to represent [a wildcard label or TLD](https://en.wikipedia.org/wiki/Wildcard_DNS_record).

          * To block multiple domains, duplicate or increment the parameter name.'
        examples:
          multiple:
            summary: Multiple domains.
            value: domain=example.com domain-1=example1.com domain-2=example2.com
          multiple-alternative:
            summary: Multiple domains.
            value: domain=example.com domain=example1.com domain=example2.com
          single:
            summary: A single domain.
            value: example.com
        in: query
        name: domain
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      updated:
                        description: 'Whether the function blocked one or more domains.

                          * 1 — Success.

                          * 0 — Failure.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: block_incoming_email_from_domain
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Add block on emails from specific domains
      tags:
      - Mail
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  block_incoming_email_from_domain \\\n  domain='example.com'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/block_incoming_email_from_domain?api.version=1&domain=example.com
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '84'
  /disable_dkim:
    get:
      description: This function removes the DomainKeys Identified Mail (DKIM) records on the DNS server for one or more domains.
      operationId: EmailAuth-disable_dkim
      parameters:
      - description: "The domain for which to remove DKIM records on the DNS server.\n\n**Note:**\n\n To remove multiple domain DKIM records, duplicate the parameter name. For example, use the `domain=example-1.com`, `domain=example-2.com`, and `domain=example-3.com` parameters."
        examples:
          multiple:
            summary: To remove multiple domain DKIM records
            value: domain=example-1.com domain=example-2.com domain=example-3.com
          single:
            summary: To remove a single domain DKIM record
            value: example.com
        in: query
        name: domain
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      payload:
                        description: An array of objects that contains information about the removal of a domain's DKIM record on the DNS server.
                        items:
                          properties:
                            domain:
                              description: The domain for which the system removed the DKIM record.
                              example: example.com
                              type: string
                            msg:
                              description: Information about the removed DKIM record.
                              example: '[REMOVE:TXT@default._domainkey:v=DKIM1; k=rsa; p=MIGfMAOGCSqGSIb3DQEBAQUAA4GNADCBiLMNOpQDw5nw4NP1RsWXlfmiMzByDfOT16QCZO/xJtrPZKskZF8/sU0zWGTqKUOErlyJfoJzMDUv3/zzjGswc2nEmYqxxoQZaBkN4QaS6MvJQxysAr+sK8C248/r9zMperQdhJedUVejtpFQHJwgqpHy1tQMxY37L7sQjdxmQ5WnQ1acXiwIDAQAB;]'
                              type: string
                            status:
                              description: 'Whether the system removed the domain''s DKIM record on the DNS server.

                                - `1`  — The system removed the domain''s DKIM record.

                                - `0`  — The system did *not* remove the domain''s DKIM record.'
                              enum:
                              - 0
                              - 1
                              example: 1
                              type: integer
                          type: object
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: disable_dkim
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Disable domain's DKIM records
      tags:
      - Mail
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  disable_dkim \\\n  domain='example.com'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/disable_dkim?api.version=1&domain=example.com
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '78'
  /disable_mail_sni:
    get:
      deprecated: true
      description: 'This function is deprecated and always fails.


        **Note:**


        Mail SNI is **always** enabled. cPanel & WHM no longer allows mail SNI to be disabled.


        * Functions that disable Mail SNI fail and make no changes.

        * Functions that enable Mail SNI succeed with a warning that Mail SNI is always enabled.'
      operationId: SSL-disable_mail_sni
      parameters:
      - description: 'The account''s domain. You may pass multiple domains using additional

          numbered parameters (e.g., `domain-1`, `domain-2`).


          **Note:** This parameter has no effect — this function always fails

          regardless of any input because mail SNI can no longer be disabled.'
        in: query
        name: domain
        required: false
        schema:
          example: example.com
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties: {}
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: disable_mail_sni
                        type: string
                      reason:
                        description: The reason the API function failed.
                        example: cPanel & WHM no longer allows mail SNI to be disabled.
                        type: string
                      result:
                        description: 'This function always returns `0` (failure) because mail SNI

                          can no longer be disabled.


                          * `0` - Failed.'
                        enum:
                        - 0
                        example: 0
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: (Deprecated) Disable SNI mail services for domains
      tags:
      - Mail
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  disable_mail_sni \\\n  domain='example.com'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/disable_mail_sni?api.version=1&domain=example.com
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.48'
  /emailtrack_search:
    get:
      description: 'This function retrieves email delivery records.


        **Warning:**


        * On most servers, this function returns a large amount of output. We **strongly**

        recommend that you filter and

        sort the output.

        * The following example uses the filter and sort options:


        `https://hostname.example.com:2087/cpsess##########/json-api/emailtrack_search?api.version=1&api.filter.enable=1&api.filter.a.field=sendunixtime&api.filter.a.arg0=1628889719&api.filter.a.type=gt&api.filter.b.field=sendunixtime&api.filter.b.arg0=1629847321&api.filter.b.type=lt&api.sort.enable=1&api.sort.a.field=sendunixtime&api.sort.a.reverse=0&api.chunk.enable=1&api.chunk.size=25&api.chunk.start=1&success=1`'
      operationId: Exim-emailtrack_search
      parameters:
      - description: 'Whether to return delivery deferral events.

          * `1` — Return delivery deferral events.

          * `0` — Do not return delivery deferral events.'
        in: query
        name: defer
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'The type of delivery records to retrieve.

          * `all` — Retrieve all delivery records.

          * `remote` — Retrieve remote delivery records.

          * `local` — Retrieve local delivery records.'
        in: query
        name: deliverytype
        required: false
        schema:
          default: all
          enum:
          - all
          - remote
          - local
          example: all
          type: string
      - description: 'Whether to return delivery failure events.

          * `1` — Return delivery failure events.

          * `0` — Do not return delivery failure events.'
        in: query
        name: failure
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'Whether to return delivery attempts in progress.

          * `1` — Return delivery attempts in progress.

          * `0` — Do not return delivery attempts in progress.'
        in: query
        name: inprogress
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'The number of results to return for each type.


          **Note**


          If you set this parameter to `0`, the function returns unlimited results.'
        in: query
        name: max_results_by_type
        required: false
        schema:
          default: 0
          example: 3
          type: integer
      - description: 'Whether to return successful delivery attempts.

          * `1` — Return successful delivery attempts.

          * `0` — Do not return successful delivery attempts.'
        in: query
        name: success
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      records:
                        description: An array of objects containing the delivery record.
                        items:
                          properties:
                            actiontime:
                              description: When the delivery attempt happened in `YYYY-MM-DD HH-mm-SS` format.
                              example: '2012-02-06T14:17:51.000Z'
                              type: string
                            actionunixtime:
                              description: When the delivery attempt happened.
                              example: 1328559471
                              format: unix_timestamp
                              type: integer
                            deliveredto:
                              description: "The delivery attempt's final end point.\n\n**Note:**\n\n If the message went to a mailing list, the address will be the mailing list member's address."
                              example: null
                              type:
                              - string
                              - 'null'
                            deliverydomain:
                              description: The recipient's domain.
                              example: null
                              format: domain
                              type:
                              - string
                              - 'null'
                            deliveryuser:
                              description: The recipient's username.
                              example: null
                              type:
                              - string
                              - 'null'
                            domain:
                              description: The sender's domain.
                              example: example.com
                              format: domain
                              type: string
                            host:
                              description: The hostname that received the message.
                              example: null
                              format: hostname
                              type:
                              - string
                              - 'null'
                            ip:
                              description: The recipient's IP address.
                              example: null
                              format: ipv4
                              type:
                              - string
                              - 'null'
                            message:
                              description: The action taken.
                              example: Domain example.com has exceeded the max defers and failures per hour (5/5 (100%)) allowed. Message discarded.
                              type: string
                            msgid:
                              description: The message ID.
                              example: 1RuV0Z-0005NR-BN
                              type: string
                            recipient:
                              description: The recipient's mail address.
                              example: user@example.com
                              format: email
                              type: string
                            router:
                              description: The mail server's internal router name.
                              example: enforce_mail_permissions
                              type: string
                            sender:
                              description: The sender's full email address.
                              example: user@example.com
                              type: string
                            senderauth:
                              description: The user authentication.
                              example: localuser
                              format: hostname
                              type: string
                            senderhost:
                              description: The sender's hostname.
                              example: localhost
                              format: hostname
                              type: string
                            senderip:
                              description: The sender's IP address.
                              example: 127.0.0.1
                              type: string
                            sendunixtime:
                              description: When the message was sent.
                              example: 1328559471
                              format: unix_timestamp
                              type: integer
                            size:
                              description: The message's size.
                              example: 1653
                              format: bytes
                              minimum: 1
                              type: integer
                            spamscore:
                              description: 'The message''s spam score.


                                **Note:**


                                If the spam prevention engine uses a result range from `0` to `1` , the system multiplies the result by `10`.'
                              example: 5
                              minimum: 0
                              type: integer
                            transport:
                              description: The mail transfer agent (MTA).
                              example: null
                              type:
                              - string
                              - 'null'
                            transport_is_remote:
                              description: 'Whether the mail transfer agent (MTA) is remote.

                                * `1` — Remote.

                                * `0` — Not remote.'
                              enum:
                              - 0
                              - 1
                              example: 0
                              type: integer
                            type:
                              description: 'The delivery status.

                                * `success`

                                * `defer`

                                * `failure`

                                * `inprogress`'
                              enum:
                              - success
                              - defer
                              - failure
                              - inprogress
                              example: success
                              type: string
                            user:
                              description: The sender's username.
                              example: cpanel1
                              type: string
                          type: object
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: emailtrack_search
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success

                          * `0` — Failed: Check the reason field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return email delivery records by search criteria
      tags:
      - Mail
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  emailtrack_search\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/emailtrack_search?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11'
  /emailtrack_stats:
    get:
      description: This function retrieves email tracking statistics.
      operationId: Exim-emailtrack_stats
      parameters:
      - description: 'The type of delivery to query. If you do not specify a value,

          this function returns all types.

          * `remote`

          * `remote-or-faildefer`

          * `local`'
        in: query
        name: deliverytype
        required: false
        schema:
          enum:
          - remote
          - remote-or-faildefer
          - local
          example: remote
          type: string
      - description: 'The end date of the search window. This parameter defaults to the current time.


          **Note**


          This parameter is an alias for `endtime` and is provided for backwards compatibility.'
        in: query
        name: enddate
        required: false
        schema:
          example: 1471552781
          format: unix_timestamp
          type: integer
      - description: 'The end time of the search window. This parameter defaults to the current time.


          **Note**


          You can also call this the `enddate` parameter.'
        in: query
        name: endtime
        required: false
        schema:
          example: 1471552781
          format: unix_timestamp
          type: integer
      - description: 'Whether to return the `TOTALSIZE` parameter.

          * 1 — Do **not** return.

          * 0 — Return.'
        in: query
        name: nosize
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'Whether to return the `SUCCESSCOUNT` parameter.

          * 1 — Do **not** return.

          * 0 — Return.'
        in: query
        name: nosuccess
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
