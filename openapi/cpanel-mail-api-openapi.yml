  /fetch_mail_queue:
    get:
      description: This function retrieves the contents of the server's mail queue.
      operationId: Exim-fetch_mail_queue
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      records:
                        description: An array of objects that contain of the message information.
                        items:
                          properties:
                            frozen:
                              description: 'Whether the mail message is frozen.

                                * `1` — Frozen.

                                * `0` — **Not** frozen.'
                              enum:
                              - 0
                              - 1
                              example: 0
                              type: integer
                            msgid:
                              description: The mail message's ID.
                              example: 1UotX3-0002HX-Lr
                              type: string
                            recipients:
                              description: An array of the mail message's recipients.
                              items:
                                example: pricilla@graceland.com
                                format: email
                                type: string
                              type: array
                            sender:
                              description: The mail message's sender.
                              example: elvis@graceland.com
                              format: email
                              type: string
                            size:
                              description: The mail message's size in bytes.
                              example: 14336
                              format: bytes
                              minimum: 0
                              type: integer
                            time:
                              description: The mail message's timestamp.
                              example: 1371552781
                              format: unix_timestamp
                              type: integer
                            user:
                              description: The mail message's owner.
                              example: null
                              type:
                              - string
                              - 'null'
                          type: object
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: fetch_mail_queue
                        type: string
                      reason:
