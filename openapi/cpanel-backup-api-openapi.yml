  /Backup/fullbackup_to_scp_with_key:
    get:
      x-readonly: false
      x-rollback: none
      description: This function creates a full backup to a remote server with a private SSH key via the secure copy protocol (scp) command. The system creates a file in the `backup-MM.DD.YYYY_HH-mm-ss_username.tar.gz` filename format.
      operationId: Backup-fullbackup_to_scp_with_key
      parameters:
      - description: The remote server's hostname or IP address.
        in: query
        name: host
        required: true
        schema:
          example: example.com
          oneOf:
          - description: A valid hostname.
            format: hostname
            type: string
          - description: A valid IP address.
            format: ipv4
            type: string
          type: string
      - description: 'The SSH key''s name.


          **Notes:**


          * To generate a private SSH key, use the UAPI `SSL::generate_key`

          function.

          * To import an existing SSH key, use the cPanel API 2

          `SSH::importkey` function.'
        in: query
        name: key_name
        required: true
        schema:
          example: examplesshkey
          type: string
      - description: The SSH key's password.
        in: query
        name: key_passphrase
        required: true
        schema:
          example: 123456luggage
          minLength: 4
          type: string
      - description: 'The directory on the remote server that will store the backup.


          **Note:**


          This parameter defaults to the remote server account''s default login directory.'
        in: query
