        name: homedir
        required: false
        schema:
          default: include
          enum:
          - include
          - skip
          example: include
          type: string
      - description: The port to use during the transfer.
        in: query
        name: port
        required: false
        schema:
          default: 22
          example: 22
          maximum: 65335
          minimum: 1
          type: integer
      responses:
