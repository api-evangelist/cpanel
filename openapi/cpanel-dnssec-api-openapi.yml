      - description: 'Whether NSEC3 will operate in Narrow mode or Inclusive mode. In Narrow mode, PowerDNS sends out white lies about the next secure record. Rather than query the resource record in the database, PowerDNS sends the hash plus 1 as the next secure record.

          * `1` - Narrow mode. * `0` - Inclusive mode.'
        in: query
        name: nsec3_narrow
        required: true
        schema:
          enum:
          - 0
          - 1
          example: 1
          type: integer
