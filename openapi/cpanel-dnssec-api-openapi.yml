openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: UAPI accesses the cPanel interface's features. Use this API to access and modify cPanel account data and settings.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: cPanel U DNSSEC API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running cPanel.
  url: https://{host}:{port}/execute
  variables:
    host:
      default: cpanel-server.tld
      description: The hostname of a server running cPanel.
    port:
      default: '2083'
      description: The cPanel port.
security:
- BasicAuth: []
tags:
- description: The DNSSEC module for UAPI.
  name: DNSSEC
paths:
  /DNSSEC/activate_zone_key:
    get:
      x-readonly: false
      x-rollback: none
      description: 'This function activates a DNSSEC security key.


        **Important:**


        When you disable the DNS role, the system **disables** this function.'
      operationId: DNSSEC-activate_zone_key
      parameters:
      - description: The security key's domain.
        in: query
        name: domain
        required: true
        schema:
          example: example.com
          format: domain
          type: string
      - description: The security key's ID.
        in: query
        name: key_id
        required: true
        schema:
          example: 1
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: activate_zone_key
                    type: string
                  module:
                    description: The name of the module called.
                    example: DNSSEC
                    type: string
                  result:
                    properties:
                      data:
                        example:
                          domain: example.com
                          key_id: '1'
                          success: 1
                        properties:
                          domain:
                            description: The domain for which the system activated a security key.
                            example: example.com
                            format: domain
                            type: string
                          error:
                            description: 'An error message that describes why the system could not activate the security key.


                              **Note:**


                              The function **only** displays this return when the `success` return is a `0` value.'
                            example: 'Error: Invalid key_id or domain specified: No such key present for domain.'
                            type: string
                          key_id:
                            description: The security key's ID.
                            example: '1'
                            type: string
                          success:
                            description: 'Whether the system activated the security key.

                              * `1` - Activated.

                              * `0` - The system failed to activate the security key. '
                            enum:
                            - 1
                            - 0
                            example: 1
                            type: integer
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `errors` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Enable DNSSEC security key
      tags:
      - DNSSEC
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  DNSSEC \\\n  activate_zone_key \\\n  domain='example.com' \\\n  key_id='1'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/DNSSEC/activate_zone_key?domain=example.com&key_id=1
      - label: LiveAPI Perl
        lang: Perl
        source: "#--------------------------------------------------------------------------------------\n# Instructions:\n#--------------------------------------------------------------------------------------\n# <theme-name> is the theme assigned to cPanel account.\n# 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n# 2) mkdir api_examples\n# 3) cd api_examples\n# 4) create a file DNSSEC_activate_zone_key.live.pl and put this code into that file.\n# 5) In your browser login to a cPanel account.\n# 6) Manually change the url from: .../frontend/<theme-name>/\n#    to .../frontend/<theme-name>/api_examples/DNSSEC_activate_zone_key.live.pl\n#--------------------------------------------------------------------------------------\n\nuse strict;\n\nuse Cpanel::LiveAPI ();\n\nmy $cpanel = Cpanel::LiveAPI->new(); # Connect to cPanel - only do this once.\n\n# Print the header\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\n\n# Call the API\nmy $response = $cpanel->uapi(\n    q/DNSSEC/,\n    q/activate_zone_key/,\n    {\n        'domain' => 'example.com',\n        'key_id' => '1',\n    }\n);\n\n# Handle the response\nif ($response->{cpanelresult}{result}{status}) {\n    my $data = $response->{cpanelresult}{result}{data};\n    # Do something with the $data\n    # So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    # Report errors:\n    print to_json($response->{cpanelresult}{result}{errors});\n}\n\n# Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n#--------------------------------------------------------------------------------------\n# Helper function to convert a perl object to html printable json\n#--------------------------------------------------------------------------------------\nsub to_json {\n    require JSON;\n    my $str = JSON->new->pretty->encode($_[0]);\n    return $str;\n}\n"
      - label: LiveAPI PHP
        lang: PHP
        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account.\n// 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file DNSSEC_activate_zone_key.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme-name>/\n//    to .../frontend/<theme-name>/api_examples/DNSSEC_activate_zone_key.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'DNSSEC',\n    'activate_zone_key',\n    array (\n        'domain' => 'example.com',\n        'key_id' => '1',\n    )\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    // Do something with the $data\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}"
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: cPanel 84
  /DNSSEC/add_zone_key:
    get:
      x-readonly: false
      x-rollback: none
      description: 'This function generates a DNSSEC zone key for a domain.


        **Note:**


        * After you enable DNSSEC on the domain, you **must** add the DS records to your registrar.

        * You **cannot** modify the DNSSEC security key. To make any changes, you **must** disable (and delete) and re-create the DNSSEC security key.


        **Important:**


        When you disable the DNS role, the system **disables** this function.'
      operationId: DNSSEC-add_zone_key
      parameters:
      - description: 'The algorithm that the system uses to generate the security key.


          * `5` — RSA/SHA-1

          * `6` — DSA-NSEC3-SHA1

          * `7` — RSASHA1-NSEC3-SHA1

          * `8` — RSA/SHA-256

          * `10` — RSA/SHA-512

          * `13` — ECDSA Curve P-256 with SHA-256

          * `14` — ECDSA Curve P-384 with SHA-384


          **Note:**


          We recommend that you use ''ECDSA Curve P-256 with SHA-256'' if your registrar supports it.'
        in: query
        name: algo_num
        required: true
        schema:
          enum:
          - 5
          - 6
          - 7
          - 8
          - 10
          - 13
          - 14
          example: 8
          type: integer
      - description: The domain on which to enable DNSSEC.
        in: query
        name: domain
        required: true
        schema:
          example: example.com
          format: domain
          type: string
      - description: 'The type of key to add.


          * `ksk`

          * `zsk`'
        in: query
        name: key_type
        required: true
        schema:
          enum:
          - ksk
          - zsk
          example: ksk
          type: string
      - description: 'Whether to activate the newly-created key.


          * `1` — Activate the key.

          * `0` — Do **not** activate the key.'
        in: query
        name: active
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'The key''s size, in bits.


          **Note:**


          For the following `algo_num` and `key_type` parameters, the `key_size` defaults to the following values:

          * `5` — ksk `2048` zsk `1024`

          * `6` — ksk `2048` zsk `1024`

          * `7` — ksk `2048` zsk `1024`

          * `8` — ksk `2048` zsk `1024`

          * `10` — ksk `2048` zsk `1024`

          * `13` — ksk `256` zsk `256`

          * `14` — ksk `384` zsk `384` '
        in: query
        name: key_size
        required: false
        schema:
          example: 2048
          maximum: 2048
          minimum: 256
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: add_zone_key
                    type: string
                  module:
                    description: The name of the module called.
                    example: DNSSEC
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          domain:
                            description: The domain for which the system added a security key.
                            example: example.com
                            format: domain
                            type: string
                          error:
                            description: 'An error message that describes why the system could not add the security key.


                              **Note:**


                              The function **only** displays this return when the `success` return is a `0` value.'
                            example: 'Error: Invalid key_id or domain specified: No such key present for domain.'
                            type: string
                          new_key_id:
                            description: The security key's ID.
                            example: '1'
                            type: string
                          success:
                            description: 'Whether the system added the security key.


                              * `1` — The system added the security key.

                              * `0` — The system failed to add the security key.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type: integer
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '- 1 - Success

                          - 0 - Failed: Check the errors field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Create DNSSEC security key
      tags:
      - DNSSEC
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  DNSSEC \\\n  add_zone_key \\\n  domain='example.com' \\\n  algo_num='8' \\\n  key_type='ksk'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/DNSSEC/add_zone_key?domain=example.com&algo_num=8&key_type=ksk
      - label: LiveAPI Perl
        lang: Perl
