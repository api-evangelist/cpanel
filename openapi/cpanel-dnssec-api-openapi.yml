  /DNSSEC/disable_dnssec:
    get:
      x-readonly: false
      x-rollback: none
      description: 'This function disables DNSSEC on the domain.


        **Warning:**


        * This action is **irreversible**. If you disable DNSSEC on the domain, you will lose the associated keys. You can only retrieve the previous state with a full backup.

        * If you disable DNSSEC, you **must** remove the DNS records at the registrar.


        **Important:**


        When you disable the DNS role, the system **disables** this function.'
      operationId: DNSSEC-disable_dnssec
      parameters:
      - description: "The domain on which to disable DNSSEC.\n\n**Note:**\n\n To enable DNSSEC on multiple domains, increment the parameter name. For example: `domain-0`, `domain-1`, `domain-2`."
        examples:
          multiple:
            summary: To enable DNSSEC on multiple domains.
            value: domain-0=example0.com&domain-1=example1.com&domain-2=example2.com
          single:
            summary: To enable DNSSEC on a single domain.
            value: example.com
        in: query
        name: domain
        required: true
        schema:
          format: domain
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: disable_dnssec
                    type: string
                  module:
                    description: The name of the module called.
                    example: DNSSEC
                    type: string
                  result:
                    properties:
                      data:
                        example:
                          disabled:
                            example.com: 1
                        properties:
                          disabled:
                            description: An array of objects that contain the domains for which the system disabled DNSSEC.
