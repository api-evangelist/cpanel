  /DNSSEC/enable_dnssec:
    get:
      x-readonly: false
      x-rollback: none
      description: 'This function enables DNSSEC on the domain.


        **Note:**


        * After you enable DNSSEC on the domain, you **must** add the DNS records to your registrar.

        * You **cannot** modify the DNSSEC security key. To make any changes, you **must** disable (and delete) and re-create the DNSSEC security key.


        **Important:**


        When you disable the DNS role, the system **disables** this function.'
      operationId: DNSSEC-enable_dnssec
      parameters:
      - description: "The domain on which to enable DNSSEC.\n\n**Note:**\n\n To enable DNSSEC on multiple domains, increment the parameter name. For example: `domain-0`, `domain-1`, `domain-2`."
        examples:
          multiple:
            summary: To enable DNSSEC on multiple domains.
            value: domain-0=example0.com&domain-1=example1.com&domain-2=example2.com
          single:
            summary: To enable DNSSEC on a single domain.
            value: example.com
        in: query
        name: domain
        required: true
        schema:
          format: domain
          type: string
      - description: 'Whether to activate the newly-created key.


          * `1` — Activate the key.

          * `0` — Do **not** activate the key.'
        in: query
        name: active
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: "The algorithm that the system uses to generate the security key.\n\n* `5` — RSA/SHA-1\n* `6` — DSA-NSEC3-SHA1\n* `7` — RSASHA1-NSEC3-SHA1\n* `8` — RSA/SHA-256\n* `10` — RSA/SHA-512\n* `13` — ECDSA Curve P-256 with SHA-256\n* `14` — ECDSA Curve P-384 with SHA-384\n\n**Note:**\n\n We recommend that you use `ECDSA Curve P-256 with SHA-256` if your registrar supports it."
        in: query
        name: algo_num
        required: false
        schema:
          default: 8
          example: 8
          maximum: 255
          minimum: 0
          type: integer
      - description: 'The manner in which the system creates the security key.


          * `simple` — Use a single key for both KSK and ZSK. Use this value when the `algo_nom` parameter is greater than `8`.

          * `classic` — Use separate keys for KSK and ZSK. Use this value when the `algo_nom` parameter is equal to or less than `8`.'
        in: query
        name: key_setup
        required: false
        schema:
          default: classic
          enum:
          - simple
          - classic
          example: classic
          type: string
      - description: 'The number of times that the system rehashes the first resource record hash operation.


          A positive integer less than `501`.


          **Note:**


          In cPanel & WHM version 132 and earlier, the default value is `7`.'
        in: query
        name: nsec3_iterations
        required: false
        schema:
          default: 0
          example: 7
          maximum: 500
          minimum: 0
          type: integer
      - description: 'Whether NSEC3 will operate in Narrow or Inclusive mode.


          In Narrow mode, PowerDNS sends out white lies about the next secure record. Rather than query the resource record in the database, PowerDNS sends the hash plus `1` as the next secure record.


          * `1` — Narrow mode.

          * `0` — Inclusive mode.'
        in: query
        name: nsec3_narrow
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: "Whether the system will create records for all delegations.\n\n* `1` — Create records for all delegations.\n* `0` — Create records only for secure delegations.\n\n**Note:**\n\n **Only** select `1` if you **must** create records for all delegations."
        in: query
        name: nsec3_opt_out
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'A hexadecimal string that the system appends to the domain name before it applies the hash function to the name. For more information about the salt value, read the [RFC 5155](https://tools.ietf.org/html/rfc5155#section-3.1.5) documentation.


          **NOTE:**


          * In cPanel & WHM version 132 and later, this parameter also accepts the literal value `-` to indicate that no salt should be used. If you do not declare a value, the system defaults to no salt.

          * In cPanel & WHM version 130 and earlier, if you did not declare a value, the system defaulted to a random 64-bit value.'
        in: query
        name: nsec3_salt
        required: false
        schema:
          default: '-'
          example: 1A2B3C4D5E6F
          format: hex
          maxLength: 255
          type: string
      - description: "Whether the domain will use [Next Secure Record](https://tools.ietf.org/html/rfc4470) (NSEC) or NSEC3 semantics.\n\n* `1` — Use NSEC3 semantics.\n* `0` — Use NSEC semantics.\n\n**Note:**\n\n If you use NSEC semantics (`0`), the system ignores the other NSEC3 options."
        in: query
        name: use_nsec3
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
