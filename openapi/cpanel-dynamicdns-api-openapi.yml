  /DynamicDNS/list:
    get:
      x-readonly: true
      description: 'This function lists the user’s Dynamic DNS (DDNS) domains.


        **Important:**


        When you disable the _DNS_ role, the system disables this function.'
      operationId: DynamicDNS-list
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: list
                    type: string
                  module:
                    description: The name of the module called.
                    example: DynamicDNS
                    type: string
                  result:
                    properties:
                      data:
                        description: The user’s DDNS domains.
                        items:
                          properties:
                            created_time:
                              description: The DDNS domain’s creation time.
                              format: unix_timestamp
                              type: integer
                            description:
                              description: A user-editable string that describes the DDNS domain.
                              example: My home network
                              type: string
                            domain:
                              description: The domain.
                              example: home.example.com
                              format: domain
                              type: string
                            id:
                              description: 'The domain’s DDNS ID.


                                **Note:**


                                This ID goes into the URL that the client uses to

                                [update the domain’s IP address

                                resolution](https://go.cpanel.net/cpaneldocsdynamicdns).'
                              example: gziugyxxjwnamqtwysgmvrurplmafxpj
                              type: string
                            last_run_times:
                              description: 'The most recent times when the web call ran.


                                **Note:**


                                This list changes every time the web call runs,

                                even if the domain’s IP address resolution does

                                **not** change.'
                              items:
                                format: unix_timestamp
                                type: integer
                              type: array
                            last_update_time:
                              description: 'The most recent update time for the

                                DDNS domain.


                                **Note:**


                                This value changes **only** when

                                the domain’s IP address resolution changes.'
                              format: unix_timestamp
                              type:
                              - integer
                              - 'null'
                          type: object
                        type: array
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
