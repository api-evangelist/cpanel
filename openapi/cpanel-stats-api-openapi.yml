      x-readonly: true
      description: This function returns a domain's Analog statistics.
      operationId: Stats-list_stats_by_domain
      parameters:
      - description: The domain from which to retrieve statistics.
        in: query
        name: domain
        required: true
        schema:
          example: example.com
          format: domain
          type: string
      - description: The statistics engine. `analog` is the only possible value.
        in: query
        name: engine
        required: true
        schema:
          enum:
          - analog
          example: analog
          type: string
      - description: "Whether to return statistics from SSL requests.\n  * `1` - Return statistics for SSL requests.\n  * `0` - Return statistics for non-SSL requests."
        in: query
        name: ssl
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
