components:
  schemas:
    restorePoint:
      properties:
        options:
          properties:
            give_ip:
              description: 'Whether the restoration process will assign a dedicated IP address

                to the account.


                * `1` — Will assign.

                * `0` — Will **not** assign.'
              enum:
              - 1
              - 0
              example: 1
              type: integer
            mail_config:
              description: 'Whether the restoration process will restore the account''s email

                configuration.


                * `1` — Will restore.

                * `0` — Will **not** restore.'
              enum:
              - 1
              - 0
              example: 1
              type: integer
            mysql:
              description: 'Whether the restoration process will restore the account''s MySQL®

                databases.


                * `1` — Will restore.

                * `0` — Will **not** restore.'
              enum:
              - 1
              - 0
              example: 1
              type: integer
            subdomains:
              description: 'Whether the restoration process will restore the account''s subdomains.


                * `1` — Will restore.

                * `0` — Will **not** restore.'
              enum:
              - 1
              - 0
              example: 1
              type: integer
          type: object
        restore_point:
          description: The date of the backup file.
          example: '2019-10-21T00:00:00.000Z'
          format: ISO-8601 Date
          type: string
        user:
          description: The cPanel account's username.
          example: username
          format: username
          type: string
  securitySchemes:
    BasicAuth:
      scheme: basic
      type: http
