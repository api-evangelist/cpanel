        required: true
        schema:
          example: /home/example/wordpress-backups/example.com__2018-11-13T11:11:31-0600.tar.gz
          format: path
          type: string
      - description: The WordPress site's URL to restore.
        examples:
          single-domain:
            summary: Just a domain.
            value: example.com
          single-path:
            summary: Domain with path.
            value: example.com/wordpress
        in: query
        name: site
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: start
                    type: string
                  module:
                    description: The name of the module called.
                    example: WordPressRestore
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          restore_id:
                            description: The unique identifier for the restoration operation. The name of the backup file without the file extension.
                            example: example.com__2018-11-15T08:03:22-0600
                            type: string
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `errors` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Restore WordPress site
      tags:
      - WordPressRestore
      x-codeSamples:
