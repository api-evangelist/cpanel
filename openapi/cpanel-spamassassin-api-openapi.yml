  /SpamAssassin/update_user_preference:
    get:
      x-readonly: false
      x-rollback: none
      description: 'This function sets the Apache SpamAssassin™ settings for the account.


        **Note:**


        Additional customizations may appear in the function''s return. For more information,

        read the Apache SpamAssassin configuration file documentation.'
      operationId: SpamAssassin-update_user_preference
      parameters:
      - description: 'The variable that you want to manipulate.


          * `score`

          * `required_score`

          * `whitelist_from`

          * `blacklist_from`

          * A [custom SpamAssassin variable](https://spamassassin.apache.org/full/3.1.x/doc/Mail_SpamAssassin_Conf.html#user_preferences).


          **Important:**


          * You can **only** choose one of these possible values per call.

          * If you enter a value for the `preference` parameter, but you do **not** define a value for the `value` parameter, the function will remove any previous settings.'
        example: score
        in: query
        name: preference
        required: true
        schema:
          type: string
      - description: "The value for the preference of the variable that you want to manipulate.\n\n* A valid SpamAssassin \"`TEST_NAME SCORE`\" value when the value of the `preference` parameter is `score`, where:\n\n    * `TEST_NAME` represents the symbolic name of the test. For list of symbolic test names, run the UAPI `SpamAssassin::get_symbolic_test_names` function.\n    * `SCORE` represents the floating-point value that SpamAssassin assigns to the mail when the test result is true. The score value must be greater than `0`, and less than `1000`.\n\n* A valid floating-point number if the value of the `preference` parameter is `required_score`.\n* A valid email address if the value of the `preference` parameter is `whitelist_from` or `blacklist_from`.\n* A [custom SpamAssassin variable](https://spamassassin.apache.org/full/3.1.x/doc/Mail_SpamAssassin_Conf.html#user_preferences) value.\n\n**Note:**\n\nTo enter multiple values, increment the parameter name. For example, use the `value-0` and `value-1` parameters."
        examples:
          multiple:
            summary: Define multiple variable values.
            value: value-0=ACT_NOW_CAPS 5.0 value-1=INVALID_DATE 3.2
          single:
            summary: Define a single variable value.
            value: ACT_NOW_CAPS 5.0
        in: query
        name: value
        required: false
        schema:
          example: ACT_NOW_CAPS 5.0
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: update_user_preference
                    type: string
                  module:
                    description: The name of the module called.
                    example: SpamAssassin
                    type: string
                  result:
                    properties:
                      data:
                        example:
                          blacklist_from:
                          - username2@example.com
                          ok_locales:
                          - all
                          required_score:
                          - 5
                          score:
                          - ACT_NOW_CAPS 5
                          whitelist_from:
                          - username@example.com
                        properties:
                          additionalProperties:
                            description: 'An array containing custom SpamAssassin variable values.


                              **Note:**


                              The array''s name is the custom SpamAssassin variable''s name.'
                            items:
                              example: mycustomscore
                              type: string
                          blacklist_from:
                            description: An array of email addresses on the blacklist.
                            items:
                              example: username2@example.com
                              format: email
                              type: string
                            type: array
                          required_score:
                            description: An array containing the score at which the system will mark a message as spam. The system considers mail that matches this score to be spam.
                            items:
                              example: 5
                              format: float
                              type: number
                            type: array
                          score:
                            description: An array of the symbolic test names and their scores.
                            items:
                              example: ACT_NOW_CAPS 5
                              type: string
                            type: array
                          whitelist_from:
                            description: An array of the email addresses on the whitelist.
                            items:
                              example: username@example.com
                              format: email
                              type: string
                            type: array
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `errors` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running an API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
