          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: list_features
                    type: string
                  module:
                    description: The name of the module called.
                    example: Features
