  /DomainLookup/getdocroot:
    get:
      description: 'This function retrieves the document root for a single domain on the

        cPanel account.


        **Note:**


        If the domain does not exist on the account, the system returns the

        account''s `public_html` directory rather than an error.'
      operationId: DomainLookup-getdocroot
      parameters:
      - description: 'The domain to look up. The system converts this value to lowercase.


          Omit this parameter to retrieve the document root for the account''s primary domain.'
        in: query
        name: domain
        required: false
        schema:
          example: example.com
          format: domain
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    description: A single entry for the requested domain.
                    items:
                      properties:
                        docroot:
                          description: The absolute path to the domain's document root.
                          example: /home/username/public_html
                          format: path
                          type: string
                        reldocroot:
                          description: The domain's document root, relative to the account's home directory.
                          example: public_html
                          type: string
                      type: object
                    type: array
                  errors:
                    items:
                      type: string
                    type:
                    - array
                    - 'null'
                  messages:
                    items:
                      type: string
                    type:
                    - array
                    - 'null'
                  metadata:
                    properties:
                      transformed:
                        type: integer
                    type: object
                  status:
                    description: '* `1` — Success.

                      * `0` — Failed. Check the `errors` field for more details.'
                    enum:
                    - 0
                    - 1
                    example: 1
                    type: integer
                  warnings:
                    items:
                      type: string
                    type:
                    - array
                    - 'null'
                type: object
          description: HTTP Request was successful.
      summary: Return a domain's document root
      tags:
      - Domain Lookup
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  DomainLookup \\\n  getdocroot\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/DomainLookup/getdocroot
