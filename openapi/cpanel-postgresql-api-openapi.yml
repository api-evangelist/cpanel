  /Postgresql/get_restrictions:
    get:
      x-readonly: true
      description: 'This function retrieves the PostgreSQL® user and database name length restrictions.


        **Important:**


        When you disable the *PostgreSQL* role, the system **disables** this function.'
      operationId: Postgresql-get_restrictions
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: get_restrictions
                    type: string
                  module:
                    description: The name of the module called.
                    example: Postgresql
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          max_database_name_length:
                            description: The maximum length of a database name.
                            example: 63
                            minimum: 1
                            type: integer
                          max_username_length:
                            description: The maximum length of a database username.
                            example: 63
                            minimum: 1
                            type: integer
                          prefix:
                            description: If database prefixing is enabled, this return outputs the database prefix. A valid string up to eight characters and an underscore (`_`).
                            example: example_
                            type: string
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
