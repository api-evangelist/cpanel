                  result:
                    properties:
                      data:
                        description: An array of objects that contain Calendars and Contacts Server calendar delegation information.
                        items:
                          properties:
                            delegatee:
                              description: The user with delegation rights.
                              example: delegatee@cptest.test
                              format: email
                              type: string
