openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: WHM API.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: WHM Customizations API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running WHM.
  url: https://{host}:{port}/json-api
  variables:
    host:
      default: whm-server.tld
      description: The hostname of a server running WHM.
    port:
      default: '2087'
      description: The WHM port.
security:
- BasicAuth: []
tags:
- description: The Customizations module for WHM API 1.
  name: Customizations
paths:
  /delete_customizations:
    get:
      description: 'This function deletes customization data.


        Customization data includes brand logos and colors.


        Server owners and resellers can supply customization data to whitelabel portions

        of the product or customize the cPanel experience for their users.


        This function is used to delete customization data for the Jupiter theme **only**.


        If you provide the optional `path` parameter, the API will removed only the specific element specified in the `.` separated path.

        See the parameter for more details.'
      operationId: Customizations-delete_customizations
      parameters:
      - description: The application name for the customization.
        in: query
        name: application
        required: true
        schema:
          enum:
          - cpanel
          - webmail
          example: cpanel
          type: string
      - description: The theme name for the customization.
        in: query
        name: theme
        required: true
        schema:
          example: jupiter
          type: string
      - description: 'The JSONPath expression to reach to property you want to delete. We support only the

          subset of JSONPath using the `.` style notation. There is presently no other JSONPath

          features supported.'
        in: query
        name: path
        required: false
        schema:
          example: brand.icon.description
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: delete_customizations
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Delete customization data
      tags:
      - Customizations
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  delete_customizations \\\n  application='cpanel' \\\n  theme='jupiter'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/delete_customizations?api.version=1&application=cpanel&theme=jupiter
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '100'
      x-cpanel-cli-support: true
  /retrieve_customizations:
    get:
      description: 'This function retrieves customization data.


        Customization data includes brand logos and colors.


        This function is used to retrieve customization data for the Jupiter theme **only**.'
      operationId: Customizations-retrieve_customizations
      parameters:
      - description: The application name for the customization.
        in: query
        name: application
        required: true
        schema:
          enum:
          - cpanel
          - webmail
          example: cpanel
          type: string
      - description: The theme for the customization.
        in: query
        name: theme
        required: true
        schema:
          example: jupiter
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: retrieve_customizations
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Retrieve customization data
      tags:
      - Customizations
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  retrieve_customizations \\\n  application='cpanel' \\\n  theme='jupiter'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/retrieve_customizations?api.version=1&application=cpanel&theme=jupiter
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '100'
      x-cpanel-cli-support: true
  /update_customizations:
    post:
      description: 'This function supplies branding data for a specific application and theme.


        Customization data includes brand logos and colors.


        This function is used to save customization data for the Jupiter theme **only**.'
      operationId: Customizations-update_customizations
      parameters:
      - description: The application name for the customization.
        in: query
        name: application
        required: true
        schema:
          enum:
          - cpanel
          - webmail
          example: cpanel
          type: string
      - content:
          application/json:
            schema:
              example:
                brand:
                  colors:
                    accent: '#00FF00'
                    primary: '#961218'
                  favicon: 
                  logo:
                    description: The orange logo for cPanel.
                    forDarkBackground: 
                    forLightBackground: 
                documentation:
                  url: https://hosting.com/documentation
                help:
                  url: https://hosting.com/get-help
              properties:
                brand:
                  description: The customization data.
                  properties:
                    colors:
                      description: The hex-code colors used to apply a custom color palette to the interface.
                      properties:
                        accent:
                          description: The hex-code to set in the customization.
                          example: '#00FF00'
                          type: string
                        primary:
                          description: The primary color to apply to the interface.
                          example: '#961218'
                          type: string
                      type: object
                    favicon:
                      description: The base64-encoded favorites icon. This function **only** accepts the ICO file format.
                      example: 
                      format: base64
                      type: string
                    logo:
                      description: Logo information used to add your custom logo to the interface.
                      properties:
                        description:
                          description: The description of the logo used for accessibility requirements.
                          example: The orange logo for cPanel.
                          type: string
                        forDarkBackground:
                          description: The base64-encoded logo used on black or dark backgrounds. This function **only** accepts the SVG file format.
                          example: 
                          format: base64
                          type: string
                        forLightBackground:
                          description: The base64-encoded logo used on white or light backgrounds. This function **only** accepts the SVG file format.
                          example: 
                          format: base64
                          type: string
                      type: object
                  type: object
                documentation:
                  description: Optional documentation information.
                  properties:
                    url:
                      description: URL to the companies documentation site. This url will replace the default documentation link in the footer if defined.
                      example: https://hosting.com/documentation
                      format: url
                      type: string
                  type: object
                help:
                  description: Optional help information.
                  properties:
                    url:
                      description: URL to the companies customer support site. This url will replace the default help link in the footer if defined.
                      example: https://hosting.com/get-help
                      format: url
                      type: string
                  type: object
              type: object
        description: The theme data to save.
        in: query
        name: data
        required: true
      - description: The theme name for the customization.
        in: query
        name: theme
        required: true
        schema:
          enum:
          - jupiter
          example: jupiter
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: update_customizations
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Update customization data
      tags:
      - Customizations
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  update_customizations \\\n  application='cpanel' \\\n  theme='jupiter' \\\n  data='{\"brand\":{\"colors\":{\"accent\":\"#00FF00\",\"primary\":\"#961218\"},\"favicon\":\"AAABAAEAICACAAEAAQAwAQAAFgAAACgAAAAgAAAAQAAAAAEAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACanZoAAAAAAP%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2FAD%2F%2F%2BAg%2F%2F%2FAEH%2F%2FgDB%2F%2F4AQf%2F%2BAuCq%2FAfAgBwP4IA8H%2BBABA%2FgQAwH8EAGArA%2FAgAQPwMACD%2BDAAAfA%2BAIPwP1UBQH%2F%2FgAB%2F%2F8AAf%2F%2FgAP%2F%2FwAH%2F%2F%2BiP%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F8AP%2F%2F4CD%2F%2F8AQf%2F%2BAMH%2F%2FgBB%2F%2F4C4Kr8B8CAHA%2FggDwf4EAED%2BBADAfwQAYCsD8CABA%2FAwAIP4MAAB8D4Ag%2FA%2FVQFAf%2F%2BAAH%2F%2FwAB%2F%2F%2BAA%2F%2F%2FAAf%2F%2F6I%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F8%3D\",\"logo\":{\"description\":\"The orange logo for cPanel.\",\"forDarkBackground\":\"%%%2BCgk8L2c%2BCjwvZz4KPC9zdmc%2B\",\"forLightBackground\":\"%2BCjxzdHlsZSB0eXBlPSJ0ZXh0L2NzcyI%2BCgkuc3Qwe2ZpbGw6I0ZGNkMyQzt9Cjwvc3R5bGU%2BCjx0aXRsZT5jUGFuZWwgTG9nbyAtIE9yYW5nZTwvdGl0bGU%2BCjxnIGlkPSJ4TGF5ZXJfMiI%2BCgk8ZyBpZD0ieExheWVyXzEtMiI%%%2BCjwvc3ZnPgo%3D\"}},\"documentation\":{\"url\":\"https://hosting.com/documentation\"},\"help\":{\"url\":\"https://hosting.com/get-help\"}}'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/update_customizations?api.version=1&application=cpanel&theme=jupiter&data=%7B%22brand%22%3A%7B%22colors%22%3A%7B%22accent%22%3A%22%2300FF00%22%2C%22primary%22%3A%22%23961218%22%7D%2C%22favicon%22%3A%22AAABAAEAICACAAEAAQAwAQAAFgAAACgAAAAgAAAAQAAAAAEAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACanZoAAAAAAP%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2FAD%2F%2F%2BAg%2F%2F%2FAEH%2F%2FgDB%2F%2F4AQf%2F%2BAuCq%2FAfAgBwP4IA8H%2BBABA%2FgQAwH8EAGArA%2FAgAQPwMACD%2BDAAAfA%2BAIPwP1UBQH%2F%2FgAB%2F%2F8AAf%2F%2FgAP%2F%2FwAH%2F%2F%2BiP%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F8AP%2F%2F4CD%2F%2F8AQf%2F%2BAMH%2F%2FgBB%2F%2F4C4Kr8B8CAHA%2FggDwf4EAED%2BBADAfwQAYCsD8CABA%2FAwAIP4MAAB8D4Ag%2FA%2FVQFAf%2F%2BAAH%2F%2FwAB%2F%2F%2BAA%2F%2F%2FAAf%2F%2F6I%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F8%3D%22%2C%22logo%22%3A%7B%22description%22%3A%22The%20orange%20logo%20for%20cPanel.%22%2C%22forDarkBackground%22%3A%%%%2BCgk8L2c%2BCjwvZz4KPC9zdmc%2B%22%2C%22forLightBackground%22%3A%%2BCjxzdHlsZSB0eXBlPSJ0ZXh0L2NzcyI%2BCgkuc3Qwe2ZpbGw6I0ZGNkMyQzt9Cjwvc3R5bGU%2BCjx0aXRsZT5jUGFuZWwgTG9nbyAtIE9yYW5nZTwvdGl0bGU%2BCjxnIGlkPSJ4TGF5ZXJfMiI%2BCgk8ZyBpZD0ieExheWVyXzEtMiI%%%2BCjwvc3ZnPgo%3D%22%7D%7D%2C%22documentation%22%3A%7B%22url%22%3A%22https%3A%2F%2Fhosting.com%2Fdocumentation%22%7D%2C%22help%22%3A%7B%22url%22%3A%22https%3A%2F%2Fhosting.com%2Fget-help%22%7D%7D
