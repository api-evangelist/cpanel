  /TwoFactorAuth/set_user_configuration:
    get:
      x-readonly: false
      x-rollback: none
      description: This function configures the two-factor authentication settings for an account.
      operationId: TwoFactorAuth-set_user_configuration
      parameters:
      - description: The 16-character string that UAPI's `TwoFactorAuth::generate_user_configuration` function generates.
        in: query
        name: secret
        required: true
        schema:
          example: JBSWY3DPEHPK3PXP
          maxLength: 16
          type: string
      - description: The six-digit security code that the time-based one-time password (TOTP) authentication app generates.
        in: query
        name: tfa_token
        required: true
        schema:
          example: 528112
          maxLength: 6
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: set_user_configuration
                    type: string
                  module:
                    description: The name of the module called.
                    example: TwoFactorAuth
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          tfa_configured:
                            description: 'Whether two-factor authentication is enabled.

                              * `1` - Enabled.

                              * `1` - Disabled.'
                            enum:
                            - 0
                            - 1
                            example: 1
                            type: integer
                        type: object
                      errors:
