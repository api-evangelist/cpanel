components:
  schemas:
    PricingPeriod:
      description: Pricing for a single registration period.
      properties:
        period:
          description: The registration period in years.
          example: 1
          type: integer
        register:
          description: The registration price for this period.
          properties:
            code:
              description: The ISO 4217 currency code.
              example: USD
              type: string
            display_value:
              description: The formatted price string including prefix and suffix.
              example: $10.74 USD
              type: string
            prefix:
              description: The currency symbol that appears before the value.
              example: $
              type: string
            suffix:
              description: The currency label that appears after the value.
              example: ' USD'
              type: string
            value:
              description: The numeric price as a decimal string.
              example: '10.74'
              type: string
          type:
          - object
          - 'null'
        renew:
          description: The renewal price for this period.
          properties:
            code:
              description: The ISO 4217 currency code.
              example: USD
              type: string
            display_value:
              description: The formatted price string including prefix and suffix.
              example: $10.74 USD
              type: string
            prefix:
              description: The currency symbol that appears before the value.
              example: $
              type: string
            suffix:
              description: The currency label that appears after the value.
              example: ' USD'
              type: string
            value:
              description: The numeric price as a decimal string.
              example: '10.74'
              type: string
          type:
          - object
          - 'null'
        transfer:
          description: The transfer price for this period.
          properties:
            code:
              description: The ISO 4217 currency code.
              example: USD
              type: string
            display_value:
              description: The formatted price string including prefix and suffix.
              example: $11.40 USD
              type: string
            prefix:
              description: The currency symbol that appears before the value.
              example: $
              type: string
            suffix:
              description: The currency label that appears after the value.
              example: ' USD'
              type: string
            value:
              description: The numeric price as a decimal string.
              example: '11.40'
              type: string
          type:
          - object
          - 'null'
      type: object
  securitySchemes:
    BasicAuth:
      scheme: basic
      type: http
