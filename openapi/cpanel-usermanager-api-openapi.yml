        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account.\n// 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file UserManager_lookup_user.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme-name>/\n//    to .../frontend/<theme-name>/api_examples/UserManager_lookup_user.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'UserManager',\n    'lookup_user',\n    array (\n        'guid' => 'EXAMPLE1:EXAMPLE.COM:564CD663%3AFE50072F2620B50988EA4E5F46022546FBE6BDDE3C36C2F2534F4967C661EC37',\n    )\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    // Do something with the $data\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}"
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: cPanel 54
  /UserManager/merge_service_account:
    get:
      x-readonly: false
      x-rollback: none
      description: 'This function links service accounts to subaccounts and creates a subaccount if one does not exist.


        **Note:**


        You can only link email, FTP, or Web Disk accounts.


        **Important**


        You must use at least **one** of the following parameters:


        * services.email.merge

        * services.ftp.merge

        * services.webdisk.merge


        To link multiple service accounts, the service accounts **must** share the same username and domain.'
      operationId: UserManager-merge_service_account
      parameters:
      - description: The service account's associated domain.
        in: query
        name: domain
        required: true
        schema:
          example: example.com
          format: domain
          type: string
      - description: 'The username for the service account that meets the account name limitations.


          * Length - 64 characters

          * Characters — `a-z`, `A-Z`, `0-9`, dot (`.`), hyphen (`-`), underscore (`_`).


          **Note:**


          This value does **not** include the domain name.'
        in: query
        name: username
        required: true
        schema:
          example: example
          format: username
          type: string
      - description: 'Whether to link the email account to the subaccount.


          * `1` - Merge.

          * `0` - Do **not** merge.'
        in: query
        name: services.email.merge
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to link the FTP account to the subaccount.


          * `1` - Merge.

          * `0` - Do **not** merge.'
        in: query
        name: services.ftp.merge
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: 'Whether to link the Web Disk account to the subaccount.


          * `1` - Merge.

          * `0` - Do **not** merge.'
        in: query
        name: services.webdisk.merge
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
