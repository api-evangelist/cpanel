openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: UAPI accesses the cPanel interface's features. Use this API to access and modify cPanel account data and settings.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: cPanel U User Manager API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running cPanel.
  url: https://{host}:{port}/execute
  variables:
    host:
      default: cpanel-server.tld
      description: The hostname of a server running cPanel.
    port:
      default: '2083'
      description: The cPanel port.
security:
- BasicAuth: []
tags:
- description: The UserManager module for UAPI.
  name: UserManager
paths:
  /UserManager/change_password:
    get:
      x-readonly: false
      x-rollback: none
      description: This function updates the password of the main cPanel account, from the User Manager interface. It applies to the account owner only.
      operationId: UserManager-change_password
      parameters:
      - description: The new password.
        in: query
        name: newpass
        required: true
        schema:
          example: MyNewPassw0rd!
          format: password
          type: string
      - description: The current password.
        in: query
        name: oldpass
        required: true
        schema:
          example: ThisWasMyPassword!
          format: password
          type: string
      - description: 'Whether to update the cPanel account''s MySQL password.

          * `1` - Update MySQL password.

          * `0` - Do not update MySQL passowrd.'
        in: query
        name: enablemysql
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: change_password
                    type: string
                  module:
                    description: The name of the module called.
                    example: UserManager
                    type: string
                  result:
                    properties:
                      data:
                        default: null
                        type:
                        - object
                        - 'null'
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` - Success

                          * `0` - Failed: Check the errors field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                type: object
          description: HTTP Request was successful.
      summary: Update cPanel account password (User Manager)
      tags:
      - UserManager
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  UserManager \\\n  change_password \\\n  oldpass='MyPreviousPassword' \\\n  newpass='MyUpdatedPassword'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/UserManager/change_password?oldpass=12346=newpass=ThisIs4It!
      - label: LiveAPI Perl
        lang: Perl
        source: "#--------------------------------------------------------------------------------------\n# Instructions:\n#--------------------------------------------------------------------------------------\n# <theme-name> is the theme assigned to cPanel account.\n# 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n# 2) mkdir api_examples\n# 3) cd api_examples\n# 4) create a file UserManager_change_password.live.pl and put this code into that file.\n# 5) In your browser login to a cPanel account.\n# 6) Manually change the url from: .../frontend/<theme-name>/\n#    to .../frontend/<theme-name>/api_examples/UserManager_change_password.live.pl\n#--------------------------------------------------------------------------------------\n\nuse strict;\n\nuse Cpanel::LiveAPI ();\n\nmy $cpanel = Cpanel::LiveAPI->new(); # Connect to cPanel - only do this once.\n\n# Print the header\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\n\n# Call the API\nmy $response = $cpanel->uapi(\n    q/UserManager/,\n    q/change_password/,\n    {\n        'oldpass' => 'PreviousPassword',\n        'newpass' => 'B3tt3rP4ssw0rd!',\n    }\n);\n\n# Handle the response\nif ($response->{cpanelresult}{result}{status}) {\n    my $data = $response->{cpanelresult}{result}{data};\n    # Do something with the $data\n    # So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    # Report errors:\n    print to_json($response->{cpanelresult}{result}{errors});\n}\n\n# Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n#--------------------------------------------------------------------------------------\n# Helper function to convert a perl object to html printable json\n#--------------------------------------------------------------------------------------\nsub to_json {\n    require JSON;\n    my $str = JSON->new->pretty->encode($_[0]);\n    return $str;\n}\n"
      - label: LiveAPI PHP
        lang: PHP
        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account.\n// 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file UserManager_change_password.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme-name>/\n//    to .../frontend/<theme-name>/api_examples/UserManager_change_password.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'UserManager',\n    'change_password',\n    array (\n        'oldpass' => 'PreviousPassword',\n        'newpass' => 'B3tt3rP4ssw0rd!',\n    )\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    // Do something with the $data\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}"
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: cPanel 116
  /UserManager/check_account_conflicts:
    get:
      x-readonly: true
      description: 'This function lists the other Subaccounts or services accounts that conflict

        with the specified username.


        **Note:**


        If the function returns more than one account, it will return some values

        multiple times within the return arrays.'
      operationId: UserManager-check_account_conflicts
      parameters:
      - description: The Subaccount's username and domain name.
        in: query
        name: full_username
        required: true
        schema:
          example: username@example.com
          format: email
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: check_account_conflicts
                    type: string
                  module:
                    description: The name of the module called.
                    example: UserManager
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          accounts:
                            description: An object containing the service accounts that match the queried `full_username` parameter.
                            properties:
                              alternate_email:
                                description: An alternate email address for the Subaccount's user.
                                example: user@example.com
                                format: email
                                type:
                                - string
                                - 'null'
                              avatar_url:
                                description: The URL to the user's Subaccount profile image file.
                                example: https://img.example.com/avatars/example.jpg
                                format: url
                                type:
                                - string
                                - 'null'
                              can_delete:
                                description: 'Whether the cPanel account user can delete the Subaccount.


                                  * `1` — Can delete.

                                  * `0` — **Cannot** delete.'
                                enum:
                                - 1
                                - 0
                                example: 0
                                type: integer
                              can_set_password:
                                description: 'Whether the cPanel account user can change the Subaccount''s

                                  password.


                                  * `1` — Can change the password.

                                  * `0` — **Cannot** change the password.


                                  **Note:**


                                  the function returns `0` for Subaccounts that inherit their password

                                  from the cPanel account.'
                                enum:
                                - 1
                                - 0
                                example: 1
                                type: integer
                              can_set_quota:
                                description: 'Whether the cPanel account user can change the Subaccount''s

                                  disk usage quota.


                                  * `1` — Can change the Subaccount''s disk usage quota.

                                  * `0` — **Cannot** change the Subaccount''s disk useage quota.'
                                enum:
                                - 1
                                - 0
                                example: 0
                                type: integer
                              dismissed:
                                description: 'Whether the cPanel account user dismissed the merge prompt

                                  for the service account.


                                  * `1` — Dismissed.

                                  * `0` — Did **not** dismiss.


                                  **Note:**


                                  **Only** service accounts return this value.'
                                enum:
                                - 1
                                - 0
                                example: 1
                                type: integer
                              dismissed_merge_candidates:
                                description: 'A list of the service accounts that the user dismissed the merge

                                  prompt for.


                                  **Note:**


                                  * This array **always** returns empty.

                                  * We reserved this return for future use.'
                                items:
                                  type: string
                                type: array
                              domain:
                                description: The Subaccount user's associated domain.
                                example: example.com
                                format: domain
                                type: string
                              full_username:
                                description: The Subaccount's username.
                                example: username@example.com
                                format: email
                                type: string
                              guid:
                                description: The Subaccount's system-assigned unique identifier.
                                example: N4641:EXAMPLE.COM:564CC8A7:A82EA007D8348AC631C0170F9418EC1DEB0D164CC5A722A87C55EF5DD2AD98D4
                                type: string
                              has_expired_invite:
                                description: 'Whether the Subaccount owns an expired invitation.


                                  * `1` — Owns an expired invitation.

                                  * `0` — Does **not** own an expired invitation.'
                                enum:
                                - 1
                                - 0
                                example: 0
                                type: integer
                              has_invite:
                                description: 'Whether the Subaccount owns an active invitation.


                                  * `1` — Own an active invitation.

                                  * `0` — Does **not** own an active invitation.'
                                enum:
                                - 1
                                - 0
                                example: 0
                                type: integer
                              has_siblings:
                                description: 'Whether the service account shares the queried `full_username` value

                                  with another service account.


                                  * `1` — Shares the service account.

                                  * `0` — Does **not** share the service account.'
                                enum:
                                - 1
                                - 0
                                example: 0
                                type: integer
                              invite_expiration:
                                description: 'The time at which the new Subaccount invitation will expire.


                                  * `null` — The account does **not** own an active invitation.'
                                example: 1600162200
                                format: unix_timestamp
                                type:
                                - integer
                                - 'null'
                              issues:
                                description: An array of objects containing information about any issues or problems with the Subaccount.
                                items:
                                  properties:
                                    area:
                                      description: The affected section of cPanel & WHM.
                                      example: info
                                      type: string
                                    limit:
                                      description: The set megabyte (MB) quota limit for the affected Subaccount.
                                      example: 1500
                                      minimum: 1
                                      type: integer
                                    message:
                                      description: A description of the issue.
                                      example: Your account is over quota.
                                      type: string
                                    service:
                                      description: 'The affected service.


                                        * `email`

                                        * `ftp`

                                        * `webdisk`'
                                      enum:
                                      - email
                                      - ftp
                                      - webdisk
                                      example: email
                                      type: string
                                    type:
                                      description: 'The type of issue.


                                        * `error`

                                        * `warning`

                                        * `info`'
                                      enum:
                                      - error
                                      - warning
                                      - info
                                      example: info
                                      type: string
                                    used:
                                      description: The number of megabytes (MB) the account currently uses.
                                      example: 2000
                                      minimum: 1
                                      type: integer
                                  type: object
                                type: array
                              merge_candidates:
                                description: An array of objects containing the service accounts that the system could merge for this Subaccount.
                                items:
                                  properties:
                                    parent_type:
                                      description: 'The type of account that could own the service account.


                                        * `sub` — A Subaccount.

                                        * `hypothetical` — A hypothetical Subaccount that does **not**

                                        yet exist, but that the user could create as part of a merge.

                                        * `null` — **Not** a merge candidate.'
                                      enum:
                                      - sub
                                      - hypothetical
                                      type:
                                      - string
                                      - 'null'
                                    phone_number:
                                      description: 'The Subaccount user''s phone number, in

                                        [ITU-T-recommended E.164](https://en.wikipedia.org/wiki/E.164)

                                        format.'
                                      example: '+15551234567'
                                      type: string
                                    real_name:
                                      description: The name of the Subaccount user, if provided.
                                      example: John Doe
                                      type: string
                                    services:
                                      description: Information about the Subaccount's access to email, FTP, and Web Disk.
                                      properties:
                                        email:
                                          description: Information that indicates the Subaccount's email status.
                                          properties:
                                            enabled:
                                              description: 'Whether the Subaccount can access Webmail, POP, and

                                                IMAP services.


                                                * `1` — Has service access.

                                                * `0` — Does **not** have service access.'
                                              enum:
                                              - 1
                                              - 0
                                              example: 1
                                              type: integer
                                            quota:
                                              description: 'The Subaccount''s email disk space quota, in megabytes (MB).


                                                * `0` — The account has an unlimited email disk space quota.'
                                              example: 100
                                              maximum: 999999
                                              minimum: 0
                                              type: integer
                                          type: object
                                        ftp:
                                          description: Information about the Subaccount's FTP status.
                                          properties:
                                            enabled:
                                              description: 'Whether the Subaccount can access FTP.


                                                * `1` — Has FTP service access.

                                                * `0` — Does **not** have FTP service access.'
                                              enum:
                                              - 1
                                              - 0
                                              example: 0
                                              type: integer
                                            homedir:
                                              description: The Subaccount's FTP directory, relative to the cPanel account's home directory.
                                              example: /Subaccount
                                              type: string
                                            quota:
                                              description: 'The Subaccount''s FTP maximum disk space quota, in

                                                megabytes (MB).


                                                * `0` — The account has an unlimited disk space quota.'
                                              example: 100
                                              minimum: 0
                                              type: integer
                                          type: object
                                        webdisk:
                                          description: Information about the Subaccount's Web Disk status.
                                          properties:
                                            enabled:
                                              description: 'Whether the Subaccount can access Web Disk.


                                                * `1` — Has Web Disk service access.

                                                * `0` — Does **not** have Web Disk service access.'
                                              enum:
                                              - 1
                                              - 0
                                              example: 0
                                              type: integer
                                            homedir:
                                              description: The Subaccount's Web Disk directory, relative to the cPanel account's home directory.
                                              example: /username
                                              type: string
                                            perms:
                                              description: 'Whether the Web Disk has read or read and write

                                                permissions.


                                                * `ro` — Read-only permissions.

                                                * `rw` — Read and write permissions.'
                                              enum:
                                              - ro
                                              - rw
                                              example: rw
                                              type: string
                                            private:
                                              description: 'Whether the Web Disk directory permissions are public

                                                or private.


                                                * `1` — Private (`0700`).

                                                * `0` — Public (`0755`).'
                                              enum:
                                              - 1
                                              - 0
                                              example: 0
                                              type: integer
                                          type: object
                                      type: object
                                    special:
                                      description: 'Whether the account is a system-created special account that

                                        the user **cannot** remove.


                                        * `1` — The user can remove the account.

                                        * `0` — The user **cannot** remove the account.'
                                      enum:
                                      - 1
                                      - 0
                                      example: 1
                                      type: integer
                                    sub_account_exists:
                                      description: 'Whether a Subaccount exists with the same username.


                                        * `1` — Exists.

                                        * `0` — Does **not** exist.

                                        * `null` — The account is **not** a Subaccount.'
                                      enum:
                                      - 1
                                      - 0
                                      example: 0
                                      type:
                                      - integer
                                      - 'null'
                                    synced_password:
                                      description: 'Whether the user has synchronized the passwords for each of

                                        the Subaccount''s service accounts.


                                        * `1` — Synchronized.

                                        * `0` — **Not** synchronized.

                                        * `null` — The account is **not** a Subaccount.'
                                      enum:
                                      - 1
                                      - 0
                                      example: 0
                                      type:
                                      - integer
                                      - 'null'
                                    type:
                                      description: 'The type of account.


                                        * `sub` — A Subaccount.

                                        * `hypothetical` — A hypothetical Subaccount that does **not**

                                        yet exist, but that the user could create as part of a merge.

                                        * `service` — A service account.

                                        * `cpanel` — A cPanel account.'
                                      enum:
                                      - sub
                                      - hypothetical
                                      - service
                                      - cpanel
                                      example: sub
                                      type: string
                                    username:
                                      description: 'The username for the Subaccount.


                                        **Note:**


                                        This value does **not** include the domain name.'
                                      example: username
                                      format: username
                                      type: string
                                  type: object
                                type: array
                            type: object
                          conflict:
                            description: 'Whether the system detected an account conflict.


                              * `1` — Conflict.

                              * `0` — **No** conflict.'
                            enum:
                            - 1
                            - 0
                            example: 1
                            type: integer
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `errors` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Return Subaccounts and service accounts conflicts
      tags:
      - UserManager
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --output=jsonpretty \\\n  --user=username \\\n  UserManager \\\n  check_account_conflicts \\\n  full_username='username@example.com'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2083/cpsess##########/execute/UserManager/check_account_conflicts?full_username=username%40example.com
      - label: LiveAPI Perl
        lang: Perl
        source: "#--------------------------------------------------------------------------------------\n# Instructions:\n#--------------------------------------------------------------------------------------\n# <theme-name> is the theme assigned to cPanel account.\n# 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n# 2) mkdir api_examples\n# 3) cd api_examples\n# 4) create a file UserManager_check_account_conflicts.live.pl and put this code into that file.\n# 5) In your browser login to a cPanel account.\n# 6) Manually change the url from: .../frontend/<theme-name>/\n#    to .../frontend/<theme-name>/api_examples/UserManager_check_account_conflicts.live.pl\n#--------------------------------------------------------------------------------------\n\nuse strict;\n\nuse Cpanel::LiveAPI ();\n\nmy $cpanel = Cpanel::LiveAPI->new(); # Connect to cPanel - only do this once.\n\n# Print the header\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\n\n# Call the API\nmy $response = $cpanel->uapi(\n    q/UserManager/,\n    q/check_account_conflicts/,\n    {\n        'full_username' => 'username@example.com',\n    }\n);\n\n# Handle the response\nif ($response->{cpanelresult}{result}{status}) {\n    my $data = $response->{cpanelresult}{result}{data};\n    # Do something with the $data\n    # So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    # Report errors:\n    print to_json($response->{cpanelresult}{result}{errors});\n}\n\n# Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n#--------------------------------------------------------------------------------------\n# Helper function to convert a perl object to html printable json\n#--------------------------------------------------------------------------------------\nsub to_json {\n    require JSON;\n    my $str = JSON->new->pretty->encode($_[0]);\n    return $str;\n}\n"
      - label: LiveAPI PHP
        lang: PHP
        source: "<?php\n//--------------------------------------------------------------------------------------\n// Instructions:\n//--------------------------------------------------------------------------------------\n// <theme-name> is the theme assigned to cPanel account.\n// 1) cd /usr/local/cpanel/base/frontend/<theme-name>\n// 2) mkdir api_examples\n// 3) cd api_examples\n// 4) create a file UserManager_check_account_conflicts.live.php and put this code into that file.\n// 5) In your browser login to a cPanel account.\n// 6) Manually change the url from: .../frontend/<theme-name>/\n//    to .../frontend/<theme-name>/api_examples/UserManager_check_account_conflicts.live.php\n//--------------------------------------------------------------------------------------\n\n// Instantiate the CPANEL object.\nrequire_once \"/usr/local/cpanel/php/cpanel.php\";\n\n// Print the header\nheader('Content-Type: text/plain');\n\n// Connect to cPanel - only do this once.\n$cpanel = new CPANEL();\n\n// Call the API\n$response = $cpanel->uapi(\n    'UserManager',\n    'check_account_conflicts',\n    array (\n        'full_username' => 'username@example.com',\n    )\n);\n\n// Handle the response\nif ($response['cpanelresult']['result']['status']) {\n    $data = $response['cpanelresult']['result']['data'];\n    // Do something with the $data\n    // So you can see the data shape we print it here.\n    print to_json($data);\n}\nelse {\n    // Report errors:\n    print to_json($response['cpanelresult']['result']['errors']);\n}\n\n// Disconnect from cPanel - only do this once.\n$cpanel->end();\n\n//--------------------------------------------------------------------------------------\n// Helper function to convert a PHP value to html printable json\n//--------------------------------------------------------------------------------------\nfunction to_json($data) {\n    return json_encode($data, JSON_PRETTY_PRINT);\n}"
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: cPanel 56
  /UserManager/create_user:
    get:
      x-readonly: false
      x-rollback: none
      description: This function creates a Subaccount.
      operationId: UserManager-create_user
      parameters:
      - description: The Subaccount user's associated domain that the cPanel account owns.
        in: query
        name: domain
        required: true
        schema:
          example: example.com
          format: domain
          type: string
      - description: "The Subaccount's password.\n\n**Note:**\n\n Email, FTP, and Web Disk services use this password."
        in: query
        name: password
        required: true
        schema:
          example: 123456luggage
          format: password
          type: string
      - description: 'The username for the Subaccount. The username can only contain alphanumeric characters, dots (`.`), hyphens (`-`), and underscores (`_`).


          **Note:**


          This value does **not** include the domain name.'
        in: query
        name: username
        required: true
        schema:
          example: example
          format: username
          maxLength: 64
          type: string
      - description: "An alternate email address for the Subaccount's user.\n\n**Note:**\n\n You **must** use this parameter if you set the `send_invite` value to `1`."
        in: query
        name: alternate_email
        required: false
        schema:
          example: user@example.com
          format: email
          type: string
      - description: 'The URL path to the user''s Subaccount profile photo.


          **Note:**


