        in: query
        name: username
        required: true
        schema:
          example: example
          type: string
      - description: "An alternate email address for the Subaccount's user.\n\n**Note:**\n\n The cPanel account user could use this email address to contact the Subaccount user if their primary email address's domain is unavailable."
