                  type: integer
              type: object
            webdisk:
              description: This object contains information that indicates the subaccount's Web Disk status.
              properties:
                enabled:
                  description: 'Whether the subaccount can access Web Disk.


                    * `1` - Can access.

                    * `0` - **Cannot** access.'
                  enum:
                  - 0
                  - 1
                  example: 0
                  type: integer
                homedir:
                  description: The subaccount's Web Disk home directory.
                  example: /bob
                  format: path
                  type: string
                perms:
                  description: 'Whether to grant write permissions to the subaccount.


                    * `ro` - Read-only permissions.

                    * `rw` - Read and write permissions.'
                  enum:
                  - ro
                  - rw
                  example: rw
                  type: string
                private:
                  description: 'Whether to set the Web Disk directory''s permissions to public or private.


                    * `1` - Private (`0700`).

                    * `0` - Public (`0755`).'
                  enum:
                  - 0
                  - 1
                  example: 0
                  type: integer
              type: object
          type: object
        special:
          description: 'Whether the account is a system-created special account that the user **cannot** remove.


            * `1` - A special account.

            * `0` - **Not** a special account.'
          enum:
          - 0
          - 1
          example: 1
          type: integer
        sub_account_exists:
          description: "Whether a subaccount exists with the same username.\n\n* `1` - Exists.\n* `0` - Does **not** exist.\n\n**Note:**\n\n  The function returns a `null` value if the account is **not** a service account."
          enum:
          - 0
          - 1
          example: 0
          type: integer
        synced_password:
          description: "Whether the user has synchronized the passwords for each of the subaccount's service accounts.\n\n* `1` - Synchronized.\n* `0` - **Not** synchronized.\n\n**Note:**\n\n  The function returns a `null` value if the account is **not** a subaccount."
          enum:
          - 0
          - 1
          example: 0
          type: integer
        type:
          description: 'The type of account.


            * `sub` - A subaccount.

            * `hypothetical` - A hypothetical subaccount that does **not** exist, but that the user could create as part of a merge.

            * `service` - A service account.

            * `cpanel` - The cPanel account.'
          example: sub
          type: string
        username:
          description: "The username for the subaccount.\n\n* Length - 64 characters.\n* Characters - `a-z`, `A-Z`, `0-9`, dot (`.`), hyphen (`-`), underscore (`_`).\n\n**Note:**\n\n  This value does **not** include the domain name."
          example: example
          type: string
      type: object
  securitySchemes:
    BasicAuth:
      scheme: basic
      type: http
