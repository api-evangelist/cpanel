  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: WHM API.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: WHM Web Log Retention API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running WHM.
  url: https://{host}:{port}/json-api
  variables:
    host:
      default: whm-server.tld
      description: The hostname of a server running WHM.
    port:
      default: '2087'
      description: The WHM port.
security:
- BasicAuth: []
tags:
- description: The Web Log Retention module for WHM API 1.
  name: Web Log Retention
paths:
  /list_accounts_retention:
    get:
      description: List each cPanel account's web server log retention preference alongside the server default.
      operationId: WebLogRetention-list_accounts_retention
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      default_retention:
                        description: 'The server-wide default web log retention period, in days, from Tweak Settings.

                          A value of 0 means logs are retained indefinitely.

                          '
                        example: 14
                        type: integer
                      accounts:
                        description: A list of cPanel accounts and their web log retention preferences.
                        items:
                          properties:
                            user:
                              description: The cPanel account username.
                              example: alice
                              type: string
                            domain:
                              description: The account's primary domain.
                              example: example.com
                              type: string
                            retention_days:
                              description: 'The account''s custom web log retention period, in days.

                                Null when the account uses the server default.

                                '
                              example: 30
                              type:
                              - integer
                              - 'null'
                            using_default:
                              description: 'Whether the account uses the server-wide default retention setting.

                                * `true` — Uses the server default.

                                * `false` — Uses a custom retention value.

                                '
                              example: false
                              type: boolean
                          type: object
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: list_accounts_retention
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.

                          '
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: List accounts' web log retention settings
      tags:
      - Web Log Retention
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  list_accounts_retention\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/list_accounts_retention?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '136'
