  /Backup/restore_files:
    post:
      x-readonly: false
      x-rollback: none
      description: 'This function restores an account''s files.


        **Important:**


        When the File Storage role is disabled, the system also **disables** this function.


        **Note:**


        You **must** use the `backup` parameter when you call this function in one of the following formats:

        * As part of a `multipart/form-data` request body to upload and restore a backup file to the server. For more information about this structure, read Mozilla''s POST Method documentation.

        * As a query parameter to restore an existing file on the server.'
      operationId: Backup-restore_files
      parameters:
      - description: 'The backup file to restore.


          **Important:**


          **Only** pass this parameter to restore backup files that already exist on the server.


          **Note:**


          To restore multiple backup files, increment the parameter name. For example: `backup-1`, `backup-2`, and `backup-3`.'
        examples:
          multiple:
            summary: Restore multiple backup files.
            value: backup-1=/home/cpuser/backup-cpuser.tld-9-10-2019_1.tar.gz backup-2=/home/cpuser/backup-cpuser.tld-9-10-2019_2.tar.gz
          single:
            summary: Restore a single backup file.
            value: /home/cpuser/backup-cpuser.tld-9-10-2019_1.tar.gz
        in: query
        name: backup
        required: false
        schema:
          type: string
      - description: The directory to which to restore the file. The default is the user's `home` directory.
        in: query
        name: directory
        required: false
        schema:
          example: /home/user/example
          format: path
          type: string
      - description: 'The maximum number of seconds to try to restore the file.

          * `0` - The system will not time out the file restoration.'
        in: query
        name: timeout
        required: false
        schema:
          default: 172800
          example: 7200
          minimum: 0
          type: integer
      - description: 'Whether to return additional information from the `/home/cptest/.cpanel/logs/restorefiles` log files.

          * `1` - Return additional information.

          * `0` - Do not return additional information.'
        in: query
        name: verbose
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                backup:
                  format: binary
                  type: string
              type: object
        description: 'The backup file to upload and restore.


          **Important:**


          * **Only** pass this parameter to upload files that don''t already exist on the server.

          * You can''t pass this parameter on the command line.


          **Note:**


          To upload and restore multiple backup files, increment the parameter name. For example: `backup-1`, `backup-2`, and `backup-3`.'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: restore_files
                    type: string
                  module:
                    description: The name of the module called.
                    example: Backup
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          log_id:
                            description: The log file's restoration identification (ID). The system uses the backup restoration's date to create this ID. The ID is in [ISO-8601 Date Time](https://en.wikipedia.org/wiki/ISO_8601) format with the log's revision number appended.
                            example: 2019-08-13T15:10:07Z.1
                            type: string
                          log_path:
                            description: The filepath to the backup restoration's log file.
                            example: /home/cptest/.cpanel/logs/restorefiles/2019-08-13T15:10:07Z.1.log
                            format: path
                            type: string
                          messages:
                            description: An array of statements about the database's restoration.
                            items:
                              example: The system successfully restored the directory /home/cpuser/point2 from the backup file backup-cpuser.tld-9-10-2019_1.tar.gz
                              type: string
                            type: array
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` - Success

                          * `0` - Failed: Check the errors field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Restore files
      tags:
      - File Restoration
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --input=json --output=jsonpretty \\\n  --user=username \\\n  Backup \\\n  restore_files\n"
