  /Restore/directory_listing:
    get:
      x-readonly: true
      description: 'This function lists all of the backup files and directories in the user''s home directory.


        **Important:**


        When you disable the File Storage role, the system **disables** this function.'
      operationId: Restore-directory_listing
      parameters:
      - description: 'A path to a subdirectory within the user''s home directory, or any level below it.


          **Note:**


          The value of this parameter **must** begin and end with a forward slash (`/`) for security purposes.'
        in: query
        name: path
        required: true
        schema:
          example: /public_html/
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: directory_listing
                    type: string
                  module:
                    description: The name of the module called.
                    example: Restore
                    type: string
                  result:
                    properties:
                      data:
                        description: An object that contains information about a specific item stored in the backup.
                        items:
                          properties:
                            conflict:
                              description: 'Whether a difference exists between the `type` and `onDiskType` returns.

                                * `1` - Conflict exists.

                                * `0` - **No** conflict exists.'
                              enum:
                              - 0
                              - 1
                              example: 0
                              type: integer
                            exists:
                              description: 'Whether the file exists in the user''s directory or **only** in the backup.

                                * `1` - File exists in the user''s directory.

                                * `0` - File exists **only** in the backup.'
                              enum:
                              - 0
                              - 1
                              example: 1
                              type: integer
                            name:
                              description: The name of the file or directory.
                              example: public_html
                              type: string
                            onDiskType:
                              description: 'The item type stored on the disk.

                                * `dir` - A directory.

                                * `file` - A file.

                                * `symlink` - A symlink.

                                * `unknown` - An unknown file type.'
                              enum:
                              - dir
                              - file
                              - symlink
                              - unknown
                              example: file
                              type: string
                            type:
                              description: 'The item type stored in the backup.

                                * `dir` - A directory.

                                * `file` - A file.

                                * `symlink` - A symlink.

                                * `unknown` - An unknown file type.'
                              enum:
                              - dir
                              - file
                              - symlink
                              - unknown
                              example: file
                              type: string
                          type: object
                        type: array
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties:
                          transformed:
                            description: Post-processing may have transformed the data.
                            enum:
                            - 1
