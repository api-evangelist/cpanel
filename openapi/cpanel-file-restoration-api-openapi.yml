      parameters:
      - description: 'The email filter file to restore.


          **Important:**


          **Only** pass this parameter to restore email filter files that already exist on the server.


          **Note:**


          To restore multiple email filter files, increment the parameter name. For example: `backup-1`, `backup-2`, and `backup-3`.'
        examples:
          multiple:
            summary: Restore multiple email filter files.
            value: backup-1=/home/user/filter_info1.username.yaml.gz backup-2=/home/user/filter_info2.username.yaml.gz backup-3=/home/user/filter_info3.username.yaml.gz
          single:
            summary: Restore a single email filter file.
            value: /home/user/filter_info.username.yaml.gz
        in: query
        name: backup
        required: false
        schema:
          type: string
      - description: 'The maximum number of seconds to try to restore the file.

          * `0` - The system will not time out the file restoration.'
        in: query
        name: timeout
        required: false
        schema:
          default: 7200
          example: 3600
          minimum: 0
          type: integer
      - description: 'Whether to return additional information from the `/home/cpuser/.cpanel/logs/restore-email-filters` log files.

          * `1` - Return additional information.

          * `0` - Do not return additional information.'
        in: query
        name: verbose
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                backup:
                  format: binary
                  type: string
              type: object
        description: 'The email filter file to upload and restore.


          **Important:**


          * **Only** pass this parameter to upload files that don''t already exist on the server.

          * You can''t pass this parameter on the command line.


          **Note:**


          * To upload multiple email filter files, increment the parameter name. For example: `backup-1`, `backup-2`, and `backup-3`.

          * Pass this file in a multipart/form-data structure.

          * For more information about this structure, read Mozilla''s [POST Method](https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods/POST) documentation.'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: restore_email_filters
                    type: string
                  module:
                    description: The name of the module called.
                    example: Backup
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          log_id:
                            description: The log file's restoration identification (ID). The system uses the backup restoration's date to create this ID. The ID is in [ISO-8601 Date Time](https://en.wikipedia.org/wiki/ISO_8601) format with the log's revision number appended.
                            example: 2019-08-13T15:10:07Z.1
                            type: string
                          log_path:
                            description: The filepath to the backup restoration's log file.
                            example: /home/cpuser/.cpanel/logs/restore-email-filters/2019-09-11T18:30:49Z.1.log
                            format: path
                            type: string
                          messages:
                            description: An array of statements about the database's restoration.
                            items:
                              example: The system successfully restored the email filters from the 'filter-info.user.yaml.gz' backup.
                              type: string
                            type: array
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` - Success

                          * `0` - Failed: Check the errors field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Restore email filters
      tags:
      - File Restoration
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --input=json --output=jsonpretty \\\n  --user=username \\\n  Backup \\\n  restore_email_filters\n"
      - label: HTTP Request (Wire Format)
        lang: HTTP
        source: 'POST /cpsess##########/execute/Backup/restore_email_filters HTTP/1.1

          Host: example.com:2083

          Cookie: ###################################

          Content-Type: application/json

          Content-Length: 0


