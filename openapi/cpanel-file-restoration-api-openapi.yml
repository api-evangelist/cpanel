openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: UAPI accesses the cPanel interface's features. Use this API to access and modify cPanel account data and settings.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: cPanel U File Restoration API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running cPanel.
  url: https://{host}:{port}/execute
  variables:
    host:
      default: cpanel-server.tld
      description: The hostname of a server running cPanel.
    port:
      default: '2083'
      description: The cPanel port.
security:
- BasicAuth: []
tags:
- description: cPanel Account Backups / File Restoration
  name: File Restoration
paths:
  /Backup/restore_databases:
    post:
      x-readonly: false
      x-rollback: none
      description: 'This function restores a database''s backup files.


        **Important:**


        When the MySQL Client role is disabled, the system also **disables** this function.


        **Note:**


        You **must** pass either the `file` **or** `backup` parameter.'
      operationId: Backup-restore_databases
      parameters:
      - description: 'The database backup file to restore.


          **Important:**


          **Only** pass this parameter to restore files already on the server.


          **Note:**


          To restore multiple database backup files, increment the parameter name. For example: `backup-1`, `backup-2`, and `backup-3`.'
        examples:
          multiple:
            summary: Restore multiple database backup files.
            value: backup-1=home/user/user_db1.sql.gz backup-2=home/user/user_db2.sql.gz backup-3=home/user/user_db3.sql.gz
          single:
            summary: Restore a single database backup file.
            value: home/user/user_db1.sql.gz
        in: query
        name: backup
        required: false
        schema:
          type: string
      - description: 'The maximum number of seconds to try to restore the file.

          * `0` - The system will not time out the file restoration.'
        in: query
        name: timeout
        required: false
        schema:
          default: 7200
          example: 3600
          minimum: 0
          type: integer
      - description: 'Whether to return additional information from the `/usr/local/cpanel/logs/cpbackup` log file.

          * `1` - Return additional information.

          * `0` - Do **not** return additional information.'
        in: query
        name: verbose
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 1
          type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  format: binary
                  type: string
              type: object
        description: 'The database backup file to upload and restore.


          **Important:**


          * **Only** pass this parameter to upload files that don''t already exist on the server.

          * You can **not** pass this parameter on the command line.


          **Note:**


          * To upload multiple database backup files, increment the parameter name. For example: `file-1`, `file-2`, and `file-3`.

          * Pass this file in a multipart/form-data structure.

          * For more information about this structure, read Mozilla''s [POST Method](https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods/POST) documentation.'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  apiversion:
                    description: The version of the API.
                    example: 3
                    type: integer
                  func:
                    description: The name of the method called.
                    example: restore_databases
                    type: string
                  module:
                    description: The name of the module called.
                    example: Backup
                    type: string
                  result:
                    properties:
                      data:
                        properties:
                          log_id:
                            description: The log file's restoration identification (ID). The system uses the backup restoration's date to create this ID. The ID is in [ISO-8601 Date Time](https://en.wikipedia.org/wiki/ISO_8601) format with the log's revision number appended.
                            example: 2019-08-13T15:10:07Z.1
                            type: string
                          log_path:
                            description: The filepath to the backup restoration's log file.
                            example: /home/cptest/logs/restoredb/2019-08-13T15:10:07Z.1.log
                            format: path
                            type: string
                          messages:
                            description: An array of statements about the database's restoration.
                            items:
                              example: The system successfully restored the database 'user_db1' from the backup file 'user_db1.sql.gz'
                              type: string
                            type: array
                        type: object
                      errors:
                        description: List of errors if the API failed.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      messages:
                        description: List of messages generated by the API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                      metadata:
                        properties: {}
                      status:
                        description: '* `1` - Success

                          * `0` - Failed: Check the errors field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      warnings:
                        description: List of warnings generated by the API. Warnings describe non-critical failures or other problematic conditions noted while running a API.
                        example: null
                        items:
                          type: string
                        type:
                        - array
                        - 'null'
                    type: object
                type: object
          description: HTTP Request was successful.
      summary: Restore databases
      tags:
      - File Restoration
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "uapi --input=json --output=jsonpretty \\\n  --user=username \\\n  Backup \\\n  restore_databases\n"
      - label: HTTP Request (Wire Format)
        lang: HTTP
        source: 'POST /cpsess##########/execute/Backup/restore_databases HTTP/1.1

          Host: example.com:2083

          Cookie: ###################################

          Content-Type: application/json

          Content-Length: 0


          '
      x-cpanel-api-version: UAPI
      x-cpanel-available-version: cPanel 84
  /Backup/restore_email_filters:
    post:
      x-readonly: false
      x-rollback: none
      description: 'This function restores an account''s email filters.


        **Important:**


        When the Receive Mail role is disabled, the system also **disables** this function.


        **Note:**


        You **must** use the `backup` parameter when you call this function in one of the following formats:

        * As part of a `multipart/form-data` request body to upload and restore a backup file to the server.

        * As a query parameter to restore an existing file on the server.'
