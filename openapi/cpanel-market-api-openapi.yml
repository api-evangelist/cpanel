    SSLMarketProviderProductMetaData:
      allOf:
      - $ref: '#/components/schemas/MarketProviderProductMetaData'
      - properties:
          x_certificate_term:
            description: An array that indicates the length of time and unit of time that the product secures for.
            example:
            - '1'
            - year
            items:
              type: string
            type: array
          x_identity_verification:
            additionalProperties:
              description: Contains additional properties that vary between products.
              x-additionalPropertiesName: certificate_properties
            description: Defines a schema for identity verification information for OV and EV certificates.
            properties:
              label:
                description: The display name of the property.
                example: Dun & Bradstreet D-U-N-S (Data Universal Numbering System) Number
                type: string
              name:
                description: The name of the property.
                example: duns_number
                type: string
            type: object
          x_max_http_redirects:
            description: The maximum number of HTTP redirections that the provider allows during a Domain Control Validation (DCV) check of the domain or domains in the certificate.
            minimum: 1
            type: integer
          x_payment_trigger:
            description: 'Indicates whether the provider charges immediately or when they issue the Secure Sockets Layer (SSL) certificate.


              * `checkout` — Collect payment and finalize immediately after checkout. Any failures to issue the certificate must prompt a separate refund.

              * `issuance` — Collect payment when the provider issues the certificate to the user.


              **Note:**


              For more information, read the _For certificate orders_ section of our [Guide to cPanel Market Provider Modules](https://go.cpanel.net/featureshowcasemarket) documentation.'
            enum:
            - checkout
            - issuance
            type: string
          x_price_per_domain:
            description: The product's price per domain.
            example: 3
            minimum: 1
            type: number
          x_price_per_domain_maximum:
            description: The maximum `x_price_per_domain` value.
            example: 30
            minimum: 1
            type: number
          x_price_per_domain_minimum:
            description: The minimum `x_price_per_domain` value.
            example: 3
            minimum: 1
            type: number
          x_price_per_wildcard_domain:
            description: The price per domain for a wildcard certificate.
            example: 99
            minimum: 1
            type: number
          x_price_per_wildcard_domain_maximum:
            description: The maximum `x_prive_per_wildcard_domain` value.
            example: 30
            minimum: 1
            type: number
          x_price_per_wildcard_domain_minimum:
            description: The minimum `x_prive_per_wildcard_domain` value.
            example: 99
            minimum: 1
            type: number
          x_ssl_per_domain_pricing:
            description: 'Whether the provider uses per-domain pricing for this certificate.

              * `1` — Uses per-domain pricing.

              * `0` — Does **not** use per-domain pricing.'
            enum:
            - 0
            - 1
            type: integer
          x_supports_dns_dcv:
            description: 'Whether this product supports DNS-based DCV.

              * `1` — Supports DNS DCV.

              * `0` — Does `not` support DNS DCV.'
            enum:
            - 0
            - 1
            type: integer
          x_validation_type:
            description: The validation type.
            example: ev
            type: string
          x_warn_after:
            description: A length of time, in seconds, after which the cPanel interface warns the user that a problem may exist with the order. The warning suggests that they contact the cPanel Market provider's support contact.
            example: 14400
            minimum: 1
            type: integer
          x_wildcard_parent_domain_free:
            description: 'Indicates if a wildcard domain includes its parent domain. For example, `*.example.com` would include the `example.com` parent domain.


              * `1` — The domain does include its parent domain.

              * `0` — The domain does **not** include its parent domain.'
            enum:
            - 0
            - 1
            type: integer
      type: object
    MarketProviderProductMetaDataType:
      anyOf:
      - $ref: '#/components/schemas/MarketProviderProductMetaData'
      - $ref: '#/components/schemas/SSLMarketProviderProductMetaData'
      discriminator:
        mapping:
          ssl_certificate: '#/components/schemas/SSLMarketProviderProductMetaData'
        propertyName: product_group
    SSLCertificateMarketItem:
      allOf:
      - $ref: '#/components/schemas/MarketItem'
      - properties:
          x_certificate_term:
            description: An array indicating the length and unit of time that the product secures for.
            example:
            - '1'
            - year
            items:
              type: string
            type: array
          x_identity_verification:
            description: "An array of objects that define a schema for identity\n  verification information for Organizational Validation (OV)\n  and Extended Validation (EV) certificates.\nOV and EV certificates require identifying information."
            items:
              properties:
                description:
                  description: A sentence that provides more information about the SSL provider.
                  example: This is a company name
                  type: string
                is_optional:
                  description: 'Whether the value is optional.

                    * `1` - Optional.

                    * Any object that does **not** contain a `1` value indicates that the SSL certificate provider requires identity verification.'
                  enum:
                  - 1
                  example: 1
                  type: integer
                label:
                  description: A phrase that serves as a label for the value.
                  example: Company Name
                  type: string
                name:
                  description: The name by which to submit this value.
                  example: duns_number
                  type: string
                options:
                  description: 'An array of two member arrays.


                    **Note:**


