  /set_market_product_attribute:
    get:
      description: This function sets an attribute for a cPanel Market provider's product.
      operationId: Market-set_market_product_attribute
      parameters:
      - description: 'The attribute of the cPanel Market provider''s product.


          **Note**


          Attributes vary between cPanel Market providers and products.'
        in: query
        name: attribute
        required: true
        schema:
          example: price
          type: string
      - description: The cPanel Market provider product's name.
        in: query
        name: product_id
        required: true
        schema:
          example: '12345'
          type: string
      - description: The cPanel Market provider's name.
        in: query
        name: provider
        required: true
        schema:
          example: cPStore
          type: string
      - description: The value to set for the attribute.
        in: query
        name: value
        required: true
        schema:
          example: '6.00'
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: set_market_product_attribute
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is 0. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Update Market provider product
      tags:
      - Market
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  set_market_product_attribute \\\n  provider='cPStore' \\\n  product_id='12345' \\\n  attribute='price' \\\n  value='6.00'\n"
      - label: URL
