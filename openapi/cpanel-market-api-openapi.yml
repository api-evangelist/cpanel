    get:
      x-readonly: false
      x-rollback: none
      description: This function submits a request for a certificate order to the cPanel Market provider.
      operationId: Market-request_ssl_certificates
      parameters:
      - description: The access token for the session to the cPanel Market provider.
        in: query
        name: access_token
        required: true
        schema:
          example: 725431a1-d5bc-11e5-a28b-8b0e09a93f05
          type: string
      - content:
          application/json:
            schema:
              example:
                price: 6
                product_id: '143'
                subject_names:
                - dNSName: example.com
                - dNSName: example.org
                validity_period:
                - 1, "year"
                vhost_names:
                - example.com
              properties:
                price:
                  description: The certificate's price.
                  format: currency
                  type: number
                product_id:
                  description: The product's ID.
                  type: string
                subject_names:
                  anyOf:
                  - description: HTTP-based DCV only.
                    items:
                      type: string
                    type: array
                  - description: DNS-based DCV or HTTP-based DCV.
                    items:
                      type: object
                    type: array
                  description: 'An array of strings or array of objects containing the certificate''s subject names:


                    **For HTTP-based DCV only:**


                    Use an array of strings that contains `dNSName` and the domain.


                    For example:


                    `[["dNSName","example.com"],["dNSName","example.org"]]`


                    **DNS-based DCV or HTTP-based DCV:**


                    Use an array of objects that consits of:


                    * `type:dNSName`

                    * `name` — The domain name.

                    * `dcv_method` — Either the `dns` or `http` value for for DNS-based or HTTP-based Domain Control Validation (DCV).


                    For example:


                    `[{type:“dNSName”,name:“text.example.com”,dcv_method:“dns”},{type:“dNSName”,name:“text.example.com”,dcv_method:“http”}]`


                    **Note:**


                    * Custom provider modules that include DNS-based DCV requests **must** use the array of

                    objects format, **not** the array of strings format.

                    * This function does **not** automatically include the corresponding `www.` subdomain for each domain

                    that you declare in this parameter.

                    * If you wish to order the `www.` subdomain for a domain, you **must** explicitly declare it in an additional

                    array or object within the `subject_names` parameter.'
                validity_period:
                  description: 'The period of time the certificate will remain valid.

                    This array consists of a number value and string that represents a unit of time (for example, `year`).'
                  items:
                    type: string
                  type: array
                vhost_names:
                  description: 'A comma-separated list of web virtual hosts (vhosts) for which the system will install the certificate.


                    **Note:**


                    An asterisk (`*`) chraracter represents every vhost with which the certificate is compatible.'
                  items:
                    type: string
                  type: array
              required:
              - product_id
              - price
              - subject_names
              - validity_period
