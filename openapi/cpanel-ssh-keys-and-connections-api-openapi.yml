  /listsshkeys:
    get:
      description: 'This function lists the server''s SSH keys.


        **Warning:**


        Only the `root` account can use this function, and it only affects the `root`

        keys. To perform this function on a regular user account, call the cPanel API

        2 `SSH::listkeys` function through the WHM API.'
      operationId: SSH-listsshkeys
      parameters:
      - description: A filename, to limit the results to keys that have that filename.
        in: query
        name: files
        required: false
        schema:
          example: TestKey
          type: string
      - description: 'Whether to display only private keys.


          * `1` — Display only private keys.

          * `0` — Display all keys.'
        in: query
        name: private
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'Whether to include private key text.


          * `1` — Include private key text.

          * `0` — Do **not** include private key text.'
        in: query
        name: private_texts
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'Whether to display only public keys.


          * `1` — Display only public keys.

          * `0` — Display all keys.'
        in: query
        name: public
        required: false
        schema:
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'Whether to include public key text.


          * `1` — Include public key text.

          * `0` — Do **not** include public key text.'
        in: query
        name: public_texts
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: 'Whether to synchronize the keys that can access the server.


          * `1` — Synchronize the keys.

          * `0` — Do **not** synchronize the keys.'
        in: query
        name: sync_authorized
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          example: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      keys:
                        description: An array of objects of each key's information.
                        items:
                          properties:
                            authorized:
                              description: 'Whether the key is authorized to access the server.


                                * `1` — Authorized.

                                * `0` — **Not** authorized.'
                              enum:
                              - 0
                              - 1
                              example: 0
                              type: integer
                            comment:
                              description: The key's comment.
                              example: REPO username@example.com
                              type: string
                            ctime:
                              description: 'The date that the key was created, in

                                [Unix time format](http://en.wikipedia.org/wiki/Unix_time).'
                              example: 1416596824
                              format: unix_timestamp
                              type: integer
                            file:
                              description: The key's filename.
                              example: TestKey
                              type: string
                            mtime:
                              description: The date that the key will expire, in Unix time format.
                              example: 1416596824
                              format: unix_timestamp
                              type: integer
                            private:
                              description: 'Whether the private key is stored on the server.


                                * `1` — The private key is on the server.

                                * `0` — The private key is **not** on the server.'
                              enum:
                              - 0
                              - 1
                              example: 1
                              type: integer
                            text:
                              description: The key's text.
                              example: ssh- REPO username@example.com
                              type: string
                          type: object
                        type: array
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: listsshkeys
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return SSH keys list
      tags:
      - SSH Keys and Connections
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  listsshkeys\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/listsshkeys?api.version=1
