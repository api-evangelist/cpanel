openapi: 3.2.0
info:
  contact:
    email: cs@cpanel.net
    name: WebPros International, LLC
    url: https://cpanel.net/support/
  description: WHM API.
  license:
    name: cPanel License
    url: https://cpanel.net/legal-notices/
  termsOfService: https://cpanel.net/legal-notices/
  title: WHM SSH Keys and Connections API
  version: 11.137.9999.106
  x-api-evangelist-provenance: 'Harvested verbatim from cPanel''s developer portal on 2026-09-05 via the MCP tool get-full-api-description at https://api.docs.cpanel.net/mcp. ONE mechanical change was made before storage: example values containing PEM private-key or certificate blocks, and AWS-access-key-shaped example strings, were replaced with REDACTED_* placeholders so the file can be stored in a public git repository without tripping secret scanning. No path, operation, parameter, schema or description was altered, added or removed.'
servers:
- description: A server running WHM.
  url: https://{host}:{port}/json-api
  variables:
    host:
      default: whm-server.tld
      description: The hostname of a server running WHM.
    port:
      default: '2087'
      description: The WHM port.
security:
- BasicAuth: []
tags:
- description: Authentication / SSH Keys and Connections
  name: SSH Keys and Connections
paths:
  /accesshash:
    get:
      deprecated: true
      description: 'This function regenerates or retrieves a user''s access hash. For more information about access hashes, read our Remote Access Key documentation.


        **Warning:**


        We **deprecated** this function. We **strongly** suggest that you use the WHM API 1 `api_token_create` function.'
      operationId: Resellers-accesshash
      parameters:
      - description: 'Whether to regenerate the access hash.

          * `1` — Regenerate the access hash.

          * `0` — Do **not** regenerate the access hash.'
        in: query
        name: generate
        required: true
        schema:
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: The user's name.
        in: query
        name: user
        required: true
        schema:
          example: root
          format: username
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      accesshash:
                        description: The user's access hash.
                        example: 
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: accesshash
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Return cPanel account access hash
      tags:
      - SSH Keys and Connections
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  accesshash \\\n  user='root' \\\n  generate='0'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/accesshash?api.version=1&user=root&generate=0
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11'
  /authorizesshkey:
    get:
      description: 'This function authorizes a public SSH key to access the server.

        When you call this function, it adds the key to the `/root/.ssh/authorized_keys` file.


        **Warning:**


        * Do **not** transfer private keys over insecure ports.

        * Only `root` and `root`-enabled resellers can use this function, and it only affects

        the `root` public SSH keys. To perform this function on a regular user account, call

        the cPanel API 2 `SSH::authkey` function via the WHM API. For more information, read our

        Use WHM API to Call cPanel API and UAPI

        documentation.'
      operationId: SSH-authorizesshkey
      parameters:
      - description: 'Whether to authorize the public SSH key to access the server.


          * `1` — Authorize.

          * `0` — Do **not** authorize.'
        in: query
        name: authorize
        required: true
        schema:
          enum:
          - 1
          - 0
          example: 1
          type: integer
      - description: 'The public SSH key file''s name.


          **Note:**


          * This file **must** exist in the `/root/.ssh` directory.

          * If you call **both** the `file` and the `text` parameters, the function **ignores**

          the `file` parameter.'
        in: query
        name: file
        required: true
        schema:
          example: sshkey.pub
          type: string
      - description: 'The text of the SSH public key file.


          **Note:**


          * If you call **both** the `file` and the `text` parameters, the function **ignores**

          the `file` parameter.'
        in: query
        name: text
        required: true
        schema:
          example: ssh-rsa 
          type: string
      - description: 'A comma-separated list of options to include with the public SSH key.

          For a list of options, read the

          [OpenBSD manaual](https://man.openbsd.org/sshd.8#AUTHORIZED_KEYS_FILE_FORMAT).


          This parameter defaults to no options.'
        in: query
        name: options
        required: false
        schema:
          example: agent-forwarding,cert-authority
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      authorized:
                        description: 'Whether the public SSH key has authorization.

                          * `1` — Authorized.

                          * `0` — **Not** authorized.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      file:
                        description: The public SSH key file's name.
                        example: sshkey.pub
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: authorizesshkey
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 1
                        - 0
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Enable SSH key for server
      tags:
      - SSH Keys and Connections
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  authorizesshkey \\\n  file='sshkey.pub' \\\n  text='ssh-rsa ' \\\n  authorize='1'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/authorizesshkey?api.version=1&file=sshkey.pub&text=ssh-rsa%20AAAAB3NzaC1yc2EAAAADAQABAAABAQCys7JbGhkAZ8E4Pmq8D4EBm1UedKK2oMhs3RVIEFRJX6S86Itw6Qmhds62LNGrxuVL11W6v25%2bmaIiBhXnslyQpd838tHyAC7J%2fSJojDid8acovX%2f4xgJQaJHLAh9tLgyQXnNhIxIGJ4nVZ%2b8OqM2Vb1Cps%2bE5H17ivG07PXnVPEvwMaeWkm2DnGgSy5kmjVpNKlj9GWFCn%2fSJd7up7QnbGKoz87pxKDs3esp%2bziuPEAJHLeXnKHWPVukQgtRUpUBdqkCvu5hUkhpaiWmBR8yxajkxbSObPw%2bZkELhmm%2bfQseOfEbrwToMRJCO7gAKwBtNi7OhyFM7YFrvdo0xh6cn&authorize=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11'
  /check_remote_ssh_connection:
    get:
      description: This function tests an SSH connection to another server.
      operationId: SSH-check_remote_ssh_connection
      parameters:
      - description: The remote server's hostname.
        in: query
        name: host
        required: true
        schema:
          example: example.com
          format: domain
          type: string
      - description: The remote server's port number.
        in: query
        name: port
        required: false
        schema:
          default: 22
          example: 22
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      comment:
                        description: 'The remote connection''s comment section.

                          * A valid string.

                          * `undef` - If the local and remote servers connect successfully.'
                        example: 'null'
                        type: string
                      protocol_versions:
                        description: 'The available SSH protocol versions.

                          * A valid string.

                          * `undef` - If the local and remote servers connect successfully.'
                        items:
                          example: '2.0'
                          type: string
                        type: array
                      received:
                        description: The raw data from the remote server.
                        example: SSH-2.0-OpenSSH_5.3
                        type: string
                      server_software:
                        description: 'The version of the remote server''s SSH server software.

                          * A valid string.

                          * `undef` - If the local and remote servers connect successfully.'
                        example: OpenSSH_5.3
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: check_remote_ssh_connection
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Validate SSH connection to another server
      tags:
      - SSH Keys and Connections
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  check_remote_ssh_connection \\\n  host='example.com'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/check_remote_ssh_connection?api.version=1&host=example.com
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11'
  /convertopensshtoputty:
    get:
      description: 'This function converts an OpenSSH private key to a PuTTY key.


        **Warning:**


        Do **not** transfer private keys over insecure ports.'
      operationId: SSH-convertopensshtoputty
      parameters:
      - description: The private key file's name.
        in: query
        name: file
        required: true
        schema:
          example: KeyFile
          type: string
      - description: 'Whether to keep the OpenSSH file on the server after conversion.

          * `1` — Keep the file.

          * `0` — Delete the file.'
        in: query
        name: keep_file
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 0
          type: integer
      - description: The private key file's passphrase.
        in: query
        name: passphrase
        required: false
        schema:
          default: ''
          example: 12345luggage
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      key:
                        description: The converted key file's text.
                        example: 'PuTTY-User-Key-File-2: ssh-rsa Encryption: aes256-cbc Comment: imported-openssh-key Public-Lines: 12 AAAAB3NzaC1yc2EAAAABIwAAAgEAuuth41YYyWABsRKexJXgSMD8FvIBFCptUfZP 4U/6R41FvL/RS+99kq1WL/KASsKRoEA5uc0axM+iNgZtKuemQYGUZNvN+8X8sC/l E6GF7X3Pvj2Ml4AlD7TQv0WQZUp9xn+SlOti+3pYh+S56vzNjvdifO7U5mPGW/81 9N4vGhG3ThaAgETwkL33CM2LeNRuvoWpeQcuzEVX2aOvHQZqOvV15fTjZ64ZGL3i UDtKmeaHs4tMqgNIUXgn1P1V4TgPvTIfopH8FBX3g1pD15XD3vn+XHLwia0505c5 +QM+jElS3HHb0vrrDo3S+8koXLWp07wu/GYrvBd5+MlsSV7bpr7lmWj8uMQjc0ap eZe+eb/MteadWnqIPeOVuracssCvDLqXEPK2KjhFMPqBTepNhZaJHRfvkodPm43C 50nhqzrNoxFvXb1rfCjPPqGfhuSZhlCmo2FDiZPKdl0X7bhzDIvMVikyqJP06bqK y9iclyQv0VPfyCIx/VDcVclIoUa8A49nAinXHKeUx9QUNBHv8wXdyz7W41jQa+++ Ih3Yc4o9rpV95DDmKp7iF6kFk4aVjIWDgEsPTaL28wlvUyazoW5TAGPHDrRJoedU ag8KDRNPrGbKYu3CvoINiz0sshyCvr1gjKNG75Cwe+L4hXIkaw8wlCpwFq8VSX70 RS9Pei8= Private-Lines: 28 bb31s+xsiAv1+pclnmvreEYdxvuVmbeWMjUWJd4Y4TKIAyLEItsXNs078qn1QAZ+ Wj6t+0HcnhuUVICHyCyJrp++1g4OtzTAHRczaD5ybhb9ktSe1qlnszKD1Rg5/o+B 61h6kvMcZyuNSjtPkmqQ3XIh8OFYybB2oJXY7gJQzfRuRwk8dx9YWtIR4438Nbv5 ecTzGUDWvx+AfYzC4X/UIGiRy8AftfiBQyA+c1OFyg37qM1SLYnZYmIpSf5GsQ3A MaEGlB9P9hE2uoqZ4yT/A0aHj7w8DGEzYZqxNbMlCIJhLEO3vKZvMvaq7Q8ramG6 BzYwUz+8NPgCBUp1qyIcN2vvEHEq57pMMHYNfJMVfG9o0ijo+xxGCPV3MosmmvRI 1nxH0nrgdA2o6SJp/dJrKm3Hicbbxak/Kz4m8BROcnlCgptdjHp9V/cBnFq/UUHv or32gShGWmnG6+XyQs4LxpbLC4koz8EjPwg3/3W2Qn6Drn3i98omvZpmnX466i7e GUiHaiKTpBkqZkHmHFxNBAbbs85yngeo8o3RGUsmN69RupTqSkkLDuDFOMwgfsZG TWexWg/qBe+8Xrbshd9HphxvWv+Q3YcSeg+mm8Bc50Q5saLKYdQQsbfV5wtIpvLj 0eyjoTSh+FkPGBw/iB1MDzYV5OoIIgiDBndP2bOK2zFsLElSbbv/r3i//wL98316DgJWmJiQDqKxly4MEij8TfIVDAsdeyJJKvg6iGahonHbEBkZ9g9wcCpxlg8iMtTf /7eb8SmcPwe1NGdgB7PR1dU/RQ/kBbLaaBfo/1jQEnCC8VmksVu7B9ULImfLEOEm +A4J4NpKKlQocgCvJAtMogL+uRS5GpojJIElVqP12jnb7Ij3AYY3Zb4qotlprLeK 7dJslpNnrD/MSvbJZ/ZoAX+xyDxUMeq/83Xv30i5/wh00QBY4Cv5NTDU4rPoVmQm EWGW5aQx34in4JHY5bK3F4BvVYm7MscKLHoU8/OeKVAgzNcatUgPlN43FG9SX0AE pP3EYlVADSfULdbfBn9dZDidAiDMXnCv9259J65zA64tuT9XluinHXVs5PA/f5vm rZPQhAzGThw7h9L6rGY