                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: convertopensshtoputty
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Migrate OpenSSH key to PuTTY format
      tags:
      - SSH Keys and Connections
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  convertopensshtoputty \\\n  file='KeyFile'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/convertopensshtoputty?api.version=1&file=KeyFile
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.32'
  /deletesshkey:
    get:
      description: 'This function function deletes an SSH key from the server.


        **Warning:**


        Only the `root` account can use this function, and it only affects

        the `root` keys. To perform this function on a cPanel user account, call the

        cPanel API 2 `SSH::authkey` function through the WHM API.'
      operationId: SSH-deletesshkey
      parameters:
      - description: The SSH key file's name.
        in: query
        name: file
        required: true
        schema:
          example: /root/.ssh/test
          type: string
      - description: 'Whether to authorize the SSH key to access the server.


          * `1` — Leave authorized.

          * `0` — Do **not** leave authorized.'
        in: query
        name: leave_authorized
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      file:
                        description: The SSH key file's name.
                        example: /root/.ssh/test
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: deletesshkey
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` - Success.

                          * `0` - Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Delete SSH key
      tags:
      - SSH Keys and Connections
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  deletesshkey \\\n  file='/root/.ssh/test'\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/deletesshkey?api.version=1&file=%2froot%2f.ssh%2ftest
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11'
  /generatesshkeypair:
    get:
      description: This function generates an SSH key pair.
      operationId: SSH-generatesshkeypair
      parameters:
      - description: 'Whether to abort the function if the user already has a key with the same name.


          * `1` — Abort.

          * `0` — Continue.'
        in: query
        name: abort_on_existing_key
        required: false
        schema:
          default: 1
          enum:
          - 0
          - 1
          example: 1
          type: integer
      - description: The key's encryption algorithm. The parameter defaults to the system's default algorithm.
        in: query
        name: algorithm
        required: false
        schema:
          enum:
          - rsa2
          - dsa
          example: dsa
          type: string
      - description: 'The key''s bits:


          * `1024` — The DSA algorithm''s default value.

          * `2048`

          * `4096` — The RSA algorithm''s default value.'
        in: query
        name: bits
        required: false
        schema:
          enum:
          - 1024
          - 2048
          - 4096
          example: 2048
          type: integer
      - description: A comment.
        in: query
        name: comment
        required: false
        schema:
          default: ''
          example: NoComment
          type: string
      - description: 'The key''s filename.


          This parameter defaults to `id_rsa` if the algorithm is RSA, and `id_dsa`

          if the algorithm is DSA.'
        in: query
        name: name
        required: false
        schema:
          default: id_rsa
          example: KeyFile
          type: string
      - description: The key's secure passphrase.
        in: query
        name: passphrase
        required: false
        schema:
          default: ''
          example: 123456luggage
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      fingerprint:
                        description: The key's [MD5](https://en.wikipedia.org/wiki/MD5) fingerprint.
                        example: null
                        format: md5
                        type:
                        - string
                        - 'null'
                      name:
                        description: The key's filename.
                        example: KeyFile
                        type: string
                    type: object
                  metadata:
                    properties:
                      command:
                        description: The method name called.
                        example: generatesshkeypair
                        type: string
                      reason:
                        description: The reason the API function failed when the `metadata.result` field is `0`. This field may display a success message when a function succeeds.
                        example: OK
                        type: string
                      result:
                        description: '* `1` — Success.

                          * `0` — Failed. Check the `reason` field for more details.'
                        enum:
                        - 0
                        - 1
                        example: 1
                        type: integer
                      version:
                        description: The version of the API function.
                        example: 1
                        type: integer
                type: object
          description: HTTP Request was successful.
      summary: Create SSH key pair
      tags:
      - SSH Keys and Connections
      x-codeSamples:
      - label: CLI
        lang: Shell
        source: "whmapi1 --output=jsonpretty \\\n  generatesshkeypair\n"
      - label: URL
        lang: HTTP
        source: https://hostname.example.com:2087/cpsess##########/json-api/generatesshkeypair?api.version=1
      x-cpanel-api-version: WHM API 1
      x-cpanel-available-version: '11.32'
  /importsshkey:
    get:
      description: This function imports an SSH key.
      operationId: SSH-importsshkey
      parameters:
      - description: The key's contents.
        in: query
        name: key
        required: true
        schema:
          example: REDACTED_PRIVATE_KEY_EXAMPLE
          type: string
      - description: The key's name.
        in: query
        name: name
        required: true
        schema:
          example: TestKey
          type: string
      - description: 'Whether to extract and save only the private key.

          * `1` — Private key only.

          * `0` — All data.


          **Note:**


          This parameter defaults to `1` for

          PPK [(PuTTY Key Generator)](https://www.puttygen.com/)

          files and `0` for all other imports.'
        in: query
        name: extract_private
        required: false
        schema:
          enum:
          - 0
          - 1
          example: 0
          type: integer
