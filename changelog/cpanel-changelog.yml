description: >-
  cPanel publishes a dated release-notes feed and a separate per-version change log, both on the
  product documentation host. They cover the PRODUCT; there is no API-only changelog, so an API
  change is discoverable only as part of the major version that carried it. The recent window is
  recorded below with the dates cPanel itself prints.
