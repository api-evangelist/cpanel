apis:
- aid: cpanel:uapi
  name: cPanel UAPI
  description: 'The cPanel User API (UAPI) is the modern HTTP API for cPanel-account operations — email
    accounts, mailboxes, files, MySQL and PostgreSQL databases, FTP accounts, SSL certificates, DNS, backups
    and more — for a single cPanel user. 657 operations across 101 modules, served at /execute/{Module}/{Function}
    on the customer''s own cPanel server (port 2083 secure, 2082 unsecure, 2096/2095 for Webmail sessions).
    Authenticates with HTTP Basic or an ''Authorization: cpanel <user>:<token>'' API token. Every call
    returns HTTP 200; success is result.status == 1. UAPI is the recommended replacement for the legacy
    cPanel API 2.'
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api.docs.cpanel.net/cpanel/introduction/
  baseURL: https://{host}:2083/execute
  tags:
  - Databases
  - Email
  - File
  - Hosting
  - REST
  - UAPI
  tags_raw:
  - Databases
  - Email
  - Files
  - Hosting
  - REST
  - UAPI
  properties:
  - type: OpenAPI
    url: openapi/cpanel-uapi-openapi.yml
  - type: Overlay
    url: overlays/cpanel-uapi-overlay.yaml
  - type: Documentation
    url: https://api.docs.cpanel.net/cpanel/introduction/
  - type: APIReference
    url: https://api.docs.cpanel.net/specifications/cpanel.openapi
  - type: Authentication
    url: https://api.docs.cpanel.net/cpanel/tokens/
  features:
  - name: Token Authentication
    description: API tokens scoped per cPanel user.
  - name: Modular Function Catalog
    description: Functions grouped into modules such as Email, DNS, Mysql, and Ftp.
  - name: JSON Responses
    description: Modern JSON responses with consistent metadata envelope.
- aid: cpanel:whm-api-1
  name: WHM API 1
  description: 'WHM API 1 is the HTTP API for server-wide and reseller-level operations on a cPanel &
    WHM server: creating, suspending, restoring and terminating cPanel accounts, managing hosting packages
    and feature lists, DNS and DNSSEC, AutoSSL and certificate installation, backups and backup destinations,
    transfers, ModSecurity, cPHulk and API tokens. 625 operations served at /json-api/{function} on ports
    2087 (secure) and 2086, or 443 through a service subdomain. Every call requires api.version=1 and
    an ''Authorization: whm <user>:<token>'' header; every call returns HTTP 200 with the outcome in metadata.result.'
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api.docs.cpanel.net/whm/introduction/
  baseURL: https://{host}:2087/json-api
  tags:
  - Account
  - Packages
  - Reseller
  - Server Administration
  - WHM
  tags_raw:
  - Accounts
  - Packages
  - Reseller
  - Server Administration
  - WHM
  properties:
  - type: OpenAPI
    url: openapi/cpanel-whm-api-openapi.yml
  - type: Overlay
    url: overlays/cpanel-whm-api-overlay.yaml
  - type: Documentation
    url: https://api.docs.cpanel.net/whm/introduction/
  - type: APIReference
    url: https://api.docs.cpanel.net/specifications/whm.openapi
  - type: Authentication
    url: https://api.docs.cpanel.net/whm/tokens/
  features:
  - name: Account Management
    description: Create, suspend, terminate, modify, and migrate cPanel accounts.
  - name: Package Management
    description: Define hosting packages and feature lists.
  - name: DNS Cluster Operations
    description: Sync zones across DNS-only servers in a cluster.
- aid: cpanel:cpanel-api-2
  name: cPanel API 2 (Legacy)
  description: cPanel API 2 is the legacy XML/JSON API for cPanel-user operations. cPanel marks the whole
    system deprecated on every function page and directs new development to UAPI, but it remains supported
    for backward compatibility and no removal date is published. At least one function (MysqlFE::userdbprivs)
    is documented as deprecated, non-functional and without a UAPI equivalent, so the migration path is
    not complete.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api.docs.cpanel.net/cpanel/introduction/
  baseURL: https://{host}:2083/json-api/cpanel
  tags:
  - Legacy
  - cPanel
  properties:
  - type: Documentation
    url: https://api.docs.cpanel.net/cpanel-api-2/
  - type: Deprecation
    url: https://api.docs.cpanel.net/guides/guide-to-replacing-cpanel-api-1-functions-with-uapi-equivalents/
- aid: cpanel:manage2
  name: Manage2 API
  description: The Manage2 API automates cPanel LICENCE management for cPanel partners and direct licence
    holders — activating, reactivating, transferring and cancelling licences, changing a licence's IP
    address, managing groups and pickup phrases. It is the one cPanel API that runs on cPanel's own infrastructure
    rather than the customer's server, at manage2.cpanel.net. Methods are GET and POST; output is XML,
    JSON or YAML. Access is gated by an IP allowlist configured in the Manage2 profile before any call
    is accepted, and cPanel publishes PHP (cPanelLicensing) and Perl helper classes. No OpenAPI is published
    for it — the function reference is prose.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.cpanel.net/manage2/knowledge-base/guide-to-the-manage2-api/
  baseURL: https://manage2.cpanel.net/
  tags:
  - Licensing
  - Partner
  - Billing
  - Reseller
  properties:
  - type: Documentation
    url: https://docs.cpanel.net/manage2/knowledge-base/guide-to-the-manage2-api/
  - type: APIReference
    url: https://docs.cpanel.net/manage2/
  - type: Authentication
    url: https://docs.cpanel.net/manage2/knowledge-base/manage2-authentication-methods/
  - type: ErrorCatalog
    url: https://docs.cpanel.net/manage2/knowledge-base/manage2-return-data/
  features:
  - name: Licence Lifecycle
    description: Add, activate, reactivate, transfer and cancel cPanel licences.
  - name: IP Allowlist Access Control
    description: Calls are only accepted from IP addresses added to the Manage2 profile.
  - name: Multiple Output Formats
    description: XML, JSON or YAML, selected with the output parameter.
