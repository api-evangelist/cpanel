aid: cpanel
name: cPanel
kind: company
description: cPanel is a web-based control panel that provides a graphical interface and automation tools
  to simplify the management of web hosting services. cPanel exposes a family of HTTP APIs (UAPI, WHM
  API 1, and the legacy cPanel API 2) for automating account, domain, email, database, DNS, and server-wide
  operations. APIs accept API tokens or Basic Authentication and return JSON or XML responses.
