aid: cpanel
name: cPanel
kind: company
description: cPanel is a web-based control panel that provides a graphical interface and automation tools
  to simplify the management of web hosting services. cPanel exposes a family of HTTP APIs (UAPI, WHM
  API 1, and the legacy cPanel API 2) for automating account, domain, email, database, DNS, and server-wide
  operations. APIs accept API tokens or Basic Authentication and return JSON or XML responses.
deliveryModel:
  model: self-hosted
  open_source: false
  commercial: true
  callable_host: false
  label: Self-hosted software · you run the server that serves the API
  confidence: high
  source:
  - openapi
  - pricing
  - docs
  generated: '2026-09-05'
  method: searched
  note: Corrected from saas on 2026-09-05. cPanel & WHM is licensed software installed on the customer's
    own server; the OpenAPI servers[] are templated https://{host}:{port} against that machine. The one
    vendor-hosted API is Manage2 (licensing) at manage2.cpanel.net.
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: true
  try_now: false
  public: true
  label: Paid licence · Self-serve signup · 15-day free trial
  confidence: high
  source:
  - plans
  - pricing
  - authentication
  - sandbox
  generated: '2026-09-05'
  method: searched
  note: 'Corrected from freemium/trial:false on 2026-09-05 against https://cpanel.net/pricing/. There
    is no free tier and no metered API pricing: licences start at $29.99/mo for one cPanel account and
    every API is included at no extra cost. There is a 15-day free trial with no credit card, but it is
    a licence to install on your own server, not a hosted try-now sandbox.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/cpanel.png
url: https://raw.githubusercontent.com/api-evangelist/cpanel/refs/heads/main/apis.yml
