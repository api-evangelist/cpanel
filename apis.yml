apis:
- aid: cpanel:cpanel-api-2
  name: cPanel API 2 (Legacy)
  description: >-
    cPanel API 2 is the legacy XML/JSON API for cPanel-user operations. cPanel marks the whole system
    deprecated on every function page and directs new development to UAPI, but it remains supported for
    backward compatibility and no removal date is published. At least one function (MysqlFE::userdbprivs)
    is documented as deprecated, non-functional and without a UAPI equivalent, so the migration path is
    not complete.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api.docs.cpanel.net/cpanel/introduction/
  baseURL: https://{host}:2083/json-api/cpanel
  tags:
  - Legacy
  - cPanel
  properties:
  - type: Documentation
    url: https://api.docs.cpanel.net/cpanel-api-2/
  - type: Deprecation
    url: >-
      https://api.docs.cpanel.net/guides/guide-to-replacing-cpanel-api-1-functions-with-uapi-equivalents/
- aid: cpanel:manage2
  name: Manage2 API
  description: >-
    The Manage2 API automates cPanel LICENCE management for cPanel partners and direct licence holders
    — activating, reactivating, transferring and cancelling licences, changing a licence's IP address,
    managing groups and pickup phrases. It is the one cPanel API that runs on cPanel's own infrastructure
    rather than the customer's server, at manage2.cpanel.net. Methods are GET and POST; output is XML,
    JSON or YAML. Access is gated by an IP allowlist configured in the Manage2 profile before any call
    is accepted, and cPanel publishes PHP (cPanelLicensing) and Perl helper classes. No OpenAPI is published
    for it — the function reference is prose.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.cpanel.net/manage2/knowledge-base/guide-to-the-manage2-api/
  baseURL: https://manage2.cpanel.net/
  tags:
  - Licensing
  - Partner
  - Billing
  - Reseller
  properties:
  - type: Documentation
    url: https://docs.cpanel.net/manage2/knowledge-base/guide-to-the-manage2-api/
  - type: APIReference
    url: https://docs.cpanel.net/manage2/
  - type: Authentication
    url: https://docs.cpanel.net/manage2/knowledge-base/manage2-authentication-methods/
  - type: ErrorCatalog
    url: https://docs.cpanel.net/manage2/knowledge-base/manage2-return-data/
  features:
  - name: Licence Lifecycle
    description: Add, activate, reactivate, transfer and cancel cPanel licences.
  - name: IP Allowlist Access Control
    description: Calls are only accepted from IP addresses added to the Manage2 profile.
  - name: Multiple Output Formats
    description: XML, JSON or YAML, selected with the output parameter.
