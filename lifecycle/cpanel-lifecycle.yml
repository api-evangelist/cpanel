deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  statement: >-
    cPanel publishes NO API deprecation policy, no removal timeline for individual functions, and
    neither RFC 8594 Sunset nor Deprecation response headers. Deprecation is expressed two ways:
    a deprecated:true flag in the OpenAPI, and prose warnings in the documentation.
  deprecated_api_family:
    name: cPanel API 2
    status: deprecated
    statement: >-
      "The cPanel API 2 system is deprecated. We strongly recommend that you use UAPI instead of
      cPanel API 2." — repeated on every cPanel API 2 function page.
    replacement: cPanel UAPI
    removal_date: none published
    caveat: >-
      cPanel documents at least one API 2 function (MysqlFE::userdbprivs) that is deprecated AND
      non-functional AND has no UAPI equivalent — so the migration path is not complete.
    migration_guide: https://api.docs.cpanel.net/guides/guide-to-replacing-cpanel-api-1-functions-with-uapi-equivalents/
  deprecated_operations:
    total: 13
    cpanel_uapi:
      count: 5
      operations:
        - operationId: DCV-ensure_domains_can_pass_dcv
          path: /DCV/ensure_domains_can_pass_dcv
        - operationId: SSL-check_shared_cert
          path: /SSL/check_shared_cert
        - operationId: get_sitejet_templates
          path: /Sitejet/get_templates
        - operationId: set_sitejet_template
          path: /Sitejet/set_template
        - operationId: Themes-get_theme_base
          path: /Themes/get_theme_base
    whm_api_1:
      count: 8
      operations:
        - operationId: Resellers-accesshash
          path: /accesshash
        - operationId: Resellers-get_remote_access_hash
          path: /get_remote_access_hash
        - operationId: SSL-disable_mail_sni
          path: /disable_mail_sni
        - operationId: DNS-dumpzone
          path: /dumpzone
        - operationId: FeatureLists-get_available_featurelists
          path: /get_available_featurelists
        - operationId: FeatureLists-read_featurelist
          path: /read_featurelist
        - operationId: get_ecommerce
          path: /get_ecommerce
        - operationId: set_ecommerce
          path: /set_ecommerce
    note: >-
      13 of 1,282 operations carry deprecated:true. Both access-hash operations are on the list,
      which matters: access-hash authentication is still documented as a supported method while the
      operations that mint the hash are marked deprecated in the contract.
  internal_only:
    extension: x-cpanel-internal-only
    count: 3
    note: Operations cPanel reserves for itself; published in the contract but not for third-party use.
change_log:
  published: true
  index: https://docs.cpanel.net/changelogs/
  release_notes: https://docs.cpanel.net/release-notes/
  detail: See changelog/cpanel-changelog.yml.
status_page:
  url: https://status.cpanel.net/
  vendor: Atlassian Statuspage
  machine_readable: true
  endpoints:
    summary: https://status.cpanel.net/api/v2/summary.json
    status: https://status.cpanel.net/api/v2/status.json
  probed:
    - url: https://status.cpanel.net/api/v2/summary.json
      status: 200
    - url: https://status.cpanel.net/api/v2/status.json
      status: 200
  note: >-
    A real machine-readable status feed, which is more than a status page — an agent can poll it.
    Scope is cPanel's own hosted services (store, licensing, update servers), NOT a customer's
    cPanel server, which is self-hosted and has no vendor status to report.
sla:
  published: false
  note: >-
    No uptime SLA is published for the APIs, which follows from the deployment model: UAPI and WHM
    API 1 run on the customer's own server. The Technical Support Agreements page
    (https://www.cpanel.net/technical-support-agreements/) governs support, not API availability.
