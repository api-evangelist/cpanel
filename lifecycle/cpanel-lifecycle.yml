generated: '2026-09-05'
method: searched
source: >-
  https://docs.cpanel.net/knowledge-base/cpanel-product/product-versions-and-the-release-process/,
  https://docs.cpanel.net/release-notes/release-notes/, https://docs.cpanel.net/changelogs/,
  https://status.cpanel.net/ (Atlassian Statuspage API), and the deprecated:true flags in
  openapi/_original/
provider: cPanel
providerId: cpanel
description: >-
  cPanel's API lifecycle is the PRODUCT's lifecycle. There is no separately versioned API: an
  operation ships in a cPanel & WHM major version, is available from that version onwards, and
  goes out of support when the version it lives on reaches EOL. That makes cPanel unusually
  legible on availability — the contract stamps every operation with the version it appeared in —
  and unusually quiet on removal: there is no Sunset/Deprecation header, no removal calendar for
  individual functions, and no published API deprecation policy separate from the release process.
versioning:
  scheme: product-major-version
  current_product_version_documented: '138'
  contract_version_at_harvest: 11.137.9999.106
  contract_version_note: >-
    The OpenAPI documents served on the developer portal on 2026-09-05 declare
    info.version 11.137.9999.106 while the documentation's current production release is 138.
    Odd major values are EDGE development builds, so 137 is the development tree behind 138 — the
    published contract therefore tracks the development branch, not the shipped release.
  version_number_parts:
    parent: Legacy grouping (the leading 11); deprecated as a numbering concept in version 11.52 but still visible in API function output.
    major: Feature set. EVEN majors are production releases across all tiers; ODD majors are EDGE development releases.
    minor: Always 0 for cPanel & WHM installations.
    build: A unique build.
  api_version_parameter:
    whm_api_1: api.version=1, required on every call
    uapi: apiversion 3, reported in the response
  per_operation_availability:
    extension: x-cpanel-available-version
    coverage: 655 of 657 cPanel UAPI operations and 625 of 625 WHM API 1 operations
    example: '"cPanel 98", "cPanel 138"'
    value: >-
      A machine-readable availability floor per operation. An agent can decide from the contract
      alone whether a call exists on the server it is pointed at.
  downgrade: Not possible between major versions or between release tiers (cPanel states this explicitly).
release_tiers:
  - name: LTS
    detail: >-
      One LTS version per year. Security and other critical updates for the supported year; no new
      features unless critical. LTS-tier servers move to the next LTS when it appears, possibly
      before their current version reaches EOL.
  - name: STABLE
  - name: RELEASE
  - name: CURRENT
  - name: EDGE
    detail: Odd-numbered development majors appear here.
release_tiers_note: >-
  A version becomes unsupported when it exists in no tier and reaches EOL; unsupported versions
  receive neither security updates nor bug fixes. cPanel emails an EOL notice, and states that a
  previous version is not EOL until the upcoming version reaches the RELEASE tier.
