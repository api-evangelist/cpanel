provider: cPanel
providerId: cpanel
description: >-
  The entity graph behind cPanel & WHM's APIs, derived from the module namespaces and the
  identifier parameters that actually recur across operations. A caveat that shapes everything
  below: cPanel's contracts are RPC-shaped, so there is no $ref-linked resource graph to walk.
  Response schemas are mostly inline and anonymous — 42 named schemas across 657 UAPI operations,
  155 across 625 WHM operations — and entities are identified by NATURAL KEYS carried as query
  parameters (a username, a domain name, an email address), not by opaque ids. The relationships
  recorded here are therefore read from parameter usage, and each one names the field that carries
  it.
identity_model:
  style: natural-keys
  no_opaque_ids: >-
    cPanel does not use prefixed opaque identifiers. The primary keys are the cPanel account
    username, the domain name, and the email address. The exceptions are few and local — SSL
    certificate `id`, `key_id`, DNS record ids and transfer_session_id.
  scoping: >-
    Everything in UAPI is implicitly scoped to the authenticated cPanel account; the account is not
    a parameter, it is the credential. WHM API 1 inverts this: `user` is the single most common
    parameter (86 operations) because WHM acts ON accounts.
root_entities:
  - name: Server
    api: WHM API 1
    description: The cPanel & WHM machine itself. Not addressable as a resource; it is the host.
  - name: Account
    aka: cPanel account, user
    api: WHM API 1 (managed), cPanel UAPI (implicit subject)
    key: user
    key_field_occurrences: 86 WHM operations, 38 UAPI operations
    lifecycle_operations:
      create: Accounts-createacct
      read: Accounts-accountsummary
      list: Accounts-listaccts
      delete: Accounts-removeacct
    description: The tenant that owns domains, mailboxes, databases and files.
  - name: Reseller
    api: WHM API 1
    key: user
    description: An account with privileges to manage other accounts. 17 dedicated operations.
  - name: Package
    aka: hosting plan
    api: WHM API 1
    key: name
    description: The resource template an account is created from. 8 dedicated operations.
  - name: FeatureList
    api: WHM API 1
    key: featurelist
    description: The set of cPanel features an account may use. 11 dedicated operations.
