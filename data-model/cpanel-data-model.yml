gaps:
  - No $ref graph to traverse — most response payloads are inline anonymous objects.
  - No id-prefix scheme, so an identifier cannot be typed by inspection.
  - No hypermedia links between related resources.
  - >-
    UAPI and WHM API 1 model the same entities with different parameter names (e.g. `user` vs
    `username`), so a shared client must normalise.
