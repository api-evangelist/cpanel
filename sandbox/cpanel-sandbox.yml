description: >-
  cPanel publishes no hosted API sandbox. There is no test-mode key, no test-vs-live key prefix,
  no fixture data, no time simulation and no vendor-operated endpoint an integrator can call
  without first standing up a server. That follows from the deployment model — the API lives on
  the customer's machine — but it is a real cost to an integrator, so it is recorded rather than
  left blank.
hosted_sandbox: false
test_mode: false
key_prefixes:
  test: null
  live: null
  note: >-
    cPanel has no key-prefix convention. An API token is an opaque string used with
    `Authorization: cpanel user:TOKEN` or `Authorization: whm user:TOKEN`; nothing in the token
    distinguishes a test credential from a production one, because there is no test mode to
    distinguish.
